<meta name="theme-color" content="#2E6B49">

<style>
  :root{
    --paper:#EEF0EF;
    --surface:#FAFAF8;
    --ink:#16231C;
    --ink-soft:#4B564E;
    --rule:#D8DAD3;
    --trail:#2E6B49;
    --contour:#3A5A8C;
    --flag:#B8451F;
    --stone:#8B8D82;
    --gold:#B08D2E;
  }
  [data-theme="dark"]{
    --paper:#12161A;
    --surface:#1E232A;
    --ink:#EDEEE9;
    --ink-soft:#9BA3A0;
    --rule:#2A3038;
    --trail:#4C9A72;
    --contour:#7B9FD1;
    --flag:#E07850;
    --stone:#6B7178;
    --gold:#D9B15C;
  }
  [data-theme="dark"] .empty-state-icons,
  [data-theme="dark"] .sport-icon-wrap{color:var(--trail);}
  [data-theme="dark"] .row-remove{color:var(--stone);}
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Noto Sans TC',sans-serif;
    font-size:16px;
    line-height:1.6;
  }
  :focus-visible{outline:2px solid var(--contour);outline-offset:1px;}
  h1,h2,h3{margin:0;font-weight:700;}
  .mono{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;}
  .small{font-size:14px;}

  #app{display:flex;flex-direction:column;min-height:100vh;}

  /* ---------- Topbar ---------- */
  #topbar{
    position:sticky;top:0;z-index:10;background:var(--paper);
    border-bottom:1px solid var(--rule);padding:18px 32px 14px;
  }
  .topbar-row1{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;}
  .topbar-actions{display:flex;align-items:center;gap:14px;}
  .auth-area{display:flex;align-items:center;gap:10px;}
  .auth-hint{color:var(--stone);}
  .auth-error{color:var(--flag);max-width:260px;}
  .auth-user{display:flex;align-items:center;gap:6px;color:var(--ink-soft);}
  .auth-user img{width:22px;height:22px;border-radius:50%;display:block;}
  .app-title{font-size:21px;letter-spacing:0.01em;}
  .app-tagline{color:var(--stone);font-size:14px;margin:2px 0 0;}
  .topbar-row2{display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin-top:14px;}
  .cal-nav{display:flex;align-items:center;gap:6px;flex-shrink:0;}
  .cal-nav .btn-ghost{padding:6px 11px;font-size:16px;}
  .cal-label{font-size:16px;min-width:92px;text-align:center;display:inline-block;}
  #search-input{
    flex:1 1 200px;min-width:160px;padding:8px 10px;border:1px solid var(--rule);
    border-radius:3px;background:var(--surface);color:var(--ink);font:inherit;
  }
  .chips{display:flex;flex-wrap:wrap;gap:6px;}
  .chip{
    font-size:14px;padding:4px 10px;border:1px solid var(--rule);border-radius:12px;
    background:none;cursor:pointer;color:var(--ink-soft);font-family:inherit;
  }
  .chip.active{background:var(--ink);color:var(--surface);border-color:var(--ink);}
  .topbar-row3{display:flex;gap:16px;margin-top:12px;flex-wrap:wrap;}

  #main-content{flex:1;padding:24px 32px 100px;max-width:1120px;width:100%;margin:0 auto;}
  .empty-hint{color:var(--stone);font-size:15px;padding:16px 8px;}

  /* ---------- Calendar ---------- */
  #calendar{margin-bottom:8px;}
  .cal-weekdays{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-bottom:6px;}
  .cal-weekdays span{font-size:14px;color:var(--stone);text-align:center;padding:2px 0;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;}
  .cal-cell{
    min-width:0;min-height:96px;border:1px solid var(--rule);border-radius:3px;background:var(--surface);
    padding:6px 6px 4px;display:flex;flex-direction:column;gap:3px;overflow:hidden;
  }
  .cal-cell.muted{background:transparent;border-color:transparent;}
  .cal-cell.muted .cal-daynum{color:var(--stone);}
  .cal-cell.today{border-color:var(--trail);border-width:1.5px;}
  .cal-daynum{font-family:'IBM Plex Mono',monospace;font-size:14px;color:var(--ink-soft);}
  .cal-cell.today .cal-daynum{color:var(--trail);font-weight:600;}
  .cal-chip{
    display:block;width:100%;text-align:left;border:none;border-left:3px solid currentColor;
    background:rgba(22,35,28,0.05);border-radius:2px;padding:2px 5px;font:inherit;
    font-size:13px;color:var(--ink);cursor:pointer;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;
  }
  .cal-chip.status-registered,.cal-chip.status-completed{color:var(--trail);}
  .cal-chip.status-considering,.cal-chip.status-lottery_pending{color:var(--contour);}
  .cal-chip.status-dns,.cal-chip.status-dnf{color:var(--flag);}
  .cal-chip.selected{background:var(--ink);color:var(--surface)!important;border-left-color:var(--surface);}
  .cal-more{font-size:13px;color:var(--stone);padding:1px 5px;}

  /* ---------- Calendar: mobile list view ---------- */
  .cal-list{display:none;}
  .cal-list-day{margin-bottom:14px;}
  .cal-list-date{
    display:flex;align-items:baseline;gap:6px;font-size:18px;font-weight:600;
    color:var(--ink-soft);margin-bottom:6px;padding-left:2px;
  }
  .cal-list-date.today{color:var(--trail);}
  .cal-list-weekday{font-size:13px;color:var(--stone);font-weight:400;}
  .cal-list-races{display:flex;flex-direction:column;gap:8px;}
  .cal-list-item{
    display:flex;align-items:center;gap:10px;width:100%;text-align:left;
    border:1px solid var(--rule);border-radius:4px;background:var(--surface);
    padding:14px 14px;font:inherit;cursor:pointer;min-height:48px;
  }
  .cal-list-item.selected{background:var(--ink);border-color:var(--ink);}
  .cal-list-item.selected .cal-list-name{color:var(--surface);}
  .cal-list-item.selected .stamp{filter:brightness(1.6);}
  .cal-list-name{font-size:15px;color:var(--ink);}

  /* ---------- Career summary ---------- */
  .career-summary{display:flex;gap:28px;flex-wrap:wrap;padding:2px 2px 18px;margin-bottom:14px;border-bottom:1px solid var(--rule);}
  .career-stat{display:flex;flex-direction:column;gap:2px;}
  .career-stat-value{font-size:23px;font-weight:700;}
  .career-stat-label{font-size:12px;color:var(--stone);}

  /* ---------- Results dashboard ---------- */
  .results-dashboard{border:1px solid var(--rule);border-radius:4px;padding:22px;margin-bottom:22px;background:var(--surface);}
  .results-dashboard.is-pb{border-color:var(--gold);}
  .results-dashboard-main{display:flex;align-items:baseline;gap:14px;margin-bottom:16px;flex-wrap:wrap;}
  .results-big-time{font-size:44px;font-weight:700;letter-spacing:-0.01em;}
  .pb-badge{display:inline-block;padding:3px 11px;border:1.5px solid var(--gold);color:var(--gold);border-radius:12px;font-size:12px;font-weight:600;white-space:nowrap;}
  .results-badge-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px;margin-bottom:16px;}
  .results-badge{display:flex;flex-direction:column;gap:3px;padding:9px 11px;background:var(--paper);border-radius:3px;}
  .results-badge-label{font-size:11px;color:var(--stone);}
  .results-badge-value{font-size:16px;font-weight:600;}
  .results-dashboard-actions{display:flex;flex-wrap:wrap;gap:10px;}

  /* ---------- Split analysis ---------- */
  .split-analysis{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-radius:4px;margin-bottom:18px;border:1px solid var(--rule);}
  .split-analysis-label{font-size:13px;color:var(--ink-soft);}
  .split-analysis-value{font-size:20px;font-weight:700;}
  .split-analysis.split-good{border-color:var(--trail);}
  .split-analysis.split-good .split-analysis-value{color:var(--trail);}
  .split-analysis.split-bad{border-color:var(--flag);}
  .split-analysis.split-bad .split-analysis-value{color:var(--flag);}

  /* ---------- Elevation profile ---------- */
  .elevation-profile{margin:4px 2px 18px;}
  .elevation-profile-head{display:flex;justify-content:space-between;color:var(--stone);margin-bottom:6px;}
  .elevation-svg{width:100%;height:110px;display:block;}

  /* ---------- Shoe management ---------- */
  .shoe-add-row{display:flex;gap:8px;margin-bottom:16px;}
  .shoe-add-row input{flex:1;font:inherit;font-size:15px;padding:8px 10px;border:1px solid var(--rule);border-radius:3px;background:var(--surface);color:var(--ink);}
  .shoe-list{display:flex;flex-direction:column;gap:8px;}
  .shoe-row{display:flex;align-items:center;gap:14px;padding:10px 12px;border:1px solid var(--rule);border-radius:3px;}
  .shoe-row-name{flex:1;font-size:15px;}
  .shoe-row-stats{color:var(--ink-soft);font-size:13px;}

  /* ---------- Pacing calculator ---------- */
  .pacing-inputs{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:6px;}
  .pacing-inputs .field{flex:1 1 150px;}

  /* ---------- Progress block ---------- */
  .progress-block{margin:16px 0 22px;}
  .progress-label{display:flex;justify-content:space-between;font-size:15px;color:var(--ink-soft);margin-bottom:6px;}
  .progress-label .mono{color:var(--ink);}
  .progress-track{height:8px;border-radius:4px;background:var(--rule);overflow:hidden;}
  .progress-fill{height:100%;background:var(--trail);border-radius:4px;}
  .progress-fill.urgent{background:var(--flag);}

  /* ---------- Stamp badge ---------- */
  .stamp{
    display:inline-block;padding:2px 9px;border:1.5px solid currentColor;border-radius:2px;
    font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:0.02em;
    transform:rotate(-2deg);white-space:nowrap;
  }
  .stamp.status-registered,.stamp.status-completed{color:var(--trail);}
  .stamp.status-considering,.stamp.status-lottery_pending{color:var(--contour);}
  .stamp.status-dns,.stamp.status-dnf{color:var(--flag);}

  /* ---------- Buttons ---------- */
  button{cursor:pointer;}
  .btn-primary{
    background:var(--ink);color:var(--surface);border:none;border-radius:3px;
    padding:10px 16px;font:inherit;font-weight:500;font-size:15px;
  }
  .btn-primary:hover{opacity:0.88;}
  .btn-ghost{
    background:none;border:1px solid var(--rule);color:var(--ink);border-radius:3px;
    padding:6px 12px;font:inherit;font-size:14px;
  }
  .btn-ghost:hover{border-color:var(--ink);}
  .icon-btn{display:inline-flex;align-items:center;justify-content:center;padding:6px;width:34px;height:34px;}
  .icon-btn svg{width:18px;height:18px;display:block;}
  .btn-ghost.danger{color:var(--flag);border-color:var(--rule);}
  .btn-ghost.danger:hover{border-color:var(--flag);}
  .btn-text{background:none;border:none;color:var(--ink-soft);text-decoration:underline;font:inherit;font-size:14px;padding:0;}
  .btn-text.danger{color:var(--flag);}

  /* ---------- Detail ---------- */
  #detail{padding-top:32px;border-top:1px solid var(--rule);margin-top:28px;}
  #detail:empty{display:none;}
  .empty-state{padding:40px 0;color:var(--ink-soft);}
  .empty-state p{margin-bottom:16px;}
  .empty-state-icons{display:flex;gap:26px;margin-bottom:22px;color:var(--stone);}

  .detail-header{padding-bottom:22px;margin-bottom:6px;border-bottom:2px solid var(--ink);}
  .dh-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
  .dh-badges{display:flex;align-items:center;gap:12px;}
  .dh-actions{display:flex;align-items:center;gap:8px;}
  .sport-icon-wrap{display:inline-flex;color:var(--trail);}
  .sport-icon{display:block;}
  .detail-header h1{font-size:30px;line-height:1.3;}
  .detail-header h1 .alias{font-weight:400;color:var(--ink-soft);font-size:18px;}
  .dh-meta{color:var(--ink-soft);}

  details.section{border-bottom:1px solid var(--rule);}
  details.section summary{
    cursor:pointer;font-weight:600;font-size:17px;padding:16px 2px;
    list-style:none;display:flex;align-items:center;justify-content:space-between;
  }
  details.section summary::-webkit-details-marker{display:none;}
  details.section summary::after{content:'+';font-family:'IBM Plex Mono',monospace;color:var(--stone);font-weight:400;}
  details.section[open] summary::after{content:'\2013';}

  .section-body{display:flex;flex-wrap:wrap;gap:16px 20px;padding:2px 2px 16px;}
  .section-body .field{flex:1 1 200px;min-width:170px;margin-bottom:0;}
  .section-body .field.wide{flex-basis:100%;}

  .field{display:flex;flex-direction:column;gap:5px;font-size:15px;color:var(--ink-soft);margin-bottom:12px;}
  .field span{font-size:14px;}
  .field span i{font-style:normal;color:var(--stone);margin-left:3px;}
  .field input,.field select,.field textarea{
    font:inherit;font-family:'Noto Sans TC',sans-serif;font-size:15px;
    padding:8px 10px;border:1px solid var(--rule);border-radius:3px;
    background:var(--surface);color:var(--ink);width:100%;
  }
  .field input[type="number"],.field input[data-kind="duration"]{font-family:'IBM Plex Mono',monospace;}
  .field textarea{resize:vertical;min-height:60px;}
  .field-inline{flex-direction:row;align-items:center;gap:8px;}
  .field-inline input{width:auto;}

  .subsection{padding:6px 2px 22px;}
  .subsection-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
  .subsection h3{font-size:15px;font-weight:600;color:var(--ink-soft);}

  .repeat-rows .empty-hint{padding:0 0 8px;}
  .repeat-row{
    position:relative;display:flex;flex-wrap:wrap;gap:10px 16px;
    padding:14px 36px 4px 14px;border:1px solid var(--rule);border-radius:3px;
    margin-bottom:10px;background:var(--surface);
  }
  .repeat-row .field{flex:1 1 150px;min-width:130px;}
  .row-remove{
    position:absolute;top:6px;right:8px;width:22px;height:22px;border:none;
    background:none;color:var(--stone);font-size:19px;line-height:1;
  }
  .row-remove:hover{color:var(--flag);}

  .tier-label{
    display:flex;align-items:center;justify-content:center;width:28px;height:28px;
    border:1.5px solid var(--ink);border-radius:50%;font-size:15px;flex-shrink:0;margin-top:4px;
  }

  .create-form{max-width:420px;}
  .create-form h1{font-size:24px;margin-bottom:20px;}
  .create-actions{display:flex;gap:10px;margin-top:8px;}

  @media (max-width:860px){
    #topbar{padding:16px 18px 12px;transition:padding 0.2s ease;}
    #main-content{padding:18px 18px 80px;}
    .topbar-row1{flex-direction:column;align-items:stretch;gap:12px;}
    .topbar-actions{justify-content:space-between;}
    .auth-user{max-width:140px;}
    .auth-user .mono{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .app-tagline{transition:opacity 0.15s ease,max-height 0.15s ease,margin 0.15s ease;max-height:20px;overflow:hidden;}
    #topbar.topbar-compact{padding-top:10px;padding-bottom:8px;}
    #topbar.topbar-compact .app-tagline{opacity:0;max-height:0;margin:0;}
    #topbar.topbar-compact .topbar-row1{gap:6px;}
    .cal-cell{min-height:64px;padding:4px 4px 3px;}
    .cal-weekdays span{font-size:12px;}
    .cal-chip{font-size:12px;padding:2px 4px;}
  }
  @media (max-width:640px){
    .cal-weekdays,.cal-grid{display:none;}
    .cal-list{display:block;}
  }
  @media (max-width:520px){
    .cal-cell{min-height:auto;}
    .cal-daynum{font-size:13px;}
    .topbar-actions{flex-wrap:wrap;gap:10px;}
    .auth-user{max-width:110px;}
  }

  /* ---------- Import modal ---------- */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(22,35,28,0.45);
    display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;
  }
  .modal-overlay[hidden]{display:none;}
  .modal-panel{
    background:var(--surface);border-radius:4px;padding:28px 30px;max-width:440px;width:100%;
    max-height:86vh;overflow-y:auto;
  }
  .modal-panel-wide{max-width:960px;}
  .modal-panel h2{font-size:20px;margin-bottom:10px;}
  .modal-hint{color:var(--ink-soft);font-size:15px;margin-bottom:16px;}
  .modal-actions{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap;}
  .modal-actions-top{margin-top:0;margin-bottom:14px;}
  .sheet-checks{display:flex;flex-direction:column;gap:8px;max-height:280px;overflow-y:auto;padding:4px 0;}
  .sheet-check{display:flex;align-items:center;gap:8px;font-size:15px;}
  .import-table-wrap{overflow-x:auto;border:1px solid var(--rule);border-radius:3px;}
  .import-table{border-collapse:collapse;width:100%;font-size:14px;}
  .import-table th{text-align:left;padding:8px 8px;border-bottom:1px solid var(--rule);background:var(--paper);white-space:nowrap;position:sticky;top:0;}
  .import-table td{padding:5px 8px;border-bottom:1px solid var(--rule);vertical-align:middle;}
  .import-table input[type="text"],.import-table input[type="date"],.import-table select{
    font:inherit;font-size:14px;padding:5px 6px;border:1px solid var(--rule);border-radius:3px;background:var(--surface);width:100%;min-width:90px;
  }
  .import-table input.narrow{min-width:60px;width:74px;}
  .import-table td:first-child{width:28px;}

  /* ---------- Series comparison ---------- */
  .series-best{font-size:15px;margin:0 0 12px;}
  .series-table-wrap{overflow-x:auto;border:1px solid var(--rule);border-radius:3px;}
  .series-table{border-collapse:collapse;width:100%;font-size:14px;}
  .series-table th{text-align:left;padding:8px 10px;border-bottom:1px solid var(--rule);background:var(--paper);white-space:nowrap;}
  .series-table td{padding:7px 10px;border-bottom:1px solid var(--rule);white-space:nowrap;}
  .series-table tr.current{background:rgba(46,107,73,0.08);}
  .series-table td.pb-time{color:var(--gold);font-weight:700;}

  /* ---------- Equipment templates ---------- */
  .template-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px;}
  .template-bar select{
    font:inherit;font-size:14px;padding:6px 8px;border:1px solid var(--rule);border-radius:3px;background:var(--surface);color:var(--ink);
  }
  .template-save-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;}
  .template-save-row input{
    flex:1 1 200px;font:inherit;font-size:15px;padding:8px 10px;border:1px solid var(--rule);border-radius:3px;background:var(--surface);color:var(--ink);
  }

  /* ---------- GPX/TCX import & paste quick-fill ---------- */
  .gpx-import-bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:2px 2px 16px;}
  .gpx-summary{list-style:none;margin:0 0 18px;padding:0;display:flex;flex-direction:column;gap:6px;font-size:15px;}
  .gpx-summary li{display:flex;justify-content:space-between;border-bottom:1px solid var(--rule);padding:5px 2px;}
  #paste-json-input{
    width:100%;font-family:'IBM Plex Mono',monospace;font-size:13px;padding:10px 12px;border:1px solid var(--rule);
    border-radius:3px;background:var(--surface);color:var(--ink);resize:vertical;margin-bottom:8px;
  }
  .paste-error{color:var(--flag);font-size:13px;min-height:18px;margin:0 0 8px;}
</style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="topbar-row1">
      <div class="topbar-brand">
        <h1 class="app-title">賽事紀錄</h1>
        <p class="app-tagline">從報名到終點的完整紀錄</p>
      </div>
      <div class="topbar-actions">
        <button id="btn-theme-toggle" class="btn-ghost icon-btn" aria-label="切換深色模式" title="切換深色模式"></button>
        <div id="auth-area" class="auth-area"></div>
        <button id="btn-new" class="btn-primary">+ 新增賽事</button>
      </div>
    </div>
    <div class="topbar-row2">
      <div class="cal-nav">
        <button id="cal-prev" class="btn-ghost" aria-label="上個月">‹</button>
        <span id="cal-label" class="cal-label mono"></span>
        <button id="cal-next" class="btn-ghost" aria-label="下個月">›</button>
        <button id="cal-today" class="btn-ghost">今天</button>
      </div>
      <input id="search-input" type="search" placeholder="搜尋賽事名稱、城市…">
      <div id="filter-chips" class="chips"></div>
    </div>
    <div class="topbar-row3">
      <button id="btn-import" class="btn-text">匯入 Excel</button>
      <button id="btn-export" class="btn-text">匯出 JSON</button>
      <button id="btn-clear" class="btn-text danger">清除全部資料</button>
    </div>
  </header>
  <main id="main-content">
    <section id="calendar"></section>
    <section id="detail"></section>
  </main>
</div>
<input type="file" id="import-file-input" accept=".xlsx,.xls" style="display:none">
<div id="import-modal" class="modal-overlay" hidden></div>
<input type="file" id="gpx-file-input" accept=".gpx,.tcx" style="display:none">
<div id="gpx-modal" class="modal-overlay" hidden></div>
<div id="paste-modal" class="modal-overlay" hidden></div>
<div id="shoe-modal" class="modal-overlay" hidden></div>
<div id="pacing-modal" class="modal-overlay" hidden></div>

<script>
/* ============================================================
   常數與選項
   ============================================================ */
const STATUS_OPTIONS=[
  {value:'registered',label:'已報名'},{value:'lottery_pending',label:'抽籤中'},
  {value:'considering',label:'考慮中'},{value:'completed',label:'已完賽'},
  {value:'dns',label:'未起跑 (DNS)'},{value:'dnf',label:'未完賽 (DNF)'},
];
const SPORT_OPTIONS=[
  {value:'road_running',label:'路跑'},{value:'trail_running',label:'越野跑'},
  {value:'ultra_marathon',label:'超級馬拉松'},{value:'duathlon',label:'二鐵'},
  {value:'triathlon',label:'三鐵'},{value:'cycling',label:'自行車'},
  {value:'obstacle_race',label:'障礙賽'},{value:'other',label:'其他'},

  {value:'solo',label:'個人單人'},{value:'pair',label:'雙人組'},

const WEATHER_OPTIONS=[{value:'sunny',label:'晴'},{value:'cloudy',label:'陰'},{value:'rainy',label:'雨'},{value:'foggy',label:'霧'},{value:'other',label:'其他'}];
const ROLE_OPTIONS=[{value:'partner',label:'同行夥伴'},{value:'cheer_squad',label:'加油團'},{value:'emergency_contact',label:'緊急聯絡人'},{value:'pacer',label:'配速員'},{value:'other',label:'其他'}];
const EQUIP_CATEGORY_OPTIONS=[{value:'shoes',label:'跑鞋/戰靴'},{value:'apparel',label:'服裝'},{value:'vest',label:'背心'},{value:'headlamp',label:'頭燈'},{value:'nutrition',label:'補給品'},{value:'mandatory_gear',label:'強制裝備'},{value:'other',label:'其他'}];
const MEDIA_TYPE_OPTIONS=[{value:'official_site',label:'官方網站'},{value:'brochure_pdf',label:'賽事簡章 PDF'},{value:'gpx_track',label:'GPX 軌跡'},{value:'photo_album',label:'個人相簿'},{value:'certificate',label:'證書照片'},{value:'medal_photo',label:'獎牌照片'},{value:'other',label:'其他'}];
const TRANSPORT_MODE_OPTIONS=[{value:'hsr',label:'高鐵'},{value:'shuttle',label:'接駁車'},{value:'self_drive',label:'自駕'},{value:'flight',label:'飛機'},{value:'other',label:'其他'}];
const DIRECTION_OPTIONS=[{value:'outbound',label:'去程'},{value:'return',label:'回程'}];

const SECTION_BASIC=[
  {path:'name',label:'賽事名稱',type:'text'},
  {path:'alias',label:'別名 / 英文名稱',type:'text'},
  {path:'series',label:'賽事系列（跨年比較用，同系列請填一致名稱）',type:'text',wide:true},
  {path:'status',label:'狀態',type:'select',options:STATUS_OPTIONS},
  {path:'sportType',label:'主要運動種類',type:'select',options:SPORT_OPTIONS},
  {path:'raceFormat',label:'競賽形式',type:'select',options:FORMAT_OPTIONS},
  {path:'schedule.raceDate',label:'比賽日期',type:'date'},
  {path:'schedule.startTime',label:'起跑時間',type:'time'},
  {path:'schedule.registrationOpenDate',label:'報名開始日期',type:'date'},
  {path:'schedule.registrationCloseDate',label:'報名截止日期',type:'date'},
  {path:'schedule.lotteryResultDate',label:'抽籤結果公佈日',type:'date'},
  {path:'lottery.applicants',label:'抽籤申請人數',type:'number'},
  {path:'lottery.winners',label:'抽籤名額 / 中籤人數',type:'number'},
  {path:'lottery.winRatePct',label:'中籤率',type:'number',unit:'%'},
  {path:'lottery.wasSelected',label:'本次是否抽中',type:'checkbox'},
  {path:'location.venueName',label:'起終點名稱',type:'text'},
  {path:'location.city',label:'縣市',type:'text'},
  {path:'location.country',label:'國家',type:'text'},
];
const SECTION_ROUTE=[
  {path:'route.distanceKm',label:'總距離',type:'number',unit:'公里'},
  {path:'route.elevationGainM',label:'總爬升',type:'number',unit:'公尺'},
  {path:'route.elevationLossM',label:'總下降',type:'number',unit:'公尺'},
  {path:'route.startAltitudeM',label:'起點海拔',type:'number',unit:'公尺'},
  {path:'route.minAltitudeM',label:'最低海拔',type:'number',unit:'公尺'},
  {path:'route.maxAltitudeM',label:'最高海拔',type:'number',unit:'公尺'},
  {path:'route.surface.pavedPct',label:'柏油路比例',type:'number',unit:'%'},
  {path:'route.surface.trailPct',label:'土路比例',type:'number',unit:'%'},
  {path:'route.surface.stairsPct',label:'階梯比例',type:'number',unit:'%'},
  {path:'route.checkpointCount',label:'CP / 補給站數量',type:'number'},
  {path:'route.cutoffTimeSeconds',label:'全程關門時間',type:'duration'},
  {path:'route.itraPoints',label:'ITRA / UTMB 點數（官方公告值，非自動計算）',type:'number'},
  {path:'route.terrainNotes',label:'賽道陡升段說明',type:'textarea',wide:true},
];
const SECTION_WEATHER=[
  {path:'climateForecast.avgTempC',label:'歷年平均氣溫',type:'number',unit:'°C'},
  {path:'climateForecast.avgHumidityPct',label:'歷年平均濕度',type:'number',unit:'%'},
  {path:'climateForecast.windDirection',label:'風向',type:'text'},
  {path:'climateForecast.windSpeedKmh',label:'風速',type:'number',unit:'km/h'},
  {path:'climateForecast.rainProbabilityPct',label:'降雨機率',type:'number',unit:'%'},

];
const SECTION_LOGISTICS=[

  {path:'budget.currency',label:'幣別',type:'text'},
  {path:'budget.paymentStatus',label:'繳費狀態',type:'select',options:PAYMENT_OPTIONS},

  {path:'trainingPlan.externalPlanUrl',label:'外部訓練計畫連結',type:'url',wide:true},
  {path:'trainingPlan.notes',label:'訓練備註',type:'textarea',wide:true},
];
const SECTION_POST=[
  {path:'results.gunTimeSeconds',label:'大會時間 (Gun Time)',type:'duration'},
  {path:'results.chipTimeSeconds',label:'晶片時間 (Chip Time)',type:'duration'},
  {path:'results.overallRank',label:'總排名次',type:'number'},
  {path:'results.overallParticipants',label:'總參賽人數',type:'number'},
  {path:'results.ageGroupRank',label:'分組名次',type:'number'},
  {path:'results.ageGroupParticipants',label:'分組人數',type:'number'},
  {path:'results.isPb',label:'個人最佳 (PB)',type:'checkbox'},
  {path:'results.firstHalfSeconds',label:'前半程時間',type:'duration'},
  {path:'results.secondHalfSeconds',label:'後半程時間',type:'duration'},
  {path:'performanceData.avgHr',label:'平均心率',type:'number',unit:'bpm'},
  {path:'performanceData.maxHr',label:'最大心率',type:'number',unit:'bpm'},
  {path:'performanceData.avgCadence',label:'平均步頻',type:'number',unit:'spm'},
  {path:'performanceData.avgPowerWatts',label:'平均功率',type:'number',unit:'W'},
  {path:'performanceData.dataSource',label:'資料來源',type:'text'},
  {path:'review.hitTheWallNotes',label:'撞牆期紀錄',type:'textarea',wide:true},
  {path:'review.courseReview',label:'路線心得',type:'textarea',wide:true},
  {path:'review.pros',label:'優點評價',type:'textarea',wide:true},
  {path:'review.cons',label:'缺點評價',type:'textarea',wide:true},

];

const CHECKPOINT_FIELDS=[
  {path:'name',label:'名稱',type:'text'},{path:'distanceKm',label:'距離',type:'number',unit:'公里'},
  {path:'cutoffTimeSeconds',label:'關門時間',type:'duration'},{path:'elevationM',label:'海拔',type:'number',unit:'公尺'},
  {path:'hasWater',label:'提供飲水',type:'checkbox'},{path:'hasFood',label:'提供食物',type:'checkbox'},
  {path:'hasDropBag',label:'可寄放裝備',type:'checkbox'},{path:'notes',label:'備註',type:'text'},
];
const ACCOM_FIELDS=[
  {path:'hotelName',label:'飯店名稱',type:'text'},{path:'address',label:'地址',type:'text'},
  {path:'checkIn',label:'入住時間',type:'datetime-local'},{path:'checkOut',label:'退房時間',type:'datetime-local'},
  {path:'distanceToStartKm',label:'距起點距離',type:'number',unit:'公里'},
  {path:'bookingStatus',label:'訂房狀態',type:'select',options:BOOKING_OPTIONS},
  {path:'cost',label:'費用',type:'number'},{path:'notes',label:'備註',type:'text'},
];
const TRANSPORT_FIELDS=[
  {path:'direction',label:'方向',type:'select',options:DIRECTION_OPTIONS},
  {path:'mode',label:'交通工具',type:'select',options:TRANSPORT_MODE_OPTIONS},
  {path:'departureTime',label:'發車 / 出發時間',type:'datetime-local'},
  {path:'pickupLocation',label:'接駁點位置',type:'text'},{path:'notes',label:'備註',type:'text'},
];

function uid(){return 'r'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function getPath(obj,path){return path.split('.').reduce((o,k)=>(o==null?undefined:o[k]),obj);}
function setPath(obj,path,value){
  const keys=path.split('.');let o=obj;
  for(let i=0;i<keys.length-1;i++){o=o[keys[i]];}
  o[keys[keys.length-1]]=value;
}
function labelFor(options,value){const o=options.find(o=>o.value===value);return o?o.label:(value||'—');}
function statusLabel(v){return labelFor(STATUS_OPTIONS,v);}
function sportLabel(v){return labelFor(SPORT_OPTIONS,v);}
function secToHMS(sec){
  if(sec==null||sec==='') return '';
  sec=Math.round(Number(sec));
  const h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=Math.floor(sec%60);
  return h+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
function hmsToSec(str){
  if(!str||!str.trim()) return null;
  const parts=str.trim().split(':').map(Number);
  if(parts.some(isNaN)) return null;
  while(parts.length<3) parts.unshift(0);
  const [h,m,s]=parts;
  return h*3600+m*60+s;
}
function daysDiff(dateStr){
  if(!dateStr) return null;
  const target=new Date(dateStr+'T00:00:00');
  if(isNaN(target.getTime())) return null;
  const today=new Date();today.setHours(0,0,0,0);
  return Math.round((target-today)/86400000);
}
function countdownLabel(race){
  if(race.status==='completed') return '已完賽';
  if(race.status==='dns') return 'DNS';
  if(race.status==='dnf') return 'DNF';
  const d=daysDiff(race.schedule&&race.schedule.raceDate);
  if(d==null) return '尚未設定日期';
  if(d>0) return `倒數 ${d} 天`;
  if(d===0) return '今天出發';
  return `已過 ${Math.abs(d)} 天`;
}
function adaptiveCountdown(d){
  if(d==null) return '尚未設定日期';
  if(d<0) return `已過 ${Math.abs(d)} 天`;
  if(d===0) return '就是今天';
  if(d>=60) return `還有約 ${Math.round(d/30)} 個月`;
  if(d>=14) return `還有 ${Math.round(d/7)} 週`;
  return `還有 ${d} 天`;
}
const PROGRESS_WINDOW_DAYS=180;
function progressPct(d){
  if(d==null) return null;
  if(d<=0) return 100;
  if(d>=PROGRESS_WINDOW_DAYS) return 0;
  return Math.round((1-d/PROGRESS_WINDOW_DAYS)*100);
}
function progressBlockHtml(race){
  if(['completed','dns','dnf'].includes(race.status)) return '';
  const d=daysDiff(race.schedule&&race.schedule.raceDate);
  if(d==null) return '';
  const pct=progressPct(d);
  const urgent=d>=0&&d<=7;
  return `<div class="progress-block">
    <div class="progress-label"><span>${adaptiveCountdown(d)}</span><span class="mono">${race.schedule.raceDate}</span></div>
    <div class="progress-track"><div class="progress-fill${urgent?' urgent':''}" style="width:${pct}%"></div></div>
  </div>`;
}

function sparklineSvg(race){
  const pts=(race.checkpoints||[]).filter(c=>c.elevationM!=null&&c.distanceKm!=null).sort((a,b)=>a.distanceKm-b.distanceKm);
  if(pts.length<2) return '';
  const xs=pts.map(p=>p.distanceKm),ys=pts.map(p=>p.elevationM);
  const minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys);
  const w=140,h=22,pad=2;
  const sx=x=>maxX===minX?w/2:pad+(x-minX)/(maxX-minX)*(w-2*pad);
  const sy=y=>maxY===minY?h/2:h-pad-(y-minY)/(maxY-minY)*(h-2*pad);
  const points=pts.map(p=>sx(p.distanceKm).toFixed(1)+','+sy(p.elevationM).toFixed(1)).join(' ');
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polyline points="${points}" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>`;
}

// window.storage 只存在於 Claude 內建的 artifact 預覽環境；獨立架站（如 GitHub Pages）
// 或直接開檔案時並不存在，此時自動改用瀏覽器原生的 localStorage，兩種環境都能正常儲存。
const hasArtifactStorage=(typeof window.storage!=='undefined')&&(typeof window.storage.get==='function');

// 補上舊資料（此功能上線前建立的賽事）缺少的欄位，避免 setPath 寫入 undefined 巢狀物件時出錯。
function migrateRace(r){
  if(r.series==null) r.series='';
  if(r.lottery==null) r.lottery={applicants:null,winners:null,winRatePct:null,wasSelected:false};
  if(r.nutritionSchedule==null) r.nutritionSchedule=[];
  if(r.route&&r.route.itraPoints===undefined) r.route.itraPoints=null;
  if(r.route&&r.route.elevationProfile==null) r.route.elevationProfile=[];
  if(r.results&&r.results.firstHalfSeconds===undefined) r.results.firstHalfSeconds=null;
  if(r.results&&r.results.secondHalfSeconds===undefined) r.results.secondHalfSeconds=null;
  if(r.performanceData&&r.performanceData.shoeId===undefined) r.performanceData.shoeId='';
  return r;
}

async function loadRaces(){
  try{
    if(hasArtifactStorage){
      const res=await window.storage.get(STORAGE_KEY,false);
      state.races=(res&&res.value)?JSON.parse(res.value):[];
    }else{
      const raw=localStorage.getItem(STORAGE_KEY);
      state.races=raw?JSON.parse(raw):[];
    }
    state.races=state.races.map(migrateRace);
  }catch(err){
    state.races=[];
  }
}
async function persist(){
  try{
    if(hasArtifactStorage){
      await window.storage.set(STORAGE_KEY,JSON.stringify(state.races),false);
    }else{
      localStorage.setItem(STORAGE_KEY,JSON.stringify(state.races));
    }
  }catch(err){
    console.error('本機儲存失敗',err);
  }
  scheduleCloudSync();
}

/* ============================================================
   雲端同步（Firebase，選用功能）
   本機儲存（localStorage / window.storage）永遠是主要的儲存方式，
   雲端同步是疊加上去的：登入後會把資料同步到 Firestore，
   讓同一個 Google 帳號在不同裝置間可以看到一樣的資料。
   未設定 Firebase 或未登入時，這整組功能不會做任何事。
   ============================================================ */
let cloudSyncTimer=null;
function cloudEnabled(){
  return !!(window.__cloud&&window.__cloud.enabled);
}
function scheduleCloudSync(){
  if(!state.user||!cloudEnabled()) return;
  clearTimeout(cloudSyncTimer);
  cloudSyncTimer=setTimeout(()=>{cloudSyncAllRaces();},800);
}
async function cloudSyncAllRaces(){
  if(!state.user||!cloudEnabled()) return;
  try{
    await window.__cloud.replaceAll(state.user.uid,state.races);
  }catch(err){
    console.error('雲端同步失敗',err);
  }
}
async function mergeCloudAndLocal(cloudRaces){
  const merged={};
  state.races.forEach(r=>{merged[r.id]=r;});
  cloudRaces.forEach(r=>{
    const existing=merged[r.id];
    if(!existing||(r.updatedAt||'')>(existing.updatedAt||'')) merged[r.id]=r;
  });
  state.races=Object.values(merged).map(migrateRace);
}
let authError=null;
function renderAuthArea(){
  const el=document.getElementById('auth-area');
  if(!el) return;
  if(!cloudEnabled()){
    el.innerHTML=`<span class="auth-hint small">雲端同步未設定</span>`;
    return;
  }
  if(state.user){
    const name=state.user.displayName||state.user.email||'已登入';
    const photo=state.user.photoURL?`<img src="${state.user.photoURL}" alt="">`:'';
    el.innerHTML=`<span class="auth-user small">${photo}<span class="mono">${escapeHtml(name)}</span></span><button id="btn-signout" class="btn-text">登出</button>`;
  }else{
    el.innerHTML=`<button id="btn-signin" class="btn-ghost">使用 Google 登入同步</button>${authError?`<span class="auth-error small">${escapeHtml(authError)}</span>`:''}`;
  }
}
function authErrorMessage(err){
  const code=err&&err.code||'';
  if(code==='auth/unauthorized-domain') return '這個網域還沒被 Firebase 授權，請到 Authentication → Settings → Authorized domains 新增此網域';
  if(code==='auth/popup-blocked') return '瀏覽器擋掉了登入視窗，請允許彈出視窗後再試一次';
  if(code==='auth/popup-closed-by-user') return '登入視窗被關閉了，請再試一次';
  if(code==='auth/cancelled-popup-request') return '';
  return '登入失敗：'+(err&&err.message?err.message:'未知錯誤')+(code?`（${code}）`:'');
}
async function handleAuthChange(user){
  state.user=user;
  renderAuthArea();
  if(user){
    try{
      const cloudRaces=await window.__cloud.fetchAll(user.uid);
      await mergeCloudAndLocal(cloudRaces);
      await persist();
      await cloudSyncAllRaces();
      renderAll();
    }catch(err){
      console.error('雲端資料讀取失敗',err);
    }
  }
}
document.addEventListener('click',e=>{
  if(e.target.closest('#btn-signin')){
    if(cloudEnabled()){
      authError=null;renderAuthArea();
      window.__cloud.signIn().catch(err=>{
        console.error('登入失敗',err);
        authError=authErrorMessage(err);
        renderAuthArea();
      });
    }
    return;
  }
  if(e.target.closest('#btn-signout')){
    if(cloudEnabled()) window.__cloud.signOutUser().catch(err=>console.error('登出失敗',err));
    return;
  }
});
window.addEventListener('cloud-ready',()=>{
  renderAuthArea();
  if(cloudEnabled()) window.__cloud.onAuthChange(handleAuthChange);
});

function pathToId(path){ return 'f-'+path.replace(/\./g,'-'); }
function renderField(race,cfg){
  const val=getPath(race,cfg.path);
  const id=pathToId(cfg.path);
  let input;
  switch(cfg.type){
    case 'select':
      input=`<select id="${id}" data-path="${cfg.path}"><option value="">—</option>${cfg.options.map(o=>`<option value="${o.value}" ${val===o.value?'selected':''}>${o.label}</option>`).join('')}</select>`;
      break;
    case 'textarea':
      input=`<textarea id="${id}" data-path="${cfg.path}" rows="3">${escapeHtml(val||'')}</textarea>`;
      break;
    case 'checkbox':
      return `<label class="field field-inline" for="${id}"><span>${cfg.label}</span><input id="${id}" type="checkbox" data-path="${cfg.path}" ${val?'checked':''}></label>`;
    case 'duration':
      input=`<input id="${id}" type="text" placeholder="H:MM:SS" data-path="${cfg.path}" data-kind="duration" value="${val!=null?secToHMS(val):''}">`;
      break;
    case 'number':
      input=`<input id="${id}" type="number" step="any" data-path="${cfg.path}" value="${val!=null?val:''}">`;
      break;
    default:
      input=`<input id="${id}" type="${cfg.type||'text'}" data-path="${cfg.path}" value="${escapeHtml(val!=null?val:'')}">`;
  }

function computeSplitPercent(race){

  if(h1==null||h2==null||h1<=0) return null;
  return ((h2-h1)/h1)*100;
}
function renderSplitAnalysis(race){
  const pct=computeSplitPercent(race);
  if(pct==null) return '';
  const isNegative=pct<0;
  const label=isNegative?'負分段（後半程加速）':'正分段（後半程掉速）';
  const cls=isNegative?'split-good':(pct>5?'split-bad':'split-ok');
  return `<div class="split-analysis ${cls}">
    <span class="split-analysis-label">${label}</span>
    <span class="split-analysis-value mono">${pct>0?'+':''}${pct.toFixed(1)}%</span>

function elevationProfileHtml(race){
  let pts=(race.route.elevationProfile&&race.route.elevationProfile.length>=2)?race.route.elevationProfile
    :(race.checkpoints||[]).filter(c=>c.elevationM!=null&&c.distanceKm!=null).map(c=>({distanceKm:c.distanceKm,elevationM:c.elevationM}));
  pts=pts.filter(p=>p.elevationM!=null&&p.distanceKm!=null).sort((a,b)=>a.distanceKm-b.distanceKm);
  if(pts.length<2) return '';
  const w=600,h=130,pad=6;
  const xs=pts.map(p=>p.distanceKm),ys=pts.map(p=>p.elevationM);
  const minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys);
  const sx=x=>pad+(x-minX)/((maxX-minX)||1)*(w-2*pad);
  const sy=y=>h-pad-(y-minY)/((maxY-minY)||1)*(h-2*pad);
  const linePoints=pts.map(p=>sx(p.distanceKm).toFixed(1)+','+sy(p.elevationM).toFixed(1)).join(' ');
  const areaPoints=`${sx(minX).toFixed(1)},${(h-pad).toFixed(1)} ${linePoints} ${sx(maxX).toFixed(1)},${(h-pad).toFixed(1)}`;
  return `<div class="elevation-profile">
    <div class="elevation-profile-head small"><span>海拔變化圖</span><span class="mono">${Math.round(minY)}–${Math.round(maxY)} 公尺</span></div>
    <svg viewBox="0 0 ${w} ${h}" class="elevation-svg" preserveAspectRatio="none">
      <polygon points="${areaPoints}" fill="var(--trail)" opacity="0.14"/>
      <polyline points="${linePoints}" fill="none" stroke="var(--trail)" stroke-width="2"/>
    </svg>
  </div>`;
}

/* ============================================================
   分享圖產生（Canvas，純前端，不上傳任何資料）
   ============================================================ */
function canvasWrapText(ctx,text,x,y,maxWidth,lineHeight,maxLines){
  const chars=Array.from(text||'');
  let line='',curY=y,lines=0;
  for(let i=0;i<chars.length;i++){
    const testLine=line+chars[i];
    if(ctx.measureText(testLine).width>maxWidth&&line){
      ctx.fillText(line,x,curY);
      line=chars[i];curY+=lineHeight;lines++;
      if(maxLines&&lines>=maxLines-1){
        const rest=chars.slice(i+1).join('');
        line+= rest ? '…' : '';
        break;
      }
    }else{
      line=testLine;
    }
  }
  ctx.fillText(line,x,curY);
  return curY;
}
async function buildShareCanvas(race){
  try{ await document.fonts.ready; }catch(e){}
  const W=1080,H=1080;
  const canvas=document.createElement('canvas');
  canvas.width=W;canvas.height=H;
  const ctx=canvas.getContext('2d');
  const isPb=!!race.results.isPb;

  ctx.fillStyle='#16231C';
  ctx.fillRect(0,0,W,H);

  ctx.strokeStyle='#EEF0EF';ctx.lineWidth=7;ctx.lineCap='round';ctx.lineJoin='round';
  ctx.beginPath();
  ctx.moveTo(80,150);ctx.lineTo(170,80);ctx.lineTo(215,115);ctx.lineTo(280,55);
  ctx.stroke();
  ctx.fillStyle='#B8451F';
  ctx.beginPath();ctx.arc(280,55,11,0,Math.PI*2);ctx.fill();

  ctx.fillStyle='#9BA3A0';
  ctx.font='28px "Noto Sans TC",sans-serif';
  ctx.fillText('賽事紀錄',80,210);

  ctx.fillStyle='#EDEEE9';
  ctx.font='bold 52px "Noto Sans TC",sans-serif';
  const nameEndY=canvasWrapText(ctx,race.name||'(未命名賽事)',80,300,W-160,64,2);

  ctx.fillStyle='#9BA3A0';
  ctx.font='30px "IBM Plex Mono",monospace';
  ctx.fillText(race.schedule.raceDate||'',80,nameEndY+60);

  const timeY=nameEndY+190;
  ctx.fillStyle=isPb?'#D9B15C':'#EDEEE9';
  ctx.font='bold 128px "IBM Plex Mono",monospace';
  ctx.fillText(secToHMS(race.results.chipTimeSeconds||0),80,timeY);
  if(isPb){
    ctx.strokeStyle='#D9B15C';ctx.fillStyle='none';ctx.lineWidth=2;
    ctx.font='bold 28px "Noto Sans TC",sans-serif';
    ctx.fillStyle='#D9B15C';
    ctx.fillText('個人最佳 PB',80,timeY+50);
  }

  const pace=race.route.distanceKm?formatPace(race.results.chipTimeSeconds/race.route.distanceKm):null;
  const badges=[];
  if(pace) badges.push(['配速',pace+'/km']);
  if(race.route.distanceKm) badges.push(['距離',race.route.distanceKm+' 公里']);
  if(race.route.elevationGainM!=null) badges.push(['總爬升',race.route.elevationGainM+' 公尺']);
  if(race.results.overallRank!=null) badges.push(['總排名次',String(race.results.overallRank)]);

  const badgeY=timeY+(isPb?110:70);
  const colW=(W-160)/Math.max(badges.length,1);
  badges.forEach((b,i)=>{
    const bx=80+i*colW;
    ctx.fillStyle='#6B7178';
    ctx.font='24px "Noto Sans TC",sans-serif';
    ctx.fillText(b[0],bx,badgeY);
    ctx.fillStyle='#EDEEE9';
    ctx.font='bold 34px "IBM Plex Mono",monospace';
    ctx.fillText(b[1],bx,badgeY+42);
  });

  ctx.fillStyle='#4C9A72';
  ctx.font='24px "Noto Sans TC",sans-serif';
  ctx.fillText(sportLabel(race.sportType),80,H-70);

  return canvas;
}
async function downloadShareImage(race){
  const canvas=await buildShareCanvas(race);
  canvas.toBlob(blob=>{
    if(!blob) return;
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;a.download=(race.name||'race').replace(/[\\/:*?"<>|]/g,'')+'-分享圖.png';
    a.click();
    URL.revokeObjectURL(url);
  },'image/png');
}

/* ============================================================
   主畫面渲染
   ============================================================ */
const calendarEl=document.getElementById('calendar');
const calLabelEl=document.getElementById('cal-label');
const detailEl=document.getElementById('detail');
const filterChipsEl=document.getElementById('filter-chips');
const searchInputEl=document.getElementById('search-input');
const WEEKDAY_LABELS=['日','一','二','三','四','五','六'];
const MONTH_LABEL_FMT=(y,m)=>`${y} 年 ${m+1} 月`;

const FILTER_CHIPS=[
  {value:'all',label:'全部'},
  {value:'upcoming',label:'即將到來'},
  {value:'registered',label:'已報名'},
  {value:'lottery_pending',label:'抽籤中'},
  {value:'considering',label:'考慮中'},
  {value:'history',label:'歷史紀錄'},
  {value:'completed',label:'已完賽'},
  {value:'dns',label:'DNS'},
  {value:'dnf',label:'DNF'},
];
function isUpcomingRace(r,todayStr){
  return ['registered','lottery_pending','considering'].includes(r.status)&&(!r.schedule.raceDate||r.schedule.raceDate>=todayStr);
}
function isHistoryRace(r,todayStr){
  return ['completed','dns','dnf'].includes(r.status)||(r.schedule.raceDate&&r.schedule.raceDate<todayStr);
}
function matchesFilter(r,filter,todayStr){
  if(filter==='all') return true;
  if(filter==='upcoming') return isUpcomingRace(r,todayStr);
  if(filter==='history') return isHistoryRace(r,todayStr);
  return r.status===filter;
}
function computeFilterCounts(){
  const todayStr=todayISO();
  const counts={};
  FILTER_CHIPS.forEach(f=>{counts[f.value]=0;});
  state.races.forEach(r=>{
    FILTER_CHIPS.forEach(f=>{ if(matchesFilter(r,f.value,todayStr)) counts[f.value]++; });
  });
  return counts;
}
function renderFilterChips(){
  const counts=computeFilterCounts();
  filterChipsEl.innerHTML=FILTER_CHIPS.map(f=>
    `<button class="chip${state.filterStatus===f.value?' active':''}" data-status="${f.value}">${f.label}${counts[f.value]?` (${counts[f.value]})`:''}</button>`
  ).join('');
}
function filteredRaces(){
  const q=state.searchQuery.trim().toLowerCase();
  const todayStr=todayISO();
  return state.races.filter(r=>{
    if(!matchesFilter(r,state.filterStatus,todayStr)) return false;
    if(q){
      const hay=`${r.name} ${r.alias} ${(r.location&&r.location.city)||''}`.toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
}
function buildRacesByDate(races){
  const map={};
  races.forEach(r=>{
    const d=r.schedule&&r.schedule.raceDate;
    if(!d) return;
    (map[d]=map[d]||[]).push(r);
  });
  return map;
}

function formatPace(secPerKm){
  if(secPerKm==null||!isFinite(secPerKm)||secPerKm<=0) return null;
  const m=Math.floor(secPerKm/60),s=Math.round(secPerKm%60);
  return `${m}'${String(s).padStart(2,'0')}"`;
}
function computeCareerStats(){
  const completed=state.races.filter(r=>r.status==='completed');
  const marathonPB=completed
    .filter(r=>r.route.distanceKm>=41&&r.route.distanceKm<=43.5&&r.results.chipTimeSeconds!=null)
    .reduce((min,r)=>(min==null||r.results.chipTimeSeconds<min)?r.results.chipTimeSeconds:min,null);
  const thisYear=String(new Date().getFullYear());
  const yearDistance=completed
    .filter(r=>r.schedule.raceDate&&r.schedule.raceDate.startsWith(thisYear))
    .reduce((sum,r)=>sum+(r.route.distanceKm||0),0);
  return {totalCompleted:completed.length,marathonPB,yearDistance};
}
function renderCareerSummary(){
  if(state.races.length<5) return '';
  const s=computeCareerStats();
  const items=[['總完賽場次',s.totalCompleted+' 場']];
  if(s.marathonPB!=null) items.push(['全馬 PB',secToHMS(s.marathonPB)]);
  if(s.yearDistance>0) items.push([`${new Date().getFullYear()} 年累計里程`,s.yearDistance.toFixed(1)+' 公里']);
  return `<div class="career-summary">${items.map(([l,v])=>`<div class="career-stat"><span class="career-stat-value mono">${v}</span><span class="career-stat-label">${l}</span></div>`).join('')}</div>`;
}

function renderCalendar(){
  const y=state.calendarYear,m=state.calendarMonth;
  calLabelEl.textContent=MONTH_LABEL_FMT(y,m);
  renderFilterChips();
  const racesByDate=buildRacesByDate(filteredRaces());
  const todayISOStr=todayISO();

  const firstOfMonth=new Date(y,m,1);
  const startOffset=firstOfMonth.getDay();
  const daysInMonth=new Date(y,m+1,0).getDate();
  const daysInPrevMonth=new Date(y,m,0).getDate();
  const totalCells=Math.ceil((startOffset+daysInMonth)/7)*7;

  const cells=[];
  const listRows=[];
  for(let i=0;i<totalCells;i++){
    const dayNum=i-startOffset+1;
    let cellY=y,cellM=m,cellD=dayNum,muted=false;
    if(dayNum<1){cellM=m-1;cellD=daysInPrevMonth+dayNum;muted=true;if(cellM<0){cellM=11;cellY=y-1;}}
    else if(dayNum>daysInMonth){cellD=dayNum-daysInMonth;cellM=m+1;muted=true;if(cellM>11){cellM=0;cellY=y+1;}}
    const iso=`${cellY}-${String(cellM+1).padStart(2,'0')}-${String(cellD).padStart(2,'0')}`;
    const dayRaces=racesByDate[iso]||[];
    const isToday=iso===todayISOStr;
    const shown=dayRaces.slice(0,3);
    const extra=dayRaces.length-shown.length;
    cells.push(`<div class="cal-cell${muted?' muted':''}${isToday?' today':''}">
      <span class="cal-daynum">${cellD}</span>
      ${shown.map(r=>`<button type="button" class="cal-chip status-${r.status}${r.id===state.selectedId?' selected':''}" data-id="${r.id}" title="${escapeHtml(r.name)}">${escapeHtml(r.name)||'(未命名賽事)'}</button>`).join('')}
      ${extra>0?`<span class="cal-more">+${extra}</span>`:''}
    </div>`);
    // 手機清單檢視只列本月、有賽事的日期，避免小螢幕上格子太擠、觸控熱區太小
    if(!muted&&dayRaces.length){
      listRows.push(`<div class="cal-list-day">
        <div class="cal-list-date mono${isToday?' today':''}">${cellD}<span class="cal-list-weekday">${WEEKDAY_LABELS[new Date(cellY,cellM,cellD).getDay()]}</span></div>
        <div class="cal-list-races">
          ${dayRaces.map(r=>`<button type="button" class="cal-list-item status-${r.status}${r.id===state.selectedId?' selected':''}" data-id="${r.id}">
            <span class="stamp status-${r.status}">${statusLabel(r.status)}</span>
            <span class="cal-list-name">${escapeHtml(r.name)||'(未命名賽事)'}</span>
          </button>`).join('')}
        </div>
      </div>`);
    }
  }

  calendarEl.innerHTML=`
    ${renderCareerSummary()}
    <div class="cal-weekdays">${WEEKDAY_LABELS.map(w=>`<span>${w}</span>`).join('')}</div>
    <div class="cal-grid">${cells.join('')}</div>
    <div class="cal-list">${listRows.length?listRows.join(''):`<p class="empty-hint">這個月沒有符合條件的賽事</p>`}</div>
  `;
}

/* ============================================================
   Excel 匯入
   ============================================================ */
const HEADER_KEYWORDS=[
  [['日期'],'date'],
  [['項目','賽事','名稱'],'name'],
  [['距離'],'distance'],
  [['地點','地址','位置'],'venue'],
  [['費用','報名費'],'fee'],
  [['報名'],'statusHint'],
];
const RACE_KEYWORDS=/馬拉松|路跑|越野|鐵人|半程|全馬|接力|障礙|定向|泳渡|三鐵|二鐵|夜跑|盃|杯|marathon|trail|triathlon|relay/i;

function inferColumnRoles(headerRow,dataRows){
  const roles=headerRow.map(()=>null);
  const used=new Set();
  headerRow.forEach((h,i)=>{
    const text=(h==null?'':String(h));
    for(const [keys,role] of HEADER_KEYWORDS){
      if(keys.some(k=>text.includes(k))&&!used.has(role)){roles[i]=role;used.add(role);return;}
    }
  });
  headerRow.forEach((h,i)=>{
    if(roles[i]) return;
    const sample=dataRows.map(r=>(r||[])[i]).filter(v=>v!=null&&v!=='').slice(0,15);
    if(sample.length===0){roles[i]='note';return;}
    const numericCount=sample.filter(v=>typeof v==='number'||(typeof v==='string'&&v.trim()!==''&&!isNaN(Number(v)))).length;
    const dateCount=sample.filter(v=>v instanceof Date).length;
    if(!used.has('distance')&&numericCount/sample.length>0.5){roles[i]='distance';used.add('distance');return;}
    if(!used.has('date')&&dateCount/sample.length>0.5){roles[i]='date';used.add('date');return;}
    roles[i]='note';
  });
  return roles;
}
function cellToISODate(v){
  if(v instanceof Date&&!isNaN(v)){
    const y=v.getFullYear(),m=String(v.getMonth()+1).padStart(2,'0'),d=String(v.getDate()).padStart(2,'0');
    return `${y}-${m}-${d}`;
  }
  if(typeof v==='string'){
    const s=v.trim();
    if(/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0,10);
    if(/[~～–至到]/.test(s)) return null;
    const m=s.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/);
    if(m) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  }
  return null;
}
function parseDistanceCell(v){
  if(v==null||v==='') return {km:null,raw:''};
  if(typeof v==='number') return {km:v,raw:String(v)};
  const s=String(v).trim();
  const n=Number(s);
  if(s!==''&&!isNaN(n)) return {km:n,raw:s};
  return {km:null,raw:s};
}
function parseFeeCell(v){
  if(v==null||v==='') return null;
  if(typeof v==='number') return v;
  const s=String(v).trim();
  if(/free|免費/i.test(s)) return 0;
  const n=Number(s.replace(/[^\d.]/g,''));
  return isNaN(n)?null:n;
}
function inferSportType(name){
  if(/鐵人|triathlon|challenge|226|113|70\.3/i.test(name)) return 'triathlon';
  if(/越野|trail/i.test(name)) return 'trail_running';
  if(/超馬|ultra/i.test(name)) return 'ultra_marathon';
  if(/障礙/i.test(name)) return 'obstacle_race';
  if(/自行車|單車|cycling|bike/i.test(name)) return 'cycling';
  if(/泳渡|長泳|游泳|swim/i.test(name)) return 'other';
  return 'road_running';
}
function inferFormat(name,distanceRaw){
  const hay=name+' '+(distanceRaw||'');
  if(/接力|relay/i.test(hay)) return 'relay';
  if(/雙人|pair/i.test(hay)) return 'pair';
  if(/繞圈|loop/i.test(hay)) return 'loop';
  return 'solo';
}
function todayISO(){
  const d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function parseSheetRows(sheetName,rows,isCurated){
  let headerIdx=0;
  for(let i=0;i<Math.min(rows.length,5);i++){
    const rowText=(rows[i]||[]).map(c=>c==null?'':String(c)).join('|');
    if(rowText.includes('日期')||rowText.includes('項目')){headerIdx=i;break;}
  }
  const headerRow=rows[headerIdx]||[];
  const dataRows=rows.slice(headerIdx+1);
  const roles=inferColumnRoles(headerRow,dataRows);
  const candidates=[];
  dataRows.forEach(row=>{
    if(!row||row.every(c=>c==null||c==='')) return;
    let name='',dateISO=null,distRaw=null,distKm=null,venue='',fee=null;
    const noteParts=[];
    roles.forEach((role,i)=>{
      const v=(row||[])[i];
      if(v==null||v==='') return;
      if(role==='name'&&!name) name=String(v).trim();
      else if(role==='date'&&!dateISO) dateISO=cellToISODate(v);
      else if(role==='distance'&&distKm==null&&distRaw==null){const d=parseDistanceCell(v);distKm=d.km;distRaw=d.raw;}
      else if(role==='venue'&&!venue) venue=String(v).trim();
      else if(role==='fee'&&fee==null) fee=parseFeeCell(v);
      else if(role==='note'||role==='statusHint'){
        const label=(headerRow[i]==null||headerRow[i]==='')?'':String(headerRow[i])+': ';
        noteParts.push(label+String(v).trim());
      }
    });
    if(!name) return;
    const noteText=noteParts.join(' ｜ ');
    const hasRaceKeyword=RACE_KEYWORDS.test(name);
    const hasDistance=distKm!=null;
    const checked=isCurated?true:!!(dateISO&&(hasDistance||hasRaceKeyword));
    let status;
    if(/DNF/i.test(noteText)) status='dnf';
    else if(/DNS/i.test(noteText)) status='dns';
    else if(dateISO) status=(dateISO<todayISO())?'completed':'registered';
    else status='considering';
    candidates.push({
      sheetName,checked,name,dateISO:dateISO||'',distanceRaw:distRaw||'',distanceKm:distKm,
      venue,fee,status,note:noteText,
    });
  });
  return candidates;
}

let importWorkbook=null;
let importSheetChecks={};
let importCandidates=[];
const importModalEl=document.getElementById('import-modal');

document.getElementById('btn-import').addEventListener('click',()=>{
  document.getElementById('import-file-input').click();
});
document.getElementById('import-file-input').addEventListener('change',async e=>{
  const file=e.target.files[0];
  if(!file) return;
  const buf=await file.arrayBuffer();
  importWorkbook=XLSX.read(buf,{type:'array',cellDates:true});
  importSheetChecks={};
  importWorkbook.SheetNames.forEach(n=>{importSheetChecks[n]=/^(19|20)\d{2}$/.test(n.trim());});
  if(!Object.values(importSheetChecks).some(Boolean)){
    importSheetChecks[importWorkbook.SheetNames[0]]=true;
  }
  importCandidates=[];
  showImportModal('select-sheets');
  e.target.value='';
});

function parseCheckedSheets(){
  importCandidates=[];
  importWorkbook.SheetNames.forEach(name=>{
    if(!importSheetChecks[name]) return;
    const ws=importWorkbook.Sheets[name];
    const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:null});
    const isCurated=/^(19|20)\d{2}$/.test(name.trim());
    importCandidates.push(...parseSheetRows(name,rows,isCurated));
  });
  importCandidates.sort((a,b)=>(a.dateISO||'9999').localeCompare(b.dateISO||'9999'));
}

/* ============================================================
   運動紀錄檔匯入（GPX / TCX，Garmin / COROS / Strava 皆可匯出）
   全部在瀏覽器端解析，不會上傳到任何伺服器。
   ============================================================ */
function haversineKm(lat1,lon1,lat2,lon2){
  const R=6371;
  const dLat=(lat2-lat1)*Math.PI/180,dLon=(lon2-lon1)*Math.PI/180;
  const a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
function findByLocalName(parent,localName){
  if(!parent) return null;
  const all=parent.getElementsByTagName('*');
  for(let i=0;i<all.length;i++){ if(all[i].localName===localName) return all[i]; }
  return null;
}
// 用「回落門檻」抓總爬升，避免 GPS 高度雜訊把爬升灌水：
// 只有確認下降超過 threshold 公尺，才把前一段上升正式計入總爬升。
function computeElevationGain(elevations,threshold){
  threshold=threshold||2;
  let gain=0,lastValley=elevations[0],peak=elevations[0];
  for(let i=1;i<elevations.length;i++){
    const e=elevations[i];
    if(e>peak){ peak=e; }
    else if(peak-e>=threshold){
      if(peak>lastValley) gain+=peak-lastValley;
      lastValley=e;peak=e;
    }
  }
  if(peak>lastValley) gain+=peak-lastValley;
  return Math.round(gain);
}
function computeSplitsFromPoints(pts){
  const valid=pts.filter(p=>p.lat!=null&&p.lon!=null);
  if(valid.length<2) return [];
  const splits=[];
  let cumDist=0,splitStartTime=valid[0].time,hrSum=0,hrCount=0,nextBoundary=1;
  for(let i=1;i<valid.length;i++){
    const d=haversineKm(valid[i-1].lat,valid[i-1].lon,valid[i].lat,valid[i].lon);
    const prevCum=cumDist;
    cumDist+=d;
    if(valid[i].hr!=null){ hrSum+=valid[i].hr; hrCount++; }
    while(cumDist>=nextBoundary && valid[i-1].time && valid[i].time){
      const frac=(nextBoundary-prevCum)/((cumDist-prevCum)||1);
      const t0=valid[i-1].time.getTime(),t1=valid[i].time.getTime();
      const crossTime=new Date(t0+(t1-t0)*frac);
      const splitTimeSeconds=Math.round((crossTime-splitStartTime)/1000);
      splits.push({distanceKm:1,splitTimeSeconds,avgHr:hrCount?Math.round(hrSum/hrCount):null,avgPaceSecPerKm:splitTimeSeconds,elevationGainM:null,notes:''});
      splitStartTime=crossTime;hrSum=0;hrCount=0;nextBoundary+=1;
    }
  }
  return splits;
}
function downsampleElevationProfile(pts,maxPoints){
  const valid=pts.filter(p=>p.lat!=null&&p.lon!=null&&p.ele!=null);
  if(valid.length<2) return [];
  let cum=0;
  const withDist=[{distanceKm:0,elevationM:valid[0].ele}];
  for(let i=1;i<valid.length;i++){
    cum+=haversineKm(valid[i-1].lat,valid[i-1].lon,valid[i].lat,valid[i].lon);
    withDist.push({distanceKm:cum,elevationM:valid[i].ele});
  }
  if(withDist.length<=maxPoints) return withDist.map(p=>({distanceKm:+p.distanceKm.toFixed(2),elevationM:Math.round(p.elevationM)}));
  const step=(withDist.length-1)/(maxPoints-1);
  const out=[];
  for(let i=0;i<maxPoints;i++){
    const idx=Math.round(i*step);
    out.push({distanceKm:+withDist[idx].distanceKm.toFixed(2),elevationM:Math.round(withDist[idx].elevationM)});
  }
  return out;
}
function summarizeTrackPoints(pts){
  const valid=pts.filter(p=>p.lat!=null&&p.lon!=null);
  if(valid.length<2) throw new Error('檔案中沒有足夠的座標點');
  let distKm=0;
  for(let i=1;i<valid.length;i++) distKm+=haversineKm(valid[i-1].lat,valid[i-1].lon,valid[i].lat,valid[i].lon);
  const elevations=valid.map(p=>p.ele).filter(e=>e!=null);
  const hrs=valid.map(p=>p.hr).filter(h=>h!=null);
  const cads=valid.map(p=>p.cad).filter(c=>c!=null);
  const withTime=valid.filter(p=>p.time);
  const t0=withTime[0]&&withTime[0].time,t1=withTime.length?withTime[withTime.length-1].time:null;
  return {
    distanceKm:+distKm.toFixed(2),
    durationSeconds:(t0&&t1)?Math.round((t1-t0)/1000):null,
    elevationGainM:elevations.length>1?computeElevationGain(elevations):null,
    avgHr:hrs.length?Math.round(hrs.reduce((a,b)=>a+b,0)/hrs.length):null,
    maxHr:hrs.length?Math.max(...hrs):null,
    avgCadence:cads.length?Math.round(cads.reduce((a,b)=>a+b,0)/cads.length):null,
    splits:computeSplitsFromPoints(valid),
    elevationProfile:downsampleElevationProfile(valid,50),
  };
}
function parseGpxDoc(xml){
  const pts=[...xml.getElementsByTagName('trkpt')].map(pt=>{
    const eleEl=findByLocalName(pt,'ele'),timeEl=findByLocalName(pt,'time');
    const hrEl=findByLocalName(pt,'hr'),cadEl=findByLocalName(pt,'cad');
    return {
      lat:parseFloat(pt.getAttribute('lat')),lon:parseFloat(pt.getAttribute('lon')),
      ele:eleEl?parseFloat(eleEl.textContent):null,
      time:timeEl?new Date(timeEl.textContent):null,
      hr:hrEl?parseFloat(hrEl.textContent):null,
      cad:cadEl?parseFloat(cadEl.textContent):null,
    };
  });
  return summarizeTrackPoints(pts);
}
function parseTcxDoc(xml){
  const laps=[...xml.getElementsByTagName('Lap')];
  const pts=[...xml.getElementsByTagName('Trackpoint')].map(tp=>{
    const latEl=findByLocalName(tp,'LatitudeDegrees'),lonEl=findByLocalName(tp,'LongitudeDegrees');
    const eleEl=findByLocalName(tp,'AltitudeMeters'),timeEl=findByLocalName(tp,'Time');
    const hrWrap=findByLocalName(tp,'HeartRateBpm');
    const hrEl=hrWrap?findByLocalName(hrWrap,'Value'):null;
    return {
      lat:latEl?parseFloat(latEl.textContent):null,lon:lonEl?parseFloat(lonEl.textContent):null,
      ele:eleEl?parseFloat(eleEl.textContent):null,
      time:timeEl?new Date(timeEl.textContent):null,
      hr:hrEl?parseFloat(hrEl.textContent):null,
    };
  });
  if(!laps.length) return summarizeTrackPoints(pts);

  let totalDistM=0,totalTimeS=0,hrSum=0,hrCount=0,maxHr=0;
  const splits=laps.map(lap=>{
    const distEl=findByLocalName(lap,'DistanceMeters'),timeEl=findByLocalName(lap,'TotalTimeSeconds');
    const avgHrWrap=findByLocalName(lap,'AverageHeartRateBpm'),maxHrWrap=findByLocalName(lap,'MaximumHeartRateBpm');
    const avgHrEl=avgHrWrap?findByLocalName(avgHrWrap,'Value'):null;
    const maxHrEl=maxHrWrap?findByLocalName(maxHrWrap,'Value'):null;
    const dist=distEl?parseFloat(distEl.textContent):0;
    const time=timeEl?parseFloat(timeEl.textContent):0;
    const avgHr=avgHrEl?parseFloat(avgHrEl.textContent):null;
    const mHr=maxHrEl?parseFloat(maxHrEl.textContent):null;
    totalDistM+=dist;totalTimeS+=time;
    if(avgHr!=null){ hrSum+=avgHr; hrCount++; }
    if(mHr!=null&&mHr>maxHr) maxHr=mHr;
    return {distanceKm:+(dist/1000).toFixed(2),splitTimeSeconds:Math.round(time),
      avgHr:avgHr!=null?Math.round(avgHr):null,
      avgPaceSecPerKm:dist>0?Math.round(time/(dist/1000)):null,
      elevationGainM:null,notes:''};
  });
  const elevations=pts.map(p=>p.ele).filter(e=>e!=null);
  const ptHrs=pts.map(p=>p.hr).filter(h=>h!=null);
  return {
    distanceKm:+(totalDistM/1000).toFixed(2),
    durationSeconds:Math.round(totalTimeS)||null,
    elevationGainM:elevations.length>1?computeElevationGain(elevations):null,
    avgHr:hrCount?Math.round(hrSum/hrCount):(ptHrs.length?Math.round(ptHrs.reduce((a,b)=>a+b,0)/ptHrs.length):null),
    maxHr:maxHr||(ptHrs.length?Math.max(...ptHrs):null),
    avgCadence:null,
    splits:laps.length>1?splits:computeSplitsFromPoints(pts),
    elevationProfile:downsampleElevationProfile(pts,50),
  };
}
function parseGpxOrTcx(text){
  const xml=new DOMParser().parseFromString(text,'application/xml');
  if(xml.getElementsByTagName('parsererror').length) throw new Error('檔案格式無法解析，請確認是有效的 GPX 或 TCX 檔');
  const isTcx=xml.getElementsByTagName('TrainingCenterDatabase').length>0;
  return isTcx?parseTcxDoc(xml):parseGpxDoc(xml);
}

/* ============================================================
   貼上資料快速填入
   給 Claude（或任何人）讀完賽事網站／簡章 PDF／完賽證書後，
   把整理好的 JSON 貼進來，自動合併到目前賽事對應的欄位。
   只會更新貼上的欄位，其餘資料不受影響；id / createdAt 一律不可被覆蓋。
   ============================================================ */
function deepMergeInto(target,source){
  Object.keys(source).forEach(key=>{
    const val=source[key];
    if(val!==null&&typeof val==='object'&&!Array.isArray(val)&&
       target[key]!==null&&typeof target[key]==='object'&&!Array.isArray(target[key])){
      deepMergeInto(target[key],val);
    }else{
      target[key]=val;
    }
  });
}

/* ============================================================
   配速試算與手環產生器
   ============================================================ */
function computePacingRows(targetSeconds,distanceKm,strategy,intervalKm){
  if(!targetSeconds||!distanceKm||!intervalKm) return [];
  const avgPace=targetSeconds/distanceKm;
  const x=strategy==='negative'?0.04:(strategy==='positive'?-0.04:0);
  const p1=avgPace*(1+x),p2=avgPace*(1-x);
  const rows=[];
  let d=intervalKm;
  while(d<distanceKm-0.05){
    const t=p1*d+(p2-p1)*d*d/(2*distanceKm);
    rows.push({distanceKm:+d.toFixed(1),cumulativeSeconds:Math.round(t)});
    d+=intervalKm;
  }
  rows.push({distanceKm:+distanceKm.toFixed(2),cumulativeSeconds:Math.round(targetSeconds)});
  return rows;
}
function pacingTableHtml(rows){
  return `<table class="series-table"><thead><tr><th>距離</th><th>預計通過時間</th></tr></thead>
    <tbody>${rows.map(r=>`<tr><td class="mono">${r.distanceKm} km</td><td class="mono">${secToHMS(r.cumulativeSeconds)}</td></tr>`).join('')}</tbody></table>`;
}
function pacingModalHtml(prefillTarget,prefillDistance,rows){
  return `<div class="modal-panel modal-panel-wide">
    <h2>配速試算與手環產生器</h2>
    <p class="modal-hint">輸入目標時間與距離，選擇配速策略，算出每個分段的預計通過時間，也可以下載成手環圖片。</p>
    <div class="pacing-inputs">
      <label class="field" for="pacing-target"><span>目標時間</span><input type="text" id="pacing-target" placeholder="H:MM:SS" value="${escapeHtml(prefillTarget||'')}"></label>
      <label class="field" for="pacing-distance"><span>總距離（公里）</span><input type="number" step="any" id="pacing-distance" value="${prefillDistance||''}"></label>
      <label class="field" for="pacing-strategy"><span>配速策略</span><select id="pacing-strategy">
        <option value="even">勻速</option>
        <option value="negative">負分段（後段加速）</option>
        <option value="positive">正分段（後段保守）</option>
      </select></label>
      <label class="field" for="pacing-interval"><span>分段間隔</span><select id="pacing-interval">
        <option value="5">每 5 公里</option>
        <option value="10">每 10 公里</option>
        <option value="1">每 1 公里</option>
      </select></label>
    </div>
    <div class="modal-actions modal-actions-top">
      <button class="btn-primary" data-action="calc-pacing">試算</button>
    </div>
    <div id="pacing-results">${rows&&rows.length?pacingTableHtml(rows):''}</div>
    <div class="modal-actions">
      ${rows&&rows.length?'<button class="btn-ghost" data-action="download-wristband">下載配速手環圖片</button>':''}
      <button class="btn-ghost" data-action="close-pacing">關閉</button>
    </div>
  </div>`;
}
let pacingModalRows=[];
const pacingModalEl_getter=()=>document.getElementById('pacing-modal');
function openPacingModal(){
  if(!currentRace) return;
  const goalA=currentRace.goals.find(g=>g.tier==='A');
  const prefillTarget=goalA&&goalA.targetTimeSeconds!=null?secToHMS(goalA.targetTimeSeconds):'';
  const prefillDistance=currentRace.route.distanceKm||'';
  pacingModalRows=[];
  pacingModalEl_getter().innerHTML=pacingModalHtml(prefillTarget,prefillDistance,null);
  pacingModalEl_getter().hidden=false;
}
pacingModalEl_getter().addEventListener('click',e=>{
  if(e.target.closest('[data-action="close-pacing"]')){
    pacingModalEl_getter().hidden=true;pacingModalEl_getter().innerHTML='';return;
  }
  if(e.target.closest('[data-action="calc-pacing"]')){
    const targetStr=document.getElementById('pacing-target').value;
    const distance=parseFloat(document.getElementById('pacing-distance').value);
    const strategy=document.getElementById('pacing-strategy').value;
    const interval=parseFloat(document.getElementById('pacing-interval').value);
    const targetSeconds=hmsToSec(targetStr);
    if(!targetSeconds||!distance){
      document.getElementById('pacing-results').innerHTML='<p class="paste-error">請輸入有效的目標時間與距離</p>';
      return;
    }
    pacingModalRows=computePacingRows(targetSeconds,distance,strategy,interval);
    pacingModalEl_getter().innerHTML=pacingModalHtml(targetStr,distance,pacingModalRows);
    return;
  }
  if(e.target.closest('[data-action="download-wristband"]')){
    downloadWristbandImage(pacingModalRows,currentRace);
    return;
  }
});
async function buildWristbandCanvas(rows,race){
  try{ await document.fonts.ready; }catch(e){}
  const W=360,H=120+rows.length*70;
  const canvas=document.createElement('canvas');
  canvas.width=W;canvas.height=H;
  const ctx=canvas.getContext('2d');
  ctx.fillStyle='#16231C';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#9BA3A0';
  ctx.font='20px "Noto Sans TC",sans-serif';
  ctx.fillText(race&&race.name?Array.from(race.name).slice(0,16).join(''):'配速手環',24,50);
  let y=100;
  rows.forEach(r=>{
    ctx.fillStyle='#EDEEE9';
    ctx.font='bold 28px "IBM Plex Mono",monospace';
    ctx.textAlign='left';
    ctx.fillText(String(r.distanceKm)+' km',24,y);
    ctx.fillStyle='#4C9A72';
    ctx.font='bold 32px "IBM Plex Mono",monospace';
    ctx.textAlign='right';
    ctx.fillText(secToHMS(r.cumulativeSeconds),W-24,y);
    ctx.textAlign='left';
    ctx.strokeStyle='#2A3038';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(24,y+20);ctx.lineTo(W-24,y+20);ctx.stroke();
    y+=70;
  });
  return canvas;
}
async function downloadWristbandImage(rows,race){
  if(!rows||!rows.length) return;
  const canvas=await buildWristbandCanvas(rows,race);
  canvas.toBlob(blob=>{
    if(!blob) return;
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;a.download='配速手環.png';
    a.click();
    URL.revokeObjectURL(url);
  },'image/png');
}

document.addEventListener('click',e=>{
  if(e.target.closest('[data-action="open-paste-modal"]')) openPasteModal();
  if(e.target.closest('[data-action="open-gpx-picker"]')) document.getElementById('gpx-file-input').click();
  if(e.target.closest('[data-action="generate-share-image"]')&&currentRace) downloadShareImage(currentRace);
  if(e.target.closest('[data-action="open-shoe-modal"]')) openShoeModal();
  if(e.target.closest('[data-action="open-pacing-modal"]')) openPacingModal();
});

/* ============================================================

async function init(){
  detailEl.innerHTML='<p class="empty-hint">載入中…</p>';
  renderAuthArea();
  await Promise.all([loadRaces(),loadTemplates(),loadShoes()]);
  if(templates.length===0){
    templates=STARTER_TEMPLATES.map(t=>({id:uid(),name:t.name,items:t.items}));
    persistTemplates();
  }
  renderAll();
}
init();
</script>
