<meta name="theme-color" content="#2E6B49">
<meta name="apple-mobile-web-app-capable" content="yes">

<style>
  :root{
    --paper:#EEF0EF;
    --surface:#FAFAF8;
    --ink:#16231C;
    --ink-soft:#4B564E;
    --rule:#D8DAD3;
    --trail:#2E6B49;
    --contour:#3A5A8C;
    --flag:#B8451F;
    --stone:#8B8D82;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Noto Sans TC',sans-serif;
    font-size:14px;
    line-height:1.6;
  }
  :focus-visible{outline:2px solid var(--contour);outline-offset:1px;}
  h1,h2,h3{margin:0;font-weight:700;}
  .mono{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;}
  .small{font-size:12px;}

  #app{display:flex;flex-direction:column;min-height:100vh;}

  /* ---------- Topbar ---------- */
  #topbar{
    position:sticky;top:0;z-index:10;background:var(--paper);
    border-bottom:1px solid var(--rule);padding:18px 32px 14px;
  }
  .topbar-row1{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;}
  .app-title{font-size:19px;letter-spacing:0.01em;}
  .app-tagline{color:var(--stone);font-size:12px;margin:2px 0 0;}
  .topbar-row2{display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin-top:14px;}
  .cal-nav{display:flex;align-items:center;gap:6px;flex-shrink:0;}
  .cal-nav .btn-ghost{padding:6px 11px;font-size:14px;}
  .cal-label{font-size:14px;min-width:92px;text-align:center;display:inline-block;}
  #search-input{
    flex:1 1 200px;min-width:160px;padding:8px 10px;border:1px solid var(--rule);
    border-radius:3px;background:var(--surface);color:var(--ink);font:inherit;
  }
  .chips{display:flex;flex-wrap:wrap;gap:6px;}
  .chip{
    font-size:12px;padding:4px 10px;border:1px solid var(--rule);border-radius:12px;
    background:none;cursor:pointer;color:var(--ink-soft);font-family:inherit;
  }
  .chip.active{background:var(--ink);color:var(--surface);border-color:var(--ink);}
  .topbar-row3{display:flex;gap:16px;margin-top:12px;flex-wrap:wrap;}

  #main-content{flex:1;padding:24px 32px 100px;max-width:1120px;width:100%;margin:0 auto;}
  .empty-hint{color:var(--stone);font-size:13px;padding:16px 8px;}

  /* ---------- Calendar ---------- */
  #calendar{margin-bottom:8px;}
  .cal-weekdays{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px;}
  .cal-weekdays span{font-size:12px;color:var(--stone);text-align:center;padding:2px 0;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
  .cal-cell{
    min-height:96px;border:1px solid var(--rule);border-radius:3px;background:var(--surface);
    padding:6px 6px 4px;display:flex;flex-direction:column;gap:3px;
  }
  .cal-cell.muted{background:transparent;border-color:transparent;}
  .cal-cell.muted .cal-daynum{color:var(--stone);}
  .cal-cell.today{border-color:var(--trail);border-width:1.5px;}
  .cal-daynum{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-soft);}
  .cal-cell.today .cal-daynum{color:var(--trail);font-weight:600;}
  .cal-chip{
    display:block;width:100%;text-align:left;border:none;border-left:3px solid currentColor;
    background:rgba(22,35,28,0.05);border-radius:2px;padding:2px 5px;font:inherit;
    font-size:11px;color:var(--ink);cursor:pointer;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;
  }
  .cal-chip.status-registered,.cal-chip.status-completed{color:var(--trail);}
  .cal-chip.status-considering,.cal-chip.status-lottery_pending{color:var(--contour);}
  .cal-chip.status-dns,.cal-chip.status-dnf{color:var(--flag);}
  .cal-chip.selected{background:var(--ink);color:var(--surface)!important;border-left-color:var(--surface);}
  .cal-more{font-size:11px;color:var(--stone);padding:1px 5px;}

  /* ---------- Progress block ---------- */
  .progress-block{margin:16px 0 22px;}
  .progress-label{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-soft);margin-bottom:6px;}
  .progress-label .mono{color:var(--ink);}
  .progress-track{height:8px;border-radius:4px;background:var(--rule);overflow:hidden;}
  .progress-fill{height:100%;background:var(--trail);border-radius:4px;}
  .progress-fill.urgent{background:var(--flag);}

  /* ---------- Stamp badge ---------- */
  .stamp{
    display:inline-block;padding:2px 9px;border:1.5px solid currentColor;border-radius:2px;
    font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.02em;
    transform:rotate(-2deg);white-space:nowrap;
  }
  .stamp.status-registered,.stamp.status-completed{color:var(--trail);}
  .stamp.status-considering,.stamp.status-lottery_pending{color:var(--contour);}
  .stamp.status-dns,.stamp.status-dnf{color:var(--flag);}

  /* ---------- Buttons ---------- */
  button{cursor:pointer;}
  .btn-primary{
    background:var(--ink);color:var(--surface);border:none;border-radius:3px;
    padding:10px 16px;font:inherit;font-weight:500;font-size:13px;
  }
  .btn-primary:hover{opacity:0.88;}
  .btn-ghost{
    background:none;border:1px solid var(--rule);color:var(--ink);border-radius:3px;
    padding:6px 12px;font:inherit;font-size:12px;
  }
  .btn-ghost:hover{border-color:var(--ink);}
  .btn-ghost.danger{color:var(--flag);border-color:var(--rule);}
  .btn-ghost.danger:hover{border-color:var(--flag);}
  .btn-text{background:none;border:none;color:var(--ink-soft);text-decoration:underline;font:inherit;font-size:12px;padding:0;}
  .btn-text.danger{color:var(--flag);}

  /* ---------- Detail ---------- */
  #detail{padding-top:32px;border-top:1px solid var(--rule);margin-top:28px;}
  #detail:empty{display:none;}
  .empty-state{padding:40px 0;color:var(--ink-soft);}
  .empty-state p{margin-bottom:16px;}

  .detail-header{padding-bottom:22px;margin-bottom:6px;border-bottom:2px solid var(--ink);}
  .dh-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
  .detail-header h1{font-size:27px;line-height:1.3;}
  .detail-header h1 .alias{font-weight:400;color:var(--ink-soft);font-size:16px;}
  .dh-meta{color:var(--ink-soft);}

  details.section{border-bottom:1px solid var(--rule);}
  details.section summary{
    cursor:pointer;font-weight:600;font-size:15px;padding:16px 2px;
    list-style:none;display:flex;align-items:center;justify-content:space-between;
  }
  details.section summary::-webkit-details-marker{display:none;}
  details.section summary::after{content:'+';font-family:'IBM Plex Mono',monospace;color:var(--stone);font-weight:400;}
  details.section[open] summary::after{content:'\2013';}

  .section-body{display:flex;flex-wrap:wrap;gap:16px 20px;padding:2px 2px 16px;}
  .section-body .field{flex:1 1 200px;min-width:170px;margin-bottom:0;}
  .section-body .field.wide{flex-basis:100%;}

  .field{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--ink-soft);margin-bottom:12px;}
  .field span{font-size:12px;}
  .field span i{font-style:normal;color:var(--stone);margin-left:3px;}
  .field input,.field select,.field textarea{
    font:inherit;font-family:'Noto Sans TC',sans-serif;font-size:13px;
    padding:8px 10px;border:1px solid var(--rule);border-radius:3px;
    background:var(--surface);color:var(--ink);width:100%;
  }
  .field input[type="number"],.field input[data-kind="duration"]{font-family:'IBM Plex Mono',monospace;}
  .field textarea{resize:vertical;min-height:60px;}
  .field-inline{flex-direction:row;align-items:center;gap:8px;}
  .field-inline input{width:auto;}

  .subsection{padding:6px 2px 22px;}
  .subsection-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
  .subsection h3{font-size:13px;font-weight:600;color:var(--ink-soft);}

  .repeat-rows .empty-hint{padding:0 0 8px;}
  .repeat-row{
    position:relative;display:flex;flex-wrap:wrap;gap:10px 16px;
    padding:14px 36px 4px 14px;border:1px solid var(--rule);border-radius:3px;
    margin-bottom:10px;background:var(--surface);
  }
  .repeat-row .field{flex:1 1 150px;min-width:130px;}
  .row-remove{
    position:absolute;top:6px;right:8px;width:22px;height:22px;border:none;
    background:none;color:var(--stone);font-size:17px;line-height:1;
  }
  .row-remove:hover{color:var(--flag);}

  .tier-label{
    display:flex;align-items:center;justify-content:center;width:28px;height:28px;
    border:1.5px solid var(--ink);border-radius:50%;font-size:13px;flex-shrink:0;margin-top:4px;
  }

  .create-form{max-width:420px;}
  .create-form h1{font-size:22px;margin-bottom:20px;}
  .create-actions{display:flex;gap:10px;margin-top:8px;}

  @media (max-width:860px){
    #topbar{padding:16px 18px 12px;}
    #main-content{padding:18px 18px 80px;}
    .cal-cell{min-height:64px;padding:4px 4px 3px;}
    .cal-weekdays span{font-size:10px;}
    .cal-chip{font-size:10px;}
  }
  @media (max-width:520px){
    .cal-cell{min-height:auto;}
    .cal-daynum{font-size:11px;}
  }

  /* ---------- Import modal ---------- */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(22,35,28,0.45);
    display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;
  }
  .modal-overlay[hidden]{display:none;}
  .modal-panel{
    background:var(--surface);border-radius:4px;padding:28px 30px;max-width:440px;width:100%;
    max-height:86vh;overflow-y:auto;
  }
  .modal-panel-wide{max-width:960px;}
  .modal-panel h2{font-size:18px;margin-bottom:10px;}
  .modal-hint{color:var(--ink-soft);font-size:13px;margin-bottom:16px;}

/* ============================================================
   工具函式
   ============================================================ */
function uid(){return 'r'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function getPath(obj,path){return path.split('.').reduce((o,k)=>(o==null?undefined:o[k]),obj);}
function setPath(obj,path,value){
  const keys=path.split('.');let o=obj;
  for(let i=0;i<keys.length-1;i++){o=o[keys[i]];}
  o[keys[keys.length-1]]=value;
}
function labelFor(options,value){const o=options.find(o=>o.value===value);return o?o.label:(value||'—');}
function statusLabel(v){return labelFor(STATUS_OPTIONS,v);}
function sportLabel(v){return labelFor(SPORT_OPTIONS,v);}
function secToHMS(sec){
  if(sec==null||sec==='') return '';
  sec=Math.round(Number(sec));
  const h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=Math.floor(sec%60);
  return h+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
function hmsToSec(str){
  if(!str||!str.trim()) return null;
  const parts=str.trim().split(':').map(Number);
  if(parts.some(isNaN)) return null;
  while(parts.length<3) parts.unshift(0);
  const [h,m,s]=parts;
  return h*3600+m*60+s;
}
function daysDiff(dateStr){
  if(!dateStr) return null;
  const target=new Date(dateStr+'T00:00:00');
  if(isNaN(target.getTime())) return null;
  const today=new Date();today.setHours(0,0,0,0);
  return Math.round((target-today)/86400000);
}
function countdownLabel(race){
  if(race.status==='completed') return '已完賽';
  if(race.status==='dns') return 'DNS';
  if(race.status==='dnf') return 'DNF';
  const d=daysDiff(race.schedule&&race.schedule.raceDate);
  if(d==null) return '尚未設定日期';
  if(d>0) return `倒數 ${d} 天`;
  if(d===0) return '今天出發';
  return `已過 ${Math.abs(d)} 天`;
}
function adaptiveCountdown(d){
  if(d==null) return '尚未設定日期';
  if(d<0) return `已過 ${Math.abs(d)} 天`;
  if(d===0) return '就是今天';
  if(d>=60) return `還有約 ${Math.round(d/30)} 個月`;
  if(d>=14) return `還有 ${Math.round(d/7)} 週`;
  return `還有 ${d} 天`;
}
const PROGRESS_WINDOW_DAYS=180;
function progressPct(d){
  if(d==null) return null;
  if(d<=0) return 100;
  if(d>=PROGRESS_WINDOW_DAYS) return 0;
  return Math.round((1-d/PROGRESS_WINDOW_DAYS)*100);
}
function progressBlockHtml(race){
  if(['completed','dns','dnf'].includes(race.status)) return '';
  const d=daysDiff(race.schedule&&race.schedule.raceDate);
  if(d==null) return '';
  const pct=progressPct(d);
  const urgent=d>=0&&d<=7;
  return `<div class="progress-block">
    <div class="progress-label"><span>${adaptiveCountdown(d)}</span><span class="mono">${race.schedule.raceDate}</span></div>
    <div class="progress-track"><div class="progress-fill${urgent?' urgent':''}" style="width:${pct}%"></div></div>
  </div>`;
}
function sparklineSvg(race){
  const pts=(race.checkpoints||[]).filter(c=>c.elevationM!=null&&c.distanceKm!=null).sort((a,b)=>a.distanceKm-b.distanceKm);
  if(pts.length<2) return '';
  const xs=pts.map(p=>p.distanceKm),ys=pts.map(p=>p.elevationM);
  const minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys);
  const w=140,h=22,pad=2;
  const sx=x=>maxX===minX?w/2:pad+(x-minX)/(maxX-minX)*(w-2*pad);
  const sy=y=>maxY===minY?h/2:h-pad-(y-minY)/(maxY-minY)*(h-2*pad);
  const points=pts.map(p=>sx(p.distanceKm).toFixed(1)+','+sy(p.elevationM).toFixed(1)).join(' ');
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polyline points="${points}" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>`;
}

/* ============================================================
   狀態與儲存
   ============================================================ */
const today0=new Date();
const state={races:[],selectedId:null,creating:false,filterStatus:'all',searchQuery:'',confirmDelete:false,
  calendarYear:today0.getFullYear(),calendarMonth:today0.getMonth(),savingTemplate:false,confirmDeleteTemplate:false};
let currentRace=null;
const STORAGE_KEY='races-v1';
const TEMPLATES_KEY='equipment-templates-v1';
// window.storage 只存在於 Claude 內建的 artifact 預覽環境；獨立架站（如 GitHub Pages）
// 或直接開檔案時並不存在，此時自動改用瀏覽器原生的 localStorage，兩種環境都能正常儲存。
const hasArtifactStorage=(typeof window.storage!=='undefined')&&(typeof window.storage.get==='function');

// 補上舊資料（此功能上線前建立的賽事）缺少的欄位，避免 setPath 寫入 undefined 巢狀物件時出錯。
function migrateRace(r){
  if(r.series==null) r.series='';
  if(r.lottery==null) r.lottery={applicants:null,winners:null,winRatePct:null,wasSelected:false};
  return r;
}

async function loadRaces(){
  try{
    if(hasArtifactStorage){
      const res=await window.storage.get(STORAGE_KEY,false);
      state.races=(res&&res.value)?JSON.parse(res.value):[];
    }else{
      const raw=localStorage.getItem(STORAGE_KEY);
      state.races=raw?JSON.parse(raw):[];
    }
    state.races=state.races.map(migrateRace);
  }catch(err){
    state.races=[];
  }
}
async function persist(){
  try{
    if(hasArtifactStorage){
      await window.storage.set(STORAGE_KEY,JSON.stringify(state.races),false);
    }else{
      localStorage.setItem(STORAGE_KEY,JSON.stringify(state.races));
    }
  }catch(err){
    console.error('儲存失敗',err);
  }
}

let templates=[];
async function loadTemplates(){
  try{
    if(hasArtifactStorage){
      const res=await window.storage.get(TEMPLATES_KEY,false);
      templates=(res&&res.value)?JSON.parse(res.value):[];
    }else{
      const raw=localStorage.getItem(TEMPLATES_KEY);
      templates=raw?JSON.parse(raw):[];
    }
  }catch(err){
    templates=[];
  }
}
async function persistTemplates(){
  try{
    if(hasArtifactStorage){
      await window.storage.set(TEMPLATES_KEY,JSON.stringify(templates),false);
    }else{
      localStorage.setItem(TEMPLATES_KEY,JSON.stringify(templates));
    }
  }catch(err){
    console.error('範本儲存失敗',err);
  }
}

/* ============================================================
   欄位 / 表單渲染
   ============================================================ */
function renderField(race,cfg){
  const val=getPath(race,cfg.path);
  let input;
  switch(cfg.type){
    case 'select':
      input=`<select data-path="${cfg.path}"><option value="">—</option>${cfg.options.map(o=>`<option value="${o.value}" ${val===o.value?'selected':''}>${o.label}</option>`).join('')}</select>`;
      break;
    case 'textarea':
      input=`<textarea data-path="${cfg.path}" rows="3">${escapeHtml(val||'')}</textarea>`;
      break;
    case 'checkbox':
      return `<label class="field field-inline"><span>${cfg.label}</span><input type="checkbox" data-path="${cfg.path}" ${val?'checked':''}></label>`;
    case 'duration':
      input=`<input type="text" placeholder="H:MM:SS" data-path="${cfg.path}" data-kind="duration" value="${val!=null?secToHMS(val):''}">`;
      break;
    case 'number':
      input=`<input type="number" step="any" data-path="${cfg.path}" value="${val!=null?val:''}">`;
      break;
    default:
      input=`<input type="${cfg.type||'text'}" data-path="${cfg.path}" value="${escapeHtml(val!=null?val:'')}">`;
  }
  return `<label class="field${cfg.wide?' wide':''}"><span>${cfg.label}${cfg.unit?`<i>(${cfg.unit})</i>`:''}</span>${input}</label>`;
}

function renderRepeatable(race,listKey){
  const meta=LIST_META[listKey];
  const items=race[listKey]||[];
  return `<div class="subsection">
    <div class="subsection-head"><h3>${meta.title}</h3><button type="button" class="btn-ghost" data-action="add-item" data-list="${listKey}">+ 新增</button></div>
    <div class="repeat-rows">
      ${items.length?items.map((it,i)=>`
        <div class="repeat-row">
          <button type="button" class="row-remove" data-action="remove-item" data-list="${listKey}" data-index="${i}" title="刪除">×</button>
          ${meta.fields.map(f=>renderField(race,Object.assign({},f,{path:`${listKey}.${i}.${f.path}`}))).join('')}
        </div>`).join(''):`<p class="empty-hint">尚未新增</p>`}
    </div>
  </div>`;
}

function renderGoals(race){

function renderEquipmentSection(race){
  const items=race.equipmentChecklist||[];
  const options=templates.map(t=>`<option value="${t.id}">${escapeHtml(t.name)}（${t.items.length} 項）</option>`).join('');
  return `<div class="subsection">
    <div class="subsection-head"><h3>裝備清單</h3><button type="button" class="btn-ghost" data-action="add-item" data-list="equipmentChecklist">+ 新增</button></div>
    <div class="template-bar">
      <select id="template-select">${templates.length?options:'<option value="">尚無已存範本</option>'}</select>
      <button type="button" class="btn-ghost" data-action="apply-template" ${templates.length?'':'disabled'}>套用範本</button>
      <button type="button" class="btn-ghost" data-action="save-template" ${items.length?'':'disabled'}>另存為範本</button>
      <button type="button" class="btn-ghost danger" data-action="delete-template" ${templates.length?'':'disabled'}>${state.confirmDeleteTemplate?'確定刪除？再按一次':'刪除範本'}</button>
    </div>
    ${state.savingTemplate?`
      <div class="template-save-row">
        <input type="text" id="template-name-input" placeholder="範本名稱，如「路跑標配」「越野標配」">
        <button type="button" class="btn-primary" data-action="confirm-save-template">儲存範本</button>
        <button type="button" class="btn-ghost" data-action="cancel-save-template">取消</button>
      </div>`:''}
    <div class="repeat-rows">
      ${items.length?items.map((it,i)=>`
        <div class="repeat-row">
          <button type="button" class="row-remove" data-action="remove-item" data-list="equipmentChecklist" data-index="${i}" title="刪除">×</button>
          ${EQUIP_FIELDS.map(f=>renderField(race,Object.assign({},f,{path:`equipmentChecklist.${i}.${f.path}`}))).join('')}
        </div>`).join(''):`<p class="empty-hint">尚未新增</p>`}
    </div>
  </div>`;
}

function renderSeriesComparison(race){
  if(!race.series||!race.series.trim()) return '';
  const key=race.series.trim();
  const seriesRaces=state.races.filter(r=>r.series&&r.series.trim()===key)
    .sort((a,b)=>(a.schedule.raceDate||'').localeCompare(b.schedule.raceDate||''));
  if(seriesRaces.length<2) return '';
  const bestTime=seriesRaces.reduce((best,r)=>{
    const t=r.results&&r.results.chipTimeSeconds;
    if(t==null) return best;
    return (best==null||t<best)?t:best;
  },null);
  return `<details class="section" open>
    <summary>系列賽事比較（跨年）</summary>
    <div class="section-body" style="display:block;padding-bottom:20px;">
      ${bestTime!=null?`<p class="series-best mono">系列最佳晶片時間：${secToHMS(bestTime)}</p>`:''}
      <div class="series-table-wrap">
        <table class="series-table">
          <thead><tr><th>年份</th><th>日期</th><th>狀態</th><th>晶片時間</th><th>中籤率</th></tr></thead>
          <tbody>
            ${seriesRaces.map(r=>{
              const year=(r.schedule.raceDate||'').slice(0,4)||'—';
              const t=r.results&&r.results.chipTimeSeconds;
              const isPb=r.results&&r.results.isPb;
              const rate=r.lottery&&r.lottery.winRatePct;
              return `<tr class="${r.id===race.id?'current':''}">
                <td class="mono">${year}${r.id===race.id?'（本場）':''}</td>
                <td class="mono">${r.schedule.raceDate||'—'}</td>
                <td><span class="stamp status-${r.status}">${statusLabel(r.status)}</span></td>
                <td class="mono">${t!=null?secToHMS(t):'—'}${isPb?' ⭐':''}</td>
                <td class="mono">${rate!=null?rate+'%':'—'}</td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>
    </div>
  </details>`;
}

/* ============================================================
   主畫面渲染

const calendarEl=document.getElementById('calendar');
const calLabelEl=document.getElementById('cal-label');
const detailEl=document.getElementById('detail');
const filterChipsEl=document.getElementById('filter-chips');
const searchInputEl=document.getElementById('search-input');
const WEEKDAY_LABELS=['日','一','二','三','四','五','六'];
const MONTH_LABEL_FMT=(y,m)=>`${y} 年 ${m+1} 月`;

function filteredRaces(){
  const q=state.searchQuery.trim().toLowerCase();
  return state.races.filter(r=>{
    if(state.filterStatus!=='all'&&r.status!==state.filterStatus) return false;
    if(q){
      const hay=`${r.name} ${r.alias} ${(r.location&&r.location.city)||''}`.toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
}
function buildRacesByDate(races){
  const map={};
  races.forEach(r=>{
    const d=r.schedule&&r.schedule.raceDate;
    if(!d) return;
    (map[d]=map[d]||[]).push(r);
  });
  return map;
}

function renderCalendar(){
  const y=state.calendarYear,m=state.calendarMonth;
  calLabelEl.textContent=MONTH_LABEL_FMT(y,m);
  const racesByDate=buildRacesByDate(filteredRaces());
  const todayISOStr=todayISO();

  const firstOfMonth=new Date(y,m,1);
  const startOffset=firstOfMonth.getDay();
  const daysInMonth=new Date(y,m+1,0).getDate();
  const daysInPrevMonth=new Date(y,m,0).getDate();
  const totalCells=Math.ceil((startOffset+daysInMonth)/7)*7;

  const cells=[];
  for(let i=0;i<totalCells;i++){
    const dayNum=i-startOffset+1;
    let cellY=y,cellM=m,cellD=dayNum,muted=false;
    if(dayNum<1){cellM=m-1;cellD=daysInPrevMonth+dayNum;muted=true;if(cellM<0){cellM=11;cellY=y-1;}}
    else if(dayNum>daysInMonth){cellD=dayNum-daysInMonth;cellM=m+1;muted=true;if(cellM>11){cellM=0;cellY=y+1;}}
    const iso=`${cellY}-${String(cellM+1).padStart(2,'0')}-${String(cellD).padStart(2,'0')}`;
    const dayRaces=racesByDate[iso]||[];
    const isToday=iso===todayISOStr;
    const shown=dayRaces.slice(0,3);
    const extra=dayRaces.length-shown.length;
    cells.push(`<div class="cal-cell${muted?' muted':''}${isToday?' today':''}">
      <span class="cal-daynum">${cellD}</span>
      ${shown.map(r=>`<button type="button" class="cal-chip status-${r.status}${r.id===state.selectedId?' selected':''}" data-id="${r.id}" title="${escapeHtml(r.name)}">${escapeHtml(r.name)||'(未命名賽事)'}</button>`).join('')}
      ${extra>0?`<span class="cal-more">+${extra}</span>`:''}
    </div>`);
  }

  calendarEl.innerHTML=`
    <div class="cal-weekdays">${WEEKDAY_LABELS.map(w=>`<span>${w}</span>`).join('')}</div>
    <div class="cal-grid">${cells.join('')}</div>
  `;
}

function detailHeaderHtml(race){
  const chip=(race.status==='completed'&&race.results.chipTimeSeconds)?` ・ 晶片時間 ${secToHMS(race.results.chipTimeSeconds)}`:'';
  return `<header class="detail-header">
    <div class="dh-top">
      <span class="stamp status-${race.status}">${statusLabel(race.status)}</span>
      <button class="btn-ghost danger" data-action="delete-race">${state.confirmDelete?'確定刪除？再按一次':'刪除賽事'}</button>
    </div>
    <h1>${escapeHtml(race.name)||'(未命名賽事)'} ${race.alias?`<span class="alias">/ ${escapeHtml(race.alias)}</span>`:''}</h1>
    <div class="dh-meta mono">${race.schedule.raceDate||'尚未設定日期'} ・ ${countdownLabel(race)}${chip}</div>
    ${sparklineSvg(race)}
    ${progressBlockHtml(race)}
  </header>`;
}

function renderDetail(){
  if(state.creating){detailEl.innerHTML=renderCreateForm();return;}
  const race=state.races.find(r=>r.id===state.selectedId);
  if(!race){detailEl.innerHTML=emptyStateHtml();currentRace=null;return;}
  currentRace=race;
  const openPre=['registered','lottery_pending','considering'].includes(race.status);
  detailEl.innerHTML=`
    ${detailHeaderHtml(race)}
    ${renderSeriesComparison(race)}
    <details class="section" ${openPre?'open':''}>
      <summary>基本資訊與時間</summary>
      <div class="section-body">${SECTION_BASIC.map(f=>renderField(race,f)).join('')}</div>
    </details>
    <details class="section" ${openPre?'open':''}>
      <summary>地理與路線</summary>
      <div class="section-body">${SECTION_ROUTE.map(f=>renderField(race,f)).join('')}</div>
      ${renderRepeatable(race,'checkpoints')}
    </details>
    <details class="section">
      <summary>氣象</summary>
      <div class="section-body">${SECTION_WEATHER.map(f=>renderField(race,f)).join('')}</div>
    </details>
    <details class="section" ${openPre?'open':''}>
      <summary>預算與行程規劃</summary>
      <div class="section-body">${SECTION_LOGISTICS.map(f=>renderField(race,f)).join('')}</div>
      ${renderRepeatable(race,'accommodations')}
      ${renderRepeatable(race,'transportation')}
      ${renderRepeatable(race,'companions')}
    </details>
    <details class="section" ${openPre?'open':''}>
      <summary>裝備、補給與戰略（賽前準備）</summary>
      <div class="section-body">${SECTION_PREP.map(f=>renderField(race,f)).join('')}</div>
      ${renderGoals(race)}
      ${renderEquipmentSection(race)}
    </details>
    <details class="section" ${!openPre?'open':''}>
      <summary>賽後紀錄與個人數據</summary>
      <div class="section-body">${SECTION_POST.map(f=>renderField(race,f)).join('')}</div>
      ${renderRepeatable(race,'splits')}
      ${renderRepeatable(race,'mediaLinks')}
    </details>
  `;
}

function updateDetailHeaderBits(){
  if(!currentRace) return;
  const header=detailEl.querySelector('.detail-header');
  if(header) header.outerHTML=detailHeaderHtml(currentRace);
}

function emptyStateHtml(){
  return `<div class="empty-state">
    <p>點選上方行事曆中的賽事查看詳細紀錄，或建立一場新賽事。</p>
    <button class="btn-primary" data-action="start-create">+ 新增賽事</button>
  </div>`;
}

function renderCreateForm(){
  return `<div class="create-form">
    <h1>新增賽事</h1>
    <label class="field"><span>賽事名稱</span><input type="text" id="new-name" placeholder="如：2026 臺北馬拉松"></label>
    <label class="field"><span>主要運動種類</span><select id="new-sport">${SPORT_OPTIONS.map(o=>`<option value="${o.value}">${o.label}</option>`).join('')}</select></label>
    <label class="field"><span>狀態</span><select id="new-status">${STATUS_OPTIONS.map(o=>`<option value="${o.value}" ${o.value==='considering'?'selected':''}>${o.label}</option>`).join('')}</select></label>

function renderAll(){renderCalendar();renderDetail();}
function scrollDetailIntoView(){
  if(typeof detailEl.scrollIntoView==='function') detailEl.scrollIntoView({behavior:'smooth',block:'start'});
}
function selectRace(id,{scroll}={scroll:true}){
  state.selectedId=id;state.creating=false;state.confirmDelete=false;
  renderAll();
  if(scroll) scrollDetailIntoView();
}

/* ============================================================
   事件處理
   ============================================================ */
function startCreate(){state.creating=true;state.selectedId=null;state.confirmDelete=false;renderAll();scrollDetailIntoView();}

document.getElementById('btn-new').addEventListener('click',startCreate);

searchInputEl.addEventListener('input',e=>{state.searchQuery=e.target.value;renderCalendar();});

filterChipsEl.addEventListener('click',e=>{
  const chip=e.target.closest('.chip');if(!chip) return;
  state.filterStatus=chip.dataset.status;
  [...filterChipsEl.children].forEach(c=>c.classList.toggle('active',c===chip));
  renderCalendar();
});

calendarEl.addEventListener('click',e=>{
  const chip=e.target.closest('.cal-chip');if(!chip) return;
  selectRace(chip.dataset.id);
});

function shiftCalendarMonth(delta){
  let m=state.calendarMonth+delta,y=state.calendarYear;
  if(m<0){m=11;y--;} else if(m>11){m=0;y++;}
  state.calendarMonth=m;state.calendarYear=y;
  renderCalendar();
}
document.getElementById('cal-prev').addEventListener('click',()=>shiftCalendarMonth(-1));
document.getElementById('cal-next').addEventListener('click',()=>shiftCalendarMonth(1));
document.getElementById('cal-today').addEventListener('click',()=>{
  const t=new Date();
  state.calendarYear=t.getFullYear();state.calendarMonth=t.getMonth();
  renderCalendar();
});

document.getElementById('btn-export').addEventListener('click',()=>{
  const blob=new Blob([JSON.stringify(state.races,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download='races-export.json';a.click();
  URL.revokeObjectURL(url);
});

let confirmClear=false;
document.getElementById('btn-clear').addEventListener('click',e=>{
  if(!confirmClear){
    confirmClear=true;e.target.textContent='確定清除？再按一次';
    setTimeout(()=>{confirmClear=false;e.target.textContent='清除全部資料';},4000);
    return;
  }
  state.races=[];state.selectedId=null;confirmClear=false;
  e.target.textContent='清除全部資料';
  persist();renderAll();
});

detailEl.addEventListener('change',e=>{
  const t=e.target;const path=t.dataset.path;if(!path||!currentRace) return;
  let value;
  if(t.type==='checkbox') value=t.checked;
  else if(t.dataset.kind==='duration') value=hmsToSec(t.value);
  else if(t.type==='number') value=(t.value===''?null:Number(t.value));
  else value=t.value;
  setPath(currentRace,path,value);
  currentRace.updatedAt=new Date().toISOString();
  if(path==='schedule.raceDate'&&value){
    const d=new Date(value+'T00:00:00');
    if(!isNaN(d)){state.calendarYear=d.getFullYear();state.calendarMonth=d.getMonth();}
  }
  persist();
  renderCalendar();
  const needsFullRerender=(path==='status'||path==='series'||path.startsWith('results.')||path.startsWith('lottery.'));
  if(needsFullRerender){renderDetail();}else{updateDetailHeaderBits();}
});

detailEl.addEventListener('click',e=>{
  const addBtn=e.target.closest('[data-action="add-item"]');
  if(addBtn){
    const listKey=addBtn.dataset.list;
    currentRace[listKey]=currentRace[listKey]||[];
    currentRace[listKey].push(LIST_META[listKey].factory());
    currentRace.updatedAt=new Date().toISOString();
    persist();renderDetail();return;
  }
  const rmBtn=e.target.closest('[data-action="remove-item"]');
  if(rmBtn){
    const listKey=rmBtn.dataset.list,idx=Number(rmBtn.dataset.index);
    currentRace[listKey].splice(idx,1);
    currentRace.updatedAt=new Date().toISOString();
    persist();renderDetail();return;
  }
  const delBtn=e.target.closest('[data-action="delete-race"]');
  if(delBtn){
    if(!state.confirmDelete){
      state.confirmDelete=true;renderDetail();
      setTimeout(()=>{state.confirmDelete=false;if(currentRace&&currentRace.id===state.selectedId) renderDetail();},4000);
      return;
    }
    state.races=state.races.filter(r=>r.id!==currentRace.id);
    state.selectedId=null;state.confirmDelete=false;currentRace=null;
    persist();renderAll();return;
  }
  if(e.target.closest('[data-action="start-create"]')){startCreate();return;}
  if(e.target.closest('[data-action="cancel-create"]')){state.creating=false;renderAll();return;}
  if(e.target.closest('[data-action="confirm-create"]')){
    const nameEl=document.getElementById('new-name');
    const name=nameEl.value.trim();
    if(!name){nameEl.focus();return;}
    const sportType=document.getElementById('new-sport').value;
    const status=document.getElementById('new-status').value;
    const raceDate=document.getElementById('new-date').value;
    const race=emptyRace(name,sportType,status,raceDate);
    state.races.push(race);
    state.selectedId=race.id;state.creating=false;
    if(raceDate){
      const d=new Date(raceDate+'T00:00:00');
      if(!isNaN(d)){state.calendarYear=d.getFullYear();state.calendarMonth=d.getMonth();}
    }
    persist();renderAll();return;
  }
  if(e.target.closest('[data-action="apply-template"]')){
    const sel=document.getElementById('template-select');
    const tpl=templates.find(t=>t.id===sel.value);
    if(!tpl) return;
    currentRace.equipmentChecklist=(currentRace.equipmentChecklist||[]).concat(
      tpl.items.map(it=>({itemName:it.itemName,category:it.category,isMandatory:it.isMandatory,isPacked:false,notes:''}))
    );
    currentRace.updatedAt=new Date().toISOString();
    persist();renderDetail();return;
  }
  if(e.target.closest('[data-action="save-template"]')){
    state.savingTemplate=true;renderDetail();
    const input=document.getElementById('template-name-input');
    if(input) input.focus();
    return;
  }
  if(e.target.closest('[data-action="cancel-save-template"]')){
    state.savingTemplate=false;renderDetail();return;
  }
  if(e.target.closest('[data-action="confirm-save-template"]')){
    const nameInput=document.getElementById('template-name-input');
    const name=nameInput.value.trim();
    if(!name){nameInput.focus();return;}
    const items=(currentRace.equipmentChecklist||[]).map(it=>({itemName:it.itemName,category:it.category,isMandatory:it.isMandatory}));
    templates.push({id:uid(),name,items});
    state.savingTemplate=false;
    persistTemplates();renderDetail();return;
  }
  if(e.target.closest('[data-action="delete-template"]')){
    const sel=document.getElementById('template-select');
    if(!sel||!sel.value) return;
    if(!state.confirmDeleteTemplate){
      state.confirmDeleteTemplate=true;renderDetail();
      setTimeout(()=>{state.confirmDeleteTemplate=false;if(currentRace) renderDetail();},4000);
      return;
    }
    templates=templates.filter(t=>t.id!==sel.value);
    state.confirmDeleteTemplate=false;
    persistTemplates();renderDetail();return;
  }
});

/* ============================================================
   Excel 匯入
   ============================================================ */
const HEADER_KEYWORDS=[
  [['日期'],'date'],
  [['項目','賽事','名稱'],'name'],
  [['距離'],'distance'],
  [['地點','地址','位置'],'venue'],
  [['費用','報名費'],'fee'],
  [['報名'],'statusHint'],
];
const RACE_KEYWORDS=/馬拉松|路跑|越野|鐵人|半程|全馬|接力|障礙|定向|泳渡|三鐵|二鐵|夜跑|盃|杯|marathon|trail|triathlon|relay/i;

function inferColumnRoles(headerRow,dataRows){
  const roles=headerRow.map(()=>null);
  const used=new Set();
  headerRow.forEach((h,i)=>{
    const text=(h==null?'':String(h));
    for(const [keys,role] of HEADER_KEYWORDS){
      if(keys.some(k=>text.includes(k))&&!used.has(role)){roles[i]=role;used.add(role);return;}
    }
  });
  headerRow.forEach((h,i)=>{
    if(roles[i]) return;
    const sample=dataRows.map(r=>(r||[])[i]).filter(v=>v!=null&&v!=='').slice(0,15);
    if(sample.length===0){roles[i]='note';return;}
    const numericCount=sample.filter(v=>typeof v==='number'||(typeof v==='string'&&v.trim()!==''&&!isNaN(Number(v)))).length;
    const dateCount=sample.filter(v=>v instanceof Date).length;
    if(!used.has('distance')&&numericCount/sample.length>0.5){roles[i]='distance';used.add('distance');return;}
    if(!used.has('date')&&dateCount/sample.length>0.5){roles[i]='date';used.add('date');return;}
    roles[i]='note';
  });
  return roles;
}
function cellToISODate(v){
  if(v instanceof Date&&!isNaN(v)){
    const y=v.getFullYear(),m=String(v.getMonth()+1).padStart(2,'0'),d=String(v.getDate()).padStart(2,'0');
    return `${y}-${m}-${d}`;
  }
  if(typeof v==='string'){
    const s=v.trim();
    if(/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0,10);
    if(/[~～–至到]/.test(s)) return null;
    const m=s.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/);
    if(m) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  }
  return null;
}
function parseDistanceCell(v){
  if(v==null||v==='') return {km:null,raw:''};
  if(typeof v==='number') return {km:v,raw:String(v)};
  const s=String(v).trim();
  const n=Number(s);
  if(s!==''&&!isNaN(n)) return {km:n,raw:s};
  return {km:null,raw:s};
}
function parseFeeCell(v){
  if(v==null||v==='') return null;
  if(typeof v==='number') return v;
  const s=String(v).trim();
  if(/free|免費/i.test(s)) return 0;
  const n=Number(s.replace(/[^\d.]/g,''));
  return isNaN(n)?null:n;
}
function inferSportType(name){
  if(/鐵人|triathlon|challenge|226|113|70\.3/i.test(name)) return 'triathlon';
  if(/越野|trail/i.test(name)) return 'trail_running';
  if(/超馬|ultra/i.test(name)) return 'ultra_marathon';
  if(/障礙/i.test(name)) return 'obstacle_race';
  if(/自行車|單車|cycling|bike/i.test(name)) return 'cycling';
  if(/泳渡|長泳|游泳|swim/i.test(name)) return 'other';
  return 'road_running';
}
function inferFormat(name,distanceRaw){
  const hay=name+' '+(distanceRaw||'');
  if(/接力|relay/i.test(hay)) return 'relay';
  if(/雙人|pair/i.test(hay)) return 'pair';
  if(/繞圈|loop/i.test(hay)) return 'loop';
  return 'solo';
}
function todayISO(){
  const d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function parseSheetRows(sheetName,rows,isCurated){
  let headerIdx=0;
  for(let i=0;i<Math.min(rows.length,5);i++){
    const rowText=(rows[i]||[]).map(c=>c==null?'':String(c)).join('|');
    if(rowText.includes('日期')||rowText.includes('項目')){headerIdx=i;break;}
  }
  const headerRow=rows[headerIdx]||[];
  const dataRows=rows.slice(headerIdx+1);
  const roles=inferColumnRoles(headerRow,dataRows);
  const candidates=[];
  dataRows.forEach(row=>{
    if(!row||row.every(c=>c==null||c==='')) return;
    let name='',dateISO=null,distRaw=null,distKm=null,venue='',fee=null;
    const noteParts=[];
    roles.forEach((role,i)=>{
      const v=(row||[])[i];
      if(v==null||v==='') return;
      if(role==='name'&&!name) name=String(v).trim();
      else if(role==='date'&&!dateISO) dateISO=cellToISODate(v);
      else if(role==='distance'&&distKm==null&&distRaw==null){const d=parseDistanceCell(v);distKm=d.km;distRaw=d.raw;}
      else if(role==='venue'&&!venue) venue=String(v).trim();
      else if(role==='fee'&&fee==null) fee=parseFeeCell(v);
      else if(role==='note'||role==='statusHint'){
        const label=(headerRow[i]==null||headerRow[i]==='')?'':String(headerRow[i])+': ';
        noteParts.push(label+String(v).trim());
      }
    });
    if(!name) return;
    const noteText=noteParts.join(' ｜ ');
    const hasRaceKeyword=RACE_KEYWORDS.test(name);
    const hasDistance=distKm!=null;
    const checked=isCurated?true:!!(dateISO&&(hasDistance||hasRaceKeyword));
    let status;
    if(/DNF/i.test(noteText)) status='dnf';
    else if(/DNS/i.test(noteText)) status='dns';
    else if(dateISO) status=(dateISO<todayISO())?'completed':'registered';
    else status='considering';
    candidates.push({
      sheetName,checked,name,dateISO:dateISO||'',distanceRaw:distRaw||'',distanceKm:distKm,
      venue,fee,status,note:noteText,
    });
  });
  return candidates;
}

let importWorkbook=null;
let importSheetChecks={};
let importCandidates=[];
const importModalEl=document.getElementById('import-modal');

document.getElementById('btn-import').addEventListener('click',()=>{
  document.getElementById('import-file-input').click();
});
document.getElementById('import-file-input').addEventListener('change',async e=>{
  const file=e.target.files[0];
  if(!file) return;
  const buf=await file.arrayBuffer();
  importWorkbook=XLSX.read(buf,{type:'array',cellDates:true});
  importSheetChecks={};
  importWorkbook.SheetNames.forEach(n=>{importSheetChecks[n]=/^(19|20)\d{2}$/.test(n.trim());});
  if(!Object.values(importSheetChecks).some(Boolean)){
    importSheetChecks[importWorkbook.SheetNames[0]]=true;
  }
  importCandidates=[];
  showImportModal('select-sheets');
  e.target.value='';
});

function parseCheckedSheets(){
  importCandidates=[];
  importWorkbook.SheetNames.forEach(name=>{
    if(!importSheetChecks[name]) return;
    const ws=importWorkbook.Sheets[name];
    const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:null});
    const isCurated=/^(19|20)\d{2}$/.test(name.trim());
    importCandidates.push(...parseSheetRows(name,rows,isCurated));
  });
  importCandidates.sort((a,b)=>(a.dateISO||'9999').localeCompare(b.dateISO||'9999'));
}

function importModalHtml(step){
  if(step==='select-sheets'){
    return `<div class="modal-panel">
      <h2>匯入 Excel — 選擇工作表</h2>
      <p class="modal-hint">已勾選看起來像「年度賽事清單」的工作表，可自行調整要匯入哪些分頁。</p>
      <div class="sheet-checks">
        ${importWorkbook.SheetNames.map(n=>`
          <label class="sheet-check"><input type="checkbox" data-sheet="${escapeHtml(n)}" ${importSheetChecks[n]?'checked':''}> ${escapeHtml(n)}</label>
        `).join('')}
      </div>
      <div class="modal-actions">
        <button class="btn-primary" data-action="parse-sheets">解析並預覽</button>
        <button class="btn-ghost" data-action="close-import">取消</button>
      </div>
    </div>`;
  }
  const checkedCount=importCandidates.filter(c=>c.checked).length;
  return `<div class="modal-panel modal-panel-wide">
    <h2>匯入 Excel — 確認賽事清單</h2>
    <p class="modal-hint">已選 <span class="mono">${checkedCount}</span> / ${importCandidates.length} 筆。可直接調整名稱、日期、距離、地點、狀態後再匯入；取消勾選可略過該筆（距離單位、DNF/DNS 建議順手核對一下）。</p>
    <div class="modal-actions modal-actions-top">
      <button class="btn-ghost" data-action="check-all">全選</button>
      <button class="btn-ghost" data-action="check-none">全不選</button>
      <button class="btn-ghost" data-action="back-sheets">‹ 重新選擇工作表</button>
    </div>
    <div class="import-table-wrap">
      <table class="import-table">
        <thead><tr><th></th><th>日期</th><th>賽事名稱</th><th>距離</th><th>地點</th><th>狀態</th><th>來源分頁</th></tr></thead>
        <tbody>
          ${importCandidates.map((c,i)=>`
            <tr>
              <td><input type="checkbox" data-idx="${i}" data-field="checked" ${c.checked?'checked':''}></td>
              <td><input type="date" data-idx="${i}" data-field="dateISO" value="${c.dateISO}"></td>
              <td><input type="text" data-idx="${i}" data-field="name" value="${escapeHtml(c.name)}"></td>
              <td><input type="text" data-idx="${i}" data-field="distanceRaw" value="${escapeHtml(c.distanceRaw)}" class="mono narrow"></td>
              <td><input type="text" data-idx="${i}" data-field="venue" value="${escapeHtml(c.venue)}"></td>
              <td><select data-idx="${i}" data-field="status">${STATUS_OPTIONS.map(o=>`<option value="${o.value}" ${c.status===o.value?'selected':''}>${o.label}</option>`).join('')}</select></td>
              <td class="small mono">${escapeHtml(c.sheetName)}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>
    <div class="modal-actions">
      <button class="btn-primary" data-action="confirm-import">匯入所選賽事</button>
      <button class="btn-ghost" data-action="close-import">取消</button>
    </div>
  </div>`;
}
function showImportModal(step){
  importModalEl.innerHTML=importModalHtml(step);
  importModalEl.hidden=false;
}
function closeImportModal(){
  importModalEl.hidden=true;
  importModalEl.innerHTML='';
}
importModalEl.addEventListener('click',e=>{
  if(e.target.closest('[data-action="close-import"]')){closeImportModal();return;}
  if(e.target.closest('[data-action="back-sheets"]')){showImportModal('select-sheets');return;}
  if(e.target.closest('[data-action="parse-sheets"]')){parseCheckedSheets();showImportModal('review');return;}
  if(e.target.closest('[data-action="check-all"]')){importCandidates.forEach(c=>c.checked=true);showImportModal('review');return;}
  if(e.target.closest('[data-action="check-none"]')){importCandidates.forEach(c=>c.checked=false);showImportModal('review');return;}
  if(e.target.closest('[data-action="confirm-import"]')){
    const toImport=importCandidates.filter(c=>c.checked);
    toImport.forEach(c=>{
      const race=emptyRace(c.name,inferSportType(c.name),c.status,c.dateISO||'');
      race.raceFormat=inferFormat(c.name,c.distanceRaw);
      if(c.distanceKm!=null) race.route.distanceKm=c.distanceKm;
      if(c.venue) race.location.venueName=c.venue;
      if(c.fee!=null){race.budget.registrationFee=c.fee;race.budget.paymentStatus=(c.status==='completed')?'paid':'unpaid';}
      if(c.note) race.review.courseReview=`【Excel 匯入備註】${c.note}`;
      state.races.push(race);
    });
    persist();
    closeImportModal();
    renderAll();
    return;
  }
});
importModalEl.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.sheet!=null){importSheetChecks[t.dataset.sheet]=t.checked;return;}
  const idx=t.dataset.idx;
  if(idx==null) return;
  const field=t.dataset.field;
  const c=importCandidates[Number(idx)];
  if(!c) return;
  if(field==='checked') c.checked=t.checked;
  else if(field==='distanceRaw'){
    c.distanceRaw=t.value;
    const n=Number(t.value);
    c.distanceKm=(t.value.trim()!==''&&!isNaN(n))?n:null;
  }
  else c[field]=t.value;
});

/* ============================================================
   初始化
   ============================================================ */
async function init(){
  detailEl.innerHTML='<p class="empty-hint">載入中…</p>';
  await Promise.all([loadRaces(),loadTemplates()]);
  renderAll();
}
init();
</script>
