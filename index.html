    currentRace.updatedAt=new Date().toISOString();
    persist();renderDetail();return;
  }
  const rmBtn=e.target.closest('[data-action="remove-item"]');
  if(rmBtn){
    const listKey=rmBtn.dataset.list,idx=Number(rmBtn.dataset.index);
    currentRace[listKey].splice(idx,1);
    currentRace.updatedAt=new Date().toISOString();
    persist();renderDetail();return;
  }
  const moveUpBtn=e.target.closest('[data-action="move-item-up"]');
  if(moveUpBtn&&currentRace){
    const arr=currentRace[moveUpBtn.dataset.list],idx=Number(moveUpBtn.dataset.index);
    if(arr&&idx>0){
      [arr[idx-1],arr[idx]]=[arr[idx],arr[idx-1]];
      currentRace.updatedAt=new Date().toISOString();
      persist();renderDetail();
    }
    return;
  }
  const moveDownBtn=e.target.closest('[data-action="move-item-down"]');
  if(moveDownBtn&&currentRace){
    const arr=currentRace[moveDownBtn.dataset.list],idx=Number(moveDownBtn.dataset.index);
    if(arr&&idx<arr.length-1){
      [arr[idx],arr[idx+1]]=[arr[idx+1],arr[idx]];
      currentRace.updatedAt=new Date().toISOString();
      persist();renderDetail();
    }
    return;
  }
  const delBtn=e.target.closest('[data-action="delete-race"]');
  if(delBtn){
    if(!state.confirmDelete){
      state.confirmDelete=true;renderDetail();
      setTimeout(()=>{state.confirmDelete=false;if(currentRace&&currentRace.id===state.selectedId) renderDetail();},4000);
      return;
    }
    currentRace.deletedAt=new Date().toISOString();
    currentRace.updatedAt=new Date().toISOString();
    state.selectedId=null;state.confirmDelete=false;currentRace=null;
    persist();renderAll();return;
  }
  if(e.target.closest('[data-action="duplicate-race"]')&&currentRace){
    const copy=duplicateRace(currentRace);
    state.races.push(copy);
    state.selectedId=copy.id;
    persist();renderAll();scrollDetailIntoView();
    logFeatureUse('race_duplicate');
    return;
  }
  if(e.target.closest('[data-action="cancel-create"]')){state.creating=false;resetCreateStaging();renderAll();return;}
  if(e.target.closest('[data-action="confirm-create"]')){
    const nameEl=document.getElementById('new-name');
    const name=nameEl.value.trim();
    if(!name){nameEl.focus();return;}
    const sportType=document.getElementById('new-sport').value;
    const status=document.getElementById('new-status').value;
    const raceDate=document.getElementById('new-date').value;
    const officialUrl=document.getElementById('new-url').value.trim();
    const race=emptyRace(name,sportType,status,raceDate);
    if(officialUrl) race.officialUrl=officialUrl;
    if(createStagedActivity) applyActivitySummaryToRace(race,createStagedActivity.summary);
    if(createStagedCover){ race.coverImage=createStagedCover.dataUrl; race.coverImageAspect=createStagedCover.aspect; race.coverImageAccentColor=createStagedCover.accentColor; }
    autoApplyEquipmentTemplate(race);
    state.races.push(race);
    state.selectedId=race.id;state.creating=false;
    resetCreateStaging();
    if(raceDate){
      const d=new Date(raceDate+'T00:00:00');
      if(!isNaN(d)){state.calendarYear=d.getFullYear();state.calendarMonth=d.getMonth();}
    }
    persist();renderAll();return;
  }
  if(e.target.closest('[data-action="apply-template"]')){
    const sel=document.getElementById('template-select');
    const tpl=templates.find(t=>t.id===sel.value);
    if(!tpl) return;
    currentRace.equipmentChecklist=(currentRace.equipmentChecklist||[]).concat(
      tpl.items.map(it=>({itemName:it.itemName,category:it.category,isMandatory:it.isMandatory,isPacked:false,notes:''}))
    );
    currentRace.updatedAt=new Date().toISOString();
    persist();renderDetail();return;
  }
  if(e.target.closest('[data-action="save-template"]')){
    state.savingTemplate=true;renderDetail();
    const input=document.getElementById('template-name-input');
    if(input) input.focus();
    return;
  }
  if(e.target.closest('[data-action="cancel-save-template"]')){
    state.savingTemplate=false;renderDetail();return;
  }
  if(e.target.closest('[data-action="confirm-save-template"]')){
    const nameInput=document.getElementById('template-name-input');
    const name=nameInput.value.trim();
    if(!name){nameInput.focus();return;}
    const items=(currentRace.equipmentChecklist||[]).map(it=>({itemName:it.itemName,category:it.category,isMandatory:it.isMandatory}));
    templates.push({id:uid(),name,items});
    state.savingTemplate=false;
    persistTemplates();renderDetail();return;
  }
  if(e.target.closest('[data-action="delete-template"]')){
    const sel=document.getElementById('template-select');
    if(!sel||!sel.value) return;
    if(!state.confirmDeleteTemplate){
      state.confirmDeleteTemplate=true;renderDetail();
      setTimeout(()=>{state.confirmDeleteTemplate=false;if(currentRace) renderDetail();},4000);
      return;
    }
    templates=templates.filter(t=>t.id!==sel.value);
    state.confirmDeleteTemplate=false;
    persistTemplates();renderDetail();return;
  }
});

/* ============================================================
   Excel 匯入
   ============================================================ */
const HEADER_KEYWORDS=[
  [['日期'],'date'],
  [['項目','賽事','名稱'],'name'],
  [['距離'],'distance'],
  [['地點','地址','位置'],'venue'],
  [['費用','報名費'],'fee'],
  [['報名'],'statusHint'],
];
const RACE_KEYWORDS=/馬拉松|路跑|越野|鐵人|半程|全馬|接力|障礙|定向|泳渡|三鐵|二鐵|夜跑|盃|杯|marathon|trail|triathlon|relay/i;

function inferColumnRoles(headerRow,dataRows){
  const roles=headerRow.map(()=>null);
  const used=new Set();
  headerRow.forEach((h,i)=>{
    const text=(h==null?'':String(h));
    for(const [keys,role] of HEADER_KEYWORDS){
      if(keys.some(k=>text.includes(k))&&!used.has(role)){roles[i]=role;used.add(role);return;}
    }
  });
  headerRow.forEach((h,i)=>{
    if(roles[i]) return;
    const sample=dataRows.map(r=>(r||[])[i]).filter(v=>v!=null&&v!=='').slice(0,15);
    if(sample.length===0){roles[i]='note';return;}
    const numericCount=sample.filter(v=>typeof v==='number'||(typeof v==='string'&&v.trim()!==''&&!isNaN(Number(v)))).length;
    const dateCount=sample.filter(v=>v instanceof Date).length;
    if(!used.has('distance')&&numericCount/sample.length>0.5){roles[i]='distance';used.add('distance');return;}
    if(!used.has('date')&&dateCount/sample.length>0.5){roles[i]='date';used.add('date');return;}
    roles[i]='note';
  });
  return roles;
}
function cellToISODate(v){
  if(v instanceof Date&&!isNaN(v)){
    const y=v.getFullYear(),m=String(v.getMonth()+1).padStart(2,'0'),d=String(v.getDate()).padStart(2,'0');
    return `${y}-${m}-${d}`;
  }
  if(typeof v==='string'){
    const s=v.trim();
    if(/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0,10);
    if(/[~～–至到]/.test(s)) return null;
    const m=s.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/);
    if(m) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  }
  return null;
}
function parseDistanceCell(v){
  if(v==null||v==='') return {km:null,raw:''};
  if(typeof v==='number') return {km:v,raw:String(v)};
  const s=String(v).trim();
  const n=Number(s);
  if(s!==''&&!isNaN(n)) return {km:n,raw:s};
  return {km:null,raw:s};
}
function parseFeeCell(v){
  if(v==null||v==='') return null;
  if(typeof v==='number') return v;
  const s=String(v).trim();
  if(/free|免費/i.test(s)) return 0;
  const n=Number(s.replace(/[^\d.]/g,''));
  return isNaN(n)?null:n;
}
function inferSportType(name){
  if(/鐵人|triathlon|challenge|226|113|70\.3/i.test(name)) return 'triathlon';
  if(/越野|trail/i.test(name)) return 'trail_running';
  if(/超馬|ultra/i.test(name)) return 'ultra_marathon';
  if(/障礙/i.test(name)) return 'obstacle_race';
  if(/自行車|單車|cycling|bike/i.test(name)) return 'cycling';
  if(/泳渡|長泳|游泳|swim/i.test(name)) return 'other';
  return 'road_running';
}
function inferFormat(name,distanceRaw){
  const hay=name+' '+(distanceRaw||'');
  if(/接力|relay/i.test(hay)) return 'relay';
  if(/雙人|pair/i.test(hay)) return 'pair';
  if(/繞圈|loop/i.test(hay)) return 'loop';
  return 'solo';
}
function todayISO(){
  const d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function parseSheetRows(sheetName,rows,isCurated){
  let headerIdx=0;
  for(let i=0;i<Math.min(rows.length,5);i++){
    const rowText=(rows[i]||[]).map(c=>c==null?'':String(c)).join('|');
    if(rowText.includes('日期')||rowText.includes('項目')){headerIdx=i;break;}
  }
  const headerRow=rows[headerIdx]||[];
  const dataRows=rows.slice(headerIdx+1);
  const roles=inferColumnRoles(headerRow,dataRows);
  const candidates=[];
  dataRows.forEach(row=>{
    if(!row||row.every(c=>c==null||c==='')) return;
    let name='',dateISO=null,distRaw=null,distKm=null,venue='',fee=null;
    const noteParts=[];
    roles.forEach((role,i)=>{
      const v=(row||[])[i];
      if(v==null||v==='') return;
      if(role==='name'&&!name) name=String(v).trim();
      else if(role==='date'&&!dateISO) dateISO=cellToISODate(v);
      else if(role==='distance'&&distKm==null&&distRaw==null){const d=parseDistanceCell(v);distKm=d.km;distRaw=d.raw;}
      else if(role==='venue'&&!venue) venue=String(v).trim();
      else if(role==='fee'&&fee==null) fee=parseFeeCell(v);
      else if(role==='note'||role==='statusHint'){
        const label=(headerRow[i]==null||headerRow[i]==='')?'':String(headerRow[i])+': ';
        noteParts.push(label+String(v).trim());
      }
    });
    if(!name) return;
    const noteText=noteParts.join(' ｜ ');
    const hasRaceKeyword=RACE_KEYWORDS.test(name);
    const hasDistance=distKm!=null;
    const checked=isCurated?true:!!(dateISO&&(hasDistance||hasRaceKeyword));
    let status;
    if(/DNF/i.test(noteText)) status='dnf';
    else if(/DNS/i.test(noteText)) status='dns';
    else if(dateISO) status=(dateISO<todayISO())?'completed':'registered';
    else status='considering';
    candidates.push({
      sheetName,checked,name,dateISO:dateISO||'',distanceRaw:distRaw||'',distanceKm:distKm,
      venue,fee,status,note:noteText,
    });
  });
  return candidates;
}

let importWorkbook=null;
let importSheetChecks={};
let importCandidates=[];
let importErrorMessage='';
const importModalEl=document.getElementById('import-modal');

document.getElementById('btn-import').addEventListener('click',()=>{
  document.getElementById('import-file-input').click();
});
document.getElementById('import-file-input').addEventListener('change',async e=>{
  const file=e.target.files[0];
  e.target.value='';
  if(!file) return;
  try{
    if(typeof XLSX==='undefined'){
      throw new Error(t('ui.excelErrorLibFailed','Excel 解析工具載入失敗，請檢查網路連線後重新整理頁面再試一次（部分廣告或追蹤攔截外掛也可能擋到這個工具，可以先暫時停用試試看）。'));
    }
    const buf=await file.arrayBuffer();
    importWorkbook=XLSX.read(buf,{type:'array',cellDates:true});
    if(!importWorkbook.SheetNames||!importWorkbook.SheetNames.length){
      throw new Error(t('ui.excelErrorNoSheets','這個檔案裡沒有找到任何工作表。'));
    }
    importSheetChecks={};
    importWorkbook.SheetNames.forEach(n=>{importSheetChecks[n]=/^(19|20)\d{2}$/.test(n.trim());});
    if(!Object.values(importSheetChecks).some(Boolean)){
      importSheetChecks[importWorkbook.SheetNames[0]]=true;
    }
    importCandidates=[];
    showImportModal('select-sheets');
  }catch(err){
    console.error('Excel 匯入失敗',err);
    importErrorMessage=t('ui.excelErrorPrefix','無法解析這個檔案：')+err.message;
    showImportModal('error');
  }
});

function parseCheckedSheets(){
  importCandidates=[];
  importWorkbook.SheetNames.forEach(name=>{
    if(!importSheetChecks[name]) return;
    const ws=importWorkbook.Sheets[name];
    const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:null});
    const isCurated=/^(19|20)\d{2}$/.test(name.trim());
    importCandidates.push(...parseSheetRows(name,rows,isCurated));
  });
  importCandidates.sort((a,b)=>(a.dateISO||'9999').localeCompare(b.dateISO||'9999'));
}

    <h2>${t('ui.excelStep2Title','匯入 Excel — 確認賽事清單')}</h2>
    <p class="modal-hint">${tf2('ui.excelSelectedCount',`已選 <span class="mono">${checkedCount}</span> / ${importCandidates.length} 筆。可直接調整名稱、日期、距離、地點、狀態後再匯入；取消勾選可略過該筆（距離單位、DNF/DNS 建議順手核對一下）。`,`<span class="mono">${checkedCount}</span>`,importCandidates.length)}</p>
    <div class="modal-actions modal-actions-top">
      <button class="btn-ghost" data-action="check-all">${t('ui.selectAll','全選')}</button>

      <button class="btn-ghost" data-action="back-sheets">${t('ui.excelBackToSheets','‹ 重新選擇工作表')}</button>
    </div>
    <div class="import-table-wrap">
      <table class="import-table">
        <thead><tr><th></th><th>${t('ui.excelColDate','日期')}</th><th>${t('ui.excelColName','賽事名稱')}</th><th>${t('ui.excelColDistance','距離')}</th><th>${t('ui.excelColVenue','地點')}</th><th>${t('ui.excelColStatus','狀態')}</th><th>${t('ui.excelColSource','來源分頁')}</th></tr></thead>
        <tbody>
          ${importCandidates.map((c,i)=>`
            <tr>
              <td><input type="checkbox" data-idx="${i}" data-field="checked" ${c.checked?'checked':''}></td>

              <td><input type="text" data-idx="${i}" data-field="name" value="${escapeHtml(c.name)}"></td>
              <td><input type="text" data-idx="${i}" data-field="distanceRaw" value="${escapeHtml(c.distanceRaw)}" class="mono narrow"></td>
              <td><input type="text" data-idx="${i}" data-field="venue" value="${escapeHtml(c.venue)}"></td>
              <td><select data-idx="${i}" data-field="status">${STATUS_OPTIONS.map(o=>`<option value="${o.value}" ${c.status===o.value?'selected':''}>${t('opt.status.'+o.value,o.label)}</option>`).join('')}</select></td>
              <td class="small mono">${escapeHtml(c.sheetName)}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>
    <div class="modal-actions">
      <button class="btn-primary" data-action="confirm-import">${t('ui.excelImport','匯入所選賽事')}</button>
      <button class="btn-ghost" data-action="close-import">${t('ui.cancel','取消')}</button>
    </div>
  </div>`;
}
function showImportModal(step){
  importModalEl.innerHTML=importModalHtml(step);
  importModalEl.hidden=false;
}
function closeImportModal(){
  importModalEl.hidden=true;
  importModalEl.innerHTML='';
}
importModalEl.addEventListener('click',e=>{
  if(e.target.closest('[data-action="close-import"]')){closeImportModal();return;}
  if(e.target.closest('[data-action="back-sheets"]')){showImportModal('select-sheets');return;}
  if(e.target.closest('[data-action="parse-sheets"]')){
    try{
      parseCheckedSheets();
      showImportModal('review');
    }catch(err){
      console.error('Excel 工作表解析失敗',err);
      importErrorMessage=t('ui.excelErrorPrefix','無法解析這個檔案：')+err.message;
      showImportModal('error');
    }
    return;
  }
  if(e.target.closest('[data-action="check-all"]')){importCandidates.forEach(c=>c.checked=true);showImportModal('review');return;}
  if(e.target.closest('[data-action="check-none"]')){importCandidates.forEach(c=>c.checked=false);showImportModal('review');return;}
  if(e.target.closest('[data-action="confirm-import"]')){
    const toImport=importCandidates.filter(c=>c.checked);
    toImport.forEach(c=>{
      const race=emptyRace(c.name,inferSportType(c.name),c.status,c.dateISO||'');
      race.raceFormat=inferFormat(c.name,c.distanceRaw);
      if(c.distanceKm!=null) race.route.distanceKm=c.distanceKm;
      if(c.venue) race.location.venueName=c.venue;
      if(c.fee!=null){race.budget.registrationFee=c.fee;race.budget.paymentStatus=(c.status==='completed')?'paid':'unpaid';}
      if(c.note) race.review.courseReview=`【Excel 匯入備註】${c.note}`;
      state.races.push(race);
    });
    persist();
    closeImportModal();
    renderAll();
    if(toImport.length) logFeatureUse('import_excel');
    return;
  }
});
importModalEl.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.sheet!=null){importSheetChecks[t.dataset.sheet]=t.checked;return;}
  const idx=t.dataset.idx;
  if(idx==null) return;
  const field=t.dataset.field;
  const c=importCandidates[Number(idx)];
  if(!c) return;
  if(field==='checked') c.checked=t.checked;
  else if(field==='distanceRaw'){
    c.distanceRaw=t.value;
    const n=Number(t.value);
    c.distanceKm=(t.value.trim()!==''&&!isNaN(n))?n:null;
  }
  else c[field]=t.value;
});

/* ============================================================
   封面照片（本機處理：保留長寬比縮小、壓縮成 JPEG）
   不會上傳到任何伺服器，純瀏覽器端 Canvas 運算。
   ============================================================ */
function extractDominantColor(ctx,w,h){
  // 從畫面上取樣一部分像素（不用整張圖，效能考量），排除太灰、太暗、太亮的像素
  // （通常是陰影、反光或天空這類不具代表性的區域），統計出現最多次的色彩區間當主色調。
  try{
    const sampleW=Math.min(w,60),sampleH=Math.min(h,60);
    const data=ctx.getImageData(0,0,w,h).data;
    const stepX=Math.max(1,Math.floor(w/sampleW)),stepY=Math.max(1,Math.floor(h/sampleH));
    const buckets={};
    for(let y=0;y<h;y+=stepY){
      for(let x=0;x<w;x+=stepX){
        const i=(y*w+x)*4;
        const r=data[i],g=data[i+1],b=data[i+2],a=data[i+3];
        if(a<128) continue;
        const max=Math.max(r,g,b),min=Math.min(r,g,b);
        const sat=max===0?0:(max-min)/max;
        const lightness=(max+min)/2/255;
        if(sat<0.15||lightness<0.12||lightness>0.92) continue;
        const key=[Math.round(r/24)*24,Math.round(g/24)*24,Math.round(b/24)*24].join(',');
        buckets[key]=(buckets[key]||0)+1;
      }
    }
    let best=null,bestCount=0;
    Object.keys(buckets).forEach(k=>{ if(buckets[k]>bestCount){ bestCount=buckets[k]; best=k; } });
    if(!best) return null;
    const [r,g,b]=best.split(',').map(Number);
    return {r,g,b};
  }catch(err){ return null; }
}
function processCoverImage(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        // 保留原始長寬比，只縮小到合理上限，不強制裁成正方形——
        // 背景底圖用得到完整構圖，小縮圖（行事曆格子等）顯示時再用 CSS object-fit 裁切即可。
        const maxDim=760;
        const scale=Math.min(1,maxDim/Math.max(img.width,img.height));
        const w=Math.round(img.width*scale),h=Math.round(img.height*scale);
        const canvas=document.createElement('canvas');
        canvas.width=w;canvas.height=h;
        const ctx=canvas.getContext('2d');
        ctx.drawImage(img,0,0,w,h);
        const accentColor=extractDominantColor(ctx,w,h);
        resolve({dataUrl:canvas.toDataURL('image/jpeg',0.78),aspect:w/h,accentColor});
      };

      img.src=e.target.result;
    };
    reader.onerror=()=>reject(new Error(t('ui.errImageLoad','無法讀取這張圖片')));
    reader.readAsDataURL(file);
  });
}

/* ============================================================
   運動紀錄檔匯入（GPX / TCX / FIT，Garmin / COROS / Strava 皆可匯出）
   全部在瀏覽器端解析，不會上傳到任何伺服器。
   ============================================================ */
function haversineKm(lat1,lon1,lat2,lon2){
  const R=6371;
  const dLat=(lat2-lat1)*Math.PI/180,dLon=(lon2-lon1)*Math.PI/180;
  const a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
function findByLocalName(parent,localName){
  if(!parent) return null;
  const all=parent.getElementsByTagName('*');
  for(let i=0;i<all.length;i++){ if(all[i].localName===localName) return all[i]; }
  return null;
}
// 用「回落門檻」抓總爬升，避免 GPS 高度雜訊把爬升灌水：
// 只有確認下降超過 threshold 公尺，才把前一段上升正式計入總爬升。
function computeElevationGain(elevations,threshold){
  threshold=threshold||2;
  let gain=0,lastValley=elevations[0],peak=elevations[0];
  for(let i=1;i<elevations.length;i++){
    const e=elevations[i];
    if(e>peak){ peak=e; }
    else if(peak-e>=threshold){
      if(peak>lastValley) gain+=peak-lastValley;
      lastValley=e;peak=e;
    }
  }
  if(peak>lastValley) gain+=peak-lastValley;
  return Math.round(gain);
}
function computeSplitsFromPoints(pts){
  const valid=pts.filter(p=>p.lat!=null&&p.lon!=null);
  if(valid.length<2) return [];
  const splits=[];
  let cumDist=0,splitStartTime=valid[0].time,hrSum=0,hrCount=0,nextBoundary=1;
  for(let i=1;i<valid.length;i++){
    const d=haversineKm(valid[i-1].lat,valid[i-1].lon,valid[i].lat,valid[i].lon);
    const prevCum=cumDist;
    cumDist+=d;
    if(valid[i].hr!=null){ hrSum+=valid[i].hr; hrCount++; }
    while(cumDist>=nextBoundary && valid[i-1].time && valid[i].time){
      const frac=(nextBoundary-prevCum)/((cumDist-prevCum)||1);
      const t0=valid[i-1].time.getTime(),t1=valid[i].time.getTime();
      const crossTime=new Date(t0+(t1-t0)*frac);
      const splitTimeSeconds=Math.round((crossTime-splitStartTime)/1000);
      splits.push({distanceKm:1,splitTimeSeconds,avgHr:hrCount?Math.round(hrSum/hrCount):null,avgPaceSecPerKm:splitTimeSeconds,elevationGainM:null,notes:''});
      splitStartTime=crossTime;hrSum=0;hrCount=0;nextBoundary+=1;
    }
  }
  return splits;
}
function downsampleElevationProfile(pts,maxPoints){
  const valid=pts.filter(p=>p.lat!=null&&p.lon!=null&&p.ele!=null);
  if(valid.length<2) return [];
  let cum=0;
  const withDist=[{distanceKm:0,elevationM:valid[0].ele}];
  for(let i=1;i<valid.length;i++){
    cum+=haversineKm(valid[i-1].lat,valid[i-1].lon,valid[i].lat,valid[i].lon);
    withDist.push({distanceKm:cum,elevationM:valid[i].ele});
  }
  if(withDist.length<=maxPoints) return withDist.map(p=>({distanceKm:+p.distanceKm.toFixed(2),elevationM:Math.round(p.elevationM)}));
  const step=(withDist.length-1)/(maxPoints-1);
  const out=[];
  for(let i=0;i<maxPoints;i++){
    const idx=Math.round(i*step);
    out.push({distanceKm:+withDist[idx].distanceKm.toFixed(2),elevationM:Math.round(withDist[idx].elevationM)});
  }
  return out;
}
function downsampleLatLon(pts,maxPoints){
  const valid=pts.filter(p=>p.lat!=null&&p.lon!=null);
  if(valid.length<2) return [];
  if(valid.length<=maxPoints) return valid.map(p=>({lat:p.lat,lon:p.lon}));
  const step=(valid.length-1)/(maxPoints-1);
  const out=[];
  for(let i=0;i<maxPoints;i++){
    const idx=Math.round(i*step);
    out.push({lat:valid[idx].lat,lon:valid[idx].lon});
  }
  return out;
}
function summarizeTrackPoints(pts){
  const valid=pts.filter(p=>p.lat!=null&&p.lon!=null);
  if(valid.length<2) throw new Error(t('ui.errNotEnoughPoints','檔案中沒有足夠的座標點'));
  let distKm=0;
  for(let i=1;i<valid.length;i++) distKm+=haversineKm(valid[i-1].lat,valid[i-1].lon,valid[i].lat,valid[i].lon);
  const elevations=valid.map(p=>p.ele).filter(e=>e!=null);
  const hrs=valid.map(p=>p.hr).filter(h=>h!=null);
  const cads=valid.map(p=>p.cad).filter(c=>c!=null);
  const withTime=valid.filter(p=>p.time);
  const t0=withTime[0]&&withTime[0].time,t1=withTime.length?withTime[withTime.length-1].time:null;
  return {
    distanceKm:+distKm.toFixed(2),
    durationSeconds:(t0&&t1)?Math.round((t1-t0)/1000):null,
    elevationGainM:elevations.length>1?computeElevationGain(elevations):null,
    avgHr:hrs.length?Math.round(hrs.reduce((a,b)=>a+b,0)/hrs.length):null,
    maxHr:hrs.length?Math.max(...hrs):null,
    avgCadence:cads.length?Math.round(cads.reduce((a,b)=>a+b,0)/cads.length):null,
    splits:computeSplitsFromPoints(valid),
    elevationProfile:downsampleElevationProfile(valid,50),
    trackPoints:downsampleLatLon(valid,400),
  };
}
/* ============================================================
   FIT 檔案解析（Garmin/COROS/Wahoo 等裝置常見的二進位格式）
   只解析我們需要的「record」訊息（GPS/心率/步頻逐點紀錄），
   足夠餵給既有的 summarizeTrackPoints() 走同一套彙整邏輯。
   ============================================================ */
const FIT_EPOCH_MS=Date.UTC(1989,11,31,0,0,0);
function fitBaseTypeInfo(baseType){
  const table={
    0x00:{size:1,signed:false,kind:'int',invalid:0xFF},
    0x01:{size:1,signed:true,kind:'int',invalid:0x7F},
    0x02:{size:1,signed:false,kind:'int',invalid:0xFF},
    0x83:{size:2,signed:true,kind:'int',invalid:0x7FFF},
    0x84:{size:2,signed:false,kind:'int',invalid:0xFFFF},
    0x85:{size:4,signed:true,kind:'int',invalid:0x7FFFFFFF},
    0x86:{size:4,signed:false,kind:'int',invalid:0xFFFFFFFF},
    0x87:{size:1,signed:false,kind:'string',invalid:null},
    0x88:{size:4,signed:false,kind:'float',invalid:null},
    0x89:{size:8,signed:false,kind:'float',invalid:null},
    0x0A:{size:1,signed:false,kind:'int',invalid:0xFF},
    0x8B:{size:2,signed:false,kind:'int',invalid:0xFFFF},
    0x8C:{size:4,signed:false,kind:'int',invalid:0xFFFFFFFF},
    0x0D:{size:1,signed:false,kind:'byte',invalid:null},
    0x8E:{size:8,signed:true,kind:'int',invalid:null},
    0x8F:{size:8,signed:false,kind:'int',invalid:null},
    0x90:{size:8,signed:false,kind:'int',invalid:null},
  };
  return table[baseType&0xFF]||{size:1,signed:false,kind:'byte',invalid:null};
}
function parseFitPoints(buffer){
  const view=new DataView(buffer);
  if(buffer.byteLength<14) throw new Error(t('ui.errCannotParseFile','檔案格式無法解析，請確認是有效的 GPX 或 TCX 檔'));
  const headerSize=view.getUint8(0);
  const sig=String.fromCharCode(view.getUint8(8),view.getUint8(9),view.getUint8(10),view.getUint8(11));
  if(sig!=='.FIT') throw new Error(t('ui.errCannotParseFile','檔案格式無法解析，請確認是有效的 GPX 或 TCX 檔'));
  const dataSize=view.getUint32(4,true);
  const dataEnd=Math.min(headerSize+dataSize,buffer.byteLength);
  let offset=headerSize;
  const localDefs={};
  const points=[];

  function readField(off,size,baseType,little){
    const info=fitBaseTypeInfo(baseType);
    if(info.kind==='string'||info.kind==='byte') return null;
    try{
      let raw;
      if(info.kind==='float'){
        raw=(info.size===4)?view.getFloat32(off,little):view.getFloat64(off,little);
        return raw;
      }
      switch(info.size){
        case 1: raw=info.signed?view.getInt8(off):view.getUint8(off); break;
        case 2: raw=info.signed?view.getInt16(off,little):view.getUint16(off,little); break;
        case 4: raw=info.signed?view.getInt32(off,little):view.getUint32(off,little); break;
        case 8: raw=Number(info.signed?view.getBigInt64(off,little):view.getBigUint64(off,little)); break;
        default: raw=null;
      }
      if(info.invalid!=null&&raw===info.invalid) return null;
      return raw;
    }catch(e){ return null; }
  }

  while(offset<dataEnd){
    const recordHeader=view.getUint8(offset); offset+=1;
    const isDefinition=(recordHeader&0x40)!==0;
    const isCompressedTS=(recordHeader&0x80)!==0;
    const localType=isCompressedTS?((recordHeader>>5)&0x03):(recordHeader&0x0F);

    if(isDefinition&&!isCompressedTS){
      offset+=1; // reserved
      const architecture=view.getUint8(offset); offset+=1;
      const little=architecture===0;
      const globalMesgNum=little?view.getUint16(offset,true):view.getUint16(offset,false); offset+=2;
      const numFields=view.getUint8(offset); offset+=1;
      const fields=[];
      for(let i=0;i<numFields;i++){
        fields.push({defNum:view.getUint8(offset),size:view.getUint8(offset+1),baseType:view.getUint8(offset+2)});
        offset+=3;
      }
      let devFields=[];
      if(recordHeader&0x20){
        const numDev=view.getUint8(offset); offset+=1;
        for(let i=0;i<numDev;i++){
          devFields.push({size:view.getUint8(offset+1)});
          offset+=3;
        }
      }
      localDefs[localType]={globalMesgNum,little,fields,devFields};
    }else{
      const def=localDefs[localType];
      if(!def) break; // 沒看過的 local type，無法得知訊息長度，安全起見停止解析
      const values={};
      for(const f of def.fields){
        values[f.defNum]=readField(offset,f.size,f.baseType,def.little);
        offset+=f.size;
      }
      for(const df of def.devFields) offset+=df.size;
      if(def.globalMesgNum===20){ // 'record' message
        const rawLat=values[0],rawLon=values[1];
        const lat=(rawLat!=null)?rawLat*(180/Math.pow(2,31)):null;
        const lon=(rawLon!=null)?rawLon*(180/Math.pow(2,31)):null;
        const rawAlt=values[2];
        const ele=(rawAlt!=null)?(rawAlt/5-500):null;
        const hr=values[3]!=null?values[3]:null;
        const cad=values[4]!=null?values[4]:null;
        const rawTime=values[253];
        const time=(rawTime!=null)?new Date(FIT_EPOCH_MS+rawTime*1000):null;
        if(lat!=null&&lon!=null) points.push({lat,lon,ele,hr,cad,time});
      }
    }
  }
  return points;
}

function parseGpxDoc(xml){
  const pts=[...xml.getElementsByTagName('trkpt')].map(pt=>{
    const eleEl=findByLocalName(pt,'ele'),timeEl=findByLocalName(pt,'time');
    const hrEl=findByLocalName(pt,'hr'),cadEl=findByLocalName(pt,'cad');
    return {
      lat:parseFloat(pt.getAttribute('lat')),lon:parseFloat(pt.getAttribute('lon')),
      ele:eleEl?parseFloat(eleEl.textContent):null,
      time:timeEl?new Date(timeEl.textContent):null,
      hr:hrEl?parseFloat(hrEl.textContent):null,
      cad:cadEl?parseFloat(cadEl.textContent):null,
    };
  });
  return summarizeTrackPoints(pts);
}
function parseTcxDoc(xml){
  const laps=[...xml.getElementsByTagName('Lap')];
  const pts=[...xml.getElementsByTagName('Trackpoint')].map(tp=>{
    const latEl=findByLocalName(tp,'LatitudeDegrees'),lonEl=findByLocalName(tp,'LongitudeDegrees');
    const eleEl=findByLocalName(tp,'AltitudeMeters'),timeEl=findByLocalName(tp,'Time');
    const hrWrap=findByLocalName(tp,'HeartRateBpm');
    const hrEl=hrWrap?findByLocalName(hrWrap,'Value'):null;
    return {
      lat:latEl?parseFloat(latEl.textContent):null,lon:lonEl?parseFloat(lonEl.textContent):null,
      ele:eleEl?parseFloat(eleEl.textContent):null,
      time:timeEl?new Date(timeEl.textContent):null,
      hr:hrEl?parseFloat(hrEl.textContent):null,
    };
  });
  if(!laps.length) return summarizeTrackPoints(pts);

  let totalDistM=0,totalTimeS=0,hrSum=0,hrCount=0,maxHr=0;
  const splits=laps.map(lap=>{
    const distEl=findByLocalName(lap,'DistanceMeters'),timeEl=findByLocalName(lap,'TotalTimeSeconds');
    const avgHrWrap=findByLocalName(lap,'AverageHeartRateBpm'),maxHrWrap=findByLocalName(lap,'MaximumHeartRateBpm');
    const avgHrEl=avgHrWrap?findByLocalName(avgHrWrap,'Value'):null;
    const maxHrEl=maxHrWrap?findByLocalName(maxHrWrap,'Value'):null;
    const dist=distEl?parseFloat(distEl.textContent):0;
    const time=timeEl?parseFloat(timeEl.textContent):0;
    const avgHr=avgHrEl?parseFloat(avgHrEl.textContent):null;
    const mHr=maxHrEl?parseFloat(maxHrEl.textContent):null;
    totalDistM+=dist;totalTimeS+=time;
    if(avgHr!=null){ hrSum+=avgHr; hrCount++; }
    if(mHr!=null&&mHr>maxHr) maxHr=mHr;
    return {distanceKm:+(dist/1000).toFixed(2),splitTimeSeconds:Math.round(time),
      avgHr:avgHr!=null?Math.round(avgHr):null,
      avgPaceSecPerKm:dist>0?Math.round(time/(dist/1000)):null,
      elevationGainM:null,notes:''};
  });
  const elevations=pts.map(p=>p.ele).filter(e=>e!=null);
  const ptHrs=pts.map(p=>p.hr).filter(h=>h!=null);
  return {
    distanceKm:+(totalDistM/1000).toFixed(2),
    durationSeconds:Math.round(totalTimeS)||null,
    elevationGainM:elevations.length>1?computeElevationGain(elevations):null,
    avgHr:hrCount?Math.round(hrSum/hrCount):(ptHrs.length?Math.round(ptHrs.reduce((a,b)=>a+b,0)/ptHrs.length):null),
    maxHr:maxHr||(ptHrs.length?Math.max(...ptHrs):null),
    avgCadence:null,
    splits:laps.length>1?splits:computeSplitsFromPoints(pts),
    elevationProfile:downsampleElevationProfile(pts,50),
    trackPoints:downsampleLatLon(pts,400),
  };
}
function parseGpxOrTcx(text){
  const xml=new DOMParser().parseFromString(text,'application/xml');
  if(xml.getElementsByTagName('parsererror').length) throw new Error(t('ui.errCannotParseFile','檔案格式無法解析，請確認是有效的 GPX 或 TCX 檔'));
  const isTcx=xml.getElementsByTagName('TrainingCenterDatabase').length>0;
  return isTcx?parseTcxDoc(xml):parseGpxDoc(xml);
}

let pendingGpxSummary=null;
function applyActivitySummaryToRace(race,s){
  if(s.distanceKm) race.route.distanceKm=s.distanceKm;
  if(s.elevationGainM!=null) race.route.elevationGainM=s.elevationGainM;
  if(s.durationSeconds!=null&&race.results.chipTimeSeconds==null) race.results.chipTimeSeconds=s.durationSeconds;
  if(s.avgHr!=null) race.performanceData.avgHr=s.avgHr;
  if(s.maxHr!=null) race.performanceData.maxHr=s.maxHr;
  if(s.avgCadence!=null) race.performanceData.avgCadence=s.avgCadence;
  if(!race.performanceData.dataSource) race.performanceData.dataSource='運動手錶匯入 (GPX/TCX/FIT)';
  if(s.splits&&s.splits.length) race.splits=s.splits;
  if(s.elevationProfile&&s.elevationProfile.length) race.route.elevationProfile=s.elevationProfile;
  if(s.trackPoints&&s.trackPoints.length) race.route.trackPoints=s.trackPoints;
}
async function parseActivityFile(file){
  const ext=(file.name.split('.').pop()||'').toLowerCase();
  if(ext==='fit'){
    const buffer=await file.arrayBuffer();
    const points=parseFitPoints(buffer);
    return summarizeTrackPoints(points);
  }
  const text=await file.text();
  return parseGpxOrTcx(text);
}
document.getElementById('gpx-file-input').addEventListener('change',async e=>{
  const file=e.target.files[0];
  e.target.value='';
  if(!file) return;
  if(state.creating){
    try{
      createStagedActivity={summary:await parseActivityFile(file),filename:file.name};
      createStagedActivityError=null;
      logFeatureUse('import_gpx');
    }catch(err){
      createStagedActivity=null;
      createStagedActivityError=t('ui.errCannotParseThisFile','無法解析這個檔案：')+err.message;
    }
    updateCreateStagingUI();
    return;

  if(!currentRace) return;
  const modal=gpxModalEl_getter();

    pendingGpxSummary=await parseActivityFile(file);

    modal.hidden=false;
  }catch(err){
    pendingGpxSummary=null;
    modal.innerHTML=gpxErrorHtml(t('ui.errCannotParseThisFile','無法解析這個檔案：')+err.message);
    modal.hidden=false;
  }
});
gpxModalEl_getter().addEventListener('click',e=>{

      persist();renderCalendar();renderDetail();
      logFeatureUse('import_gpx');

    gpxModalEl_getter().hidden=true;gpxModalEl_getter().innerHTML='';pendingGpxSummary=null;

/* ============================================================
   貼上資料快速填入
   給 Claude（或任何人）讀完賽事網站／簡章 PDF／完賽證書後，
   把整理好的 JSON 貼進來，自動合併到目前賽事對應的欄位。
   只會更新貼上的欄位，其餘資料不受影響；id / createdAt 一律不可被覆蓋。
   ============================================================ */
function deepMergeInto(target,source){
  Object.keys(source).forEach(key=>{
    const val=source[key];
    if(val!==null&&typeof val==='object'&&!Array.isArray(val)&&
       target[key]!==null&&typeof target[key]==='object'&&!Array.isArray(target[key])){
      deepMergeInto(target[key],val);
    }else{
      target[key]=val;
    }
  });
}
function pasteModalHtml(){
  const raceName=escapeHtml(currentRace.name||t('ui.unnamedRace','此賽事'));
  return `<div class="modal-panel modal-panel-wide">
    <h2>${t('ui.pasteModalTitle','貼上資料快速填入')}</h2>
    <p class="modal-hint">${t('ui.pasteHintFull',`把賽事網站、簡章 PDF 或證書內容請 Claude 整理成 JSON（欄位名稱對照 <span class="mono">race-document.schema.json</span>），貼在下面就會套用到「${raceName}」。只會更新你貼的欄位，其他資料不會被覆蓋。`).replace('{race}',raceName)}</p>
    <textarea id="paste-json-input" rows="9" placeholder='{"name":"2026 臺北馬拉松","schedule":{"raceDate":"2026-12-20"},"route":{"distanceKm":42.195,"elevationGainM":180},"location":{"venueName":"臺北市政府","city":"臺北市"},"budget":{"registrationFee":1500}}'></textarea>
    <p class="paste-error" id="paste-error"></p>
    <div class="modal-actions">
      <button class="btn-primary" data-action="confirm-paste">${t('ui.apply','套用')}</button>
      <button class="btn-ghost" data-action="close-paste">${t('ui.cancel','取消')}</button>
    </div>
  </div>`;
}
const pasteModalEl_getter=()=>document.getElementById('paste-modal');
pasteModalEl_getter().addEventListener('click',e=>{
  if(e.target.closest('[data-action="close-paste"]')){
    pasteModalEl_getter().hidden=true;pasteModalEl_getter().innerHTML='';return;
  }
  if(e.target.closest('[data-action="confirm-paste"]')){
    const ta=document.getElementById('paste-json-input');
    const errEl=document.getElementById('paste-error');
    let parsed;
    try{
      parsed=JSON.parse(ta.value);
      if(typeof parsed!=='object'||parsed===null||Array.isArray(parsed)) throw new Error(t('ui.errPasteNotObject','請貼上一個 JSON 物件（用 { } 包起來）'));
    }catch(err){
      errEl.textContent=t('ui.pasteJsonError','JSON 格式錯誤：')+err.message;
      return;
    }
    delete parsed.id;delete parsed.createdAt;
    deepMergeInto(currentRace,parsed);
    currentRace.updatedAt=new Date().toISOString();
    persist();renderCalendar();renderDetail();
    pasteModalEl_getter().hidden=true;pasteModalEl_getter().innerHTML='';
    logFeatureUse('race_paste_quickfill');
    return;
  }
});
function openPasteModal(){
  if(!currentRace) return;
  pasteModalEl_getter().innerHTML=pasteModalHtml();
  pasteModalEl_getter().hidden=false;
}

/* ============================================================
   封面照片焦點調整
   小縮圖（行事曆格子、清單、獎牌牆）用 object-fit:cover 會裁成正方形，
   這裡讓使用者用滑鼠/觸控直接在完整照片上點選或拖曳，決定裁切時
   要保留哪個位置，存成百分比座標（跟 CSS object-position 直接對應）。
   ============================================================ */
let focalPointDraft=null;
function focalPointModalHtml(race){
  const fp=race.coverImageFocalPoint||{x:50,y:50};
  const aspect=race.coverImageAspect||1.5;
  return `<div class="modal-panel">
    <h2>${t('ui.focalPointTitle','調整封面照片焦點')}</h2>
    <p class="modal-hint">${t('ui.focalPointHint','行事曆格子、清單、獎牌牆的小縮圖會把照片裁成正方形。點選或拖曳下方照片，把最重要的部分移到準心位置，右側縮圖預覽會即時更新。')}</p>
    <div class="focal-point-body">
      <div class="focal-point-stage" id="focal-point-stage" style="aspect-ratio:${aspect}">
        <img src="${race.coverImage}" alt="" id="focal-point-img" draggable="false">
        <div class="focal-point-marker" id="focal-point-marker" style="left:${fp.x}%;top:${fp.y}%"></div>
      </div>
      <div class="focal-preview-col">
        <span class="small">${t('ui.focalPreviewLabel','縮圖預覽')}</span>
        <span class="focal-preview-thumb"><img src="${race.coverImage}" id="focal-preview-img" style="object-position:${fp.x}% ${fp.y}%"></span>
      </div>
    </div>
    <div class="modal-actions">
      <button type="button" class="btn-primary" data-action="save-focal-point">${t('ui.apply','套用')}</button>
      <button type="button" class="btn-ghost" data-action="close-focal-point">${t('ui.cancel','取消')}</button>
    </div>
  </div>`;
}
function updateFocalPointUI(x,y){
  focalPointDraft={x,y};
  const marker=document.getElementById('focal-point-marker');
  const previewImg=document.getElementById('focal-preview-img');
  if(marker){ marker.style.left=x+'%'; marker.style.top=y+'%'; }
  if(previewImg){ previewImg.style.objectPosition=`${x}% ${y}%`; }
}
function focalPosFromEvent(stage,e){
  const rect=stage.getBoundingClientRect();
  let x=((e.clientX-rect.left)/rect.width)*100;
  let y=((e.clientY-rect.top)/rect.height)*100;
  x=Math.round(Math.max(0,Math.min(100,x)));
  y=Math.round(Math.max(0,Math.min(100,y)));
  return {x,y};
}
function setupFocalPointDrag(){
  const stage=document.getElementById('focal-point-stage');
  if(!stage) return;
  let dragging=false;
  stage.addEventListener('pointerdown',e=>{
    dragging=true;
    try{ stage.setPointerCapture(e.pointerId); }catch(err){}
    const{x,y}=focalPosFromEvent(stage,e);
    updateFocalPointUI(x,y);
  });
  stage.addEventListener('pointermove',e=>{
    if(!dragging) return;
    const{x,y}=focalPosFromEvent(stage,e);
    updateFocalPointUI(x,y);
  });
  stage.addEventListener('pointerup',()=>{ dragging=false; });
  stage.addEventListener('pointercancel',()=>{ dragging=false; });
}
function openFocalPointModal(){
  if(!currentRace||!currentRace.coverImage) return;
  const modal=document.getElementById('focal-point-modal');
  modal.innerHTML=focalPointModalHtml(currentRace);
  modal.hidden=false;
  setupFocalPointDrag();
}
function closeFocalPointModal(){
  const modal=document.getElementById('focal-point-modal');
  modal.hidden=true;modal.innerHTML='';focalPointDraft=null;
}
document.addEventListener('click',e=>{
  if(e.target.closest('[data-action="open-focal-point"]')){ openFocalPointModal(); return; }
  if(e.target.closest('[data-action="close-focal-point"]')){ closeFocalPointModal(); return; }
  if(e.target.closest('[data-action="save-focal-point"]')){
    if(currentRace&&focalPointDraft){
      currentRace.coverImageFocalPoint={x:focalPointDraft.x,y:focalPointDraft.y};
      currentRace.updatedAt=new Date().toISOString();
      persist();renderCalendar();renderDetail();
    }

  }
});

/* ============================================================
   資料復原（已刪除賽事的垃圾桶 + 同步覆蓋紀錄）
   ============================================================ */
function recoveryModalHtml(){
  const deleted=state.races.filter(r=>r.deletedAt).sort((a,b)=>(b.deletedAt||'').localeCompare(a.deletedAt||''));
  return `<div class="modal-panel modal-panel-wide">
    <h2>${t('ui.recoveryTitle','資料復原')}</h2>
    <div class="recovery-section">
      <h3>${t('ui.recoveryDeletedTitle','已刪除的賽事')}</h3>
      <p class="modal-hint">${tf('ui.recoveryDeletedHint',`刪除的賽事會先保留 ${TRASH_RETENTION_DAYS} 天，超過會自動清空。`,TRASH_RETENTION_DAYS)}</p>
      ${deleted.length?`<div class="recovery-list">${deleted.map(r=>`
        <div class="recovery-row">
          <span class="recovery-row-name">${escapeHtml(r.name||t('ui.unnamedRace','(未命名賽事)'))}</span>
          <span class="recovery-row-date mono small">${t('ui.recoveryDeletedOn','刪除於')} ${(r.deletedAt||'').slice(0,10)}</span>
          <button type="button" class="btn-ghost" data-action="restore-race" data-id="${r.id}">${t('ui.recoveryRestore','還原')}</button>
          <button type="button" class="btn-text danger" data-action="purge-race" data-id="${r.id}">${t('ui.recoveryPurge','永久刪除')}</button>
        </div>`).join('')}</div>`:emptyStateBlock('trash',t('ui.recoveryDeletedEmpty','目前沒有已刪除的賽事'))}
    </div>
    <div class="recovery-section">
      <h3>${t('ui.recoveryOverwriteTitle','同步覆蓋紀錄')}</h3>
      <p class="modal-hint">${t('ui.recoveryOverwriteHint','多裝置同步時，如果同一場賽事在兩邊都被修改過，系統會自動套用較新的版本，並把被覆蓋的版本留在這裡（最多 20 筆）。')}</p>
      ${syncOverwrites.length?`<div class="recovery-list">${syncOverwrites.map(en=>`
        <div class="recovery-row">
          <span class="recovery-row-name">${escapeHtml(en.raceName)}</span>
          <span class="recovery-row-date mono small">${t('ui.recoveryOverwrittenOn','覆蓋於')} ${(en.discardedAt||'').slice(0,10)}</span>
          <button type="button" class="btn-ghost" data-action="restore-overwrite" data-entry="${en.id}">${t('ui.recoveryRestoreVersion','還原此版本')}</button>
          <button type="button" class="btn-text danger" data-action="dismiss-overwrite" data-entry="${en.id}">${t('ui.recoveryDismiss','移除紀錄')}</button>
        </div>`).join('')}</div>`:emptyStateBlock('history',t('ui.recoveryOverwriteEmpty','目前沒有同步覆蓋紀錄'))}
    </div>
    <div class="modal-actions"><button class="btn-ghost" data-action="close-recovery">${t('ui.close','關閉')}</button></div>
  </div>`;
}
const recoveryModalEl_getter=()=>document.getElementById('recovery-modal');
function renderRecoveryButton(){
  const btn=document.getElementById('btn-recovery');
  if(!btn) return;
  const n=recoveryCount();
  btn.textContent=t('ui.recoveryButton','已刪除賽事')+(n?` (${n})`:'');
}
function openRecoveryModal(){
  recoveryModalEl_getter().innerHTML=recoveryModalHtml();
  recoveryModalEl_getter().hidden=false;
}
function closeRecoveryModal(){
  recoveryModalEl_getter().hidden=true;recoveryModalEl_getter().innerHTML='';
}
function restoreDeletedRace(id){
  const r=state.races.find(x=>x.id===id);
  if(!r) return;
  r.deletedAt=null;r.updatedAt=new Date().toISOString();
  persist();renderAll();renderRecoveryButton();openRecoveryModal();
}
function purgeDeletedRace(id){
  state.races=state.races.filter(x=>x.id!==id);
  persist();renderRecoveryButton();openRecoveryModal();
}
function restoreOverwriteEntry(entryId){
  const idx=syncOverwrites.findIndex(e=>e.id===entryId);
  if(idx===-1) return;
  const entry=syncOverwrites[idx];
  const currentIdx=state.races.findIndex(r=>r.id===entry.raceId);
  if(currentIdx!==-1){
    // 目前版本會被換掉，先把它也存進覆蓋紀錄，避免這次還原又造成新的遺失
    syncOverwrites.unshift({
      id:uid(),raceId:state.races[currentIdx].id,
      raceName:state.races[currentIdx].name||t('ui.unnamedRace','(未命名賽事)'),
      discardedAt:new Date().toISOString(),
      race:state.races[currentIdx],
    });
    state.races[currentIdx]=migrateRace(JSON.parse(JSON.stringify(entry.race)));
  }else{
    state.races.push(migrateRace(JSON.parse(JSON.stringify(entry.race))));
  }
  syncOverwrites=syncOverwrites.filter(e=>e.id!==entryId).slice(0,20);
  persistSyncOverwrites();
  persist();renderAll();renderRecoveryButton();openRecoveryModal();
}
function dismissOverwriteEntry(entryId){
  syncOverwrites=syncOverwrites.filter(e=>e.id!==entryId);
  persistSyncOverwrites();
  openRecoveryModal();
}

   ============================================================ */
function computePacingRows(targetSeconds,distanceKm,strategy,intervalKm){
  if(!targetSeconds||!distanceKm||!intervalKm) return [];
  const avgPace=targetSeconds/distanceKm;
  const x=strategy==='negative'?0.04:(strategy==='positive'?-0.04:0);
  const p1=avgPace*(1+x),p2=avgPace*(1-x);
  const rows=[];
  let d=intervalKm;
  while(d<distanceKm-0.05){
    const t=p1*d+(p2-p1)*d*d/(2*distanceKm);
    rows.push({distanceKm:+d.toFixed(1),cumulativeSeconds:Math.round(t)});
    d+=intervalKm;
  }
  rows.push({distanceKm:+distanceKm.toFixed(2),cumulativeSeconds:Math.round(targetSeconds)});
  return rows;
}

  return `<table class="series-table"><thead><tr><th class="num">${t('ui.pacingDistanceCol','距離')}</th><th class="num">${t('ui.pacingTimeCol','預計通過時間')}</th></tr></thead>
    <tbody>${rows.map(r=>`<tr><td class="mono num">${r.distanceKm} km</td><td class="mono num">${secToHMS(r.cumulativeSeconds)}</td></tr>`).join('')}</tbody></table>`;

async function buildWristbandCanvas(rows,race){
  try{ await document.fonts.ready; }catch(e){}
  const W=360,H=120+rows.length*70;
  const canvas=document.createElement('canvas');
  canvas.width=W;canvas.height=H;
  const ctx=canvas.getContext('2d');
  ctx.fillStyle='#16231C';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#9BA3A0';
  ctx.font=`20px ${canvasFontFamily()}`;
  ctx.fillText(race&&race.name?Array.from(race.name).slice(0,16).join(''):t('ui.wristbandTitle','配速手環'),24,50);
  let y=100;
  rows.forEach(r=>{
    ctx.fillStyle='#EDEEE9';
    ctx.font='bold 28px "IBM Plex Mono",monospace';
    ctx.textAlign='left';
    ctx.fillText(String(r.distanceKm)+' km',24,y);
    ctx.fillStyle='#4C9A72';
    ctx.font='bold 32px "IBM Plex Mono",monospace';
    ctx.textAlign='right';
    ctx.fillText(secToHMS(r.cumulativeSeconds),W-24,y);
    ctx.textAlign='left';
    ctx.strokeStyle='#2A3038';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(24,y+20);ctx.lineTo(W-24,y+20);ctx.stroke();
    y+=70;
  });
  return canvas;
}
async function downloadWristbandImage(rows,race){
  if(!rows||!rows.length) return;
  const canvas=await buildWristbandCanvas(rows,race);
  canvas.toBlob(blob=>{
    if(!blob) return;
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;a.download=t('ui.wristbandFilename','配速手環.png');
    a.click();
    URL.revokeObjectURL(url);
  },'image/png');
}

    persistTemplates();
  }

  checkAndRecordBadgeUnlocks();

/* ============================================================
   清單拖曳排序（裝備清單／補給時程／分段配速）
   滑鼠可以直接拖曳把手排序；由於原生拖放無法用鍵盤操作，
   同時提供上移／下移按鈕作為鍵盤與觸控裝置都能用的替代方案。
   ============================================================ */
let dragReorderState=null;
document.addEventListener('dragstart',e=>{
  const handle=e.target.closest('.drag-handle');
  if(!handle) return;
  const row=handle.closest('.repeat-row');
  dragReorderState={list:handle.dataset.list,index:parseInt(handle.dataset.index,10)};
  try{ e.dataTransfer.setDragImage(row,20,20); }catch(err){}
  e.dataTransfer.effectAllowed='move';
  try{ e.dataTransfer.setData('text/plain',''); }catch(err){}
  row.classList.add('dragging');
});
document.addEventListener('dragend',()=>{
  document.querySelectorAll('.repeat-row.dragging').forEach(r=>r.classList.remove('dragging'));
  document.querySelectorAll('.repeat-row.drag-over-top,.repeat-row.drag-over-bottom').forEach(r=>r.classList.remove('drag-over-top','drag-over-bottom'));
  dragReorderState=null;
});
document.addEventListener('dragover',e=>{
  if(!dragReorderState) return;
  const row=e.target.closest('.repeat-row');
  if(!row||!row.closest('.repeat-rows')) return;
  e.preventDefault();
  document.querySelectorAll('.repeat-row.drag-over-top,.repeat-row.drag-over-bottom').forEach(r=>{ if(r!==row) r.classList.remove('drag-over-top','drag-over-bottom'); });
  const rect=row.getBoundingClientRect();
  const isTopHalf=(e.clientY-rect.top)<rect.height/2;
  row.classList.toggle('drag-over-top',isTopHalf);
  row.classList.toggle('drag-over-bottom',!isTopHalf);
});
document.addEventListener('drop',e=>{
  if(!dragReorderState||!currentRace) return;
  const row=e.target.closest('.repeat-row');
  if(!row){ dragReorderState=null; return; }
  e.preventDefault();
  const rowsContainer=row.closest('.repeat-rows');
  const rows=[...rowsContainer.children];
  let targetIndex=rows.indexOf(row);
  const rect=row.getBoundingClientRect();
  const isTopHalf=(e.clientY-rect.top)<rect.height/2;
  if(!isTopHalf) targetIndex++;
  const {list,index:fromIndex}=dragReorderState;
  const arr=currentRace[list];
  if(arr&&fromIndex!==targetIndex&&fromIndex>=0&&fromIndex<arr.length){
    const [item]=arr.splice(fromIndex,1);
    let insertAt=targetIndex;
    if(fromIndex<targetIndex) insertAt--;
    insertAt=Math.max(0,Math.min(insertAt,arr.length));
    arr.splice(insertAt,0,item);
    currentRace.updatedAt=new Date().toISOString();
    persist();renderDetail();
  }
  dragReorderState=null;
});

document.addEventListener('keydown',e=>{
  if(e.key!=='Escape') return;
  const modalIds=['import-modal','gpx-modal','paste-modal','shoe-modal','pacing-modal','help-modal','recovery-modal','focal-point-modal'];
  for(const id of modalIds){
    const el=document.getElementById(id);
    if(el&&!el.hidden){
      const closeBtn=el.querySelector('[data-action^="close-"]');
      if(closeBtn) closeBtn.click();
      return;
    }
  }
});
init();
</script>

<!-- ============================================================
     Firebase 雲端同步（選用）— 把下面 firebaseConfig 換成你自己
     Firebase 專案的設定值即可啟用；沒填就完全不影響其他功能。

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
  import {
    getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js";
  import {
    getFirestore, collection, doc, setDoc, deleteDoc, getDocs, writeBatch, increment
  } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";
  import {
    getMessaging, getToken, onMessage
  } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-messaging.js";

  // TODO：換成你自己 Firebase 專案「網頁應用程式」設定裡的值（Firebase Console → 專案設定 → 一般 → 你的應用程式）
  const firebaseConfig = {
    apiKey: "AIzaSyC_CdVap0VrzuEeE5KPmOkendsHcaVSj2w",
    authDomain: "race-day-6da0b.firebaseapp.com",
    projectId: "race-day-6da0b",
    storageBucket: "race-day-6da0b.firebasestorage.app",
    messagingSenderId: "1095751046156",
    appId: "1:1095751046156:web:73d0556cf529516f874a29"
  };
  // TODO：Firebase Console → 專案設定 → Cloud Messaging → Web Push 憑證 → 產生金鑰組，把公開金鑰貼在這裡
  const VAPID_KEY = "YOUR_VAPID_KEY";

  const isConfigured = firebaseConfig.apiKey !== "YOUR_API_KEY";

  let app=null, auth=null, db=null;
  if(isConfigured){
    try{
      app=initializeApp(firebaseConfig);
      auth=getAuth(app);
      db=getFirestore(app);
    }catch(err){
      console.warn('Firebase 初始化失敗，雲端同步停用',err);
    }
  }

  function racesCol(uid){ return collection(db,'users',uid,'races'); }

  window.__cloud={
    enabled: !!(app&&auth&&db),
    notificationsConfigured: VAPID_KEY!=='YOUR_VAPID_KEY',
    async signIn(){
      await signInWithPopup(auth, new GoogleAuthProvider());
    },
    async signOutUser(){
      await signOut(auth);
    },
    onAuthChange(cb){
      onAuthStateChanged(auth, cb);
    },
    async fetchAll(uid){
      const snap=await getDocs(racesCol(uid));
      return snap.docs.map(d=>d.data());
    },
    async replaceAll(uid, races){
      const snap=await getDocs(racesCol(uid));
      const batch=writeBatch(db);
      const keepIds=new Set(races.map(r=>r.id));
      snap.docs.forEach(d=>{ if(!keepIds.has(d.id)) batch.delete(d.ref); });
      races.forEach(r=>batch.set(doc(racesCol(uid), r.id), r));
      await batch.commit();
    },
    // 功能點擊次數統計：counts 是一次要送出的 {功能代號: 這次要加的次數}，
    // 用 increment() 讓 Firestore 在伺服器端做原子加總，不管多少個訪客
    // 同時點擊都不會互相覆蓋掉彼此的計數。不需要登入也能呼叫（規則裡
    // 這個文件的寫入是開放的），這樣才能統計到所有訪客，不只是登入的人。
    async logFeatureUse(counts){
      const updates={};
      Object.keys(counts).forEach(k=>{ updates[k]=increment(counts[k]); });
      await setDoc(doc(db,'analytics','featureCounts'), updates, {merge:true});
    },
    async enableNotifications(uid){
      if(VAPID_KEY==='YOUR_VAPID_KEY') throw new Error(t('ui.errVapidNotSet','尚未設定 VAPID 金鑰'));
      if(!('serviceWorker' in navigator)) throw new Error(t('ui.errNoServiceWorker','此瀏覽器不支援背景通知'));
      if(!('Notification' in window)) throw new Error(t('ui.errNoNotificationSupport','此瀏覽器不支援通知功能'));
      const permission=await Notification.requestPermission();
      if(permission!=='granted') throw new Error(t('ui.errPermissionDenied','未取得通知權限'));
      const registration=await navigator.serviceWorker.register('/firebase-messaging-sw.js');
      const messaging=getMessaging(app);
      const token=await getToken(messaging,{vapidKey:VAPID_KEY,serviceWorkerRegistration:registration});
      if(!token) throw new Error(t('ui.errNoToken','無法取得推播權杖'));
      await setDoc(doc(db,'users',uid,'fcmTokens',token),{token,createdAt:new Date().toISOString()});
      onMessage(messaging,(payload)=>{
        if(window.__onForegroundMessage) window.__onForegroundMessage(payload);
      });
      return token;
    }
  };

  window.dispatchEvent(new Event('cloud-ready'));
</script>
