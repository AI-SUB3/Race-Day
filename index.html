/* ============================================================
   初始化
   ============================================================ */
// localDataReady：app 剛載入時，「從本機存讀讀出賽事／鞋款／補給品
// 資料庫」（init() 這裡）跟「Firebase 判斷登入狀態、觸發雲端合併」
// （handleAuthChange()）是兩條完全獨立、互不等待的非同步流程，過去
// 沒有做任何先後順序的保證——如果雲端合併剛好比本機讀取先跑完，
// 合併函式讀到的 state.races／shoes／nutritionDictionary 還是初始的
// 空值，會把雲端資料直接當成唯一內容合併進去；緊接著本機讀取才跑完，
// 用「從 storage 讀到什麼就整個蓋過去」的方式覆寫這幾個變數（不是
// 合併），剛剛合併好的雲端資料就這樣被蓋掉、蒸發，本機資料庫又是
// 空的。這在資料庫讀取剛好比較慢的裝置上機率特別高（例如手機），
// 桌機上因為讀取通常比較快、雲端合併通常會排在後面，長期沒有踩到
// 這個時序，容易被誤判成只有手機才有問題，實際上是這兩條路徑原本
// 就沒有互相協調，兩台裝置都有踩到的風險，只是機率不同。
// 修法是讓 init() 把這段本機讀取的 Promise 存起來，handleAuthChange()
// 動用這幾個變數之前，先 await 它，確保本機資料一定讀取完成、順序
// 固定之後才開始合併，不會再被後面才跑完的本機讀取蓋掉。
let localDataReady=null;
/* ============================================================
   常駐提示條：安裝到主畫面／有新版本／儲存空間快滿。
   ============================================================ */
let activeBanner=null;
function showAppBanner({text,actions,kind}){
  hideAppBanner();
  const el=document.createElement('div');
  el.className='app-banner'+(kind==='warn'?' is-warn':'');
  el.setAttribute('role','status');
  el.innerHTML=`<span>${escapeHtml(text)}</span><div class="app-banner-actions">${
    actions.map((a,i)=>`<button type="button" data-banner-action="${i}"${a.primary?' class="primary"':''}>${escapeHtml(a.label)}</button>`).join('')
  }</div>`;
  el.addEventListener('click',e=>{
    const b=e.target.closest('[data-banner-action]'); if(!b) return;
    const a=actions[Number(b.dataset.bannerAction)];
    hideAppBanner(); if(a&&a.run) a.run();
  });
  document.body.appendChild(el); activeBanner=el;
}
function hideAppBanner(){ if(activeBanner){ activeBanner.remove(); activeBanner=null; } }
function prefGet(key){ try{ return JSON.parse(localStorage.getItem(key)||'null'); }catch(e){ return null; } }
function prefSet(key,val){ try{ localStorage.setItem(key,JSON.stringify(val)); }catch(e){} }

/* ============================================================
   離線 Service Worker（4a）
   註冊 URL 帶 ?v=APP_VERSION：版號一變就是新的 SW，快取跟著換。
   file:// 與非安全來源沒有 SW，直接略過——本機打開檔案測試時不該報錯。
   ============================================================ */
let swWaitingReg=null, swReloadRequested=false;
function registerOfflineWorker(){
  if(window.__swDisabled) return;   // 救援閘門已判定這次不要註冊
  if(!('serviceWorker' in navigator)) return;
  if(location.protocol!=='https:'&&location.hostname!=='localhost'&&location.hostname!=='127.0.0.1') return;
  navigator.serviceWorker.register('./sw.js?v='+encodeURIComponent(APP_VERSION)).then(reg=>{
    if(reg.waiting&&navigator.serviceWorker.controller) offerWorkerUpdate(reg);
    reg.addEventListener('updatefound',()=>{
      const nw=reg.installing; if(!nw) return;
      nw.addEventListener('statechange',()=>{
        // 第一次安裝（沒有 controller）不用提示，靜靜地讓它接管就好
        if(nw.state==='installed'&&navigator.serviceWorker.controller) offerWorkerUpdate(reg);
      });
    });
  }).catch(err=>console.warn('離線快取註冊失敗',err));
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    // 只在使用者按了「更新」才重新載入。首次安裝 clients.claim() 也會觸發
    // 這個事件，那時重新載入會把正在填的表單洗掉。
    if(swReloadRequested){ swReloadRequested=false; location.reload(); }
  });
}
function offerWorkerUpdate(reg){
  swWaitingReg=reg;
  showAppBanner({text:t('ui.updateAvailable','有新版本可以更新'),actions:[
    {label:t('ui.updateNow','立即更新'),primary:true,run:()=>{
      if(!swWaitingReg||!swWaitingReg.waiting) return;
      swReloadRequested=true;
      swWaitingReg.waiting.postMessage({type:'SKIP_WAITING'});
    }},
    {label:t('ui.later','稍後')},
  ]});
}
window.addEventListener('offline',()=>showToast(t('ui.nowOffline','目前離線：資料仍會存在本機，恢復連線後再同步')));
window.addEventListener('online',()=>showToast(t('ui.backOnline','已恢復連線')));

/* ============================================================
   加入主畫面提示（4b）：第三次開啟才問，按「稍後」30 天內不再問。
   Android／桌機 Chrome 走 beforeinstallprompt；iOS Safari 沒有這個事件，
   只能用文字教「分享 → 加入主畫面」。已經在主畫面裡開的（standalone）
   完全不顯示。
   ============================================================ */
const OPEN_COUNT_KEY='open-count-v1', INSTALL_HINT_KEY='install-hint-v1';
let deferredInstallPrompt=null;
function isStandalone(){ return window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true; }
function isIosSafari(){ return /iPhone|iPad|iPod/.test(navigator.userAgent)&&/Safari/.test(navigator.userAgent)&&!/CriOS|FxiOS/.test(navigator.userAgent); }
function bumpOpenCount(){ const n=(prefGet(OPEN_COUNT_KEY)||0)+1; prefSet(OPEN_COUNT_KEY,n); return n; }
function installHintEligible(){
  if(isStandalone()) return false;
  const st=prefGet(INSTALL_HINT_KEY)||{};
  if(st.installed) return false;
  if(st.snoozedUntil&&Date.now()<st.snoozedUntil) return false;
  return (prefGet(OPEN_COUNT_KEY)||0)>=3;
}
function snoozeInstallHint(){ prefSet(INSTALL_HINT_KEY,{snoozedUntil:Date.now()+30*86400000}); }
function maybeShowInstallHint(){
  if(!installHintEligible()) return;
  if(deferredInstallPrompt){
    showAppBanner({text:t('ui.installHint','把賽事紀錄加到主畫面，比賽當天打開更快'),actions:[
      {label:t('ui.installNow','安裝'),primary:true,run:async()=>{
        const p=deferredInstallPrompt; deferredInstallPrompt=null;
        try{ p.prompt(); const c=await p.userChoice; if(c&&c.outcome==='accepted') prefSet(INSTALL_HINT_KEY,{installed:true}); else snoozeInstallHint(); }
        catch(e){ snoozeInstallHint(); }
      }},
      {label:t('ui.later','稍後'),run:snoozeInstallHint},
    ]});
  }else if(isIosSafari()){
    showAppBanner({text:t('ui.installHintIos','想在主畫面直接開：點 Safari 的分享按鈕 → 「加入主畫面」'),actions:[
      {label:t('ui.gotIt','知道了'),primary:true,run:snoozeInstallHint},
    ]});
  }
}
window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); deferredInstallPrompt=e; maybeShowInstallHint(); });
window.addEventListener('appinstalled',()=>{ prefSet(INSTALL_HINT_KEY,{installed:true}); hideAppBanner(); });

/* ============================================================
   儲存空間快滿（4c）：≥80% 主動跳提示，附「匯出備份」「清理封面」。
   同步診斷裡的數字變紅是被動的——要使用者自己點進去看；這裡是主動的。
   按「知道了」7 天內不再提。啟動時檢查一次，之後每次存檔最多 5 分鐘查一次。
   ============================================================ */
const STORAGE_WARN_KEY='storage-warn-v1', STORAGE_WARN_RATIO=0.8;
let lastStorageCheck=0;
async function checkStorageHeadroom(force){
  if(!navigator.storage||!navigator.storage.estimate) return null;
  if(!force&&Date.now()-lastStorageCheck<5*60*1000) return null;
  lastStorageCheck=Date.now();
  let est; try{ est=await navigator.storage.estimate(); }catch(e){ return null; }
  if(!est||est.usage==null||!est.quota) return null;
  const ratio=est.usage/est.quota;
  if(ratio<STORAGE_WARN_RATIO) return ratio;
  const st=prefGet(STORAGE_WARN_KEY)||{};
  if(st.snoozedUntil&&Date.now()<st.snoozedUntil) return ratio;
  showStorageWarning(ratio);
  return ratio;
}
function showStorageWarning(ratio){
  showAppBanner({kind:'warn',text:tf('ui.storageNearFull','儲存空間已用 {n}%，建議先匯出備份，或清掉不需要的封面照片',Math.round(ratio*100)),actions:[
    {label:t('ui.exportJson','匯出 JSON'),primary:true,run:()=>{ const b=document.getElementById('btn-export'); if(b) b.click(); }},
    {label:t('ui.cleanupCovers','清理封面'),run:openStorageCleanup},
    {label:t('ui.gotIt','知道了'),run:()=>prefSet(STORAGE_WARN_KEY,{snoozedUntil:Date.now()+7*86400000})},
  ]});
}
/* 清理封面：列出有封面的賽事、依佔用大小排序，逐張移除。
   base64 字串長度 ×0.75 就是實際位元組，不用另外解碼。
   移除是兩段式確認、5 秒自動解除——封面沒有垃圾桶，刪了就沒了。 */
const storageCleanupEl_getter=()=>document.getElementById('storage-cleanup-modal');
let cleanupConfirmTimer=null;
function coverBytes(r){ return Math.round(((r.coverImage||'').length+(r.coverThumb||'').length)*0.75); }
function storageCleanupHtml(){
  const rows=state.races.filter(r=>r.coverImage&&!r.deletedAt).map(r=>({r,bytes:coverBytes(r)})).sort((a,b)=>b.bytes-a.bytes);
  const total=rows.reduce((s,x)=>s+x.bytes,0);
  const kb=b=>b>=1048576?(b/1048576).toFixed(1)+' MB':Math.round(b/1024)+' KB';
  return `<div class="modal-panel modal-panel-wide">
    <h2>${t('ui.cleanupCoversTitle','清理封面照片')}</h2>
    <p class="modal-hint">${rows.length?tf2('ui.cleanupCoversHint','{a} 場有封面，共佔 {b}。封面移除後無法復原，其他資料不受影響。',rows.length,kb(total)):t('ui.cleanupCoversEmpty','沒有任何賽事有封面照片')}</p>
    <div class="storage-cleanup-list">${rows.map(({r,bytes})=>`
      <div class="storage-cleanup-row" data-id="${r.id}">
        <img src="${escapeHtml(coverThumbOf(r))}" alt="">
        <div class="storage-cleanup-main">
          <div class="storage-cleanup-name">${escapeHtml(r.name||t('ui.unnamedRace','(未命名賽事)'))}</div>
          <div class="storage-cleanup-meta">${escapeHtml(r.schedule.raceDate||'')} ・ ${kb(bytes)}</div>
        </div>
        <button type="button" class="btn-ghost" data-action="cleanup-remove-cover" data-id="${r.id}">${t('ui.removeCover','移除封面')}</button>
      </div>`).join('')}</div>
    <div class="modal-actions"><button class="btn-ghost" data-action="close-storage-cleanup">${t('ui.close','關閉')}</button></div>
  </div>`;
}
function openStorageCleanup(){ const el=storageCleanupEl_getter(); el.innerHTML=storageCleanupHtml(); el.hidden=false; }
function closeStorageCleanup(){ const el=storageCleanupEl_getter(); el.hidden=true; el.innerHTML=''; }
storageCleanupEl_getter().addEventListener('click',async e=>{
  if(e.target.closest('[data-action="close-storage-cleanup"]')){ closeStorageCleanup(); return; }
  const btn=e.target.closest('[data-action="cleanup-remove-cover"]'); if(!btn) return;
  if(!btn.classList.contains('is-confirming')){
    document.querySelectorAll('#storage-cleanup-modal .is-confirming').forEach(b=>{ b.classList.remove('is-confirming'); b.textContent=t('ui.removeCover','移除封面'); });
    btn.classList.add('is-confirming'); btn.textContent=t('ui.confirmRemove','確定移除？');
    clearTimeout(cleanupConfirmTimer);
    cleanupConfirmTimer=setTimeout(()=>{ if(btn.isConnected){ btn.classList.remove('is-confirming'); btn.textContent=t('ui.removeCover','移除封面'); } },5000);
    return;
  }
  const race=state.races.find(r=>r.id===btn.dataset.id); if(!race) return;
  race.coverImage=''; race.coverThumb=''; race.coverImageAspect=null; race.coverImageAccentColor=null;
  race.updatedAt=new Date().toISOString();
  await persist(); renderCalendar(); if(currentRace&&currentRace.id===race.id) renderDetail();
  openStorageCleanup();   // 重畫清單與總量
  logFeatureUse('cleanup_cover');
});

async function init(){
  document.getElementById('app-version').textContent=APP_VERSION;
  // 沒有 Vibration API 的裝置（iOS 上所有瀏覽器都是，因為共用 WebKit；
  // 大部分桌機也沒有馬達）掛一個 class，讓長按蓄力的視覺回饋可以加強
  // 到「光看也分得出三個階段」。只在啟動時判斷一次，不用每次按下去
  // 都重新問一遍。
  if(!navigator.vibrate) document.documentElement.classList.add('no-haptics');
  document.documentElement.setAttribute('lang',currentLang==='ja'?'ja':currentLang==='en'?'en':'zh-Hant');
  document.documentElement.setAttribute('data-lang',currentLang);
  applyStaticTranslations();
  detailEl.innerHTML=`<p class="empty-hint">${t('ui.loading','載入中…')}</p>`;
  renderAuthArea();
  await migrateLocalStorageToIdb();
  await loadSyncOverwrites();
  await loadBadgeUnlocks();
  localDataReady=Promise.all([loadRaces(),loadTemplates(),loadShoes(),loadUserProfile(),loadNutritionDictionary()]);
  await localDataReady;
  if(templates.length===0){
    templates=STARTER_TEMPLATES.map(t=>({id:uid(),name:t.name,items:t.items}));
    persistTemplates();
  }
  if(purgeOldTrash()) persist();
  syncSampleDataButtonLabel();
  backfillCoverThumbs();
  if(backfillRunningCadence()) persist();
  checkAndRecordBadgeUnlocks();
  renderAll();
  updateTopbarHeightVar();
  checkAndShowFirstUseGlow();
  // 走到這裡代表這一次真的啟動完成了，把「開不起來」的計數歸零
  try{ sessionStorage.setItem('boot-fails-v1','0'); }catch(e){}
  registerOfflineWorker();
  // 剛做過救援清除的話，告訴使用者發生了什麼、以及離線快取暫時關掉了
  try{
    const wiped=sessionStorage.getItem('sw-wiped-v1');
    if(wiped){
      sessionStorage.removeItem('sw-wiped-v1');
      showAppBanner({kind:'warn',text:wiped==='loop'
        ?t('ui.swWipedLoop','偵測到頁面不斷重新整理，已清除離線快取並暫時停用。資料都在，重新整理一次即可恢復正常。')
        :t('ui.swWipedManual','已清除離線快取。資料都在，重新整理一次即可恢復正常。'),
        actions:[{label:t('ui.reloadNow','重新整理'),primary:true,run:()=>location.reload()},{label:t('ui.later','稍後')}]});
    }
  }catch(e){}
  bumpOpenCount();
  // 儲存空間警示比安裝提示優先：空間快滿是會掉資料的事，安裝只是方便。
  checkStorageHeadroom(true).then(ratio=>{ if(ratio==null||ratio<STORAGE_WARN_RATIO) maybeShowInstallHint(); });
}
/* ============================================================
   清單拖曳排序（裝備清單／補給時程／分段配速）
   滑鼠可以直接拖曳把手排序；由於原生拖放無法用鍵盤操作，
   同時提供上移／下移按鈕作為鍵盤與觸控裝置都能用的替代方案。
   ============================================================ */
let dragReorderState=null;
document.addEventListener('dragstart',e=>{
  const handle=e.target.closest('.drag-handle');
  if(!handle) return;
  const row=handle.closest('.repeat-row');
  dragReorderState={list:handle.dataset.list,index:parseInt(handle.dataset.index,10)};
  try{ e.dataTransfer.setDragImage(row,20,20); }catch(err){}
  e.dataTransfer.effectAllowed='move';
  try{ e.dataTransfer.setData('text/plain',''); }catch(err){}
  row.classList.add('dragging');
});
document.addEventListener('dragend',()=>{
  document.querySelectorAll('.repeat-row.dragging').forEach(r=>r.classList.remove('dragging'));
  document.querySelectorAll('.repeat-row.drag-over-top,.repeat-row.drag-over-bottom').forEach(r=>r.classList.remove('drag-over-top','drag-over-bottom'));
  dragReorderState=null;
});
document.addEventListener('dragover',e=>{
  if(!dragReorderState) return;
  const row=e.target.closest('.repeat-row');
  if(!row||!row.closest('.repeat-rows')) return;
  e.preventDefault();
  document.querySelectorAll('.repeat-row.drag-over-top,.repeat-row.drag-over-bottom').forEach(r=>{ if(r!==row) r.classList.remove('drag-over-top','drag-over-bottom'); });
  const rect=row.getBoundingClientRect();
  const isTopHalf=(e.clientY-rect.top)<rect.height/2;
  row.classList.toggle('drag-over-top',isTopHalf);
  row.classList.toggle('drag-over-bottom',!isTopHalf);
});
document.addEventListener('drop',e=>{
  if(!dragReorderState||!currentRace) return;
  const row=e.target.closest('.repeat-row');
  if(!row){ dragReorderState=null; return; }
  e.preventDefault();
  const rowsContainer=row.closest('.repeat-rows');
  const rows=[...rowsContainer.children];
  let targetIndex=rows.indexOf(row);
  const rect=row.getBoundingClientRect();
  const isTopHalf=(e.clientY-rect.top)<rect.height/2;
  if(!isTopHalf) targetIndex++;
  const {list,index:fromIndex}=dragReorderState;
  const arr=currentRace[list];
  if(arr&&fromIndex!==targetIndex&&fromIndex>=0&&fromIndex<arr.length){
    const [item]=arr.splice(fromIndex,1);
    let insertAt=targetIndex;
    if(fromIndex<targetIndex) insertAt--;
    insertAt=Math.max(0,Math.min(insertAt,arr.length));
    arr.splice(insertAt,0,item);
    currentRace.updatedAt=new Date().toISOString();
    persist();renderDetail();
  }
  dragReorderState=null;
});

// 裝備佈署看板的拖放，跟上面既有的「清單內重新排序」是完全獨立的一套
// 監聽器（用不同的 class 跟狀態變數），故意不共用——上面那套的邏輯是
// 「在同一個陣列裡搬位置」，這裡要做的是「把項目搬到另一個位置分類」，
// 兩者處理方式不一樣，混在一起改既有的、已經在正常運作的重新排序功能
// 風險較高，用獨立的一套彼此不會互相干擾。
let kanbanDragIndex=null;
document.addEventListener('dragstart',e=>{
  const card=e.target.closest('.kanban-card');
  if(!card) return;
  kanbanDragIndex=parseInt(card.dataset.kanbanIndex,10);
  try{ e.dataTransfer.setDragImage(card,20,20); }catch(err){}
  e.dataTransfer.effectAllowed='move';
  try{ e.dataTransfer.setData('text/plain',''); }catch(err){}
  card.classList.add('kanban-dragging');
});
document.addEventListener('dragend',()=>{
  document.querySelectorAll('.kanban-card.kanban-dragging').forEach(c=>c.classList.remove('kanban-dragging'));
  document.querySelectorAll('.kanban-lane.kanban-drag-over').forEach(l=>l.classList.remove('kanban-drag-over'));
  kanbanDragIndex=null;
});
document.addEventListener('dragover',e=>{
  if(kanbanDragIndex==null) return;
  const lane=e.target.closest('.kanban-lane');
  if(!lane) return;
  e.preventDefault();
  document.querySelectorAll('.kanban-lane.kanban-drag-over').forEach(l=>{ if(l!==lane) l.classList.remove('kanban-drag-over'); });
  lane.classList.add('kanban-drag-over');
});
document.addEventListener('drop',e=>{
  if(kanbanDragIndex==null||!currentRace) return;
  const lane=e.target.closest('.kanban-lane');
  if(!lane){ kanbanDragIndex=null; return; }
  e.preventDefault();
  const item=currentRace.equipmentChecklist&&currentRace.equipmentChecklist[kanbanDragIndex];
  if(item){
    item.location=lane.dataset.location;
    currentRace.updatedAt=new Date().toISOString();
    persist();renderDetail();
  }
  kanbanDragIndex=null;
});

/* ============================================================
   全域拖曳匯入：把外部檔案（GPX／TCX／FIT 軌跡、JSON 備份、JPG／PNG
   照片）直接拖進視窗任何位置就能匯入，依副檔名自動分流到對應的既有
   匯入邏輯（跟「選擇檔案」入口共用同一套函式，不是另外重寫一份）。
   ============================================================ */
let globalDropCounter=0;
// isExternalFileDrag(e)：判斷這次拖曳事件帶的是不是「從作業系統拖進來
// 的外部檔案」。瀏覽器拖曳外部檔案時，e.dataTransfer.types 會包含
// 'Files'；上面既有的兩套頁面內部拖放功能（清單重新排序、裝備看板）
// 用的是 setData('text/plain', ...)，types 裡不會有 'Files'。用這個
// 分辨兩者，避免這次新增的全域監聽器把既有的內部拖放誤判成外部檔案、
// 彼此互相干擾——這兩套原本运作正常的功能，不應該被這次新增的東西
// 連帶影響。
function isExternalFileDrag(e){
  return !!(e.dataTransfer&&e.dataTransfer.types&&Array.from(e.dataTransfer.types).includes('Files'));
}
const globalDropzoneEl=document.getElementById('global-dropzone');
window.addEventListener('dragenter',e=>{
  if(!isExternalFileDrag(e)) return;
  e.preventDefault();
  globalDropCounter++;
  globalDropzoneEl.hidden=false;
  requestAnimationFrame(()=>globalDropzoneEl.classList.add('is-active'));
});
window.addEventListener('dragover',e=>{
  if(!isExternalFileDrag(e)) return;
  e.preventDefault(); // 必須擋掉預設行為，否則瀏覽器會直接把檔案開成新分頁
});
window.addEventListener('dragleave',e=>{
  if(!isExternalFileDrag(e)) return;
  // 用計數器而不是單純「離開了就關閉」，是因為拖曳滑鼠移動到子元素
  // 上方時，瀏覽器也會對外層元素觸發一次 dragleave——如果不用計數器
  // 判斷「真的完全離開了整個視窗」，拖曳提示層會在滑鼠移動時瘋狂
  // 閃爍。
  globalDropCounter=Math.max(0,globalDropCounter-1);
  if(globalDropCounter===0){
    globalDropzoneEl.classList.remove('is-active');
    setTimeout(()=>{ if(globalDropCounter===0) globalDropzoneEl.hidden=true; },150);
  }
});
window.addEventListener('drop',async e=>{
  if(!isExternalFileDrag(e)) return;
  e.preventDefault();
  globalDropCounter=0;
  globalDropzoneEl.classList.remove('is-active');
  globalDropzoneEl.hidden=true;
  const files=Array.from(e.dataTransfer.files||[]);
  if(files.length) await runAsyncAction(routeDroppedFiles(files),'拖放匯入');
});
// routeDroppedFiles(files)：依副檔名分組，各自呼叫既有的匯入函式。
// JSON、GPX／TCX／FIT 這兩類是「一次匯入一份」的操作，同一批拖進來
// 的檔案裡如果剛好有好幾個同類型的，只處理排在最前面的那個，不會
// 每個都各自跳出一次確認彈窗；圖片則是唯一支援一次匯入多張的類型
// （交給 importImageFiles 自己決定要走封面照還是空間記憶迴廊）。
// 依序 await、不是平行處理，因為 JSON／GPX 匯入都可能修改
// currentRace／state.races，平行處理容易互相干擾。
async function routeDroppedFiles(files){
  const extOf=name=>(name.split('.').pop()||'').toLowerCase();
  const jsonFiles=files.filter(f=>extOf(f.name)==='json');
  const activityFiles=files.filter(f=>['gpx','tcx','fit'].includes(extOf(f.name)));
  const imageFiles=files.filter(f=>['jpg','jpeg','png','heic','heif','webp','tif','tiff'].includes(extOf(f.name))||/^image\//.test(f.type||''));
  const recognizedCount=jsonFiles.length+activityFiles.length+imageFiles.length;
  const unknownCount=files.length-recognizedCount;
  if(jsonFiles.length) await importJsonFile(jsonFiles[0]);
  if(activityFiles.length) await importActivityFile(activityFiles[0]);
  if(imageFiles.length) await importImageFiles(imageFiles);
  if(unknownCount>0){
    showToast(t('ui.dropzoneUnsupportedFiles','{n} 個檔案格式不支援，已略過').replace('{n}',unknownCount),'error');
  }
  if(recognizedCount>0) logFeatureUse('global_drop_import');
}

document.addEventListener('keydown',e=>{
  if(e.key!=='Escape') return;
  // 抽屜排在一般彈窗前面處理：抽屜是後開的、疊在最上層，Esc 應該

  const hof=document.getElementById('hof-overlay');

      const closeBtn=el.querySelector('[data-action^="close-"]');

      return;
    }
  }
});

const CMDK_ACTIONS=[
  {id:'toggle-theme',icon:'🌓',labelKey:'ui.cmdkToggleTheme',labelFallback:'切換深色模式',keywords:'dark light theme 深色 淺色 主題',run:()=>document.getElementById('btn-theme-toggle').click()},

  {id:'manage-shoes',icon:'👟',labelKey:'ui.cmdkManageShoes',labelFallback:'管理鞋款',keywords:'shoe shoes 戰靴 鞋櫃',run:()=>openShoeModal()},

  {id:'open-profile',icon:'🙋',labelKey:'ui.cmdkOpenProfile',labelFallback:'建立個人資訊',keywords:'profile heart rate 心率 個人資訊',run:()=>openProfileModal()},
  {id:'export-json',icon:'💾',labelKey:'ui.cmdkExportJson',labelFallback:'匯出 JSON',keywords:'export backup json 備份',run:()=>document.getElementById('btn-export').click()},
  {id:'export-csv',icon:'📊',labelKey:'ui.cmdkExportCsv',labelFallback:'匯出 CSV（扁平化）',keywords:'export csv excel',run:()=>document.getElementById('btn-export-csv').click()},
  {id:'sample-data',icon:'🧪',labelKey:'ui.cmdkSampleData',labelFallback:'範例資料',keywords:'sample demo example 示範',run:()=>document.getElementById('btn-sample-data').click()},
  {id:'hall-of-fame',icon:'🏆',labelKey:'ui.cmdkHallOfFame',labelFallback:'生涯回顧',keywords:'wrap hall of fame career review 回顧 生涯',available:()=>state.races.filter(r=>r.status==='completed'&&!r.deletedAt).length>0,run:()=>openHallOfFame()},
  {id:'story-mode',icon:'📸',labelKey:'ui.cmdkStoryMode',labelFallback:'年度回顧相片輪播',keywords:'story year in review 年度 回顧 相片 輪播',available:()=>mostRecentStoryModeYear()!==null,run:()=>openStoryMode(mostRecentStoryModeYear())},

];
const CMDK_QUICK_FILTERS=[
  {key:'pb',labelKey:'ui.cmdkFilterPb',labelFallback:'個人最佳 (PB)',match:r=>r.results&&r.results.isPb},
  {key:'dnf',labelKey:'ui.cmdkFilterDnf',labelFallback:'未完賽 (DNF)',match:r=>r.status==='dnf'},
  {key:'dns',labelKey:'ui.cmdkFilterDns',labelFallback:'未起跑 (DNS)',match:r=>r.status==='dns'},
  {key:'upcoming',labelKey:'ui.cmdkFilterUpcoming',labelFallback:'即將到來',match:r=>isUpcomingRace(r,todayISO())},
];
function cmdkComputeResults(query){
  const trimmed=query.trim();
  if(trimmed.startsWith('>')){
    const q=trimmed.slice(1).trim().toLowerCase();
    return CMDK_ACTIONS.filter(a=>!a.available||a.available())
      .filter(a=>!q||`${t(a.labelKey,a.labelFallback)} ${a.keywords}`.toLowerCase().includes(q))
      .map(a=>({type:'action',icon:a.icon,label:t(a.labelKey,a.labelFallback),action:a}));
  }
  if(trimmed.startsWith('#')){
    const rest=trimmed.slice(1).trim();
    const q=rest.toLowerCase();
    const filter=CMDK_QUICK_FILTERS.find(f=>q.indexOf(f.key)===0);
    if(!filter){
      return CMDK_QUICK_FILTERS.filter(f=>!q||f.key.includes(q)).map(f=>({type:'filter-hint',icon:'#',label:t(f.labelKey,f.labelFallback),filter:f}));
    }
    const matches=state.races.filter(r=>!r.deletedAt&&filter.match(r));
    return matches.map(r=>({type:'race',icon:'🏁',label:r.name||t('ui.unnamedRace','(未命名賽事)'),meta:r.schedule.raceDate||'',race:r}));
  }
  const q=trimmed.toLowerCase();
  if(!q) return [];
  const matches=state.races.filter(r=>{
    if(r.deletedAt) return false;
    const hay=`${r.name} ${r.alias} ${(r.location&&r.location.city)||''}`.toLowerCase();
    return hay.includes(q);
  }).slice(0,20);
  return matches.map(r=>({type:'race',icon:'🏁',label:r.name||t('ui.unnamedRace','(未命名賽事)'),meta:r.schedule.raceDate||'',race:r}));
}
function cmdkRenderResults(results){
  const container=document.getElementById('cmdk-results');
  if(!results.length){
    container.innerHTML=`<div class="cmdk-empty">${t('ui.cmdkNoResults','沒有符合的結果')}</div>`;
    cmdkSelectedIndex=-1;
    return;
  }
  cmdkSelectedIndex=0;
  container.innerHTML=results.map((r,i)=>`<div class="cmdk-row${i===0?' active':''}" data-index="${i}">
    <span class="cmdk-row-icon">${r.icon}</span>
    <span class="cmdk-row-label">${escapeHtml(r.label)}</span>
    ${r.meta?`<span class="cmdk-row-meta mono">${escapeHtml(r.meta)}</span>`:''}
  </div>`).join('');
}
let cmdkResults=[];
let cmdkSelectedIndex=-1;
function cmdkOpen(){
  document.getElementById('command-palette').hidden=false;
  const input=document.getElementById('cmdk-input');
  input.value='';
  cmdkResults=[];
  document.getElementById('cmdk-results').innerHTML='';
  input.focus();
}
function cmdkClose(){
  document.getElementById('command-palette').hidden=true;
}
/* cmdkOpenWith(text)：帶著已經打好的字開面板，並立刻算出結果。 */
function cmdkOpenWith(text){
  cmdkOpen();
  const input=document.getElementById('cmdk-input');
  input.value=text;
  cmdkResults=cmdkComputeResults(text);
  cmdkRenderResults(cmdkResults);
  // 游標放到最後，繼續打字才會接在後面
  try{ input.setSelectionRange(text.length,text.length); }catch(err){}
}
function cmdkUpdateActiveRow(){
  document.querySelectorAll('#cmdk-results .cmdk-row').forEach((row,i)=>{
    row.classList.toggle('active',i===cmdkSelectedIndex);
  });
  const activeRow=document.querySelector('#cmdk-results .cmdk-row.active');
  if(activeRow) activeRow.scrollIntoView({block:'nearest'});
}
function cmdkExecute(index){
  const item=cmdkResults[index];
  if(!item) return;
  if(item.type==='race'){
    cmdkClose();
    selectRace(item.race.id);
  }else if(item.type==='action'){
    cmdkClose();
    item.action.run();
  }else if(item.type==='filter-hint'){
    const input=document.getElementById('cmdk-input');
    input.value='#'+item.filter.key+' ';
    input.dispatchEvent(new Event('input',{bubbles:true}));
  }
}
document.getElementById('cmdk-input').addEventListener('input',e=>{
  cmdkResults=cmdkComputeResults(e.target.value);
  cmdkRenderResults(cmdkResults);
});
document.getElementById('cmdk-input').addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'){
    e.preventDefault();
    if(cmdkResults.length){ cmdkSelectedIndex=(cmdkSelectedIndex+1)%cmdkResults.length; cmdkUpdateActiveRow(); }
  }else if(e.key==='ArrowUp'){
    e.preventDefault();
    if(cmdkResults.length){ cmdkSelectedIndex=(cmdkSelectedIndex-1+cmdkResults.length)%cmdkResults.length; cmdkUpdateActiveRow(); }
  }else if(e.key==='Enter'){
    e.preventDefault();
    cmdkExecute(cmdkSelectedIndex);
  }
});
document.getElementById('cmdk-results').addEventListener('click',e=>{
  const row=e.target.closest('.cmdk-row');
  if(!row) return;
  cmdkExecute(Number(row.dataset.index));
});
document.addEventListener('keydown',e=>{
  const palette=document.getElementById('command-palette');
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){
    e.preventDefault();
    if(palette.hidden) cmdkOpen(); else cmdkClose();
    return;
  }
  if(e.key==='Escape'&&!palette.hidden){
    e.preventDefault();
    cmdkClose();
  }
});
/* ============================================================
   全域貼上匯入（Ctrl/Cmd+V）：截圖貼成封面照、貼一包 JSON 陣列整批
   匯入賽事、貼一個 JSON 物件快速填入目前開著的賽事——跟全域拖曳
   匯入是同一個精神，只是觸發方式從「拖曳檔案」換成「貼上剪貼簿」，
   實際負責匯入的邏輯（importCoverImageFile／importRacesArray／
   deepMergeInto）全部沿用既有、已經測過的那一套，這裡只負責「從
   剪貼簿事件裡拿到正確的資料、判斷該走哪一條路」，不是另外重寫
   一套平行的匯入邏輯。
   ============================================================ */
document.addEventListener('paste',async e=>{
  // 焦點防護（Focus Guard）：使用者正在某個輸入框、文字框、或任何
  // 可編輯區域打字的時候，Ctrl+V 應該乖乖交給瀏覽器處理正常的貼上
  // 行為，不能搶走——這是這個功能能不能安全共存的關鍵前提。沒有
  // 這道防護，在「檢討筆記」裡貼一段普通文字會被誤判成要匯入賽事
  // 資料。
  const active=document.activeElement;
  const isInputTarget=active&&(active.tagName==='INPUT'||active.tagName==='TEXTAREA'||active.isContentEditable);
  if(isInputTarget) return;

  const items=e.clipboardData&&e.clipboardData.items;
  if(!items) return;

  // 優先順序：圖片 > 文字（JSON 陣列／物件）。剪貼簿裡混合圖文的
  // 情況比較少見（例如整段複製一個網頁區塊），圖片通常是使用者
  // 明確想貼的東西（截圖），優先處理，找到就不再檢查文字內容。
  for(const item of items){
    if(item.type.indexOf('image')===0){
      e.preventDefault();
      const file=item.getAsFile();
      if(file){
        await importCoverImageFile(file);
        showToast(t('ui.pasteImageApplied','已將剪貼簿裡的圖片設為封面照'));
      }
      logFeatureUse('global_paste_image');
      return;
    }
  }

  const text=e.clipboardData.getData('text');
  if(!text||!text.trim()) return;
  let parsed;
  try{
    parsed=JSON.parse(text);
  }catch(err){
    return; // 不是 JSON，代表只是一般文字，不攔截，讓貼上照常發生
  }
  if(typeof parsed!=='object'||parsed===null) return;

  e.preventDefault();
  if(Array.isArray(parsed)){
    // 判斷這個陣列是「賽事清單」還是「鞋款訓練里程更新」：每一項都
    // 有 name／trainingKm，但沒有賽事才會有的 schedule／sportType
    // 欄位，就當作是鞋款更新，不是走賽事匯入那一條路。
    const looksLikeShoeUpdate=parsed.length>0&&parsed.every(item=>item&&typeof item==='object'&&item.name!=null&&item.trainingKm!=null&&item.schedule==null&&item.sportType==null);
    if(looksLikeShoeUpdate){
      if(importShoeTrainingKm(parsed)) logFeatureUse('global_paste_shoe_training');
    }else if(importRacesArray(parsed)) logFeatureUse('global_paste_json_array');
  }else if(currentRace){
    delete parsed.id;delete parsed.createdAt;
    deepMergeInto(currentRace,parsed);
    currentRace.updatedAt=new Date().toISOString();
    persist();renderCalendar();renderDetail();
    showToast(t('ui.pasteQuickFillApplied','已把貼上的資料套用到目前這場賽事'));
    logFeatureUse('global_paste_json_quickfill');
  }else{
    showToast(t('ui.pasteNoRaceContext','請先開啟一場賽事的詳情頁，或點「新增賽事」，才能貼上資料快速填入'),'error');
  }
});
/* ============================================================
   鎖定畫面縮放（像原生 App 那樣不會跟著手指放大縮小）
   viewport 的 user-scalable=no 只有 Android 會遵守——iOS 從 10 開始
   就刻意忽略它（為了無障礙），所以在 iPhone 上一定要用 JS 攔截手勢
   才會真的鎖住。兩邊都做，各自負責自己的平台。
   攔的是 WebKit 專屬的 gesture 事件（雙指縮放）跟連點兩下放大，
   不是所有觸控事件——單指捲動、既有的滑動完賽／刪除、海拔圖的
   拖曳游標、裝備看板的拖放都不受影響，因為那些都是單指操作。
   ============================================================ */
['gesturestart','gesturechange','gestureend'].forEach(type=>{
  document.addEventListener(type,e=>{ e.preventDefault(); },{passive:false});
});
// 連點兩下放大：只在「兩次點擊間隔很短」時擋掉，一般的連續點擊
// （例如快速點兩個不同按鈕）不受影響。
let lastTouchEndAt=0;
document.addEventListener('touchend',e=>{
  const now=Date.now();
  if(now-lastTouchEndAt<=300) e.preventDefault();
  lastTouchEndAt=now;
},{passive:false});
// 桌機的 Ctrl/⌘＋滾輪縮放刻意不攔（v3.33.0 拿掉原本的攔截）：那是瀏覽器
// 層級的縮放，等同無障礙功能，使用者要看大一點是他的權利。手機鎖的是
// 「像原生 App」的觸控體驗，兩者不是同一件事，不必為了行為一致犧牲桌機。
/* ============================================================
   空間景深：有彈出層打開時，替 body 掛上 overlay-open，讓主內容退後
   失焦（實際效果見 #main-content 那段 CSS）。
   用 MutationObserver 監看各個彈出層的 hidden 屬性，而不是去每個
   開關函式裡各加一行——這個 App 的彈出層有十幾個、開關的進入點散在
   很多地方（按鈕、指令控制台、鍵盤快捷鍵、拖放），逐一掛鉤只要漏掉
   一個，就會出現「關掉視窗但背景還糊著」這種很難查的殘留狀態。
   監看 DOM 的實際狀態就不會有漏網之魚。
   全螢幕不透明的那幾層（動態回顧、生涯回顧、疲勞模式）刻意不列入：
   它們本來就完全蓋住畫面，底下再做模糊只是白做工，看不到。
   ============================================================ */
const DEPTH_OVERLAY_SELECTOR='.modal-overlay,.drawer-overlay,.cmdk-overlay';
function syncOverlayDepth(){
  const anyOpen=[...document.querySelectorAll(DEPTH_OVERLAY_SELECTOR)].some(el=>!el.hidden);
  document.body.classList.toggle('overlay-open',anyOpen);
}
(function watchOverlayDepth(){
  const obs=new MutationObserver(syncOverlayDepth);
  document.querySelectorAll(DEPTH_OVERLAY_SELECTOR).forEach(el=>{
    obs.observe(el,{attributes:true,attributeFilter:['hidden']});
  });
  syncOverlayDepth();
})();
init();
</script>

    storageBucket: "race-day-6da0b.firebasestorage.app",
    messagingSenderId: "1095751046156",
    appId: "1:1095751046156:web:73d0556cf529516f874a29"
  };
  // TODO：Firebase Console → 專案設定 → Cloud Messaging → Web Push 憑證 → 產生金鑰組，把公開金鑰貼在這裡
  const VAPID_KEY = "YOUR_VAPID_KEY";

  const isConfigured = firebaseConfig.apiKey !== "YOUR_API_KEY";

  let app=null, auth=null, db=null;
  if(isConfigured){
    try{
      app=initializeApp(firebaseConfig);
      auth=getAuth(app);
      db=getFirestore(app);
    }catch(err){
      console.warn('Firebase 初始化失敗，雲端同步停用',err);
    }
  }

  function racesCol(uid){ return collection(db,'users',uid,'races'); }

  window.__cloud={
    enabled: !!(app&&auth&&db),
    notificationsConfigured: VAPID_KEY!=='YOUR_VAPID_KEY',
    async signIn(){
      await signInWithPopup(auth, new GoogleAuthProvider());
    },
    async signOutUser(){
      await signOut(auth);
    },
    onAuthChange(cb){
      onAuthStateChanged(auth, cb);
    },
    async fetchAll(uid){
      const snap=await getDocs(racesCol(uid));
      return snap.docs.map(d=>d.data());
    },
    async replaceAll(uid, races){
      const snap=await getDocs(racesCol(uid));
      const batch=writeBatch(db);
      const keepIds=new Set(races.map(r=>r.id));
      snap.docs.forEach(d=>{ if(!keepIds.has(d.id)) batch.delete(d.ref); });
      races.forEach(r=>batch.set(doc(racesCol(uid), r.id), r));
      await batch.commit();
    },
    // 鞋款、補給品資料庫這兩份清單是全域、跨賽事共用的資料，不像賽事
    // 那樣一場一份文件，資料量也小很多，直接整包存成 users/{uid}/meta/globalLists
    // 底下的單一文件，不用比照賽事那套「逐筆文件＋依 updatedAt 判斷
    // 誰比較新」的複雜合併機制。
    async fetchGlobalLists(uid){
      const snap=await getDoc(doc(db,'users',uid,'meta','globalLists'));
      return snap.exists()?snap.data():null;
    },
    // extras（個人資料、裝備範本、徽章解鎖）刻意存進同一份 globalLists
    // 文件，而不是各開一份：安全性規則已經涵蓋 meta/{docId}，不用改規則；
    // 資料量都很小；而且一次寫入就全部到齊，不會發生「範本寫成功、徽章
    // 寫失敗」這種各自半套的狀態。
    async syncGlobalLists(uid, shoes, nutritionDictionary, extras){
      await setDoc(doc(db,'users',uid,'meta','globalLists'), Object.assign({
        shoes, nutritionDictionary, updatedAt:new Date().toISOString(),
      }, extras||{}));
    },
    // 功能點擊次數統計：counts 是一次要送出的 {功能代號: 這次要加的次數}，
    // 用 increment() 讓 Firestore 在伺服器端做原子加總，不管多少個訪客
    // 同時點擊都不會互相覆蓋掉彼此的計數。不需要登入也能呼叫（規則裡
    // 這個文件的寫入是開放的），這樣才能統計到所有訪客，不只是登入的人。
    async logFeatureUse(counts){
      const updates={};
      Object.keys(counts).forEach(k=>{ updates[k]=increment(counts[k]); });
      await setDoc(doc(db,'analytics','featureCounts'), updates, {merge:true});
    },
    async enableNotifications(uid){
      if(VAPID_KEY==='YOUR_VAPID_KEY') throw new Error(t('ui.errVapidNotSet','尚未設定 VAPID 金鑰'));
      if(!('serviceWorker' in navigator)) throw new Error(t('ui.errNoServiceWorker','此瀏覽器不支援背景通知'));
      if(!('Notification' in window)) throw new Error(t('ui.errNoNotificationSupport','此瀏覽器不支援通知功能'));
      const permission=await Notification.requestPermission();
      if(permission!=='granted') throw new Error(t('ui.errPermissionDenied','未取得通知權限'));
      const registration=await navigator.serviceWorker.register('/firebase-messaging-sw.js');
      const messaging=getMessaging(app);
      const token=await getToken(messaging,{vapidKey:VAPID_KEY,serviceWorkerRegistration:registration});
      if(!token) throw new Error(t('ui.errNoToken','無法取得推播權杖'));
      await setDoc(doc(db,'users',uid,'fcmTokens',token),{token,createdAt:new Date().toISOString()});
      onMessage(messaging,(payload)=>{
        if(window.__onForegroundMessage) window.__onForegroundMessage(payload);
      });
      return token;
    }
  };

  window.dispatchEvent(new Event('cloud-ready'));
</script>
</body>
</html>
