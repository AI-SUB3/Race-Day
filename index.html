}


function computeCareerStats(){
  const completed=state.races.filter(r=>r.status==='completed'&&!r.deletedAt);
  const marathonPB=completed
    .filter(r=>r.route.distanceKm>=41&&r.route.distanceKm<=43.5&&r.results.chipTimeSeconds!=null)
    .reduce((min,r)=>(min==null||r.results.chipTimeSeconds<min)?r.results.chipTimeSeconds:min,null);
  const thisYear=String(new Date().getFullYear());
  const yearDistance=completed
    .filter(r=>r.schedule.raceDate&&r.schedule.raceDate.startsWith(thisYear))
    .reduce((sum,r)=>sum+(r.route.distanceKm||0),0);
  const totalElevationM=completed.reduce((sum,r)=>sum+(r.route.elevationGainM||0),0);
  return {totalCompleted:completed.length,marathonPB,yearDistance,totalElevationM};
}
const CAREER_FLAG_ICON=`<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 2v16"/><path d="M4 3h9l-2 2.5L13 8H4"/></svg>`;
const CAREER_TROPHY_ICON=`<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h8v4a4 4 0 0 1-8 0V3z"/><path d="M6 4H3.5a1 1 0 0 0-1 1.2c.3 1.6 1.3 3 3 3.4M14 4h2.5a1 1 0 0 1 1 1.2c-.3 1.6-1.3 3-3 3.4"/><path d="M10 11v3M7 17h6M8 14h4v3H8z"/></svg>`;
const CAREER_ROUTE_ICON=`<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 15l4-8 3 4 3-6 3 5 3-3"/></svg>`;
const CAREER_MOUNTAIN_ICON=`<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 16L7.5 6l3 4.5L14 5l4 11H2z"/></svg>`;
function computeYearlyStats(){
  const byYear={};
  state.races.forEach(r=>{
    if(r.deletedAt||r.status!=='completed'||!r.schedule.raceDate) return;
    const year=r.schedule.raceDate.slice(0,4);
    if(!byYear[year]) byYear[year]={count:0,distanceKm:0};
    byYear[year].count++;
    byYear[year].distanceKm+=(r.route.distanceKm||0);
  });
  return Object.keys(byYear).sort().map(year=>({year,count:byYear[year].count,distanceKm:byYear[year].distanceKm}));
}
function yearlyChartSvg(){
  const data=computeYearlyStats();
  if(data.length<1) return '';
  const barW=38,gap=22,padTop=26,padBottom=22,chartH=90;
  const w=data.length*barW+(data.length+1)*gap;
  const h=padTop+chartH+padBottom;
  const maxCount=Math.max(...data.map(d=>d.count),1);
  const bars=data.map((d,i)=>{
    const barH=Math.max(4,Math.round((d.count/maxCount)*chartH));
    const x=gap+i*(barW+gap);
    const y=padTop+chartH-barH;
    return `<text x="${x+barW/2}" y="${y-8}" text-anchor="middle" class="yearly-chart-count mono">${d.count}</text>
      <rect x="${x}" y="${y}" width="${barW}" height="${barH}" rx="3" fill="var(--trail)" opacity="0.82"/>
      <text x="${x+barW/2}" y="${padTop+chartH+18}" text-anchor="middle" class="yearly-chart-year mono">${d.year}</text>`;
  }).join('');
  return `<div class="yearly-chart-wrap">
    <div class="yearly-chart-title small">${t('ui.yearlyChartTitle','歷年完賽場次')}</div>
    <svg viewBox="0 0 ${w} ${h}" class="yearly-chart-svg" preserveAspectRatio="xMinYMid meet">${bars}</svg>
  </div>`;
}
/* ============================================================
   備戰釘選（Focus Mode）
   距離某場賽前狀態的賽事不到 14 天時，在主畫面最上方獨立顯示
   裝備打包進度／配速策略／天氣預報，省去在清單裡找的步驟。
   ============================================================ */
/* ============================================================
   即時天氣（Open-Meteo，免費、免金鑰、支援瀏覽器端直接呼叫）
   只有賽事已經匯入 GPS 軌跡（route.trackPoints，透過 GPX/TCX 匯入）
   且距離開賽 7 天以內時才提供，用軌跡的第一個點當作查詢座標。
   抓回來的資料存在賽事自己身上（liveForecast），避免每次打開備戰
   釘選面板都重新打一次 API；使用者可以手動按「重新整理」強制更新。
   ============================================================ */
const OPEN_METEO_STALE_MS=3*60*60*1000; // 3 小時內的快取視為新鮮，不主動重新抓
let weatherFetchingRaceId=null;
let weatherFetchError='';
function raceHasGpsTrack(race){
  return !!(race.route.trackPoints&&race.route.trackPoints.length>0);
}
function raceWithinLiveForecastWindow(race){
  if(!race.schedule.raceDate) return false;
  const days=Math.round((new Date(race.schedule.raceDate+'T00:00:00')-new Date(todayISO()+'T00:00:00'))/86400000);
  return days>=0&&days<=7;
}
async function fetchLiveWeatherForRace(raceId){
  const race=state.races.find(r=>r.id===raceId);
  if(!race||!raceHasGpsTrack(race)||!race.schedule.raceDate) return;
  const pt=race.route.trackPoints[0];
  weatherFetchingRaceId=raceId;
  weatherFetchError='';
  renderFocusPanel();
  try{
    const url=`https://api.open-meteo.com/v1/forecast?latitude=${pt.lat}&longitude=${pt.lon}&hourly=temperature_2m,precipitation_probability,wind_gusts_10m&timezone=auto&start_date=${race.schedule.raceDate}&end_date=${race.schedule.raceDate}`;
    const res=await fetch(url);
    if(!res.ok) throw new Error('HTTP '+res.status);
    const data=await res.json();
    if(!data.hourly||!data.hourly.time||!data.hourly.time.length){
      throw new Error(t('ui.weatherErrorNoData','這個座標與日期沒有查到預報資料'));
    }
    race.liveForecast={
      fetchedAt:new Date().toISOString(),
      times:data.hourly.time,
      temp:data.hourly.temperature_2m,
      precipProb:data.hourly.precipitation_probability,
      gust:data.hourly.wind_gusts_10m,
    };
    await persist();
    logFeatureUse('weather_live_fetch');
  }catch(err){
    console.error('抓取即時天氣失敗',err);
    weatherFetchError=t('ui.weatherFetchError','抓取即時天氣失敗，請確認網路連線後再試一次。');
  }
  weatherFetchingRaceId=null;
  renderFocusPanel();
}
function liveForecastCompactHtml(live,race){
  const idx=findClosestHourIndex(live.times,race.schedule.startTime);
  const temp=live.temp[idx],precip=live.precipProb[idx],gust=live.gust[idx];
  const minsAgo=Math.max(0,Math.round((Date.now()-new Date(live.fetchedAt).getTime())/60000));
  return `<div class="focus-weather-row mono">
      ${temp!=null?`<span>${temp}°C</span>`:''}
      ${precip!=null?`<span>${t('ui.weatherPrecipProb','降雨機率')} ${precip}%</span>`:''}
      ${gust!=null?`<span>${t('ui.weatherGust','陣風')} ${gust}km/h</span>`:''}
    </div>
    <p class="focus-weather-live-note small">${tf('ui.weatherLiveNote','即時預報，{n} 分鐘前更新',minsAgo)}</p>`;
}
/* ============================================================
   歷史天氣自動回填：賽事日期已經過去、已經匯入 GPS 軌跡、但還沒抓過
   歷史天氣資料時，打開這場賽事的詳情頁會自動在背景查詢當天實際發生
   過的天氣。這裡刻意用 Open-Meteo 的「歷史氣象回溯資料庫」端點
   （archive-api.open-meteo.com），跟即時預報用的預報端點不是同一個：
   預報端點回傳的是「降雨機率」這種只有對未來才有意義的統計值，歷史
   資料庫回傳的則是「實際降雨量」這種已經發生過的量測／回算數值，
   概念上不一樣，不能直接照抄即時預報那組參數名稱。抓到之後永久
   快取（歷史資料不會變，不像即時預報有時效性，不需要重新整理）。
   只有在「打開這場賽事的詳情頁」時才會觸發一次查詢，不會一次把
   所有歷史賽事都打過去，靠使用者一次只能看一場賽事這件事本身
   自然節流，不用額外寫節流邏輯。
   ============================================================ */
let historicalWeatherFetchingRaceId=null;
function raceIsHistorical(race){
  if(!race.schedule.raceDate) return false;
  return race.schedule.raceDate<todayISO();
}
// 這次分頁工作階段裡已經嘗試過的賽事 id（不論成功或失敗）；如果只用
// 「還沒抓到資料」當成觸發條件，抓取失敗時 historicalWeatherFetchingRaceId
// 會被重設回 null 並觸發重新渲染，而重新渲染又會看到「還沒抓到資料、
// 現在也沒有在抓取中」而立刻再次觸發抓取，形成抓取失敗→重新渲染→再次
// 觸發抓取的無限迴圈，會對免費 API 發送大量不必要的請求。加上這個
// session 層級的集合，同一次瀏覽階段裡每場賽事最多只會真正嘗試一次；
// 重新整理頁面（開新的一次 session）才會再給一次機會。
const historicalWeatherAttempted=new Set();
function findClosestHourIndex(times,startTime){
  const targetHour=parseInt((startTime||'08:00').split(':')[0],10)||8;
  let idx=0,bestDiff=Infinity;
  times.forEach((tm,i)=>{
    const hour=parseInt(tm.slice(11,13),10);
    const diff=Math.abs(hour-targetHour);
    if(diff<bestDiff){ bestDiff=diff; idx=i; }
  });
  return idx;
}
// 把已經抓到的歷史天氣資料，回填進「實際體感溫度」「當日濕度」這兩個
// 手動欄位（只填還是空的、不覆蓋已經填過的值）。獨立成一個函式、不是
// 寫死在抓取成功的當下才執行，是因為這個功能是後來加上去的：在還沒有
// 這段回填邏輯之前就已經抓過、快取起來的舊資料，不會因為升級後重新
// 觸發一次抓取而得到回填（快取還在，不會重新抓），如果只在「剛抓到
// 資料的那一刻」才回填，這種已經快取好的舊資料就永遠不會被回填、卡片
// 卻仍然聲稱「已自動帶入」，變成文字說有做、實際上沒做。改成每次渲染
// 賽事詳情頁、只要有快取資料就檢查一次要不要回填，不管這份快取是剛
// 抓的還是很久以前就抓好的，回傳有沒有實際改到東西，讓呼叫的地方決定
// 要不要接著存檔，不會每次渲染都白白多寫一次。
// 把風向角度（0~360，氣象學慣例：風「從」哪個方向吹來）轉成中文常見的
// 16 方位風向文字（例如「東北風」），角度每 22.5 度一格。
function degreesToCompassWindLabel(deg){
  if(deg==null) return null;
  const dirs=['北','北北東','東北','東北東','東','東南東','東南','南南東','南','南南西','西南','西南西','西','西北西','西北','北北西'];
  const idx=Math.round((((deg%360)+360)%360)/22.5)%16;
  return dirs[idx]+'風';
}
function applyHistoricalWeatherAutofill(race){
  const hw=race.historicalWeather;
  if(!hw||!hw.times||!hw.times.length) return false;
  let changed=false;
  const idx=findClosestHourIndex(hw.times,race.schedule.startTime);
  if(race.raceDayWeather.feelsLikeTempC==null&&hw.feelsLike&&hw.feelsLike[idx]!=null){
    race.raceDayWeather.feelsLikeTempC=Math.round(hw.feelsLike[idx]*10)/10;
    changed=true;
  }
  if(race.raceDayWeather.humidityPct==null&&hw.humidity&&hw.humidity[idx]!=null){
    race.raceDayWeather.humidityPct=Math.round(hw.humidity[idx]);
    changed=true;
  }
  if(race.climateForecast.windSpeedKmh==null&&hw.windSpeed&&hw.windSpeed[idx]!=null){
    race.climateForecast.windSpeedKmh=Math.round(hw.windSpeed[idx]*10)/10;
    changed=true;
  }
  if(!race.climateForecast.windDirection&&hw.windDirection&&hw.windDirection[idx]!=null){
    const label=degreesToCompassWindLabel(hw.windDirection[idx]);
    if(label){ race.climateForecast.windDirection=label; changed=true; }
  }
  // 當天資料如果有查到降雨量（大於 0），代表那個時段確實下過雨，直接把
  // 「降雨機率」填 100%、「當日氣候狀況」選「雨」——這是已經發生過的事，
  // 不是預測，用二選一的「有下雨／沒下雨」直接對應到機率的兩個極端，
  // 是使用者明確要求的簡化規則，跟其他欄位維持保守、不亂猜的原則不同。
  const precipAtIdx=hw.precip&&hw.precip[idx];
  if(precipAtIdx!=null&&precipAtIdx>0){
    if(race.climateForecast.rainProbabilityPct==null){
      race.climateForecast.rainProbabilityPct=100;
      changed=true;
    }
    if(!race.raceDayWeather.condition){
      race.raceDayWeather.condition='rainy';
      changed=true;
    }
  }
  return changed;
}
async function fetchHistoricalWeatherForRace(raceId){
  const race=state.races.find(r=>r.id===raceId);
  if(!race||!raceHasGpsTrack(race)||!race.schedule.raceDate) return;
  if(historicalWeatherAttempted.has(raceId)) return;
  historicalWeatherAttempted.add(raceId);
  const pt=race.route.trackPoints[0];
  historicalWeatherFetchingRaceId=raceId;
  if(currentRace&&currentRace.id===raceId) renderDetail();
  try{
    const url=`https://archive-api.open-meteo.com/v1/archive?latitude=${pt.lat}&longitude=${pt.lon}&hourly=temperature_2m,apparent_temperature,relative_humidity_2m,precipitation,wind_gusts_10m,wind_speed_10m,wind_direction_10m&timezone=auto&start_date=${race.schedule.raceDate}&end_date=${race.schedule.raceDate}`;
    const res=await fetch(url);
    if(!res.ok) throw new Error('HTTP '+res.status);
    const data=await res.json();
    if(!data.hourly||!data.hourly.time||!data.hourly.time.length){
      throw new Error('這個座標與日期沒有查到歷史天氣資料');
    }
    race.historicalWeather={
      fetchedAt:new Date().toISOString(),
      times:data.hourly.time,
      temp:data.hourly.temperature_2m,
      feelsLike:data.hourly.apparent_temperature,
      humidity:data.hourly.relative_humidity_2m,
      precip:data.hourly.precipitation,
      gust:data.hourly.wind_gusts_10m,
      windSpeed:data.hourly.wind_speed_10m,
      windDirection:data.hourly.wind_direction_10m,
    };
    applyHistoricalWeatherAutofill(race);
    await persist();
  }catch(err){
    console.error('抓取歷史天氣失敗',err);
    // 歷史天氣是背景自動補的加分資訊，失敗了就默默放棄，不跳錯誤訊息
    // 打擾使用者；這次瀏覽階段不會再自動重試，下次重新整理頁面才會。
  }
  historicalWeatherFetchingRaceId=null;
  if(currentRace&&currentRace.id===raceId) renderDetail();
}
/* ============================================================
   海象自動回填（開放水域用）：跟上面「賽事當天實際天氣」是同一種
   「打開賽事詳情頁時在背景查一次、查到就永久快取」的設計，只是資料
   來源換成 Open-Meteo 的「海洋氣象」端點（marine-api.open-meteo.com），
   而且限定三鐵、游泳這兩種有開放水域游泳段的運動種類——路跑、自行車
   等賽事不會有這段落海裡的經歷，抓了也用不到，白白浪費一次 API 請求。
   這個端點跟歷史天氣那個「預報／回溯資料庫分屬兩個不同網域」不一樣，
   同一個端點本身就同時支援未來預報跟過去日期查詢（帶 start_date／
   end_date 參數即可），不用像歷史天氣那樣額外判斷要打哪一個網域。
   海洋氣象模型只在實際海面上的座標網格才有資料，起點如果落在陸地上
   （例如量測 GPS 起點剛好在岸邊、還沒真正下水那一刻），查詢會全部
   回傳 null——這是模型本身的限制，不是查詢寫錯，遇到這種情況直接
   當作查無資料處理，不特別區分是哪種原因。
   ============================================================ */
function raceIsOpenWaterEligible(race){
  return (race.sportType==='triathlon'||race.sportType==='swimming')&&raceHasGpsTrack(race);
}
let marineWeatherFetchingRaceId=null;
const marineWeatherAttempted=new Set();
function applyMarineConditionsAutofill(race){
  const mw=race.marineWeather;
  if(!mw||!mw.times||!mw.times.length) return false;
  const mc=race.raceDayWeather.marineConditions;
  if(!mc) return false;
  let changed=false;
  const idx=findClosestHourIndex(mw.times,race.schedule.startTime);
  if(mc.waveHeightM==null&&mw.waveHeight&&mw.waveHeight[idx]!=null){
    mc.waveHeightM=Math.round(mw.waveHeight[idx]*10)/10;
    changed=true;
  }
  if(mc.swellPeriodSeconds==null&&mw.swellPeriod&&mw.swellPeriod[idx]!=null){
    mc.swellPeriodSeconds=Math.round(mw.swellPeriod[idx]*10)/10;
    changed=true;
  }
  if(mc.waterTempC==null&&mw.waterTemp&&mw.waterTemp[idx]!=null){
    mc.waterTempC=Math.round(mw.waterTemp[idx]*10)/10;
    changed=true;
  }
  return changed;
}
async function fetchMarineConditionsForRace(raceId){
  const race=state.races.find(r=>r.id===raceId);
  if(!race||!raceIsOpenWaterEligible(race)||!race.schedule.raceDate) return;
  if(marineWeatherAttempted.has(raceId)) return;
  marineWeatherAttempted.add(raceId);
  const pt=race.route.trackPoints[0];
  marineWeatherFetchingRaceId=raceId;
  if(currentRace&&currentRace.id===raceId) renderDetail();
  try{
    const url=`https://marine-api.open-meteo.com/v1/marine?latitude=${pt.lat}&longitude=${pt.lon}&hourly=wave_height,swell_wave_period,sea_surface_temperature&timezone=auto&start_date=${race.schedule.raceDate}&end_date=${race.schedule.raceDate}`;
    const res=await fetch(url);
    if(!res.ok) throw new Error('HTTP '+res.status);
    const data=await res.json();
    if(!data.hourly||!data.hourly.time||!data.hourly.time.length){
      throw new Error('這個座標與日期沒有查到海象資料');
    }
    race.marineWeather={
      fetchedAt:new Date().toISOString(),
      times:data.hourly.time,
      waveHeight:data.hourly.wave_height,
      swellPeriod:data.hourly.swell_wave_period,
      waterTemp:data.hourly.sea_surface_temperature,
    };
    applyMarineConditionsAutofill(race);
    await persist();
  }catch(err){
    console.error('抓取海象資料失敗',err);
    // 跟歷史天氣一樣：這是背景自動補的加分資訊，失敗了（包含起點座標
    // 落在陸地網格上查無資料的情況）就默默放棄，不跳錯誤訊息打擾
    // 使用者；這次瀏覽階段不會再自動重試，下次重新整理頁面才會。
  }
  marineWeatherFetchingRaceId=null;
  if(currentRace&&currentRace.id===raceId) renderDetail();
}
function marineConditionsCompactHtml(race){
  const mc=race.raceDayWeather.marineConditions;
  if(!mc||(mc.waveHeightM==null&&mc.swellPeriodSeconds==null&&mc.waterTempC==null)) return '';
  const durationHours=race.results.chipTimeSeconds!=null?race.results.chipTimeSeconds/3600:null;
  const hypothermiaRisk=mc.waterTempC!=null&&mc.waterTempC<18&&durationHours!=null&&durationHours>2;
  return `<div class="historical-weather-block marine-conditions-block">
    <div class="historical-weather-title small">${t('ui.marineConditionsTitle','海象紀錄（自動查詢）')}</div>
    <div class="focus-weather-row mono">
      ${mc.waveHeightM!=null?`<span>${t('ui.marineWaveHeight','浪高')} ${mc.waveHeightM}m</span>`:''}
      ${mc.swellPeriodSeconds!=null?`<span>${t('ui.marineSwellPeriod','湧浪週期')} ${mc.swellPeriodSeconds}s</span>`:''}
      ${mc.waterTempC!=null?`<span>${t('ui.marineWaterTemp','海水溫度')} ${mc.waterTempC}°C</span>`:''}
    </div>
    ${hypothermiaRisk?`<p class="marine-hypothermia-warning small">❄️ ${t('ui.marineHypothermiaWarning','高失溫風險環境完賽：海水溫度低於 18°C，且完賽時間超過 2 小時')}</p>`:''}
    <p class="historical-weather-note small">${t('ui.marineConditionsSource','資料來源：Open-Meteo 海洋氣象資料庫')}</p>
  </div>`;
}
/* ============================================================
   「歷年平均氣溫／濕度」：跟上面「賽事當天實際天氣」是不同概念——
   那個是單一天的實際量測值，這個是同一個地點、同一個月日，往前
   五年（不含賽事當年，因為當年的實際值已經有單獨的卡片顯示）的
   歷史平均。Open-Meteo 的歷史查詢端點是「一段連續日期」的查詢，
   沒有「同一天橫跨多年」這種查詢方式，只能拆成 5 次個別查詢（每年
   一次，各自查同一個月日），5 次平行送出、用 allSettled 而不是
   all，任何一年查詢失敗都不影響其他年份，只要至少查到 1 年的資料
   就能算出平均，不用 5 年都成功才有結果。閏年 2/29 這種在部分年份
   根本不存在的日期，該年的查詢會自然失敗（當成那一年沒有資料處理），
   不特別用 2/28 去湊，畢竟兩者本來就是不同的一天。
   ============================================================ */
let historicalAverageFetchingRaceId=null;
const historicalAverageAttempted=new Set();
function isValidCalendarDateStr(dateStr){
  const d=new Date(dateStr+'T00:00:00Z');
  if(isNaN(d)) return false;
  const [y,m,day]=dateStr.split('-').map(Number);
  return d.getUTCFullYear()===y&&(d.getUTCMonth()+1)===m&&d.getUTCDate()===day;
}
async function fetchHistoricalAverageWeatherForRace(raceId){
  const race=state.races.find(r=>r.id===raceId);
  if(!race||!raceHasGpsTrack(race)||!race.schedule.raceDate) return;
  if(historicalAverageAttempted.has(raceId)) return;
  historicalAverageAttempted.add(raceId);
  const pt=race.route.trackPoints[0];
  const [raceYearStr,monthStr,dayStr]=race.schedule.raceDate.split('-');
  const raceYear=parseInt(raceYearStr,10);
  // 用 Date 建構子的「自動進位」特性反過來偵測無效日期：例如閏年才有
  // 的 2/29，套用到非閏年會被 JS 自動推移成 3/1，跟原本要求的月/日對
  // 不起來，代表那個年份根本沒有這一天，直接跳過、不送出這個年份的
  // 查詢（不會拿 2/28 去湊，畢竟是不同的一天，寧可平均少算一年）。
  const years=[];
  for(let i=1;i<=5;i++){
    const y=raceYear-i;
    const dateStr=`${y}-${monthStr}-${dayStr}`;
    if(isValidCalendarDateStr(dateStr)) years.push({year:y,dateStr});
  }
  if(!years.length){ historicalAverageFetchingRaceId=null; return; }
  historicalAverageFetchingRaceId=raceId;
  if(currentRace&&currentRace.id===raceId) renderDetail();
  try{
    const results=await Promise.allSettled(years.map(async ({year:y,dateStr})=>{
      const url=`https://archive-api.open-meteo.com/v1/archive?latitude=${pt.lat}&longitude=${pt.lon}&daily=temperature_2m_mean,relative_humidity_2m_mean&timezone=auto&start_date=${dateStr}&end_date=${dateStr}`;
      const res=await fetch(url);
      if(!res.ok) throw new Error('HTTP '+res.status);
      const data=await res.json();
      if(!data.daily||!data.daily.time||!data.daily.time.length) throw new Error('no data for '+y);
      return {
        year:y,
        temp:data.daily.temperature_2m_mean[0],
        humidity:data.daily.relative_humidity_2m_mean[0],
      };
    }));
    const succeeded=results.filter(r=>r.status==='fulfilled').map(r=>r.value)
      .filter(v=>v.temp!=null||v.humidity!=null);
    if(!succeeded.length) throw new Error('五個年份都沒有查到資料');
    const temps=succeeded.map(v=>v.temp).filter(v=>v!=null);
    const humidities=succeeded.map(v=>v.humidity).filter(v=>v!=null);
    race.historicalAverageWeather={
      fetchedAt:new Date().toISOString(),
      years:succeeded.map(v=>v.year),
      avgTempC:temps.length?Math.round((temps.reduce((a,b)=>a+b,0)/temps.length)*10)/10:null,
      avgHumidityPct:humidities.length?Math.round(humidities.reduce((a,b)=>a+b,0)/humidities.length):null,
    };
    if(race.climateForecast.avgTempC==null&&race.historicalAverageWeather.avgTempC!=null){

    if(race.climateForecast.avgHumidityPct==null&&race.historicalAverageWeather.avgHumidityPct!=null){

function computeFocusRace(){
  const todayStr=todayISO();
  const cutoff=new Date(todayStr+'T00:00:00');
  cutoff.setDate(cutoff.getDate()+14);
  const cutoffStr=cutoff.toISOString().slice(0,10);
  const candidates=state.races.filter(r=>
    !r.deletedAt&&
    ['registered','lottery_pending','considering'].includes(r.status)&&
    r.schedule.raceDate&&
    r.schedule.raceDate>=todayStr&&
    r.schedule.raceDate<=cutoffStr
  );
  if(!candidates.length) return null;
  candidates.sort((a,b)=>a.schedule.raceDate.localeCompare(b.schedule.raceDate));
  return candidates[0];
}
function progressRingSvg(pct){
  const size=64,strokeWidth=6,r=(size-strokeWidth)/2,cx=size/2,cy=size/2;

  return `<svg viewBox="0 0 ${size} ${size}" class="progress-ring" width="${size}" height="${size}">
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--rule)" stroke-width="${strokeWidth}"/>
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--trail)" stroke-width="${strokeWidth}"
      stroke-dasharray="${circumference.toFixed(2)}" stroke-dashoffset="${circumference.toFixed(2)}"
      stroke-linecap="round" transform="rotate(-90 ${cx} ${cy})"
      class="progress-ring-fill" data-target-offset="${targetOffset.toFixed(2)}"/>
  </svg>`;
}
function animateProgressRings(){
  const reduceMotion=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  document.querySelectorAll('.progress-ring-fill').forEach(el=>{
    const target=el.dataset.targetOffset;
    if(reduceMotion){ el.style.strokeDashoffset=target; return; }
    requestAnimationFrame(()=>{ requestAnimationFrame(()=>{ el.style.strokeDashoffset=target; }); });
  });
}

/* ============================================================
   備戰釘選的英雄倒數視差效果

   transform 位移寫法）。位移幅度有限制在背景圖預留的溢出範圍內，

function updateFocusHeroParallax(){
  const bg=document.getElementById('focus-hero-parallax');
  const hero=document.getElementById('focus-hero-bg');
  if(!bg||!hero) return;
  const rect=hero.getBoundingClientRect();
  if(rect.bottom<0||rect.top>window.innerHeight) return;
  const maxShift=rect.height*0.15;
  const offset=Math.max(-maxShift,Math.min(maxShift,rect.top*0.3));
  bg.style.transform=`translateY(${offset.toFixed(1)}px)`;
}
let focusHeroParallaxListenerAdded=false;
function setupFocusHeroParallax(){
  if(focusHeroParallaxListenerAdded) return;
  focusHeroParallaxListenerAdded=true;
  const reduceMotion=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduceMotion) return;
  let ticking=false;
  window.addEventListener('scroll',()=>{
    if(!ticking){
      requestAnimationFrame(()=>{ updateFocusHeroParallax(); ticking=false; });
      ticking=true;
    }
  },{passive:true});
}

function computeQuarterlyElevationStats(){
  const byQuarter={};
  state.races.forEach(r=>{
    if(r.deletedAt||r.status!=='completed'||!r.schedule.raceDate) return;
    const d=r.schedule.raceDate;
    const year=d.slice(0,4);
    const month=parseInt(d.slice(5,7),10);
    const q=Math.ceil(month/3);
    const key=year+'-Q'+q;
    if(!byQuarter[key]) byQuarter[key]={year,quarter:q,elevationM:0};
    byQuarter[key].elevationM+=(r.route.elevationGainM||0);
  });
  return Object.keys(byQuarter).sort().map(k=>byQuarter[k]);
}
function elevationTrendChartSvg(){
  const data=computeQuarterlyElevationStats();
  if(data.length<2) return '';
  const w=Math.max(320,data.length*56),h=110,pad=24,padBottom=22;
  const maxElev=Math.max(...data.map(d=>d.elevationM),1);
  const stepX=data.length>1?(w-2*pad)/(data.length-1):0;
  const sy=v=>h-padBottom-(v/maxElev)*(h-pad-padBottom);
  const points=data.map((d,i)=>({x:pad+i*stepX,y:sy(d.elevationM)}));
  const linePoints=points.map(p=>p.x.toFixed(1)+','+p.y.toFixed(1)).join(' ');
  const areaPoints=`${points[0].x.toFixed(1)},${(h-padBottom).toFixed(1)} ${linePoints} ${points[points.length-1].x.toFixed(1)},${(h-padBottom).toFixed(1)}`;
  const labels=data.map((d,i)=>{
    const anchor=i===0?'start':(i===data.length-1?'end':'middle');
    const lx=i===0?points[i].x-10:(i===data.length-1?points[i].x+10:points[i].x);
    return `<text x="${lx.toFixed(1)}" y="${h-4}" text-anchor="${anchor}" class="elevation-trend-label mono">${d.year.slice(2)} Q${d.quarter}</text>`;
  }).join('');
  const dots=data.map((d,i)=>`<circle cx="${points[i].x.toFixed(1)}" cy="${points[i].y.toFixed(1)}" r="3" fill="var(--gold)"/>`).join('');
  return `<div class="elevation-trend-wrap">
    <div class="yearly-chart-title small">${t('ui.elevationTrendTitle','累積爬升趨勢（每季）')}</div>
    <svg viewBox="0 0 ${w} ${h}" class="elevation-trend-svg" preserveAspectRatio="none">
      <polygon points="${areaPoints}" fill="var(--gold)" opacity="0.15"/>
      <polyline points="${linePoints}" fill="none" stroke="var(--gold)" stroke-width="2"/>
      ${dots}
      ${labels}
    </svg>
  </div>`;
}
function computeMonthlyHeatmapData(){

// 氣候與表現散佈圖：門檻從原本 3 場提高到 4 場，跟 EPP 模型的高溫折損
// 係數用一樣的最低樣本數（同樣是「溫度 vs 表現」的迴歸，沒有理由套用
// 不同的可信度標準）。R²／樣本數這次改成一定會顯示在圖表文字裡，不是
// 拿到才選擇性顯示——3、4 筆資料畫出來的趨勢線，視覺上看起來會跟資料
// 齊全時一樣「確定」，但統計上完全不是一回事，把 R² 藏起來等於讓使用者
// 沒辦法自己判斷這條線值不值得信。R² 偏低（<0.4，代表這條線解釋不到
// 4 成的變異）時，趨勢線改用更淡、更稀疏的虛線呈現，用視覺本身傳達
// 「這條線沒有很篤定」，不是只在文字裡加一句警語、圖案本身還是畫得
// 信心滿滿。
const CLIMATE_CHART_MIN_POINTS=4;
const CLIMATE_CHART_WEAK_R2=0.4;

function climateIncludeTrail(){ try{ return localStorage.getItem(CLIMATE_TRAIL_PREF_KEY)==='1'; }catch(e){ return false; } }
function climatePerformanceChartSvg(){
  const includeTrail=climateIncludeTrail();
  const points=computeClimatePerformancePoints({allDistances:true,allowEstimatedTemp:true,includeTrail});
  const gravityReady=!!(points.gravity&&points.gravity.ready);
  // 越野開關永遠畫出來（就算資料不足也要讓人知道有這個選項），圖本身要夠點才畫
  const trailToggle=`<label class="climate-trail-toggle small">
      <input type="checkbox" data-action="climate-toggle-trail"${includeTrail?' checked':''}${includeTrail&&!gravityReady?' data-not-ready="1"':''}>
      ${t('ui.climateIncludeTrail','含越野（用爬升折損係數校正）')}${includeTrail&&!gravityReady?`<span class="climate-trail-notready">${t('ui.climateTrailNotReady','爬升係數資料還不夠，越野暫不納入')}</span>`:''}
    </label>`;

  const sweetSpot=computeSweetSpotBand(points);
  const reg=linearRegression(points.map(p=>({x:p.tempC,y:p.degradationPct})));
  const regIsWeak=reg&&reg.r2!=null&&reg.r2<CLIMATE_CHART_WEAK_R2;

  const temps=points.map(p=>p.tempC);
  let minTemp=Math.min(...temps),maxTemp=Math.max(...temps);
  if(sweetSpot){ minTemp=Math.min(minTemp,sweetSpot.min); maxTemp=Math.max(maxTemp,sweetSpot.max); }
  if(maxTemp-minTemp<2){ minTemp-=1; maxTemp+=1; }

  const degs=points.map(p=>p.degradationPct);

    minDeg=Math.min(minDeg,reg.intercept+reg.slope*minTemp,reg.intercept+reg.slope*maxTemp);
  }

  const w=560,h=272,padL=54,padR=20,padTop=34,padBottom=48;

  const sy=deg=>padTop+((0-deg)/degRange)*plotH;

  const sweetSpotRect=sweetSpot
    ?`<rect x="${sx(sweetSpot.min).toFixed(1)}" y="${padTop}" width="${(sx(sweetSpot.max)-sx(sweetSpot.min)).toFixed(1)}" height="${plotH}" fill="var(--trail)" opacity="0.14"/>

  // 中間再補一條淡淡的 Y 軸刻度線，原本只有 0% 跟最低值兩個端點，中間
  // 完全沒有參考線，這次補一條在視覺上抓比例會更容易。
  const midDeg=minDeg/2;
  const midY=sy(midDeg).toFixed(1);
  const midGridLine=`<line x1="${padL}" y1="${midY}" x2="${w-padR}" y2="${midY}" stroke="var(--rule)" stroke-width="0.5" stroke-dasharray="2 3" opacity="0.6"/>`;
  const trendLine=reg
    ?`<line x1="${padL}" y1="${sy(reg.intercept+reg.slope*minTemp).toFixed(1)}" x2="${w-padR}" y2="${sy(reg.intercept+reg.slope*maxTemp).toFixed(1)}" stroke="var(--flag)" stroke-width="${regIsWeak?1:1.5}" stroke-dasharray="${regIsWeak?'3 5':'5 4'}" opacity="${regIsWeak?0.5:1}"/>`
    :'';
  const dots=points.map(p=>{
    const cx=+sx(p.tempC).toFixed(1),cy=+sy(p.degradationPct).toFixed(1);
    // 金點＝該距離最佳，但效率照樣寫出來：距離曲線之下它可能只有 97%，
    // 標成「PB」會讓人以為那場是 100%。
    const degLabel=p.degradationPct.toFixed(1)+'%'+(p.isPb?t('ui.climateFrontierTip','（該距離最佳）'):'');
    const tempLabel=p.tempC.toFixed(1)+'°C'+(p.tempEstimated?t('ui.climateTempEstimatedTip','（氣候平均，估計）'):'');
    const trailLabel=p.isTrail?t('ui.climateTrailTip','／越野・已校正'):'';
    const tipText=`${p.race.name||t('ui.unnamedRace','(未命名賽事)')}/  ${tempLabel}/  ${degLabel}${trailLabel}`;
    const color=p.isPb?'var(--gold)':'var(--contour)';

    // 兩件事，才不會出現「空心三角」讀不出來是哪一種。

      :`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${p.tempEstimated?'none':color}" stroke="${color}" stroke-width="1.6" opacity="0.85">`;
    return shape+`<title>${escapeHtml(tipText)}</title>`+(p.isTrail?'</path>':'</circle>');
  }).join('');
  const estimatedCount=points.filter(p=>p.tempEstimated).length;

  const axisLabels=`

   生涯數據數字滾動動畫
   只有數值真的變動時才會播放（例如剛把賽事標記完賽），
   純粹因為其他操作重新渲染、數字沒變的情況不會重播，避免每次
   互動都跳動反而讓人分心。開啟「減少動態效果」系統設定時直接
   顯示最終數字，不播放動畫。
   ============================================================ */
let careerTickerCache={};
function formatTickerNumber(v,decimals){
  return decimals>0?v.toFixed(decimals):Math.round(v).toLocaleString();
}
function animateCareerTickers(){
  const reduceMotion=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  document.querySelectorAll('.career-ticker').forEach(el=>{
    const key=el.dataset.key;
    const target=parseFloat(el.dataset.target);
    const decimals=parseInt(el.dataset.decimals,10)||0;
    const from=careerTickerCache[key]!=null?careerTickerCache[key]:0;
    if(reduceMotion||from===target){
      el.textContent=formatTickerNumber(target,decimals);
      careerTickerCache[key]=target;
      return;
    }
    const duration=800;
    const start=performance.now();
    function tick(now){
      const progress=Math.min(1,(now-start)/duration);
      const eased=1-Math.pow(1-progress,3);
      el.textContent=formatTickerNumber(from+(target-from)*eased,decimals);
      if(progress<1) requestAnimationFrame(tick);
      else{ el.textContent=formatTickerNumber(target,decimals); careerTickerCache[key]=target; }
    }
    requestAnimationFrame(tick);
  });
}

/* ============================================================
   生涯回顧主卡（Hall of Fame）
   資料全部從 state.races / shoes 即時算出來，沒有任何寫死的賽事
   名稱或數字——這張卡片要能對任何人的資料都成立，寫死特定賽事
   的話，資料一變就會變成假的。
   ============================================================ */
/* trackToSvgPath(trackPoints, w, h, pad)：把 GPS 軌跡的經緯度轉成一條
   SVG 路徑。投影方式跟既有的 drawRouteTrackOnCanvas()（分享圖用的）
   一致——等距長方投影＋用中心緯度的餘弦修正經度，避免高緯度的軌跡
   被橫向拉長；縮放取長短邊較小的那個倍率，等比例塞進框裡不變形。
   刻意不共用同一個函式：那個是畫在 canvas 上、這個是產生 SVG 字串，
   輸出型態完全不同，硬要抽共用只會多一層轉接。共用的是「算法」，
   不是程式碼本身。
   點數上限：長距離賽事的軌跡動輒上萬點，全部塞進 path 會讓 DOM
   字串肥大又沒有視覺差異，等距抽樣到 300 點以內就夠看出形狀。 */
function trackToSvgPath(trackPoints,w,h,pad){
  if(!trackPoints||trackPoints.length<2) return null;
  pad=pad==null?10:pad;
  const MAX_POINTS=300;
  let pts=trackPoints;
  if(pts.length>MAX_POINTS){
    const step=pts.length/MAX_POINTS;
    const sampled=[];
    for(let i=0;i<MAX_POINTS;i++) sampled.push(pts[Math.floor(i*step)]);
    sampled.push(pts[pts.length-1]); // 終點一定要保留，不然軌跡會少一截
    pts=sampled;
  }
  const lats=pts.map(p=>p.lat),lons=pts.map(p=>p.lon);
  const minLat=Math.min(...lats),maxLat=Math.max(...lats);
  const minLon=Math.min(...lons),maxLon=Math.max(...lons);
  const lonScale=Math.cos(((minLat+maxLat)/2)*Math.PI/180)||1;
  const spanLat=(maxLat-minLat)||0.0001;
  const spanLon=((maxLon-minLon)*lonScale)||0.0001;
  const scale=Math.min((w-pad*2)/spanLon,(h-pad*2)/spanLat);
  const drawW=spanLon*scale,drawH=spanLat*scale;
  const ox=(w-drawW)/2,oy=(h-drawH)/2;
  const xy=p=>[(ox+(p.lon-minLon)*lonScale*scale).toFixed(1),(oy+(maxLat-p.lat)*scale).toFixed(1)];
  const d=pts.map((p,i)=>{const[x,y]=xy(p);return (i?'L':'M')+x+' '+y;}).join(' ');
  const [sx,sy]=xy(pts[0]),[ex,ey]=xy(pts[pts.length-1]);
  return {d,sx,sy,ex,ey};
}

/* computeFuelStats()：生涯補給消耗統計。
   只計入「已補給」打勾的項目，不是所有排進計畫的項目——補給時程是
   賽前規劃，實際賽中吃了什麼要看那個勾。把計畫當成實際消耗會高估，
   而這張卡片講的是「你生涯吃掉了多少」，不是「你打算吃多少」。
   數量沒填的項目以 1 份計：使用者把項目排進時程又勾了已補給，代表
   確實吃了，只是懶得填數量，當成 0 份反而更不準。
   碳水／鈉／咖啡因只有在該項目有連到補給品資料庫、且資料庫有填那個
   欄位時才累加，跟既有的單場統計 computeNutritionTotals() 同一套
   規則，兩邊算出來的數字才會對得起來。 */
function computeFuelStats(){
  const completed=state.races.filter(r=>r.status==='completed'&&!r.deletedAt);
  const byItem=new Map();
  let totalCarbG=0,totalSodiumMg=0,totalCaffeineMg=0,totalServings=0,racesWithFuel=0;
  completed.forEach(race=>{
    const items=(race.nutritionSchedule||[]).filter(it=>it.consumed);
    if(items.length) racesWithFuel++;
    items.forEach(it=>{
      const dict=it.dictionaryItemId?nutritionDictionary.find(d=>d.id===it.dictionaryItemId):null;
      const name=(dict&&dict.name)||(it.item||'').trim();
      if(!name) return;
      const qty=(it.qty!=null&&it.qty>0)?it.qty:1;
      totalServings+=qty;
      const cur=byItem.get(name)||{name,qty:0,races:new Set()};
      cur.qty+=qty;
      cur.races.add(race.id);
      byItem.set(name,cur);
      if(dict){
        if(dict.carbGrams!=null) totalCarbG+=dict.carbGrams*qty;

        if(dict.caffeineMg!=null) totalCaffeineMg+=dict.caffeineMg*qty;

  });
  const ranking=[...byItem.values()]
    .map(x=>({name:x.name,qty:x.qty,races:x.races.size}))
    .sort((a,b)=>b.qty-a.qty)
    .slice(0,6);
  return {ranking,totalCarbG,totalSodiumMg,totalCaffeineMg,totalServings,racesWithFuel};
}

function computeHallOfFameData(){
  const completed=state.races.filter(r=>r.status==='completed'&&!r.deletedAt);
  const s=computeCareerStats();
  // 找出締造全馬 PB 的那一場，用來在英雄卡上標出賽事名稱與日期
  let pbRace=null;
  if(s.marathonPB!=null){
    pbRace=completed.filter(r=>r.route.distanceKm>=41&&r.route.distanceKm<=43.5
      &&r.results.chipTimeSeconds===s.marathonPB)[0]||null;
  }
  const overseas=completed.filter(r=>isOverseasRace(r)).length;
  const pbCount=completed.filter(r=>r.results&&r.results.isPb).length;
  const totalDistance=completed.reduce((sum,r)=>sum+(r.route.distanceKm||0),0);
  const countries=new Set(completed.map(r=>(r.location&&r.location.country||'').trim()).filter(Boolean));
  const years=new Set(completed.map(r=>(r.schedule.raceDate||'').slice(0,4)).filter(Boolean));
  // 鞋款排行：用既有的 computeShoeStats()（含比賽里程＋自填訓練里程），
  // 只列出真的有上場比賽過的，純訓練鞋不算進「戰靴」。
  const shoeRanking=shoes.map(sh=>{
    const st=computeShoeStats(sh.id);
    return {name:sh.name,races:st.totalRaces,distance:st.totalDistance};
  }).filter(x=>x.races>0).sort((a,b)=>b.distance-a.distance).slice(0,5);
  // 軌跡畫廊收錄「有 GPS 軌跡」的完賽紀錄，PB 與海外賽事優先排在前面
  // ——這張卡是生涯精華，不是全部賽事的清單，所以有上限。沒有軌跡的
  // 賽事畫不出形狀，直接排除。
  const trackRaces=completed
    .filter(r=>r.route.trackPoints&&r.route.trackPoints.length>=2)
    .sort((a,b)=>{
      const pri=r=>((r.results&&r.results.isPb)?2:0)+(isOverseasRace(r)?1:0);
      const dp=pri(b)-pri(a);
      if(dp) return dp;
      return (b.schedule.raceDate||'').localeCompare(a.schedule.raceDate||'');
    })
    .slice(0,12);
  return {...s,pbRace,overseas,pbCount,totalDistance,
    countryCount:countries.size,yearCount:years.size,shoeRanking,trackRaces};
}

   的震動或樣式跳出來。滑鼠也支援（mousedown/mouseup），桌機一樣

let hofPressTimers=[],hofUnlockTimer=null,hofPressStart=null;
function cancelHofPress(){
  clearTimeout(hofUnlockTimer);hofUnlockTimer=null;
  hofPressTimers.forEach(clearTimeout);hofPressTimers=[];
  hofPressStart=null;
  document.querySelectorAll('.honor-card').forEach(el=>{
    el.classList.remove('pressing','charging-1','charging-2');

function startHofPress(card,x,y){
  cancelHofPress();
  hofPressStart={x,y};
  card.classList.add('pressing');
  hofPressTimers.push(setTimeout(()=>{
    tryVibrate(10);
    card.classList.add('charging-1');
  },500));
  hofPressTimers.push(setTimeout(()=>{
    tryVibrate(30);
    card.classList.remove('charging-1');
    card.classList.add('charging-2');
  },1000));
  hofUnlockTimer=setTimeout(()=>{
    cancelHofPress();
    openHallOfFame();
  },1500);

/* ============================================================
   獎牌牆 3D 傾斜引擎
   監聽器用事件委派掛在 document 上（不是每次重畫獎牌牆後逐一綁在
   每張卡片上），因為獎牌牆會因為篩選、切換檢視、新增賽事等原因
   重新產生 DOM，逐一綁定的話每次重畫都要重綁一次，很容易漏掉。
   實際的 DOM 寫入包在 requestAnimationFrame 裡：滑鼠移動事件的
   觸發頻率可能高於螢幕更新率，每次都直接寫 style 等於做了畫面上
   根本看不到的白工，還會拖慢捲動。
   ============================================================ */
/* ============================================================
   懸浮按鈕的磁性吸附與追光
   引力範圍不另外包一層透明的 div（那會動到既有的版面結構，而這顆
   按鈕外層的 .help-fab-wrap 還帶著旁邊那句提示文字，多包一層容易
   把兩者的相對位置弄亂），改成直接算「游標到按鈕中心的距離」，
   超過半徑就當作在範圍外——效果一樣，但不需要碰 DOM。
   位移只取游標距離的 0.3 倍，按鈕會朝游標方向被「拉」過去一點點、
   而不是黏著游標跑，這個張力感才是磁性的重點。
   ============================================================ */
const MAGNET_RADIUS_PX=90;   // 引力作用範圍（從按鈕中心算起）
const MAGNET_STRENGTH=0.3;   // 位移係數：游標距離的三成
let magnetPending=null,magnetRafId=null;
function magnetSupported(){
  return window.matchMedia
    &&window.matchMedia('(hover:hover) and (pointer:fine)').matches
    &&!window.matchMedia('(prefers-reduced-motion:reduce)').matches;
}
function applyMagnetFrame(){
  magnetRafId=null;
  if(!magnetPending) return;
  const {el,mx,my,gx,gy}=magnetPending;
  magnetPending=null;
  if(!el.isConnected) return;
  el.style.setProperty('--mag-x',mx.toFixed(1)+'px');
  el.style.setProperty('--mag-y',my.toFixed(1)+'px');
  el.style.setProperty('--glare-x',gx.toFixed(1)+'%');
  el.style.setProperty('--glare-y',gy.toFixed(1)+'%');
}
function releaseMagnet(el){
  if(magnetPending&&magnetPending.el===el) magnetPending=null;
  el.classList.remove('magnet-active');
  el.style.setProperty('--mag-x','0px');
  el.style.setProperty('--mag-y','0px');
}
document.addEventListener('mousemove',e=>{
  if(!magnetSupported()) return;
  const el=document.getElementById('btn-help');
  if(!el) return;
  const rect=el.getBoundingClientRect();
  if(!rect.width) return;
  const cx=rect.left+rect.width/2,cy=rect.top+rect.height/2;
  const dx=e.clientX-cx,dy=e.clientY-cy;
  if(Math.hypot(dx,dy)>MAGNET_RADIUS_PX){
    // 只有在真的還被吸著的時候才重設，避免游標在畫面上隨便動一下
    // 就一直寫入樣式。
    if(el.classList.contains('magnet-active')) releaseMagnet(el);
    return;
  }
  el.classList.add('magnet-active');
  magnetPending={
    el,
    mx:dx*MAGNET_STRENGTH,
    my:dy*MAGNET_STRENGTH,
    // 高光位置用「游標相對按鈕左上角的百分比」，夾在 0~100 之間：
    // 引力範圍比按鈕本身大，游標還在範圍內但已經離開按鈕邊界時，
    // 不夾的話百分比會跑到負數或超過 100，高光會整個飛出去。
    gx:Math.max(0,Math.min(100,((e.clientX-rect.left)/rect.width)*100)),
    gy:Math.max(0,Math.min(100,((e.clientY-rect.top)/rect.height)*100)),
  };
  if(magnetRafId==null) magnetRafId=requestAnimationFrame(applyMagnetFrame);
},{passive:true});
const TILT_MAX_DEG=9;
let tiltPending=null,tiltRafId=null;
function tiltSupported(){
  return window.matchMedia
    &&window.matchMedia('(hover:hover) and (pointer:fine)').matches
    &&!window.matchMedia('(prefers-reduced-motion:reduce)').matches;
}
function applyTiltFrame(){
  tiltRafId=null;
  if(!tiltPending) return;
  const {card,tiltX,tiltY,glareX,glareY}=tiltPending;
  tiltPending=null;
  if(!card.isConnected) return;
  card.style.setProperty('--tilt-x',tiltX.toFixed(2)+'deg');
  card.style.setProperty('--tilt-y',tiltY.toFixed(2)+'deg');
  card.style.setProperty('--glare-x',glareX.toFixed(1)+'%');
  card.style.setProperty('--glare-y',glareY.toFixed(1)+'%');
}
document.addEventListener('mousemove',e=>{
  if(!tiltSupported()) return;
  // e.target 不一定是元素節點（事件直接派送到 document、或落在文字節點
  // 上時就不是），沒有 closest() 這個方法，直接呼叫會拋例外。
  const card=e.target&&e.target.closest&&e.target.closest('.photo-card');
  if(!card) return;
  const rect=card.getBoundingClientRect();
  if(!rect.width||!rect.height) return;
  // 把游標位置正規化成 -0.5 ~ +0.5（卡片正中心是 0），再乘上最大
  // 傾斜角度。rotateX 要取負號：游標往上（y 變小）時，卡片上緣要
  // 往後仰、下緣往前傾，這在 CSS 的旋轉方向上剛好是相反的。
  const px=(e.clientX-rect.left)/rect.width;
  const py=(e.clientY-rect.top)/rect.height;
  tiltPending={
    card,
    tiltX:-((py-0.5)*2)*TILT_MAX_DEG,
    tiltY:((px-0.5)*2)*TILT_MAX_DEG,
    glareX:px*100,
    glareY:py*100,
  };
  card.classList.remove('tilt-resetting');
  if(tiltRafId==null) tiltRafId=requestAnimationFrame(applyTiltFrame);
},{passive:true});
document.addEventListener('mouseout',e=>{
  const card=e.target&&e.target.closest&&e.target.closest('.photo-card');
  if(!card) return;
  // mouseout 在卡片內部元素之間移動時也會觸發，要確認游標是真的
  // 離開整張卡片（relatedTarget 已經不在這張卡片裡）才歸零，不然
  // 滑過卡片裡的文字就會閃一下。
  if(e.relatedTarget&&card.contains(e.relatedTarget)) return;
  if(tiltPending&&tiltPending.card===card) tiltPending=null;
  card.classList.add('tilt-resetting');
  card.style.setProperty('--tilt-x','0deg');
  card.style.setProperty('--tilt-y','0deg');
},{passive:true});

/* 表格檢視的年份收合：生涯上百場全部攤開，找一場 2024 的比賽要捲很久。
   依年份分組、標題列顯示該年摘要（場次／完賽／合計里程），點一下展開
   或收合。預設只展開「今年」（沒有今年的賽事就展開最新的一年）；
   展開狀態記在記憶體、同一次瀏覽有效——年份清單會隨資料變，存進
   localStorage 只會累積一堆已經不存在的年份。 */
let tableExpandedYears=null;
function tableYearOf(r){ return (r.schedule.raceDate||'').slice(0,4)||'unknown'; }
function ensureTableExpandedYears(races){
  if(tableExpandedYears) return;
  const thisYear=String(new Date().getFullYear());
  const years=races.map(tableYearOf);
  tableExpandedYears=new Set([years.includes(thisYear)?thisYear:(years[0]||thisYear)]);
}
function renderTableView(){
  const races=filteredRaces().slice().sort((a,b)=>(b.schedule.raceDate||'').localeCompare(a.schedule.raceDate||''));
  if(!races.length){
    return `<div class="table-view-wrap">${emptyStateBlock('trash',t('ui.tableViewEmpty','沒有符合篩選條件的賽事'))}</div>`;
  }
  ensureTableExpandedYears(races);
  // 被選中的賽事所在的年份強制展開：從別的檢視切過來時，選中的列
  // 藏在收起的年份裡會讓人以為它不見了。
  const selected=races.find(r=>r.id===state.selectedId);
  if(selected) tableExpandedYears.add(tableYearOf(selected));
  const groups=[];
  races.forEach(r=>{
    const year=tableYearOf(r);
    let g=groups[groups.length-1];
    if(!g||g.year!==year){ g={year,races:[]}; groups.push(g); }
    g.races.push(r);
  });
  const rows=groups.map(g=>{
    const open=tableExpandedYears.has(g.year);
    const done=g.races.filter(r=>r.status==='completed').length;
    const km=g.races.reduce((s2,r)=>s2+(r.route.distanceKm||0),0);
    const label=g.year==='unknown'?t('ui.tableYearUnknown','未填日期'):g.year;
    const summaryParts=[tf('ui.tableYearCount','{n} 場',g.races.length)];
    if(done) summaryParts.push(tf('ui.tableYearDone','完賽 {n}',done));
    if(km>0) summaryParts.push(tf('ui.tableYearKm','合計 {n} km',km>=100?Math.round(km):km.toFixed(1)));

    if(!open) return header;
    return header+g.races.map(r=>{
      const dist=r.route.distanceKm!=null?r.route.distanceKm.toFixed(1):'—';
      const elev=r.route.elevationGainM!=null?String(Math.round(r.route.elevationGainM)):'—';
      const time=r.results.chipTimeSeconds!=null?secToHMS(r.results.chipTimeSeconds):'—';

        <td>${statusLabel(r.status)}</td>

      </tr>`;
    }).join('');
  }).join('');
  return `<div class="table-view-wrap"><table class="table-view">
    <thead><tr>
      <th>${t('ui.tableColDate','日期')}</th>
      <th>${t('ui.tableColName','賽事名稱')}</th>
      <th>${t('ui.tableColStatus','狀態')}</th>
      <th class="num">${t('ui.tableColDistance','距離(km)')}</th>
      <th class="num">${t('ui.tableColElevation','爬升(m)')}</th>

    <tbody>${rows}</tbody>

}

    const dayRaces=racesByDate[iso]||[];

    if(!muted&&dayRaces.length){

// 生命週期軌道（Lifecycle Stepper）：把狀態下拉選單視覺化成一條可以
// 直接點擊切換的進度軌道，放在賽事標題正下方。四個主節點對應
// STATUS_OPTIONS 裡「正常路徑」的四個狀態（考慮中→抽籤中→已報名→
// 已完賽），未起跑(DNS)／未完賽(DNF)這兩個是例外分支，不是路徑上的
// 第五、第六步——這兩個狀態發生的時候，賽事本身已經走到「比賽日」
// 這個時間點了，只是結果不是「順利完賽」，所以畫面上把它們畫成最後
// 一個節點的「另一種樣子」（不同顏色、不同圖示），不是接在後面多畫
// 兩個節點，避免看起來像是「完賽之後還有更後面的階段」這種不存在的
// 順序關係。四個主節點無論目前是哪個狀態都可以直接點擊——包含目前
// 是 DNS／DNF 的時候——不特別做一個「返回正常」的按鈕，因為「點擊
// 想要的狀態」本身就已經是最直接的返回方式，不需要多一層機制。
const LIFECYCLE_MAIN_SEQUENCE=['considering','lottery_pending','registered','completed'];
function lifecycleStepperHtml(race){
  const isException=race.status==='dns'||race.status==='dnf';
  const mainIdx=LIFECYCLE_MAIN_SEQUENCE.indexOf(race.status);
  const currentIdx=isException?LIFECYCLE_MAIN_SEQUENCE.length-1:mainIdx;
  let track='';
  LIFECYCLE_MAIN_SEQUENCE.forEach((s,i)=>{
    const isLastNode=i===LIFECYCLE_MAIN_SEQUENCE.length-1;
    const label=(isLastNode&&isException)?statusLabel(race.status):statusLabel(s);
    let stateClass;
    if(isLastNode&&isException) stateClass='exception';
    else if(i<currentIdx) stateClass='done';
    else if(i===currentIdx) stateClass='current';
    else stateClass='future';
    const circleContent=stateClass==='done'?'✓':(stateClass==='exception'?'!':String(i+1));
    track+=`<button type="button" class="lc-node lc-node-${stateClass}" data-action="lc-set-status" data-status="${s}" ${stateClass==='current'||stateClass==='exception'?'aria-current="step"':''}>
      <span class="lc-node-circle">${circleContent}</span>
      <span class="lc-node-label">${escapeHtml(label)}</span>
    </button>`;
    if(!isLastNode) track+=`<span class="lc-connector${i<currentIdx?' lc-connector-done':''}"></span>`;
  });
  const exceptionLinks=isException?'':`<div class="lc-exception-row">
    <button type="button" class="lc-exception-link" data-action="lc-set-status" data-status="dns">${t('ui.lcMarkDns','標記未出賽 (DNS)')}</button>
    <button type="button" class="lc-exception-link" data-action="lc-set-status" data-status="dnf">${t('ui.lcMarkDnf','標記未完賽 (DNF)')}</button>
  </div>`;
  return `<div class="lifecycle-stepper">
    <div class="lc-track">${track}</div>
    ${exceptionLinks}
  </div>`;
}

  // 都要同步補上對應的檢查，不然舊資料會一直停在「缺了新欄位」的
  // 狀態、回填邏輯永遠不會被觸發。
  const hwMissingNewFields=race.historicalWeather&&(!race.historicalWeather.feelsLike||!race.historicalWeather.humidity||!race.historicalWeather.windSpeed||!race.historicalWeather.windDirection);
  if((!race.historicalWeather||hwMissingNewFields)&&historicalWeatherFetchingRaceId!==race.id&&raceIsHistorical(race)&&raceHasGpsTrack(race)){
    fetchHistoricalWeatherForRace(race.id);
  }else if(race.historicalWeather&&applyHistoricalWeatherAutofill(race)){
    // 這份歷史天氣快取已經有完整欄位、只是還沒真正回填進手動欄位，
    // 剛剛才第一次回填，存檔並重新渲染一次讓畫面反映出來。
    persist();
    renderDetail();
  }
  // 海象查詢是獨立的另一個背景查詢，只有三鐵／游泳這兩種有開放水域
  // 游泳段的運動種類才會觸發，跟上面單日實際天氣分開判斷、分開快取。
  if(!race.marineWeather&&marineWeatherFetchingRaceId!==race.id&&raceIsHistorical(race)&&raceIsOpenWaterEligible(race)){
    fetchMarineConditionsForRace(race.id);
  }else if(race.marineWeather&&applyMarineConditionsAutofill(race)){
    persist();
    renderDetail();
  }
  // 歷年平均氣溫濕度是獨立的另一個背景查詢（跟上面單日實際天氣分開
  // 觸發、分開快取），兩者各自判斷各自的條件，不互相依賴。
  if(!race.historicalAverageWeather&&historicalAverageFetchingRaceId!==race.id&&raceIsHistorical(race)&&raceHasGpsTrack(race)){
    fetchHistoricalAverageWeatherForRace(race.id);
  }
}

// 日期就是固定預設值（狀態預設「考慮中」、日期空白）；只有全域拖曳

// 情況，才會在呼叫 startCreate() 之後覆寫這兩個值，把表單預先帶成
// 「已完成」＋活動當天日期——使用者丟進來的是一份已經跑完的真實活動
// 紀錄，不是在規劃一場還沒發生的比賽，狀態、日期沿用「考慮中」＋

/* ============================================================
   第一次使用引導：完全沒有賽事資料、而且這台裝置這個瀏覽器也從沒
   標記過「已經看過」時，「新增賽事」按鈕會有呼吸光暈效果引導視線；
   使用者點過一次（不管後續是真的新增還是取消）、或用「範例資料」
   開始，都算完成引導，永久記在 localStorage 裡，之後就算把賽事全部
   刪光重新變回空清單，也不會再亮起來——這是「第一次用這個網站」的
   引導，不是「賽事清單目前是空的」的提示，兩者語意不一樣。
   有兩個地方都會出現「新增賽事」按鈕：頂部工具列那個是固定不變的
   靜態元素、用 JS 事後加上 class；空白狀態（還沒選任何賽事時）裡的
   那個是每次重新渲染都會整段重寫的動態內容，改成在產生 HTML 的當下
   直接判斷要不要帶上 class，不能只靠事後加 class（會在下一次重新
   渲染時被整段覆蓋掉、消失不見）。
   ============================================================ */

// swipeState：目前正在進行中的滑動手勢（一次只會有一個，因為手指
// 同時間只能滑一張卡片）。recentlySwipedId 是「這張卡片剛滑過」的
// 短暫記號——手機瀏覽器在 touchend 之後通常還會補送一個合成的 click
/* ============================================================
   Bottom Sheet 下拉關閉手勢（手機版彈窗共用）：彈窗的開關函式散落
   在很多地方（openShoeModal、openPasteModal……每個彈窗各自一份，
   沒有一個統一的入口可以掛鉤），所以這裡用「代理監聽」掛在 document
   上，不論哪個彈窗被打開，只要滑動起點落在面板最上方的把手區，
   就會觸發下拉關閉——關閉的方式是去找、去點這個彈窗自己既有的
   [data-action^="close-"] 按鈕（跟既有 Esc 鍵那段邏輯用的是同一招），
   不是自己動手把 hidden/innerHTML 重設，這樣每個彈窗原本可能附帶的
   專屬收尾動作（例如焦點位置編輯器要把暫存的草稿清掉）都還是會
   正常執行，不會因為多了這個手勢入口而被繞過去。
   ============================================================ */
const SHEET_HANDLE_ZONE_PX=44; // 觸控起點離面板頂端在這個範圍內，才算摸到把手
const SHEET_DISMISS_THRESHOLD_PX=110;
let sheetDragState=null;
function isMobileSheetLayout(){
  return window.matchMedia('(max-width:640px)').matches;
}
document.addEventListener('touchstart',e=>{
  if(!isMobileSheetLayout()) return;
  const panel=e.target.closest('.modal-panel');
  if(!panel||e.touches.length!==1) return;
  const rect=panel.getBoundingClientRect();
  const touch=e.touches[0];
  if(touch.clientY-rect.top>SHEET_HANDLE_ZONE_PX) return; // 沒摸到把手，放行給內容正常捲動
  const overlay=panel.closest('.modal-overlay');
  if(!overlay) return;
  sheetDragState={panel,overlay,startY:touch.clientY,currentY:0,dragging:false};
  panel.style.transition='none';
},{passive:true});
document.addEventListener('touchmove',e=>{
  if(!sheetDragState) return;
  const touch=e.touches[0];
  const deltaY=touch.clientY-sheetDragState.startY;
  if(deltaY<=0){ sheetDragState.currentY=0; return; } // 只處理往下拖（要關閉），往上不做事
  sheetDragState.dragging=true;
  sheetDragState.currentY=deltaY;
  sheetDragState.panel.style.transform=`translateY(${deltaY}px)`;
  e.preventDefault();
},{passive:false});
document.addEventListener('touchend',()=>{
  if(!sheetDragState) return;
  const s=sheetDragState;sheetDragState=null;
  s.panel.style.transition='transform 0.22s ease';
  if(s.dragging&&s.currentY>=SHEET_DISMISS_THRESHOLD_PX){
    s.panel.style.transform='translateY(100%)';
    // iOS Safari 完全不支援 Vibration API，這裡的判斷是必要防呆，
    // 不是可有可無的寫法，沒有這層判斷會直接拋例外、中斷關閉流程。
    tryVibrate(10);
    setTimeout(()=>{
      const closeBtn=s.overlay.querySelector('[data-action^="close-"]');
      if(closeBtn) closeBtn.click();
    },180);
  }else{
    s.panel.style.transform='translateY(0)';
  }
});
// 事件，如果不擋掉，滑動完賽／刪除之餘還會順便把賽事詳情頁打開，
// 這不是使用者要的。
let swipeState=null;
let recentlySwipedId=null;
const SWIPE_THRESHOLD_PX=84;
function swipeActionBgHtml(dir){
  return dir==='right'
    ?`<span class="swipe-action-icon">✓</span><span>${t('ui.swipeComplete','完賽')}</span>`
    :`<span>${t('ui.swipeDelete','刪除')}</span><span class="swipe-action-icon">🗑</span>`;
}
function resetSwipeCard(card,bg){
  card.style.transition='transform 0.2s ease';
  card.style.transform='translateX(0)';
  bg.className='swipe-action-bg';
  bg.innerHTML='';
}
calendarEl.addEventListener('touchstart',e=>{
  const row=e.target.closest('.swipe-row');
  if(!row||e.touches.length!==1) return;
  const card=row.querySelector('.swipe-card'),bg=row.querySelector('.swipe-action-bg');
  const touch=e.touches[0];
  swipeState={id:row.dataset.id,row,card,bg,startX:touch.clientX,startY:touch.clientY,currentX:0,dragging:false,direction:null,vibrated:false};
},{passive:true});
calendarEl.addEventListener('touchmove',e=>{
  if(!swipeState) return;
  const touch=e.touches[0];
  const deltaX=touch.clientX-swipeState.startX,deltaY=touch.clientY-swipeState.startY;
  if(!swipeState.dragging){
    if(Math.abs(deltaX)<10&&Math.abs(deltaY)<10) return;
    // 垂直移動比水平移動大，判斷成使用者在捲動頁面，整個放棄這次
    // 手勢——這一步是避免「往下捲動清單」被誤判成「向左右滑」的
    // 關鍵，只判斷一次（剛開始移動的當下），之後就不再重新判斷。
    if(Math.abs(deltaY)>Math.abs(deltaX)){ swipeState=null; return; }
    swipeState.dragging=true;
    swipeState.card.style.transition='none';
  }
  e.preventDefault(); // 確定是水平滑動之後，鎖住垂直捲動，卡片才能跟手指一起移動
  // 阻尼公式：超過門檻之後，每多拉 1px 畫面只移動 0.28px，模擬拉到
  // 底的物理極限感，不會讓卡片無止盡跟著手指一路飛出螢幕外。
  const overshoot=Math.abs(deltaX)-SWIPE_THRESHOLD_PX;
  const damped=overshoot>0?Math.sign(deltaX)*(SWIPE_THRESHOLD_PX+overshoot*0.28):deltaX;
  swipeState.currentX=damped;
  swipeState.card.style.transform=`translateX(${damped}px)`;
  const dir=deltaX>0?'right':'left';
  if(dir!==swipeState.direction){
    swipeState.direction=dir;
    swipeState.bg.className='swipe-action-bg swipe-bg-'+dir;
    swipeState.bg.innerHTML=swipeActionBgHtml(dir);
  }
  const pastThreshold=Math.abs(deltaX)>=SWIPE_THRESHOLD_PX;
  if(pastThreshold&&!swipeState.vibrated){
    swipeState.vibrated=true;
    // iOS Safari 完全不支援 Vibration API（navigator.vibrate 在那個
    // 環境下根本不存在），這裡加 if 判斷是必要的防呆，不是可有可無
    // 的寫法——沒有這層判斷，iOS 上呼叫會直接拋例外、中斷整個滑動
    // 手勢，其他平台（多數 Android 瀏覽器）才有這個效果。
    tryVibrate(10);
  }else if(!pastThreshold){
    swipeState.vibrated=false;
  }
},{passive:false});
calendarEl.addEventListener('touchend',()=>{
  if(!swipeState) return;
  const s=swipeState;swipeState=null;
  if(!s.dragging) return;
  recentlySwipedId=s.id;
  setTimeout(()=>{ if(recentlySwipedId===s.id) recentlySwipedId=null; },350);
  const pastThreshold=Math.abs(s.currentX)>=SWIPE_THRESHOLD_PX;
  if(pastThreshold&&s.direction==='right'){
    const race=state.races.find(r=>r.id===s.id);
    if(!race){ resetSwipeCard(s.card,s.bg); return; }
    s.card.style.transition='transform 0.2s ease,opacity 0.2s ease';
    s.card.style.transform='translateX(110%)';
    s.card.style.opacity='0';
    tryVibrate([15,30,15]);
    quickSetRaceStatus(race,'completed').then(()=>{ renderCalendar(); });
    logFeatureUse('swipe_complete');
  }else if(pastThreshold&&s.direction==='left'){
    // 以前這裡是「卡片定格＋露出確認區塊，再點一次才真的刪除」的
    // 兩段式操作；現在改成滑到底立刻刪除、跟完賽同一個節奏——真正
    // 的安全網是既有的軟刪除機制（deletedAt，30 天內都能從「資料
    // 復原」找回來），這裡飛出動畫播完之後跳出的 5 秒復原提示只是
    // 多一層立即的反悔捷徑，不是唯一的安全機制，所以拿掉這層「先
    // 確認才刪除」不會讓資料變得比較危險。
    const race=state.races.find(r=>r.id===s.id);
    if(!race){ resetSwipeCard(s.card,s.bg); return; }
    const raceName=race.name||t('ui.unnamedRace','(未命名賽事)');
    s.card.style.transition='transform 0.2s ease,opacity 0.2s ease';
    s.card.style.transform='translateX(-110%)';
    s.card.style.opacity='0';
    tryVibrate([15,30,15]);
    race.deletedAt=new Date().toISOString();
    race.updatedAt=new Date().toISOString();
    if(state.selectedId===s.id){ state.selectedId=null; currentRace=null; }
    persist();
    setTimeout(()=>{ renderCalendar(); },200);
    showRaceDeleteUndoToast(s.id,raceName);
    logFeatureUse('swipe_delete');
  }else{
    resetSwipeCard(s.card,s.bg);
  }
});
calendarEl.addEventListener('click',e=>{
  const chip=e.target.closest('.cal-chip,.cal-list-item');if(!chip) return;
  if(recentlySwipedId===chip.dataset.id){ recentlySwipedId=null; return; }
  selectRace(chip.dataset.id);
});

function shiftCalendarMonth(delta){
  let m=state.calendarMonth+delta,y=state.calendarYear;
  if(m<0){m=11;y--;} else if(m>11){m=0;y++;}
  state.calendarMonth=m;state.calendarYear=y;
  renderCalendar();
}
// 行事曆邊緣滑動切換月份：範圍刻意收斂在標題列（.cal-nav，本來就是
// ‹ 年 月 › 這排導覽按鈕所在的地方），不是整個月曆本體——手機版
// （寬度 ≤640px）的月曆本體幾乎全部都是可以左右滑動來完賽／刪除的
// 賽事列（.swipe-row，上一輪做的手勢），邊緣滑動如果也綁在那塊
// 區域，兩種手勢會搶奪同一個觸控起點，變成「滑一下賽事列，到底是
// 要切月份還是要標記完賽」這種無法分辨的衝突。標題列不管在哪種
// 檢視模式下都存在、不會被賽事列佔用，而且緊鄰既有的 ‹/› 按鈕，
// 滑這裡切換月份跟按鈕本身要做的事完全一致，不是另外發明一個要
// 使用者自己摸索的隱藏手勢熱區。
const CAL_NAV_SWIPE_THRESHOLD_PX=50;
let calNavSwipeState=null;
const calNavEl=document.querySelector('.cal-nav');
calNavEl.addEventListener('touchstart',e=>{
  if(e.touches.length!==1) return;
  const touch=e.touches[0];
  calNavSwipeState={startX:touch.clientX,startY:touch.clientY,dragging:false};
},{passive:true});
calNavEl.addEventListener('touchmove',e=>{
  if(!calNavSwipeState) return;
  const touch=e.touches[0];
  const deltaX=touch.clientX-calNavSwipeState.startX,deltaY=touch.clientY-calNavSwipeState.startY;
  if(!calNavSwipeState.dragging){
    if(Math.abs(deltaX)<10&&Math.abs(deltaY)<10) return;
    // 垂直位移比水平大，代表使用者是想碰到旁邊的東西或手指自然
    // 抖動，不是要滑動切月份，整個放棄這次手勢，只判斷一次。
    if(Math.abs(deltaY)>Math.abs(deltaX)){ calNavSwipeState=null; return; }
    calNavSwipeState.dragging=true;
  }
  e.preventDefault();
},{passive:false});
calNavEl.addEventListener('touchend',e=>{
  if(!calNavSwipeState||!calNavSwipeState.dragging){ calNavSwipeState=null; return; }
  const touch=e.changedTouches[0];
  const deltaX=touch.clientX-calNavSwipeState.startX;
  calNavSwipeState=null;
  if(Math.abs(deltaX)<CAL_NAV_SWIPE_THRESHOLD_PX) return;
  // 往左滑（deltaX 負）＝看下個月，往右滑＝看上個月，跟翻書、切換
  // 相簿頁面的方向直覺一致。
  shiftCalendarMonth(deltaX<0?1:-1);
});

/* ============================================================
   扁平化多表 CSV 匯出
   給要接 Python / SQL / Excel VBA 做自動化的人用：
   一份賽事主表（races.csv，純量欄位攤平），加上每個清單各自一份
   子表（checkpoints.csv、splits.csv...），都用 race_id 對回主表，
   方便直接 JOIN 或用 pandas merge。GPS 座標／海拔剖面點位資料量大
   且非分析用途，不列入匯出。CSV 開頭加 UTF-8 BOM，讓 Excel 開啟
   中文/日文內容不會變亂碼。
   ============================================================ */
function csvEscape(v){
  if(v==null) return '';
  if(typeof v==='boolean') return v?'TRUE':'FALSE';
  const s=String(v);
  if(/[",\r\n]/.test(s)) return '"'+s.replace(/"/g,'""')+'"';
  return s;
}
function rowsToCsv(headers,rows){
  const lines=[headers.map(csvEscape).join(',')];
  rows.forEach(row=>{ lines.push(row.map(csvEscape).join(',')); });
  return lines.join('\r\n');
}
function downloadCsvFile(filename,csvContent){
  const blob=new Blob(['\uFEFF'+csvContent],{type:'text/csv;charset=utf-8'});
  downloadBlob(blob,filename);
}

def classify_distance(km):

// importJsonFile(file)：從檔案物件匯入 JSON 備份，跟賽事清單合併——抽成
// 獨立、可重複呼叫的函式，因為除了原本「選擇檔案」這個入口，全域拖曳
// 匯入（見下方 globalDropzone 區塊）也要呼叫同一套邏輯，不能各自維護
// 一份重複、容易兜不起來的匯入流程。
// importRacesArray(parsed)：把一個「已經解析好的賽事陣列」合併進
// state.races、存檔、跳出結果 toast——不管這個陣列是從檔案讀出來的
// （importJsonFile()）還是使用者直接在頁面上貼上的（全域貼上匯入，
// 見下方 paste 監聽器），最後都走這一份共用邏輯，不是各自維護一份
// 容易兜不起來的重複程式碼。回傳 true／false 代表這次合併是否真的
// 成功，呼叫端據此決定要不要記錄功能使用次數。
// 跟原本內嵌在 importJsonFile() 裡的驗證邏輯有一處刻意放寬：不強制
// 要求每一筆都要有 id——直接貼上的通常是請 AI 幫忙生出的一批全新
// 賽事，本來就不會有 id，缺 id 的項目直接補一個新的，不會因為少了
// 一個原本只有「還原自己備份」這個情境才會有的欄位，就把整批貼上
// 的資料拒於門外。
// importShoeTrainingKm(parsed)：批次更新多雙鞋的「訓練里程」欄位，
// 用鞋款名稱做寬鬆比對（雙方字串誰包含誰都算，不要求完全一樣）——
// 這個 App 的鞋款名稱是自由輸入的文字，跟外部運動記錄軟體（例如
// Strava）匯出的名稱不會完全一致，硬性要求完全相符只會讓大部分
// 資料配不上；同一個關鍵字如果同時比對到兩雙以上的鞋，代表無法
// 判斷該歸給哪一雙，這種情況一律跳過、算進「找不到對應」，不會
// 隨便挑一雙硬套。只會更新 trainingKm 這一個欄位，不會動到其他
// 資料，就算真的配錯了，頂多是某雙鞋的數字不準，透過既有的編輯
// 功能就能修正，不是無法復原的操作。
function importShoeTrainingKm(parsed){
  let matched=0,unmatched=0;
  parsed.forEach(item=>{
    const name=(item.name||'').trim();
    if(!name||item.trainingKm==null) return;
    const nameLower=name.toLowerCase();
    const candidates=shoes.filter(s=>{
      const sLower=(s.name||'').toLowerCase();
      return sLower&&(sLower.includes(nameLower)||nameLower.includes(sLower));
    });
    if(candidates.length===1){
      candidates[0].trainingKm=Math.max(0,Number(item.trainingKm));
      matched++;
    }else{
      unmatched++;
    }
  });
  if(matched>0) persistShoes();
  refreshShoeManagementUI();
  const el=document.createElement('div');
  el.className='foreground-toast'+(unmatched?' sync-notice':'');
  el.innerHTML=`<strong>${t('ui.shoeTrainingImportDone','訓練里程匯入完成')}</strong><span>${tf2('ui.shoeTrainingImportSummary',`比對成功 ${matched} 雙，${unmatched} 筆找不到對應鞋款`,matched,unmatched)}</span>`;
  document.body.appendChild(el);
  setTimeout(()=>{ el.remove(); },8000);
  if(matched>0) logFeatureUse('import_shoe_training_km');
  return matched>0;
}
function importRacesArray(parsed){
  try{
    if(!Array.isArray(parsed)) throw new Error(t('ui.errJsonNotArray','檔案內容不是有效的賽事清單（需要是一個陣列）'));
    const invalid=parsed.some(r=>!r||typeof r!=='object');
    if(invalid) throw new Error(t('ui.errJsonInvalidRace','檔案裡有資料格式不正確的賽事'));
    const withIds=parsed.map(r=>r.id?r:Object.assign({},r,{id:uid()}));
    const result=mergeRacesIntoState(withIds.map(migrateRace));
    persist();renderAll();
    const el=document.createElement('div');
    el.className='foreground-toast';
    el.innerHTML=`<strong>${t('ui.jsonImportDone','JSON 匯入完成')}</strong><span>${tf2('ui.jsonImportSummary',`新增 ${result.addedCount} 筆，${result.overwrittenCount} 筆版本衝突已保留舊版本在「資料復原」`,result.addedCount,result.overwrittenCount)}</span>`;
    document.body.appendChild(el);
    setTimeout(()=>{ el.remove(); },8000);
    return true;
  }catch(err){
    console.error('JSON 匯入失敗',err);
    const el=document.createElement('div');
    el.className='foreground-toast sync-notice';
    el.innerHTML=`<strong>${t('ui.jsonImportFailed','JSON 匯入失敗')}</strong><span>${escapeHtml(err.message)}</span>`;
    document.body.appendChild(el);
    setTimeout(()=>{ el.remove(); },8000);
    return false;
  }
}
async function importJsonFile(file){
  const text=await file.text();
  let parsed;
  try{
    parsed=JSON.parse(text);
  }catch(err){
    console.error('JSON 匯入失敗',err);
    const el=document.createElement('div');
    el.className='foreground-toast sync-notice';
    el.innerHTML=`<strong>${t('ui.jsonImportFailed','JSON 匯入失敗')}</strong><span>${escapeHtml(err.message)}</span>`;
    document.body.appendChild(el);
    setTimeout(()=>{ el.remove(); },8000);
    return;
  }
  if(importRacesArray(parsed)) logFeatureUse('import_json_restore');
}

/* ============================================================
   行事曆提醒匯出（.ics，倒數一個月／一週）
   ============================================================ */
function escapeICS(str){
  return String(str||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');
}
function nowICSStamp(){
  const d=new Date();
  return d.getUTCFullYear()+String(d.getUTCMonth()+1).padStart(2,'0')+String(d.getUTCDate()).padStart(2,'0')+'T'+
    String(d.getUTCHours()).padStart(2,'0')+String(d.getUTCMinutes()).padStart(2,'0')+String(d.getUTCSeconds()).padStart(2,'0')+'Z';
}
function raceToICSEvent(race){
  if(!race.schedule.raceDate) return '';
  const dt=race.schedule.raceDate.replace(/-/g,'');
  const startDate=new Date(race.schedule.raceDate+'T00:00:00');
  const endDate=new Date(startDate.getTime()+86400000);
  const endStr=endDate.getFullYear()+String(endDate.getMonth()+1).padStart(2,'0')+String(endDate.getDate()).padStart(2,'0');
  const summary=escapeICS(race.name||'賽事');
  const location=escapeICS([race.location.venueName,race.location.city].filter(Boolean).join(' '));
  return [
    'BEGIN:VEVENT',
    `UID:${race.id}@race-day-app`,
    `DTSTAMP:${nowICSStamp()}`,
    `DTSTART;VALUE=DATE:${dt}`,
    `DTEND;VALUE=DATE:${endStr}`,
    `SUMMARY:${summary}`,
    location?`LOCATION:${location}`:null,
    'BEGIN:VALARM',
    'ACTION:DISPLAY',
    `DESCRIPTION:賽事倒數一個月：${summary}`,
    'TRIGGER:-P30D',
    'END:VALARM',
    'BEGIN:VALARM',
    'ACTION:DISPLAY',
    `DESCRIPTION:賽事倒數一週：${summary}`,
    'TRIGGER:-P7D',
    'END:VALARM',
    'END:VEVENT',
  ].filter(Boolean).join('\r\n');
}
function buildICS(races){
  const events=races.map(raceToICSEvent).filter(Boolean).join('\r\n');
  return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//賽事紀錄//MyRace//ZH','CALSCALE:GREGORIAN',events,'END:VCALENDAR'].join('\r\n');
}
function buildGoogleCalendarUrl(race){
  if(!race.schedule.raceDate) return null;
  const dt=race.schedule.raceDate.replace(/-/g,'');
  const startDate=new Date(race.schedule.raceDate+'T00:00:00');
  const endDate=new Date(startDate.getTime()+86400000);
  const endStr=endDate.getFullYear()+String(endDate.getMonth()+1).padStart(2,'0')+String(endDate.getDate()).padStart(2,'0');
  const params=new URLSearchParams();
  params.set('action','TEMPLATE');
  params.set('text',race.name||t('ui.exportRaceIcsDefaultName','賽事'));
  params.set('dates',`${dt}/${endStr}`);
  const location=[race.location.venueName,race.location.city].filter(Boolean).join(' ');
  if(location) params.set('location',location);
  if(race.officialUrl) params.set('details',race.officialUrl);
  return 'https://calendar.google.com/calendar/render?'+params.toString();
}
function downloadICS(icsText,filename){
  const blob=new Blob([icsText],{type:'text/calendar;charset=utf-8'});
  downloadBlob(blob,filename);
}

// handleDetailChange / handleDetailClick：原本直接寫成匿名函式掛在
// detailEl 上，現在抽成具名函式，因為「裝備清單」這個區塊的內容會
// 被搬進抽屜面板（#global-drawer）裡顯示——抽屜在 DOM 上不在
// detailEl 底下，事件不會冒泡過去，如果不把同一份處理函式也掛到
// 抽屜上，抽屜裡的欄位改了會完全沒有反應、而且不會報錯，是那種
// 「畫面看起來正常、資料卻悄悄沒存到」最難察覺的問題。兩邊掛的是
// 同一份函式，不是各自複製一份，避免日後改了一邊忘了另一邊。
async function handleDetailChange(e){
  const t=e.target;
  if(t.id==='geo-photo-input'){
    if(currentRace&&t.files&&t.files.length){
      const files=Array.from(t.files);
      t.value=''; // 清空選取，允許使用者之後再次選到同一批檔案（例如刪除後重新加入）
      processPhotoFiles(currentRace,files);
    }
    return;
  }
  if(t.id==='geo-photo-offset'){
    if(currentRace){
      currentRace.photoTimeOffsetSeconds=Number(t.value);
      reinterpolateAllPhotos(currentRace);
      currentRace.updatedAt=new Date().toISOString();
      persist();
      renderDetail();
    }
    return;
  }
  if(t.dataset.action==='kanban-move-select'){
    const idx=parseInt(t.dataset.index,10);
    const item=currentRace&&currentRace.equipmentChecklist&&currentRace.equipmentChecklist[idx];
    if(item){
      item.location=t.value;
      currentRace.updatedAt=new Date().toISOString();
      persist();renderDetail();
    }
    return;
  }
  if(t.dataset.action==='nutrition-dict-select'){
    const idx=parseInt(t.dataset.index,10);
    const item=currentRace&&currentRace.nutritionSchedule&&currentRace.nutritionSchedule[idx];
    if(item){
      const dictId=t.value||null;
      item.dictionaryItemId=dictId;
      if(dictId){
        const dict=nutritionDictionary.find(d=>d.id===dictId);
        if(dict) item.item=dict.name;
      }
      currentRace.updatedAt=new Date().toISOString();
      persist();renderDetail();
    }
    return;
  }
  const path=t.dataset.path;if(!path||!currentRace) return;
  let value;
  if(t.type==='checkbox') value=t.checked;
  else if(t.dataset.kind==='duration'){
    // 看不懂的字串不能變成 null 存進去——那是把使用者原本的成績清掉，
    // 而且畫面上什麼都不說。留在欄位裡、標成錯誤，讓他修。
    const v=validateDurationInput(t);
    if(!v.ok) return;
    value=v.value;
    if(value!=null) t.value=secToHMS(value);
  }
  else if(t.type==='number') value=(t.value===''?null:Number(t.value));
  else value=t.value;
  if(path==='status'){
    await setRaceStatusFromUi(currentRace,value);
  }else{
    setPath(currentRace,path,value);
    currentRace.updatedAt=new Date().toISOString();
    if(path==='schedule.raceDate'&&value){
      const d=new Date(value+'T00:00:00');
      if(!isNaN(d)){state.calendarYear=d.getFullYear();state.calendarMonth=d.getMonth();}
    }
    // 無感智慧預設：見 applySmartDefaults() 說明。回傳這次自動改了哪些
    // 欄位——「換運動種類自動帶裝備範本」這個既有機制原本只認使用者
    // 直接改 sportType 這個 path，這次如果是被智慧預設連帶改掉的，
    // 也要用同一套邏輯觸發，行為要一致，不能因為「觸發來源不是使用者
    // 手動選」就跳過裝備範本這一步。
    const smartFilled=applySmartDefaults(currentRace,path);
    // 換運動種類時，如果裝備清單還是空的，自動帶入對應的標準範本（不會覆蓋已填的內容）
    const templateApplied=(path==='sportType'||smartFilled.includes('sportType'))&&autoApplyEquipmentTemplate(currentRace);
    showSaveStatus('saving');
    await persist();
    renderCalendar();
    const needsFullRerender=(path==='series'||path==='sportType'||path.startsWith('results.')||path.startsWith('lottery.')||path.startsWith('nutritionSchedule.')||smartFilled.length>0);
    if(smartFilled.length){
      smartFilledHighlightPaths=new Set(smartFilled);
      setTimeout(()=>{ smartFilledHighlightPaths=new Set(); },2500);
    }
    if(needsFullRerender){renderDetail();}else{updateDetailHeaderBits();}
    showSaveStatus('saved');
    if(templateApplied){
      const el=document.createElement('div');
      el.className='foreground-toast';
      el.innerHTML=`<strong>${window.t('ui.templateAutoApplied','已自動套用裝備範本')}</strong>`;
      document.body.appendChild(el);
      setTimeout(()=>{ el.remove(); },4000);
    }
    // PB 心跳共鳴：晶片時間存檔後，檢查是不是破了同系列的最快紀錄
    // （見 detectSeriesPb() 說明——只在同系列內比較，不是隨便找距離
    // 相近的賽事湊）。已經手動勾過「個人最佳」的話不用再提示一次。
    // 只給震動＋提示，不直接幫忙勾選 isPb——那個欄位的既有設計就是
    // 使用者自己決定，系統這裡只負責「發現了、通知你」，不越權替你
    // 做決定，真的要標記的話提示裡有一個按鈕可以直接按。
    if(path==='results.chipTimeSeconds'&&!currentRace.results.isPb&&detectSeriesPb(currentRace)){
      tryVibrate([100,50,100]);
      const pbEl=document.createElement('div');
      pbEl.className='foreground-toast';
      pbEl.innerHTML=`<strong>${window.tf('ui.seriesPbDetected','🎉 這是「{n}」系列至今最快的一次！',escapeHtml(currentRace.series))}</strong>
        <button type="button" class="btn-text-small" data-action="mark-pb-from-toast" data-id="${currentRace.id}">${window.t('ui.markAsPb','標記為個人最佳 (PB)')}</button>`;
      document.body.appendChild(pbEl);
      setTimeout(()=>{ pbEl.remove(); },8000);
    }
  }
  // 賽事完賽狀態下，任何欄位變動都可能剛好讓某個徽章達標（例如補填晶片時間、心率、天氣）
  // ——判定成本很低（純記憶體內的陣列比對），每次存檔都重新檢查一次，確保不會漏掉。
  // 如果是「這場賽事自己觸發」的新徽章，直接在這裡立刻開箱，不用等使用者離開又點回來；
  // 如果是沒有對應單一賽事的徽章（例如累積使用滿 5 雙鞋的「千足蜈蚣」），也一併立刻開箱，
  // 不然這種徽章解鎖了會永遠沒有機會播放動畫。
  if(currentRace.status==='completed'){
    const newlyUnlocked=checkAndRecordBadgeUnlocks();
    if(newlyUnlocked.length){ checkRaceForBadgeUnboxing(currentRace.id); queueNoTriggerBadges(newlyUnlocked); }
  }
}

  const rmBtn=e.target.closest('[data-action="remove-item"]');

      reviewRace.review.lessonsLearned=REVIEW_KPT_TEMPLATE;
      reviewRace.updatedAt=new Date().toISOString();

  if(e.target.closest('[data-action="open-nutrition-dict-modal"]')){

  const kanbanPackedBtn=e.target.closest('[data-action="kanban-toggle-packed"]');
  if(kanbanPackedBtn){
    const idx=parseInt(kanbanPackedBtn.dataset.index,10);
    const item=currentRace&&currentRace.equipmentChecklist&&currentRace.equipmentChecklist[idx];
    if(item){
      item.isPacked=kanbanPackedBtn.checked;

      persist();renderDetail();

    return;
  }
  if(e.target.closest('[data-action="apply-template"]')){
    const sel=document.getElementById('template-select');
    const tpl=templates.find(t=>t.id===sel.value);
    if(!tpl) return;
    currentRace.equipmentChecklist=(currentRace.equipmentChecklist||[]).concat(
      tpl.items.map(it=>({itemName:it.itemName,category:it.category,weightG:it.weightG!=null?it.weightG:null,isConsumable:!!it.isConsumable,isMandatory:it.isMandatory,isPacked:false,notes:''}))
    );
    currentRace.updatedAt=new Date().toISOString();
    persist();renderDetail();return;
  }
  if(e.target.closest('[data-action="save-template"]')){
    state.savingTemplate=true;renderDetail();
    const input=document.getElementById('template-name-input');
    if(input) input.focus();
    return;
  }
  if(e.target.closest('[data-action="cancel-save-template"]')){
    state.savingTemplate=false;renderDetail();return;
  }
  if(e.target.closest('[data-action="confirm-save-template"]')){
    const nameInput=document.getElementById('template-name-input');
    const name=nameInput.value.trim();
    if(!name){nameInput.focus();return;}
    const items=(currentRace.equipmentChecklist||[]).map(it=>({itemName:it.itemName,category:it.category,isMandatory:it.isMandatory,weightG:it.weightG!=null?it.weightG:undefined,isConsumable:it.isConsumable||undefined}));
    templates.push({id:uid(),name,items});
    state.savingTemplate=false;
    persistTemplates();renderDetail();return;
  }
  if(e.target.closest('[data-action="delete-template"]')){
    const sel=document.getElementById('template-select');
    if(!sel||!sel.value) return;
    if(!state.confirmDeleteTemplate){
      state.confirmDeleteTemplate=true;renderDetail();
      setTimeout(()=>{state.confirmDeleteTemplate=false;if(currentRace) renderDetail();},4000);
      return;
    }
    templates=templates.filter(t=>t.id!==sel.value);
    state.confirmDeleteTemplate=false;
    persistTemplates();renderDetail();return;
  }
}

/* 時間欄位的即時驗證：使用者打字時就告訴他看不看得懂，並在看得懂但
   寫法不標準時顯示「= 0:44:25」——「44:25」到底是 44 分還是 4 時 42 分
   這種歧義，讓他在離開欄位前就看到。
   為什麼不在 change 才驗：change 是離開欄位才觸發，那時使用者的注意力
   已經到下一格了，錯誤要回頭找。 */
function durationHintEl(input,create){
  const field=input.closest('.field');
  if(!field) return null;
  let el=field.querySelector('.field-hint-live');
  if(!el&&create){ el=document.createElement('span'); el.className='field-hint-live'; field.appendChild(el); }
  return el;
}
function validateDurationInput(input){
  const raw=input.value;
  if(!raw.trim()){ input.removeAttribute('aria-invalid'); const el=durationHintEl(input,false); if(el) el.remove(); return {ok:true,value:null}; }
  const sec=hmsToSec(raw);
  if(sec==null){
    input.setAttribute('aria-invalid','true');
    const el=durationHintEl(input,true);
    el.className='field-hint-live is-error';
    el.textContent=t('ui.durationInvalidHint','看不懂這個時間格式，例如 3:44:25、44:25 或 3h44m25s');
    return {ok:false,value:null};
  }
  input.removeAttribute('aria-invalid');
  const canonical=secToHMS(sec);
  const el=durationHintEl(input,true);
  if(raw.trim()!==canonical){ el.className='field-hint-live'; el.textContent='= '+canonical; }
  else el.remove();
  return {ok:true,value:sec};
}
function handleDurationLiveInput(e){
  const input=e.target;
  if(!input||input.dataset.kind!=='duration') return;
  validateDurationInput(input);
}

const HEADER_KEYWORDS=[
  [['日期'],'date'],
  [['項目','賽事','名稱'],'name'],
  [['距離'],'distance'],
  [['地點','地址','位置'],'venue'],
  [['費用','報名費'],'fee'],
  [['報名'],'statusHint'],
];
const RACE_KEYWORDS=/馬拉松|路跑|越野|鐵人|半程|全馬|接力|障礙|定向|泳渡|三鐵|二鐵|夜跑|盃|杯|marathon|trail|triathlon|relay/i;

function inferColumnRoles(headerRow,dataRows){
  const roles=headerRow.map(()=>null);
  const used=new Set();
  headerRow.forEach((h,i)=>{
    const text=(h==null?'':String(h));
    for(const [keys,role] of HEADER_KEYWORDS){
      if(keys.some(k=>text.includes(k))&&!used.has(role)){roles[i]=role;used.add(role);return;}
    }
  });
  headerRow.forEach((h,i)=>{
    if(roles[i]) return;
    const sample=dataRows.map(r=>(r||[])[i]).filter(v=>v!=null&&v!=='').slice(0,15);
    if(sample.length===0){roles[i]='note';return;}
    const numericCount=sample.filter(v=>typeof v==='number'||(typeof v==='string'&&v.trim()!==''&&!isNaN(Number(v)))).length;
    const dateCount=sample.filter(v=>v instanceof Date).length;
    if(!used.has('distance')&&numericCount/sample.length>0.5){roles[i]='distance';used.add('distance');return;}
    if(!used.has('date')&&dateCount/sample.length>0.5){roles[i]='date';used.add('date');return;}
    roles[i]='note';
  });
  return roles;
}
function cellToISODate(v){
  if(v instanceof Date&&!isNaN(v)){
    const y=v.getFullYear(),m=String(v.getMonth()+1).padStart(2,'0'),d=String(v.getDate()).padStart(2,'0');
    return `${y}-${m}-${d}`;
  }
  if(typeof v==='string'){
    const s=v.trim();
    if(/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0,10);
    if(/[~～–至到]/.test(s)) return null;
    const m=s.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/);
    if(m) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  }
  return null;
}
function parseDistanceCell(v){
  if(v==null||v==='') return {km:null,raw:''};
  if(typeof v==='number') return {km:v,raw:String(v)};
  const s=String(v).trim();
  const n=Number(s);
  if(s!==''&&!isNaN(n)) return {km:n,raw:s};
  return {km:null,raw:s};
}
function parseFeeCell(v){
  if(v==null||v==='') return null;
  if(typeof v==='number') return v;
  const s=String(v).trim();
  if(/free|免費/i.test(s)) return 0;
  const n=Number(s.replace(/[^\d.]/g,''));
  return isNaN(n)?null:n;
}
function inferSportType(name){
  if(/鐵人|triathlon|challenge|226|113|70\.3/i.test(name)) return 'triathlon';
  if(/越野|trail/i.test(name)) return 'trail_running';
  if(/超馬|ultra/i.test(name)) return 'ultra_marathon';
  if(/障礙/i.test(name)) return 'obstacle_race';
  if(/自行車|單車|cycling|bike/i.test(name)) return 'cycling';
  if(/泳渡|長泳|游泳|swim/i.test(name)) return 'other';
  return 'road_running';
}
function inferFormat(name,distanceRaw){
  const hay=name+' '+(distanceRaw||'');
  if(/接力|relay/i.test(hay)) return 'relay';
  if(/雙人|pair/i.test(hay)) return 'pair';
  if(/繞圈|loop/i.test(hay)) return 'loop';
  return 'solo';
}
function todayISO(){
  const d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function parseSheetRows(sheetName,rows,isCurated){
  let headerIdx=0;
  for(let i=0;i<Math.min(rows.length,5);i++){
    const rowText=(rows[i]||[]).map(c=>c==null?'':String(c)).join('|');
    if(rowText.includes('日期')||rowText.includes('項目')){headerIdx=i;break;}
  }
  const headerRow=rows[headerIdx]||[];
  const dataRows=rows.slice(headerIdx+1);
  const roles=inferColumnRoles(headerRow,dataRows);
  const candidates=[];
  dataRows.forEach(row=>{
    if(!row||row.every(c=>c==null||c==='')) return;
    let name='',dateISO=null,distRaw=null,distKm=null,venue='',fee=null;
    const noteParts=[];
    roles.forEach((role,i)=>{
      const v=(row||[])[i];
      if(v==null||v==='') return;
      if(role==='name'&&!name) name=String(v).trim();
      else if(role==='date'&&!dateISO) dateISO=cellToISODate(v);
      else if(role==='distance'&&distKm==null&&distRaw==null){const d=parseDistanceCell(v);distKm=d.km;distRaw=d.raw;}
      else if(role==='venue'&&!venue) venue=String(v).trim();
      else if(role==='fee'&&fee==null) fee=parseFeeCell(v);
      else if(role==='note'||role==='statusHint'){
        const label=(headerRow[i]==null||headerRow[i]==='')?'':String(headerRow[i])+': ';
        noteParts.push(label+String(v).trim());
      }
    });
    if(!name) return;
    const noteText=noteParts.join(' ｜ ');
    const hasRaceKeyword=RACE_KEYWORDS.test(name);
    const hasDistance=distKm!=null;
    const checked=isCurated?true:!!(dateISO&&(hasDistance||hasRaceKeyword));
    let status;
    if(/DNF/i.test(noteText)) status='dnf';
    else if(/DNS/i.test(noteText)) status='dns';
    else if(dateISO) status=(dateISO<todayISO())?'completed':'registered';
    else status='considering';
    candidates.push({
      sheetName,checked,name,dateISO:dateISO||'',distanceRaw:distRaw||'',distanceKm:distKm,
      venue,fee,status,note:noteText,
    });
  });
  return candidates;
}

let importWorkbook=null;
let importSheetChecks={};
let importCandidates=[];
let importErrorMessage='';
const importModalEl=document.getElementById('import-modal');

document.getElementById('btn-import').addEventListener('click',()=>{
  document.getElementById('import-file-input').click();
});
document.getElementById('import-file-input').addEventListener('change',async e=>{
  const file=e.target.files[0];
  e.target.value='';
  if(!file) return;
  try{
    if(typeof XLSX==='undefined'){
      throw new Error(t('ui.excelErrorLibFailed','Excel 解析工具載入失敗，請檢查網路連線後重新整理頁面再試一次（部分廣告或追蹤攔截外掛也可能擋到這個工具，可以先暫時停用試試看）。'));
    }
    const buf=await file.arrayBuffer();
    importWorkbook=XLSX.read(buf,{type:'array',cellDates:true});
    if(!importWorkbook.SheetNames||!importWorkbook.SheetNames.length){
      throw new Error(t('ui.excelErrorNoSheets','這個檔案裡沒有找到任何工作表。'));
    }
    importSheetChecks={};
    importWorkbook.SheetNames.forEach(n=>{importSheetChecks[n]=/^(19|20)\d{2}$/.test(n.trim());});
    if(!Object.values(importSheetChecks).some(Boolean)){
      importSheetChecks[importWorkbook.SheetNames[0]]=true;
    }
    importCandidates=[];
    showImportModal('select-sheets');
  }catch(err){
    console.error('Excel 匯入失敗',err);
    importErrorMessage=t('ui.excelErrorPrefix','無法解析這個檔案：')+err.message;
    showImportModal('error');
  }
});

function parseCheckedSheets(){
  importCandidates=[];
  importWorkbook.SheetNames.forEach(name=>{
    if(!importSheetChecks[name]) return;
    const ws=importWorkbook.Sheets[name];
    const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:null});
    const isCurated=/^(19|20)\d{2}$/.test(name.trim());
    importCandidates.push(...parseSheetRows(name,rows,isCurated));
  });
  importCandidates.sort((a,b)=>(a.dateISO||'9999').localeCompare(b.dateISO||'9999'));
}

      parseCheckedSheets();

    }catch(err){
      console.error('Excel 工作表解析失敗',err);

      showImportModal('error');

  if(e.target.closest('[data-action="check-none"]')){importCandidates.forEach(c=>c.checked=false);showImportModal('review');return;}

      race.raceFormat=inferFormat(c.name,c.distanceRaw);

      if(c.note) race.review.courseReview=`【Excel 匯入備註】${c.note}`;

importModalEl.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.sheet!=null){importSheetChecks[t.dataset.sheet]=t.checked;return;}
  const idx=t.dataset.idx;
  if(idx==null) return;
  const field=t.dataset.field;
  const c=importCandidates[Number(idx)];
  if(!c) return;
