/* ============================================================
   無感智慧預設：填賽事名稱、日期、抽籤結果這幾個欄位時，順手推論
   幾個「大概率使用者接下來也要填」的欄位，減少手動點選次數。每一項
   都有「只在還沒被使用者動過」的保護條件——這裡統一用「還是不是
   表單給的原始預設值」判斷，不是「還是不是空的」，因為 sportType／
   status 這兩個欄位本來就有預設值（不是空字串），一旦使用者已經
   手動選過別的選項，就不該再被猜測結果蓋掉，就算後來又把名稱／
   日期改了也一樣——保護的是「使用者是不是動過這個欄位」，不是
   「這次改的觸發欄位是什麼」。
   ============================================================ */
// guessSeriesFromName(name)：剝掉名稱開頭／結尾常見、但每年都會變動的
// 部分——西元年（20XX、20XX年）、民國年（1XX年，涵蓋民國 100~199
// 年，比只認「11X年」更耐用，不會過了民國 119 年就失效）、「第X屆」
// （X 可以是阿拉伯數字或中文數字）——剩下的當「系列名稱」的猜測值。
// 反覆剝是因為開頭可能同時有年份跟屆數（例如「2026年第10屆」），
// 單次只套一輪正則會漏掉疊在一起的第二層。剝完變成空字串，代表
// 名稱整段都是會變動的部分、沒有留下固定不變的系列名稱可用，這種
// 情況回傳 null，不要硬塞一個空字串進去。
function guessSeriesFromName(name){
  if(!name) return null;
  let s=name.trim();
  const patterns=[
    /^(20\d{2}年?|1\d{2}年)\s*/,
    /^第\s*[0-9一二三四五六七八九十百]+\s*屆\s*/,
    /\s*(20\d{2}年?|1\d{2}年)$/,
    /\s*第\s*[0-9一二三四五六七八九十百]+\s*屆$/,
  ];
  let changed=true;
  while(changed){
    changed=false;
    for(const p of patterns){
      const next=s.replace(p,'').trim();
      if(next!==s){ s=next; changed=true; }
    }
  }
  return s?s:null;
}
// guessSportTypeFromNameAndDistance(name, distanceKm)：名稱裡的關鍵字
// 判斷優先於距離——距離只能分辨「是不是超馬距離」，沒辦法區分路跑、
// 越野、鐵人這幾種質地完全不同的運動，名稱裡已經寫明是哪一種的話
// 應該用那個當準，不能被距離蓋過去（一場 10K 越野賽，距離上完全
// 不到超馬門檻，但名稱已經講得很清楚是越野跑，不該被判斷成路跑）。
// 關鍵字故意不用「水」「山」這種單一個字——這類地名本身就常帶這些
// 字（例如「水上鄉半程馬拉松」是嘉義地名，不是游泳賽事），只用
// 「泳渡」「游泳」這種完整詞組，降低誤判機率。
function guessSportTypeFromNameAndDistance(name,distanceKm){
  const n=(name||'').toLowerCase();
  const has=arr=>arr.some(k=>n.includes(k));
  if(has(['三鐵','鐵人三項','triathlon','ironman','226','113','70.3'])) return 'triathlon';
  if(has(['二鐵','鐵人二項','duathlon'])) return 'duathlon';
  if(has(['越野','trail','utmb','utmf','山徑','skyrunning','sky running'])) return 'trail_running';
  if(has(['障礙','obstacle','spartan','斯巴達','ninja'])) return 'obstacle_race';
  if(has(['泳渡','游泳','swimming','open water','公開水域'])) return 'swimming';
  if(has(['自行車','單車','公路車','cycling','bike','kom'])) return 'cycling';
  if(distanceKm!=null&&distanceKm>50) return 'ultra_marathon';
  return null;
}
// applySmartDefaults(race, changedPath)：實際套用上面兩個猜測函式，
// 加上狀態的「時光機」判斷。回傳這次實際自動改了哪些欄位（陣列，
// 可能是空陣列），呼叫端用這個決定要不要顯示「已自動帶入」的提示。
function applySmartDefaults(race,changedPath){
  const filled=[];
  if(changedPath==='name'&&!race.series){
    const guessed=guessSeriesFromName(race.name);
    if(guessed){ race.series=guessed; filled.push('series'); }
  }
  if((changedPath==='name'||changedPath==='route.distanceKm')&&race.sportType==='road_running'){
    const guessed=guessSportTypeFromNameAndDistance(race.name,race.route.distanceKm);
    if(guessed&&guessed!=='road_running'){ race.sportType=guessed; filled.push('sportType'); }
  }
  if(changedPath==='schedule.raceDate'&&race.schedule.raceDate&&race.status==='considering'){
    const d=new Date(race.schedule.raceDate+'T00:00:00');
    const today=new Date(todayISO()+'T00:00:00');
    if(!isNaN(d)&&d<today){ race.status='completed'; filled.push('status'); }
  }
  if(changedPath==='lottery.wasSelected'&&race.lottery.wasSelected&&(race.status==='considering'||race.status==='lottery_pending')){
    race.status='registered'; filled.push('status');
  }
  return filled;
}
// quickSetRaceStatus(race, newStatus)：把一場賽事的狀態改成 newStatus，
// 包含鞋款里程門檻提醒、無感智慧預設、裝備範本自動套用這一整套邏輯
// ——賽事詳情頁的狀態下拉選單（跟連動的生命週期軌道）、手機版滑動
// 清單向右滑完賽（見下方 swipe-to-action 區塊），呼叫的是同一份函式，
// 不是各自維護一份容易兜不起來的重複邏輯。只負責改資料、存檔、跳出
// 對應的提示 toast，不負責事後要重新畫哪些畫面（列表、詳情頁）——
// 兩個呼叫端的畫面情境差很多（有沒有開著詳情頁、要不要整頁重繪），
// 留給各自呼叫端自己處理。回傳這次連帶觸發的無感智慧預設欄位（陣列，
// 通常是空的，因為「狀態本身改變」目前沒有任何一條智慧預設規則會
// 對它起反應，保留這個回傳值只是讓這個函式的行為跟其他呼叫
// applySmartDefaults() 的地方維持一致的介面，不代表現在就有用到）。
// setRaceStatusFromUi(race, newStatus)：從畫面上改狀態時走這一份。
// 核心資料邏輯（鞋款門檻提醒、無感智慧預設、裝備範本自動套用、存檔）
// 在 quickSetRaceStatus() 裡，跟手機滑動完賽共用；這一層再加上畫面
// 專屬的事情——存檔提示、重繪、完賽時自動展開並捲到賽後紀錄。
// 抽出來的理由：生命週期軌道（考慮中→抽籤中→…那排節點）原本是去找
// 畫面上的 #f-status 下拉選單、設值再送出 change 事件來間接觸發這段
// 邏輯；但「基本資訊與時間」的欄位搬進抽屜之後，抽屜沒打開時那個
// 下拉選單根本不在畫面上，軌道會變成點了完全沒反應、也不會報錯。
// 改成兩個入口都直接呼叫這一份，不再依賴某個 DOM 元素存不存在。
async function setRaceStatusFromUi(race,newStatus){
  const prevStatus=race.status;
  showSaveStatus('saving');
  const smartFilled=await quickSetRaceStatus(race,newStatus);
  renderCalendar();
  if(smartFilled.length){
    smartFilledHighlightPaths=new Set(smartFilled);
    setTimeout(()=>{ smartFilledHighlightPaths=new Set(); },2500);
  }
  renderDetail();
  showSaveStatus('saved');
  if(newStatus==='completed'&&prevStatus!=='completed'){
    const postSection=document.getElementById('section-post');
    if(postSection){
      postSection.open=true;
      postSection.scrollIntoView({behavior:'smooth',block:'start'});
    }
  }
}
async function quickSetRaceStatus(race,newStatus){
  const prevStatus=race.status;
  const shoeForAlert=(newStatus==='completed'&&prevStatus!=='completed'&&race.performanceData.shoeId)
    ?shoes.find(s=>s.id===race.performanceData.shoeId):null;
  const oldShoePct=shoeForAlert?shoeHealthPct(shoeForAlert,computeShoeStats(shoeForAlert.id).totalDistance):null;
  race.status=newStatus;
  race.updatedAt=new Date().toISOString();
  const smartFilled=applySmartDefaults(race,'status');
  const templateApplied=smartFilled.includes('sportType')&&autoApplyEquipmentTemplate(race);
  await persist();
  if(templateApplied){
    const el=document.createElement('div');
    el.className='foreground-toast';
    el.innerHTML=`<strong>${window.t('ui.templateAutoApplied','已自動套用裝備範本')}</strong>`;
    document.body.appendChild(el);
    setTimeout(()=>{ el.remove(); },4000);
  }
  if(shoeForAlert&&oldShoePct!=null){
    const newPct=shoeHealthPct(shoeForAlert,computeShoeStats(shoeForAlert.id).totalDistance);
    let alertMsg=null;
    if(oldShoePct<100&&newPct>=100){
      alertMsg=window.tf('ui.shoeAlert100',`注意：您的 ${shoeForAlert.name} 累積里程已達設定壽命的 100%，建議儘快更換戰靴！`,shoeForAlert.name);
    }else if(oldShoePct<80&&newPct>=80){
      alertMsg=window.tf('ui.shoeAlert80',`注意：您的 ${shoeForAlert.name} 累積里程已達設定壽命的 80%，建議開始物色下一雙戰靴！`,shoeForAlert.name);
    }
    if(alertMsg){
      const shoeToastEl=document.createElement('div');
      shoeToastEl.className='foreground-toast';
      // alertMsg 內含使用者自訂的鞋款名稱，必須跳脫後才能放進 innerHTML
      shoeToastEl.innerHTML=`<strong>${escapeHtml(alertMsg)}</strong>`;
      document.body.appendChild(shoeToastEl);
      setTimeout(()=>{ shoeToastEl.remove(); },6000);
    }
  }
  return smartFilled;
}
/* ============================================================
   個人資訊：心率區間（儲備心率法）與身體數據
   跟賽事資料分開存一份獨立檔案，是「人」的資料，不是「賽事」的資料，
   所有賽事共用同一份。心率區間依跑步／騎車／游泳三種運動分開設定，
   因為同一個人在不同運動項目下的最大心率通常不一樣。
   ============================================================ */
const PROFILE_KEY='user-profile-v1';
let userProfile=null;
function emptyUserProfile(){
  return {
    age:null,gender:'',weightKg:null,heightCm:null,bodyFatPct:null,muscleMassKg:null,
    hr:{
      running:{restingHr:null,maxHr:null},
      cycling:{restingHr:null,maxHr:null},
      swimming:{restingHr:null,maxHr:null},
    },
  };
}
// countFilledProfileFields()：個人資料實際填了幾個欄位。心率是巢狀在
// hr.running / hr.cycling / hr.swimming 底下的 restingHr / maxHr，不是
// 平鋪在最外層——同步診斷要顯示筆數、合併時要判斷「本機是不是空的」，
// 兩邊都靠這個函式，避免各寫一份、其中一份記錯結構。
function countFilledProfileFields(p){
  const src=p||userProfile;
  if(!src) return 0;
  let n=0;
  ['age','gender','weightKg','heightCm','bodyFatPct','muscleMassKg'].forEach(k=>{
    const v=src[k];
    if(v!=null&&v!=='') n++;
  });
  Object.keys(src.hr||{}).forEach(sport=>{
    const z=src.hr[sport]||{};
    if(z.restingHr!=null) n++;
    if(z.maxHr!=null) n++;
  });
  return n;
}
function migrateUserProfile(p){
  const base=emptyUserProfile();
  if(!p) return base;
  const merged=Object.assign({},base,p);
  merged.hr=Object.assign({},base.hr,p.hr||{});
  merged.hr.running=Object.assign({},base.hr.running,merged.hr.running||{});
  merged.hr.cycling=Object.assign({},base.hr.cycling,merged.hr.cycling||{});
  merged.hr.swimming=Object.assign({},base.hr.swimming,merged.hr.swimming||{});
  return merged;
}
async function loadUserProfile(){
  try{
    userProfile=migrateUserProfile(await loadJson(PROFILE_KEY,null));
  }catch(err){
    userProfile=emptyUserProfile();
  }
}
async function persistUserProfile(){
  try{
    await saveJson(PROFILE_KEY,userProfile);
  }catch(err){
    console.error('個人資訊儲存失敗',err);showStorageError();
  }
  scheduleGlobalListsSync();
}
// 儲備心率法（Karvonen）：心率區間 = 安靜心率 + (最大心率−安靜心率) × 強度百分比。
// Z1 下限採安靜心率本身，往上依 60/70/80/90/100% 切成五段，跟主流穿戴裝置
// （如 Polar）的 5 區間慣例一致。
const KARVONEN_ZONE_BOUNDS=[0,0.6,0.7,0.8,0.9,1.0];
function karvonenZones(restingHr,maxHr){
  if(restingHr==null||maxHr==null||restingHr<=0||maxHr<=restingHr) return null;
  const hrr=maxHr-restingHr;
  const cutoffs=KARVONEN_ZONE_BOUNDS.map(p=>Math.round(restingHr+hrr*p));
  const zones=[];
  for(let i=0;i<5;i++) zones.push({zone:i+1,low:cutoffs[i],high:cutoffs[i+1]});
  return zones;
}
function karvonenZoneForHr(zones,hr){
  if(!zones||hr==null) return null;
  for(const z of zones){ if(hr<=z.high) return z; }
  return zones[zones.length-1];
}
const HR_ZONE_COLORS=['var(--stone)','var(--contour)','var(--trail)','var(--gold)','var(--flag)'];
// 心率區間目前只靠顏色分辨（Z1~Z5 各配一個顏色），色盲使用者（尤其紅綠
// 色弱，偏偏綠→金→紅這種漸層正好是最容易搞混的組合）光看顏色很難
// 分辨區間。這裡加一個不依賴顏色的「柱狀強度」圖示：5 根由矮到高的
// 直條，區間 N 就把前 N 根塗實、其餘畫空心——類似訊號強度格數的概念，
// 不用讀數字、掃一眼柱子填了幾根就知道區間高低，柱子本身的「形狀」
// （填了幾根、高度遞增）才是真正傳遞資訊的東西，顏色只是額外輔助，
// 拿掉顏色（例如印成灰階、或色盲使用者眼中顏色都差不多）這個圖示
// 一樣看得懂。
function hrZoneBarsSvg(zoneNum,color){
  if(zoneNum==null) return '';
  const heights=[4,6,8,10,12];
  const bars=heights.map((h,i)=>{
    const x=i*4;
    const y=12-h;
    const filled=i<zoneNum;
    return filled
      ?`<rect x="${x}" y="${y}" width="3" height="${h}" fill="${color}" rx="0.5"/>`
      :`<rect x="${x}" y="${y}" width="3" height="${h}" fill="none" stroke="${color}" stroke-width="1" rx="0.5"/>`;
  }).join('');
  return `<svg class="hr-zone-bars" viewBox="0 0 20 14" width="20" height="14" aria-hidden="true">${bars}</svg>`;
}
/* 跑步步頻的「每分鐘單腳」換算
   錶在 FIT 檔裡記的 cadence 欄位，跑步時是「單腳每分鐘踏步數」（跟自行車
   共用同一個欄位、同樣是 RPM 的語意），所以一場正常的跑步會記成 80～95，
   而跑者實際講的步頻是雙腳合計的 160～190 spm——差剛好兩倍。
   為什麼要加數值範圍的防呆，不是看到跑步就乘二：有些錶（或先經過 Strava
   之類平台轉檔的檔案）已經直接寫成雙腳合計了，那種再乘二會變成 340 這種
   明顯荒謬的數字。只有落在「單腳」合理區間（30～120）的才換算，已經是
   雙腳合計的值原封不動。
   這個範圍限制還有一個好處：對同一筆資料重複執行也不會再乘一次
   （86→172，而 172 已經超出區間），所以舊資料的補正可以安全地重跑。 */
const RUNNING_SPORT_TYPES=['road_running','trail_running','ultra_marathon','obstacle_race'];
/* backfillRunningCadence()：這個修正之前匯入的跑步賽事，步頻存的是單腳
   的數字。啟動時一次補正。因為換算有數值範圍限制（只換算 30～120），
   已經正確的資料不會被動到，重複執行也不會再乘一次。 */
function backfillRunningCadence(){
  let changed=0;
  state.races.forEach(r=>{
    const cur=r.performanceData&&r.performanceData.avgCadence;
    const fixed=normalizeRunningCadence(cur,r.sportType);
    if(fixed!==cur){ r.performanceData.avgCadence=fixed; changed++; }
    (r.legs||[]).forEach(leg=>{
      if(leg.sport!=='running') return;
      const lf=normalizeRunningCadence(leg.avgCadence,'road_running');
      if(lf!==leg.avgCadence){ leg.avgCadence=lf; changed++; }
    });
  });
  return changed>0;
}
function isRunningSportType(sportType){ return RUNNING_SPORT_TYPES.includes(sportType); }
function normalizeRunningCadence(cad,sportType){
  if(cad==null) return cad;
  if(!isRunningSportType(sportType)) return cad;
  // 上限取 110 而不是更寬：單腳 110 已經等於雙腳 220 spm、超過菁英選手
  // 的水準，實際不會出現；而「總步頻 111 以上」是真實存在的數值，留在
  // 區間外才不會被誤乘。110 以下仍有一段模糊地帶——走路很多的超馬，
  // 雙腳合計可能就落在 100～110——這種情況無法只靠數字分辨，只能接受。
  return (cad>=30&&cad<=110)?Math.round(cad*2):cad;
}
function sportToProfileCategory(sportType){
  if(sportType==='cycling') return 'cycling';
  if(sportType==='swimming') return 'swimming';
  return 'running';
}
// 賽後紀錄裡分段配速一覽的心率顯示，優先用使用者依運動類型設定好的
// 個人化儲備心率區間；還沒設定個人資訊、或該運動類型沒填心率資料時，
// 退回原本單純「心率 ÷ 這場賽事填的最大心率」的估算方式。
function hrZoneInfoForRace(hr,race){
  if(hr==null) return null;
  const category=sportToProfileCategory(race.sportType);
  const profileHr=userProfile&&userProfile.hr&&userProfile.hr[category];
  if(profileHr&&profileHr.restingHr!=null&&profileHr.maxHr!=null){
    const zones=karvonenZones(profileHr.restingHr,profileHr.maxHr);
    if(zones){
      const z=karvonenZoneForHr(zones,hr);
      if(z) return {zone:z.zone,color:HR_ZONE_COLORS[z.zone-1]};
    }
  }
  return hrZoneInfo(hr,race.performanceData?race.performanceData.maxHr:null);
}

const SHOES_KEY='shoes-v1';
const DEFAULT_SHOE_TARGET_KM=600;
let shoes=[];
function migrateShoe(s){

}

/* ============================================================
   補給品資料庫（nutritionDictionary）：跟 shoes 一樣是「全域、跨賽事
   共用」的清單，不是掛在單一賽事底下——同一款能量膠通常會在好幾場
   比賽用到，補給資料只要建一次，之後每場賽事的補給時程規劃選一下
   就能自動帶入碳水、鈉含量，不用每場重複手動輸入營養成分。
   ============================================================ */
const NUTRITION_DICT_KEY='nutrition-dictionary-v1';
let nutritionDictionary=[];
function migrateNutritionDictItem(it){
  if(it.carbGrams===undefined) it.carbGrams=null;
  if(it.sodiumMg===undefined) it.sodiumMg=null;
  if(it.caffeineMg===undefined) it.caffeineMg=null;
  if(!Array.isArray(it.tags)) it.tags=[];
  return it;
}
async function loadNutritionDictionary(){
  try{
    nutritionDictionary=await loadJson(NUTRITION_DICT_KEY,[]);
    nutritionDictionary=nutritionDictionary.map(migrateNutritionDictItem);
  }catch(err){
    nutritionDictionary=[];
  }
}
async function persistNutritionDictionary(){
  try{
    await saveJson(NUTRITION_DICT_KEY,nutritionDictionary);
  }catch(err){
    console.error('補給品資料庫儲存失敗',err);showStorageError();
  }
  scheduleGlobalListsSync();
}
// 這場賽事的補給時程規劃裡，每一筆只要連結了資料庫項目（dictionaryItemId）
// 又填了數量（qty），就用「數量 × 該項目的碳水／鈉含量」加總；沒有連結
// 資料庫的自訂文字項目（例如手動輸入的「香蕉」）不計入這個加總，因為
// 沒有結構化的營養數字可以算。
function computeNutritionTotals(race){
  const items=race.nutritionSchedule||[];
  let totalCarbG=0,totalSodiumMg=0,totalCaffeineMg=0,countedItems=0;
  items.forEach(it=>{
    if(!it.dictionaryItemId||it.qty==null) return;
    const dict=nutritionDictionary.find(d=>d.id===it.dictionaryItemId);
    if(!dict) return;
    countedItems++;
    if(dict.carbGrams!=null) totalCarbG+=dict.carbGrams*it.qty;
    if(dict.sodiumMg!=null) totalSodiumMg+=dict.sodiumMg*it.qty;
    if(dict.caffeineMg!=null) totalCaffeineMg+=dict.caffeineMg*it.qty;
  });
  return {totalCarbG,totalSodiumMg,totalCaffeineMg,countedItems,totalItems:items.length};
}
// computeShoeStats(shoeId)：這雙鞋的總里程，包含兩個來源——這個 App
// 記錄的比賽距離（raceDistance，從綁定這雙鞋的完賽賽事加總），跟
// 使用者自己填的訓練里程（trainingDistance，這個 App 本身不記錄日常
// 訓練，這個數字通常是從 Strava 之類的運動記錄軟體另外抄過來的）。
// totalDistance 是兩者相加，既有呼叫這個函式只取 .totalDistance 的
// 地方（例如判斷鞋子有沒有到壽命）不用改，會自動把訓練里程也算
// 進去；需要分開顯示兩個來源的地方（鞋款管理畫面）則另外取
// .raceDistance／.trainingDistance。
// 多項運動：總距離是多個項目加起來的，不能整包算進單一裝備
const MULTISPORT_TYPES=['triathlon','duathlon'];
/* shoeDistanceOfRace(race)：這場賽事該記到鞋子頭上的里程。
   三鐵／多項賽事不能用 race.route.distanceKm——那是全程距離（226 公里
   裡有 3.8 游泳、180 騎車），鞋子只有跑步段在穿。有分項資料時只取
   sport==='running' 的段落加總；沒有分項資料的多項賽事寧可回 0，
   也不要把游泳與騎車的距離灌進鞋子壽命：少算可以補，多算會讓人
   以為鞋子該退役了。單項跑步賽事維持全程距離。 */
function shoeDistanceOfRace(race){
  const legs=race.legs||[];
  if(legs.length>=2){
    const runKm=legs.filter(l=>l.sport==='running').reduce((s2,l)=>s2+(l.distanceKm||0),0);
    return runKm||0;
  }
  if(MULTISPORT_TYPES.includes(race.sportType)) return 0;
  return race.route.distanceKm||0;
}
function computeShoeStats(shoeId){
  const races=state.races.filter(r=>r.performanceData&&r.performanceData.shoeId===shoeId&&r.status==='completed'&&!r.deletedAt);
  const raceDistance=races.reduce((s,r)=>s+shoeDistanceOfRace(r),0);
  const shoe=shoes.find(s=>s.id===shoeId);
  const trainingDistance=(shoe&&shoe.trainingKm)||0;
  return {totalRaces:races.length,raceDistance,trainingDistance,totalDistance:raceDistance+trainingDistance};
}
// 戰靴勝率：穿這雙鞋跑過的每一場完賽賽事，抓 PB 率（幾場裡面破了幾次
// PB，依 results.isPb 這個使用者自己勾選的欄位算，不是系統自動判斷）
// 跟平均配速（用完賽時間除以距離，兩者都要有值才算得出來，缺一就跳過
// 那一場，不會拿 0 去污染平均值）。
function computeShoePerformanceStats(shoeId){
  const races=state.races.filter(r=>!r.deletedAt&&r.status==='completed'&&r.performanceData&&r.performanceData.shoeId===shoeId);
  if(!races.length) return null;
  const pbCount=races.filter(r=>r.results.isPb).length;
  // 平均配速同樣要用跑步段：三鐵拿全程時間除以全程距離，算出來的不是
  // 這雙鞋的配速。有分項資料就用跑步段的時間與距離，沒有就跳過那一場。
  const paceOf=r=>{
    const legs=r.legs||[];
    if(legs.length>=2){
      const run=legs.filter(l=>l.sport==='running');
      const km=run.reduce((s2,l)=>s2+(l.distanceKm||0),0);
      const sec=run.reduce((s2,l)=>s2+(l.durationSeconds||0),0);
      return (km>0&&sec>0)?sec/km:null;
    }
    // 多項賽事沒有分項資料時跳過：拿 226 公里的總時間除以總距離，得到的
    // 是一個比跑步慢不了多少的假配速，會把平均值整個拉歪。
    if(MULTISPORT_TYPES.includes(r.sportType)) return null;
    return (r.results.chipTimeSeconds!=null&&r.route.distanceKm)?r.results.chipTimeSeconds/r.route.distanceKm:null;
  };
  const paces=races.map(paceOf).filter(v=>v!=null);
  const avgPaceSecPerKm=paces.length?paces.reduce((s2,v)=>s2+v,0)/paces.length:null;
  const sorted=races.slice().sort((a,b)=>(b.schedule.raceDate||'').localeCompare(a.schedule.raceDate||''));
  return {totalRaces:races.length,pbCount,avgPaceSecPerKm,races:sorted};
}
// 衰退交叉比對：對每一場「穿這雙鞋、有填分段時間、日期已知」的完賽賽事，
// 算出這雙鞋在「跑這一場之前」已經累積了多少公里（不含這場本身的距離，
// 因為要看的是「鞋子已經多舊」對這場比賽表現的影響，不是這場本身對
// 累積里程的貢獻），再對照 computeSplitPercent() 算出來的後半程掉速
// 百分比。有足夠資料的話，用這雙鞋預期壽命的一半當分界，比較「還算
// 新」跟「已經跑得比較舊」這兩組賽事的平均掉速幅度差多少。
function computeShoeDegradation(shoeId){
  const shoe=shoes.find(s=>s.id===shoeId);
  if(!shoe) return null;
  const races=state.races
    .filter(r=>!r.deletedAt&&r.status==='completed'&&r.performanceData&&r.performanceData.shoeId===shoeId&&r.schedule.raceDate)
    .sort((a,b)=>a.schedule.raceDate.localeCompare(b.schedule.raceDate));
  let cumKm=0;
  const points=[];
  races.forEach(r=>{
    const splitPct=computeSplitPercent(r);
    if(splitPct!=null) points.push({race:r,mileageBefore:cumKm,splitPct});
    cumKm+=shoeDistanceOfRace(r);
  });
  if(!points.length) return {points:[],threshold:null,early:null,late:null};
  const threshold=(shoe.targetKm||DEFAULT_SHOE_TARGET_KM)/2;
  const avg=arr=>arr.length?arr.reduce((s,p)=>s+p.splitPct,0)/arr.length:null;
  const early=points.filter(p=>p.mileageBefore<threshold);
  const late=points.filter(p=>p.mileageBefore>=threshold);
  return {
    points,threshold,
    early:early.length?{count:early.length,avgSplitPct:avg(early)}:null,
    late:late.length?{count:late.length,avgSplitPct:avg(late)}:null,
  };
}
function shoeHealthPct(shoe,totalDistance){
  const target=shoe.targetKm||DEFAULT_SHOE_TARGET_KM;
  if(target<=0) return 0;
  return (totalDistance/target)*100;
}
function shoeHealthTierColor(pct){
  if(pct<=50) return 'var(--trail)';
  if(pct<=80) return 'var(--gold)';
  return 'var(--flag)';
}
function shoeHealthStatusKey(pct){
  if(pct<=50) return 'inService';
  if(pct<=80) return 'midsoleDecline';
  return 'recommendReplace';
}
function shoeHealthStatusLabel(pct){
  const key=shoeHealthStatusKey(pct);
  if(key==='inService') return t('ui.shoeStatusInService','服役中');
  if(key==='midsoleDecline') return t('ui.shoeStatusDecline','中底彈性開始衰退');
  return t('ui.shoeStatusReplace','已達退役里程，注意受傷風險');
}
const SHOE_HP_SEGMENTS=5;
function shoeHealthSegmentsHtml(pct){
  const filled=Math.min(SHOE_HP_SEGMENTS,Math.max(0,Math.ceil((Math.min(pct,100)/100)*SHOE_HP_SEGMENTS)));
  const color=shoeHealthTierColor(pct);
  const blink=pct>80;
  let html='';
  for(let i=0;i<SHOE_HP_SEGMENTS;i++){
    const isFilled=i<filled;
    html+=`<span class="shoe-hp-segment${isFilled?' filled':''}${isFilled&&blink?' blink':''}"${isFilled?` style="background:${color}"`:''}></span>`;
  }
  return html;
}

/* ============================================================
   徽章系統：定義與判定引擎
   每個徽章的 check(ctx) 回傳 {unlocked, progress(0~100), triggerRaceId}。
   triggerRaceId 是「造成解鎖的那一場賽事」，用來讓使用者事後點進那場
   賽事時能補放開箱動畫（尤其是這個功能上線前就已經達成的舊紀錄）。
   ============================================================ */
function buildBadgeContext(){
  const completed=state.races.filter(r=>r.status==='completed'&&!r.deletedAt&&r.schedule.raceDate)
    .slice().sort((a,b)=>a.schedule.raceDate.localeCompare(b.schedule.raceDate));
  const dnf=state.races.filter(r=>r.status==='dnf'&&!r.deletedAt&&r.schedule.raceDate)
    .slice().sort((a,b)=>a.schedule.raceDate.localeCompare(b.schedule.raceDate));
  const finished=state.races.filter(r=>['completed','dns','dnf'].includes(r.status)&&!r.deletedAt&&r.schedule.raceDate)
    .slice().sort((a,b)=>a.schedule.raceDate.localeCompare(b.schedule.raceDate));
  return {completed,dnf,finished,homeCountry:detectHomeCountry()};
}
function isHalfMarathonDist(km){ return km!=null&&km>=20&&km<=22; }
function isMarathonDist(km){ return km!=null&&km>=41&&km<=43.5; }
// 偵測海拔剖面圖中「明顯」的山峰／谷底交替次數：方向反轉，且跟上一個
// 轉折點的落差達到最小顯著高度（避免把微小雜訊誤判成一個山頭）才算數。
function countElevationAlternations(profile,minProminenceM){
  if(!profile||profile.length<3) return 0;
  let alternations=0,direction=null,lastExtremeElev=profile[0].elevationM;
  for(let i=1;i<profile.length;i++){
    const diff=profile[i].elevationM-profile[i-1].elevationM;
    const newDir=diff>0?'up':(diff<0?'down':direction);
    if(direction&&newDir&&newDir!==direction){
      if(Math.abs(profile[i-1].elevationM-lastExtremeElev)>=minProminenceM){
        alternations++;
        lastExtremeElev=profile[i-1].elevationM;
      }
    }
    if(newDir) direction=newDir;
  }
  return alternations;
}
function countUnlockedBadge(count,target,triggerRace){
  return {unlocked:count>=target,progress:Math.min(100,Math.round(count/target*100)),triggerRaceId:count>=target?triggerRace:null};
}
function consecutiveWeekendsBadge(completed,targetStreak){
  const dates=[...new Set(completed.map(r=>r.schedule.raceDate))].sort();
  if(!dates.length) return {unlocked:false,progress:0,triggerRaceId:null};
  let streak=1,best=1,bestEndDate=dates[0];
  for(let i=1;i<dates.length;i++){
    const gap=(new Date(dates[i])-new Date(dates[i-1]))/86400000;
    if(gap<=7&&gap>=1){ streak++; }else if(gap>7){ streak=1; }
    if(streak>best){ best=streak; bestEndDate=dates[i]; }
  }
  const triggerRace=completed.find(r=>r.schedule.raceDate===bestEndDate);
  return countUnlockedBadge(best,targetStreak,triggerRace?triggerRace.id:null);
}

          const d=nutritionDictionary.find(x=>x.id===it.dictionaryItemId);
          if(d&&d.caffeineMg!=null) caf+=d.caffeineMg*((it.qty!=null&&it.qty>0)?it.qty:1);
        });
        if(caf>best){ best=caf; trigger=r.id; }
      });
      return countUnlockedBadge(Math.floor(best),200,trigger);
    }},
  {id:'everest_climber',order:37,category:'gear',icon:'🏔️',name:'珠峰高度',hint:'生涯累計爬升達到 8,848 公尺（一座聖母峰）',
    check(ctx){
      let sum=0,trigger=null;
      for(const r of ctx.completed){
        sum+=r.route.elevationGainM||0;
        if(sum>=8848&&!trigger) trigger=r.id;
      }
      return countUnlockedBadge(Math.floor(sum),8848,trigger);
    }},
  {id:'annual_streak',order:38,category:'gear',icon:'📅',name:'年年不缺席',hint:'連續 3 個年份都有完賽紀錄',
    check(ctx){
      const years=[...new Set(ctx.completed.map(r=>r.schedule.raceDate.slice(0,4)))].sort();
      let best=1,cur=1,bestEndYear=years[0];
      for(let i=1;i<years.length;i++){
        if(Number(years[i])===Number(years[i-1])+1){ cur++; if(cur>best){ best=cur; bestEndYear=years[i]; } }
        else cur=1;
      }
      if(!years.length) return countUnlockedBadge(0,3,null);
      const trigger=ctx.completed.filter(r=>r.schedule.raceDate.startsWith(bestEndYear))[0];
      return countUnlockedBadge(best,3,trigger&&trigger.id);
    }},
];

/* ============================================================
   徽章系統：解鎖偵測、開箱佇列
   checkAndRecordBadgeUnlocks() 掃過全部徽章，把新達成的記錄下來
   （seen:false，還沒播過開箱動畫）。真正播放動畫由呼叫端決定時機：
   完賽當下如果剛好是「這場賽事觸發的」，立刻播；如果是舊資料補判定
   出來的（這個功能上線前就已經達成），先靜靜記住，等使用者哪天點
   進當初那場觸發的賽事，才補放動畫，不會一開網站就被轟炸。
   ============================================================ */
function checkAndRecordBadgeUnlocks(){
  const ctx=buildBadgeContext();
  const newlyUnlockedIds=[];
  BADGE_DEFINITIONS.forEach(badge=>{
    if(badgeUnlocks[badge.id]) return;
    let result;
    try{ result=badge.check(ctx); }catch(err){ console.error('徽章判定失敗：'+badge.id,err); return; }
    if(result&&result.unlocked){
      badgeUnlocks[badge.id]={unlockedAt:new Date().toISOString(),seen:false,triggerRaceId:result.triggerRaceId||null};
      newlyUnlockedIds.push(badge.id);
    }
  });
  if(newlyUnlockedIds.length) persistBadgeUnlocks();
  return newlyUnlockedIds;
}
let badgeUnboxingQueue=[];
let badgeUnboxingActive=false;
function queueBadgeUnboxing(badgeIds){
  badgeIds.forEach(id=>{ if(!badgeUnboxingQueue.includes(id)) badgeUnboxingQueue.push(id); });
  processNextBadgeUnboxing();
}
function processNextBadgeUnboxing(){
  if(badgeUnboxingActive||!badgeUnboxingQueue.length) return;
  const id=badgeUnboxingQueue.shift();
  showBadgeUnboxing(id);
}
// 針對「剛好是這場賽事觸發的」未讀徽章，找出來排進開箱佇列；
// 用在剛完賽當下、以及使用者點進任何一場賽事時（讓舊資料補判定出來的
// 徽章，事後點進當初觸發的那場賽事也能補放動畫）。
function checkRaceForBadgeUnboxing(raceId){
  if(!raceId) return;
  const ids=Object.keys(badgeUnlocks).filter(id=>{
    const u=badgeUnlocks[id];
    return u&&!u.seen&&u.triggerRaceId===raceId;
  });
  if(ids.length) queueBadgeUnboxing(ids);
}
// 有些徽章的達成條件不是綁定單一場賽事（例如累積使用滿 5 雙不同鞋款的
// 「千足蜈蚣」、鞋款退役時累積里程滿壽命的「千里老兵」），這種徽章的
// triggerRaceId 一律是 null，永遠不會被 checkRaceForBadgeUnboxing 配對到
// ——如果沒有這個函式，這類徽章解鎖了也永遠不會播放開箱動畫。剛判定出
// 新解鎖的徽章清單裡，只要是這種沒有對應賽事的，直接排進開箱佇列。
function queueNoTriggerBadges(newlyUnlockedIds){
  const ids=(newlyUnlockedIds||[]).filter(id=>badgeUnlocks[id]&&!badgeUnlocks[id].triggerRaceId);
  if(ids.length) queueBadgeUnboxing(ids);
}
function confettiHtml(){
  const colors=['#2E6B49','#D9B15C','#B8451F','#3A5A8C','#C4001D'];
  let html='';
  for(let i=0;i<60;i++){
    const left=(Math.random()*100).toFixed(1);
    const delay=(Math.random()*0.6).toFixed(2);
    const duration=(2.2+Math.random()*1.2).toFixed(2);
    const color=colors[Math.floor(Math.random()*colors.length)];
    const w=(6+Math.random()*6).toFixed(0);
    html+=`<span class="confetti-piece" style="left:${left}%;background:${color};width:${w}px;height:${Math.round(w*0.4)}px;animation-delay:${delay}s;animation-duration:${duration}s;"></span>`;
  }
  return `<div class="confetti-layer">${html}</div>`;
}
function showBadgeUnboxing(badgeId){
  const badge=BADGE_DEFINITIONS.find(b=>b.id===badgeId);
  if(!badge){ processNextBadgeUnboxing(); return; }
  badgeUnboxingActive=true;
  const reduceMotion=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const overlay=document.createElement('div');
  overlay.className='badge-unbox-overlay';
  overlay.innerHTML=`
    ${reduceMotion?'':confettiHtml()}
    <div class="badge-unbox-card">
      <div class="badge-unbox-icon">${badge.icon}</div>
      <div class="badge-unbox-label small">${t('ui.badgeUnlockedLabel','徽章解鎖')}</div>
      <div class="badge-unbox-name">${escapeHtml(badge.name)}</div>
      <div class="badge-unbox-hint small">${escapeHtml(badge.hint)}</div>
      <div class="badge-unbox-actions">
        <button type="button" class="btn-ghost badge-unbox-share" data-id="${badge.id}">${t('ui.badgeDownloadShare','下載成就圖')}</button>
        <button type="button" class="btn-primary badge-unbox-collect">${t('ui.badgeCollect','收下徽章')}</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  overlay.querySelector('.badge-unbox-share').addEventListener('click',()=>{
    downloadBadgeShareImage(badgeId);
  });
  overlay.querySelector('.badge-unbox-collect').addEventListener('click',()=>{
    overlay.classList.add('closing');
    setTimeout(()=>{
      overlay.remove();
      const u=badgeUnlocks[badgeId];
      if(u){ u.seen=true; persistBadgeUnlocks(); }
      badgeUnboxingActive=false;
      renderCalendar();
      processNextBadgeUnboxing();
    },reduceMotion?0:300);
  });
}

function purgeOldTrash(){
  const cutoff=Date.now()-TRASH_RETENTION_DAYS*86400000;
  const before=state.races.length;
  state.races=state.races.filter(r=>!(r.deletedAt&&new Date(r.deletedAt).getTime()<cutoff));
  return before!==state.races.length;
}
function recoveryCount(){
  return state.races.filter(r=>r.deletedAt).length+syncOverwrites.length;
}

// renderField() 拿這個決定要不要加上短暫的高亮動畫，讓使用者看得出

// 存檔後的 change 監聽器裡填入，2.5 秒後自動清空（見那裡的說明），
// 不會一直殘留、讓之後跟這次無關的重新渲染也誤觸發動畫。
let smartFilledHighlightPaths=new Set();
function renderField(race,cfg,ns){
  const val=getPath(race,cfg.path);
  const id=pathToId(cfg.path);
  const label=ns?t('field.'+ns+'.'+(cfg.labelPath||cfg.path),cfg.label):cfg.label;
  let input;
  switch(cfg.type){
    case 'select':{
      const optNs=OPTION_SET_NS.get(cfg.options);
      input=`<select id="${id}" data-path="${cfg.path}"><option value="">—</option>${cfg.options.map(o=>`<option value="${o.value}" ${val===o.value?'selected':''}>${optNs?t('opt.'+optNs+'.'+o.value,o.label):o.label}</option>`).join('')}</select>`;
      break;
    }
    case 'textarea':
      input=`<textarea id="${id}" data-path="${cfg.path}" rows="3">${escapeHtml(val||'')}</textarea>`;
      break;
    case 'checkbox':
      return `<label class="field field-inline" for="${id}"><span>${label}</span><input id="${id}" type="checkbox" data-path="${cfg.path}" ${val?'checked':''}></label>`;
    case 'duration':
      input=`<input id="${id}" type="text" placeholder="H:MM:SS" data-path="${cfg.path}" data-kind="duration" value="${val!=null?secToHMS(val):''}">`;
      break;
    case 'number':
      input=`<input id="${id}" type="number" step="any" data-path="${cfg.path}" value="${val!=null?val:''}">`;
      break;
    default:
      input=`<input id="${id}" type="${cfg.type||'text'}" data-path="${cfg.path}" value="${escapeHtml(val!=null?val:'')}">`;
  }
  // 單位改成貼在輸入框右緣的後綴，不再寫進標籤。標籤裡掛「(公尺)」會
  // 讓一整欄的標題長短不一、視線沒辦法對齊，而單位其實是「這個輸入框
  // 要填什麼格式」的提示，放在輸入框上比放在標題上更接近它的用途。
  // hint 則放到輸入框下方：像「官方公告值，非自動計算」這種補充說明
  // 寫在標題裡會把標題撐成兩行，擠掉真正的欄位名稱。
  const unitHtml=cfg.unit?`<span class="field-unit" aria-hidden="true">${escapeHtml(unitSuffix(cfg.unit))}</span>`:'';
  const hintHtml=cfg.hint?`<span class="field-hint">${escapeHtml(cfg.hint)}</span>`:'';
  const inputWrap=cfg.unit
    ?`<span class="field-input-wrap has-unit">${input}${unitHtml}</span>`
    :input;
  return `<label class="field${cfg.wide?' wide':''}${smartFilledHighlightPaths.has(cfg.path)?' field-smart-filled':''}" for="${id}"><span>${label}</span>${inputWrap}${hintHtml}</label>`;
}

// 「m」只佔一個半形，而且數字欄位本來就是用等寬字顯示，配符號比配
// 中文更整齊。日文與英文介面本來就會翻成各自的寫法，這裡只處理中文。
const UNIT_SUFFIX_MAP={'公里':'km','公尺':'m','公斤':'kg','毫升':'ml','分鐘':'min','%':'%'};

// 裝備輕量化儀表板：只算「有填重量」的項目，沒有填重量的項目不列入
// 計算（不會把它當 0 克算，那樣總重量會失真）。基礎重量／消耗品重量
// 是靠每個項目自己勾選的「消耗品」欄位分的，不是用既有的「分類」
// 欄位去猜——「分類」欄位是給裝備種類用的（頭燈、服裝…），跟「這件
// 東西賽事中會不會被吃喝掉」是兩個不同的概念，水袋容器本身是基礎
// 重量、袋子裡裝的水才是消耗品，用既有分類欄位硬猜容易猜錯。
function computeGearWeightStats(race){
  const all=race.equipmentChecklist||[];
  const withWeight=all.filter(i=>i.weightG!=null&&i.weightG>0);
  if(!withWeight.length) return null;
  const baseWeightG=withWeight.filter(i=>!i.isConsumable).reduce((s,i)=>s+i.weightG,0);
  const consumableWeightG=withWeight.filter(i=>i.isConsumable).reduce((s,i)=>s+i.weightG,0);
  return {
    totalWeightG:baseWeightG+consumableWeightG,

function gearWeightDonutSvg(stats){

    <circle cx="58" cy="58" r="${r}" fill="none" stroke="var(--rule)" stroke-width="14"/>

    ${stats.consumableWeightG>0?`<circle cx="58" cy="58" r="${r}" fill="none" stroke="var(--flag)" stroke-width="14"
      stroke-dasharray="${consumableLen} ${circumference-consumableLen}" stroke-dashoffset="${-baseLen}" transform="rotate(-90 58 58)" stroke-linecap="butt"/>`:''}

function openDrawer(section){
  const race=currentRace;
  if(!race) return;
  const def=DRAWER_SECTIONS[section];
  if(!def) return;
  drawerOpenSection=section;
  const drawer=document.getElementById('global-drawer');
  document.getElementById('drawer-title').textContent=def.title();
  document.getElementById('drawer-content').innerHTML=def.body(race);
  drawer.hidden=false;
  // 手機上按系統返回鍵時，習慣是「收起這層面板」而不是「離開整個
  // 網站」。推一個歷史狀態進去，返回鍵就會先觸發 popstate、被下面
  // 的監聽器接住轉成關閉抽屜。
  history.pushState({drawer:section},'');
  logFeatureUse('open_drawer_'+section);
}
function closeDrawer(opts){
  const drawer=document.getElementById('global-drawer');
  if(drawer.hidden) return;
  drawer.hidden=true;
  document.getElementById('drawer-content').innerHTML='';
  drawerOpenSection=null;
  // 關閉時重新畫一次詳情頁，讓儀表板卡片上的摘要數字（例如已打包
  // 幾項）反映剛剛在抽屜裡做的修改。
  if(currentRace) renderDetail();
  // 如果是使用者自己按 ✕／遮罩／Esc 關的，要把先前推進去的歷史
  // 狀態退掉，否則返回鍵會變成要多按一次才有反應；如果本來就是
  // 返回鍵觸發的（fromPopstate），瀏覽器已經退過了，不能再退一次。
  if(!(opts&&opts.fromPopstate)) history.back();
}

/* ============================================================
   賽事詳情頁的區塊改成手風琴（Accordion）：預設全部收合，同一時間
   只展開一個，展開新的就把其他的收起來。
   之所以用 toggle 事件而不是攔截 summary 的點擊：<details> 展開收合
   本來就是瀏覽器原生行為，攔截點擊等於要自己重做一遍（還要處理鍵盤
   操作、無障礙焦點），交給原生處理、事後再把其他區塊關掉比較單純，
   鍵盤使用者按 Enter 展開也一樣會觸發，不會漏掉。
   toggle 事件不會冒泡，所以要用捕獲階段（第三個參數 true）掛在
   document 上，才接得到每一個 <details> 的事件——不然就得在每次
   重畫詳情頁之後，逐一對六個區塊重新掛監聽器。
   ============================================================ */
function collapseOtherSections(openedEl){

document.addEventListener('toggle',e=>{
  const el=e.target;
  if(!el.classList||!el.classList.contains('section')||!el.open) return;
  if(!detailEl.contains(el)) return; // 只管詳情頁裡的區塊，其他地方用到 <details> 的不受影響
  collapseOtherSections(el);

  // 問題：圖磚只鋪半邊、或整塊灰白）。展開的時候叫它重新量一次尺寸，
  // 成本很低，但可以避免「展開路線區塊後地圖破圖」這種只在特定順序
  // 下才會出現、很難重現的狀況。
  if(el.id==='section-route'&&currentRouteMap&&currentRouteMap.invalidateSize){

// detectSeriesPb(race)：這場賽事的晶片時間，是不是比「同系列」其他
// 賽事裡最快的還要快。刻意只在同系列內比較，用的是跟上面「系列賽事
// 比較（跨年）」那張表完全一樣的比較基準（同系列＝多半是同一條賽道、
// 年復一年的賽事），不是另外發明一套「距離相近就算同類」這種容易
// 誤判的模糊規則——越野賽同樣是 10K，山徑陡峭程度天差地遠，拿來
// 互相比「PB」沒有意義。沒有系列、系列裡沒有其他已經填時間的賽事，
// 一律回傳 false，因為根本沒有比較基準，沒辦法宣稱「破了 PB」。
function detectSeriesPb(race){
  const chipT=race.results&&race.results.chipTimeSeconds;
  if(chipT==null||!race.series||!race.series.trim()) return false;
  const key=race.series.trim();
  const others=state.races.filter(r=>r.id!==race.id&&r.series&&r.series.trim()===key&&r.results&&r.results.chipTimeSeconds!=null);
  if(!others.length) return false;
  const bestOther=Math.min(...others.map(r=>r.results.chipTimeSeconds));
  return chipT<bestOther;
}
function renderSeriesComparison(race){
  if(!race.series||!race.series.trim()) return '';
  const key=race.series.trim();
  const seriesRaces=state.races.filter(r=>r.series&&r.series.trim()===key)
    .sort((a,b)=>(a.schedule.raceDate||'').localeCompare(b.schedule.raceDate||''));
  if(seriesRaces.length<2) return '';
  const bestTime=seriesRaces.reduce((best,r)=>{
    const t=r.results&&r.results.chipTimeSeconds;
    if(t==null) return best;
    return (best==null||t<best)?t:best;
  },null);
  return `<details class="section" open>
    <summary>${t('ui.seriesComparison','系列賽事比較（跨年）')}</summary>
    <div class="section-body" style="display:block;padding-bottom:20px;">
      ${bestTime!=null?`<p class="series-best mono">${t('ui.seriesBest','系列最佳晶片時間')}：${secToHMS(bestTime)}</p>`:''}
      <div class="series-table-wrap">
        <table class="series-table">
          <thead><tr><th>${t('ui.seriesYear','年份')}</th><th>${t('field.basic.schedule.raceDate','日期')}</th><th>${t('field.basic.status','狀態')}</th><th class="num">${t('field.post.results.chipTimeSeconds','晶片時間')}</th><th class="num">${t('field.basic.lottery.winRatePct','中籤率')}</th></tr></thead>
          <tbody>
            ${seriesRaces.map(r=>{
              const year=(r.schedule.raceDate||'').slice(0,4)||'—';
              const chipT=r.results&&r.results.chipTimeSeconds;
              const isPb=r.results&&r.results.isPb;
              const rate=r.lottery&&r.lottery.winRatePct;
              return `<tr class="${r.id===race.id?'current':''}">
                <td class="mono">${year}${r.id===race.id?t('ui.seriesThisRace','（本場）'):''}</td>
                <td class="mono">${r.schedule.raceDate||'—'}</td>
                <td><span class="stamp status-${r.status}">${statusLabel(r.status)}</span></td>
                <td class="mono num${isPb?' pb-time':''}">${chipT!=null?secToHMS(chipT):'—'}${isPb?' <span class="pb-badge">PB</span>':''}</td>
                <td class="mono num">${rate!=null?rate+'%':'—'}</td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>
    </div>
  </details>`;
}

/* ============================================================
   心率區間色彩（Z1~Z5，經典灰/藍/綠/橘/紅配色）
   用「該場賽事自己的最大心率」當基準算百分比，
   沒有填最大心率時就不上色，不會亂猜。
   ============================================================ */
function hrZoneInfo(hr,maxHr){
  if(hr==null||!maxHr) return null;
  const pct=hr/maxHr;
  if(pct<0.6) return {zone:1,color:'var(--stone)'};
  if(pct<0.7) return {zone:2,color:'var(--contour)'};
  if(pct<0.8) return {zone:3,color:'var(--trail)'};
  if(pct<0.9) return {zone:4,color:'var(--gold)'};
  return {zone:5,color:'var(--flag)'};
}
// hrZoneCompactHtml：給分段表這種一列只有 40px 高的地方用。只保留數字
// 跟區間標籤（標籤本身就是不靠顏色的文字提示，色盲使用者一樣看得懂），
// 拿掉柱狀圖示——三個東西並排在窄螢幕上會被擠成兩行，整張表就長高一倍。
function hrZoneCompactHtml(hr,race){
  if(hr==null) return '<span class="stone">—</span>';
  const info=hrZoneInfoForRace(hr,race);
  if(!info) return `<span class="mono">${hr}</span>`;
  return `<span class="mono" style="color:${info.color}">${hr}</span> <span class="hr-zone-tag" style="background:${info.color}">Z${info.zone}</span>`;
}
function hrZoneHtml(hr,race){
  if(hr==null) return '—';
  const info=hrZoneInfoForRace(hr,race);
  if(!info) return `${hr} bpm`;
  return `<span style="color:${info.color}">${hr} bpm</span> ${hrZoneBarsSvg(info.zone,info.color)} <span class="hr-zone-tag" style="background:${info.color}">Z${info.zone}</span>`;
}
/* legPaceLabel(leg)：每一段用該項運動自己的慣用單位顯示強度。
   全部統一成 min/km 是技術上正確、實際上沒人這樣讀的做法——游泳看的
   是每 100 公尺、自行車看的是時速。轉換區沒有配速可言，只顯示時間。 */
function legPaceLabel(leg){
  if(!leg.distanceKm||!leg.durationSeconds) return null;
  if(leg.sport==='swimming') return formatSwimPace(leg.durationSeconds/(leg.distanceKm*10));
  if(leg.sport==='cycling'){
    return (leg.distanceKm/(leg.durationSeconds/3600)).toFixed(1)+' km/h';
  }
  if(leg.sport==='transition') return null;
  return formatPace(leg.durationSeconds/leg.distanceKm)+'/km';
}
const LEG_SPORT_ICONS={swimming:'🏊',cycling:'🚴',running:'🏃',transition:'🔁',walking:'🚶',hiking:'🥾'};
// legSportLabel(leg, transitionNo)：轉換區帶上編號（T1、T2）。鐵人三項
// 的兩次轉換意義完全不同——T1 是游泳上岸換自行車、T2 是下車換跑步，
// 兩列都寫「轉換區」的話沒辦法一眼分辨在看哪一段。
// 編號在呼叫端依照轉換區出現的順序算，不是存在資料裡：分段本身只記
// 「這是一次轉換」，第幾次是由它在整場賽事中的位置決定的。
function legSportLabel(leg,transitionNo){
  const key='ui.leg_'+leg.sport;
  const fallback={swimming:'游泳',cycling:'自行車',running:'跑步',transition:'轉換區',walking:'健走',hiking:'健行'}[leg.sport]||leg.sport;
  const label=t(key,fallback);
  return (leg.sport==='transition'&&transitionNo)?`T${transitionNo} ${label}`:label;
}
function renderLegBreakdown(race){
  const legs=race.legs||[];
  if(legs.length<2) return '';
  return `<div class="leg-breakdown">
    <h4 class="leg-breakdown-title">${t('ui.legBreakdownTitle','分項成績')}</h4>
    <div class="leg-list">${(()=>{ let transitionNo=0; return legs.map(leg=>{
      if(leg.sport==='transition') transitionNo++;
      const pace=legPaceLabel(leg);
      const bits=[];
      if(leg.distanceKm) bits.push(`<span class="mono">${leg.distanceKm.toFixed(2)} km</span>`);
      if(pace) bits.push(`<span class="mono">${pace}</span>`);
      if(leg.avgHr!=null) bits.push(hrZoneHtml(leg.avgHr,race));
      if(leg.avgCadence!=null) bits.push(`<span class="mono">${leg.avgCadence} spm</span>`);
      return `<div class="leg-row leg-${escapeHtml(leg.sport)}">
        <span class="leg-icon" aria-hidden="true">${LEG_SPORT_ICONS[leg.sport]||'•'}</span>
        <span class="leg-name">${escapeHtml(legSportLabel(leg,transitionNo))}</span>
        <span class="leg-time mono">${leg.durationSeconds!=null?secToHMS(leg.durationSeconds):'—'}</span>
        <span class="leg-meta">${bits.join('<span class="leg-sep">/  </span>')}</span>
      </div>`;
    }).join(''); })()}</div>
  </div>`;
}
/* ============================================================
   賽事五維雷達圖
   五個維度：距離／爬升／氣溫嚴苛度／高心率負荷／配速穩定度。
   原始構想有第六個「配速表現（相對 PB 的比例）」，但這個 App 只存
   全馬一項 PB，拿它去除越野賽或鐵人三項的時間會得出沒有意義的數字，
   所以這個維度沒有做——寧可少一維，也不要放一個看起來精確、底下卻
   是硬湊的數字。
   任何一維缺資料時回傳 null（不是 0）：0 在圖上看起來像「這場很輕鬆」，
   跟「沒有資料」是完全不同的兩件事，畫面上會分開標示。
   ============================================================ */
function computeRaceRadar(race){
  const dims=[];
  // 1. 距離：100 公里為滿分
  const dist=race.route.distanceKm;
  dims.push({key:'distance',label:t('ui.radarDistance','距離'),
    value:dist!=null?Math.min(dist/100,1):null,
    raw:dist!=null?dist.toFixed(1)+' km':null});
  // 2. 爬升：3000 公尺為滿分。游泳一律當成沒有資料——開放水域的 GPS
  //    高度跳動累加起來會得到「泳渡爬升 531 公尺」這種數字，水面是平的，
  //    把它畫進雷達圖會讓整個形狀失真。
  const elev=race.sportType==='swimming'?null:race.route.elevationGainM;
  dims.push({key:'elevation',label:t('ui.radarElevation','爬升'),
    value:elev!=null?Math.min(elev/3000,1):null,
    raw:elev!=null?Math.round(elev)+' m':null});
  // 3. 氣溫嚴苛度：以 15°C 為最舒適，往兩邊各 20 度為滿分。優先用體感
  //    溫度（跑起來的實際感受），沒有才退回歷年平均氣溫。
  const dw=race.raceDayWeather||{},cf=race.climateForecast||{};
  const temp=dw.feelsLikeTempC!=null?dw.feelsLikeTempC:(cf.avgTempC!=null?cf.avgTempC:null);
  dims.push({key:'temp',label:t('ui.radarTemp','氣溫嚴苛'),
    value:temp!=null?Math.min(Math.abs(temp-15)/20,1):null,
    raw:temp!=null?temp+'°C':null});
  // 4. 高心率負荷：有心率的分段裡，落在 Z4／Z5 的比例。這個 App 沒有
  //    存「在各心率區間各待了多久」，所以無法算真正的時間佔比；用分段
  //    當取樣單位是現有資料能做到的最接近版本。
  const withHr=(race.splits||[]).filter(s=>s.avgHr!=null);
  let hardRatio=null,hardRaw=null;
  if(withHr.length){
    const hard=withHr.filter(s=>{
      const info=hrZoneInfoForRace(s.avgHr,race);
      return info&&info.zone>=4;
    }).length;
    hardRatio=hard/withHr.length;
    hardRaw=hard+'/'+withHr.length+' '+t('ui.radarSplitsUnit','段');
  }
  dims.push({key:'hr',label:t('ui.radarHrLoad','高心率'),value:hardRatio,raw:hardRaw});
  // 5. 配速穩定度：分段配速的變異係數（標準差／平均）越小代表跑得越平均。
  //    變異係數 25% 以上視為完全不穩定（越野賽因為地形起伏，天生就會偏高，
  //    這不是缺點、是這場賽事的形狀）。
  const paces=(race.splits||[]).map(s=>s.avgPaceSecPerKm).filter(p=>p!=null&&p>0);
  let stability=null,stabRaw=null;
  if(paces.length>=3){
    const mean=paces.reduce((a,b)=>a+b,0)/paces.length;
    const sd=Math.sqrt(paces.reduce((a,b)=>a+Math.pow(b-mean,2),0)/paces.length);
    const cv=mean?sd/mean:0;
    stability=Math.max(0,1-Math.min(cv/0.25,1));
    stabRaw='CV '+(cv*100).toFixed(1)+'%';
  }
  dims.push({key:'stability',label:t('ui.radarStability','穩定度'),value:stability,raw:stabRaw});
  return dims;
}
/* drawRaceRadar(canvas, dims)：用原生 Canvas 畫五邊形雷達圖。
   不引入圖表套件——這個 App 是單一 HTML 檔，加一個套件會讓體積翻倍，
   而雷達圖需要的幾何運算其實只有 sin/cos。 */
function drawRaceRadar(canvas,dims,progress){
  const ctx=canvas.getContext('2d');
  const dpr=window.devicePixelRatio||1;
  const cssW=canvas.clientWidth||300,cssH=canvas.clientHeight||300;
  if(canvas.width!==cssW*dpr||canvas.height!==cssH*dpr){
    canvas.width=cssW*dpr;canvas.height=cssH*dpr;
  }
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,cssW,cssH);
  const cx=cssW/2,cy=cssH/2;
  const radius=Math.min(cssW,cssH)/2-38; // 留白給軸標籤
  const n=dims.length,step=Math.PI*2/n;
  const styles=getComputedStyle(document.documentElement);
  const gold=(styles.getPropertyValue('--gold')||'#D9B15C').trim();
  const grid=(styles.getPropertyValue('--rule')||'rgba(128,128,128,0.3)').trim();
  // 軸名用主字色、數值用次字色：原本兩者都用次字色，深色模式下數值那行
  // 淡到要瞇眼。這裡是 canvas，讀的是「畫的那一刻」的變數值，所以切換
  // 主題後必須重畫（見 redrawThemeDependentCanvases）。
  const ink=(styles.getPropertyValue('--ink')||'#222').trim();
  const inkSoft=(styles.getPropertyValue('--ink-soft')||'#666').trim();
  const at=(i,r)=>{
    const a=i*step-Math.PI/2; // 減去 90 度，讓第一軸落在正上方
    return [cx+r*Math.cos(a),cy+r*Math.sin(a)];
  };
  // 背景蜘蛛網。線色不用 --rule：那是「分隔線」的顏色，深色模式下跟底色
  // 只差一階（#2A3038 vs #1E232A），畫成網格幾乎看不見。改用次字色配透明度，
  // 兩個主題都看得到框架，又不會壓過金色的資料多邊形。外圈畫深一點，
  // 內圈與軸線淡一點，讀圖時先看到範圍、再看到刻度。
  ctx.lineWidth=1;
  for(let lv=0.2;lv<=1.001;lv+=0.2){
    ctx.strokeStyle=hexToRgba(inkSoft,lv>=0.999?0.75:0.42);
    ctx.beginPath();
    for(let i=0;i<n;i++){
      const [x,y]=at(i,radius*lv);
      if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    ctx.closePath();ctx.stroke();
  }
  // 放射軸線
  ctx.strokeStyle=hexToRgba(inkSoft,0.36);
  for(let i=0;i<n;i++){
    const [x,y]=at(i,radius);
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(x,y);ctx.stroke();
  }
  // 數據多邊形（缺資料的維度以 0 參與繪製，但標籤會另外標示）
  ctx.beginPath();
  for(let i=0;i<n;i++){
    const v=(dims[i].value==null?0:dims[i].value)*progress;
    const [x,y]=at(i,radius*v);
    if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  }
  ctx.closePath();
  ctx.fillStyle=hexToRgba(gold,0.28);
  ctx.strokeStyle=gold;ctx.lineWidth=2;
  ctx.shadowColor=gold;ctx.shadowBlur=16;
  ctx.fill();ctx.stroke();
  ctx.shadowBlur=0;
  // 頂點
  for(let i=0;i<n;i++){
    if(dims[i].value==null) continue;
    const [x,y]=at(i,radius*dims[i].value*progress);
    ctx.beginPath();ctx.arc(x,y,3,0,Math.PI*2);
    ctx.fillStyle=gold;ctx.fill();
  }
  // 軸標籤
  ctx.fillStyle=ink;
  ctx.font='12px "Noto Sans TC",sans-serif';
  ctx.textAlign='center';ctx.textBaseline='middle';
  for(let i=0;i<n;i++){
    const [x,y]=at(i,radius+20);
    const d=dims[i];
    ctx.fillText(d.label,x,y-6);
    ctx.font='11px "IBM Plex Mono",monospace';
    ctx.fillStyle=d.value==null?grid:inkSoft;
    ctx.fillText(d.raw||t('ui.radarNoData','無資料'),x,y+7);
    ctx.font='12px "Noto Sans TC",sans-serif';
    ctx.fillStyle=ink;
  }
}
// CSS 變數可能是 hex 或已經是 rgb()，兩種都要能轉成帶透明度的顏色。
function hexToRgba(color,alpha){
  const c=String(color).trim();
  const m=/^#?([0-9a-f]{6})$/i.exec(c);
  if(m){
    const v=parseInt(m[1],16);
    return `rgba(${(v>>16)&255},${(v>>8)&255},${v&255},${alpha})`;
  }
  const rgb=/rgba?\(([^)]+)\)/.exec(c);
  if(rgb){
    const parts=rgb[1].split(',').map(s=>s.trim());
    return `rgba(${parts[0]},${parts[1]},${parts[2]},${alpha})`;
  }
  return `rgba(217,177,92,${alpha})`;
}
/* 生長動畫：從中心往外展開，用 ease-out 收尾。系統開了「減少動態
   效果」時直接畫完成狀態，不跑動畫。 */
function animateRaceRadar(canvas,dims){
  const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  if(reduce){ drawRaceRadar(canvas,dims,1); return; }
  const dur=1000,t0=performance.now();
  function frame(now){
    if(!canvas.isConnected) return; // 畫面已經重畫過就停止，避免殘留的動畫繼續跑
    const p=Math.min((now-t0)/dur,1);
    drawRaceRadar(canvas,dims,1-Math.pow(1-p,3));
    if(p<1) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}
function renderRaceRadarHtml(race){
  const dims=computeRaceRadar(race);
  const known=dims.filter(d=>d.value!=null).length;
  if(known<3) return ''; // 少於三維有資料時畫出來只會誤導
  const missing=dims.filter(d=>d.value==null).map(d=>d.label);
  return `<div class="race-radar">
    <h4 class="race-radar-title">${t('ui.radarTitle','賽事能力雷達')}</h4>
    <canvas class="race-radar-canvas" data-race-radar="${race.id}" width="300" height="300"></canvas>
    ${missing.length?`<p class="race-radar-note small">${tf('ui.radarMissing','{n} 沒有資料，該維度顯示為 0',missing.join('、'))}</p>`:''}
  </div>`;
}
function renderResultsDashboard(race){
  if(race.status!=='completed'||race.results.chipTimeSeconds==null) return '';
  const chipT=race.results.chipTimeSeconds;
  const isPb=!!race.results.isPb;
  // 多項運動不顯示「全場平均配速」：把游泳、騎車、跑步的時間與距離
  // 混在一起除出來的數字沒有任何意義（例如 113 公里的鐵人三項會算出
  // 2'49"/km 這種看起來像世界紀錄的配速），下面的分項成績才是真正
  // 能讀的數字。平均心率與平均步頻同理。
  const isMultisport=(race.legs||[]).length>=2;
  // 游泳的強度單位是「每 100 公尺幾分幾秒」，不是每公里。一場 2.5 公里的
  // 開放水域用 min/km 算出來會是 89'25"/km 這種沒有人讀得懂的數字。
  const isSwim=race.sportType==='swimming';
  const badges=[];
  if(!isMultisport&&race.route.distanceKm){
    if(isSwim){
      badges.push([t('ui.resultPace','配速'),formatSwimPace(chipT/(race.route.distanceKm*10)),false]);
    }else{
      badges.push([t('ui.resultPace','配速'),formatPace(chipT/race.route.distanceKm)+'/km',false]);
    }
  }
  if(race.results.overallRank!=null) badges.push([t('ui.resultOverallRank','總排名次'),race.results.overallRank+(race.results.overallParticipants?`／${race.results.overallParticipants}`:''),false]);
  if(race.results.ageGroupRank!=null) badges.push([t('field.post.results.ageGroupRank','分組名次'),race.results.ageGroupRank+(race.results.ageGroupParticipants?`／${race.results.ageGroupParticipants}`:''),false]);
  if(!isMultisport&&race.performanceData.avgHr!=null) badges.push([t('ui.resultAvgHr','平均心率'),hrZoneHtml(race.performanceData.avgHr,race),true]);
  // 游泳不顯示「平均步頻」：錶在游泳時記的是划頻（每分鐘划手次數），
  // 跟跑步的步頻完全是兩回事，掛上「步頻」這個標籤只會誤導；而且這個
  // App 的步頻欄位還附了一顆「用震動體驗節奏」的按鈕，對游泳毫無意義。
  if(!isMultisport&&!isSwim&&race.performanceData.avgCadence!=null){
    const cad=race.performanceData.avgCadence;
    badges.push([t('ui.resultAvgCadence','平均步頻'),
      `<span class="mono">${cad} spm</span><button type="button" class="cadence-feel-btn" data-action="feel-cadence" data-cadence="${cad}" title="${t('ui.feelCadenceHint','用震動體驗這個步頻的節奏（5 秒）')}" aria-label="${t('ui.feelCadenceHint','用震動體驗這個步頻的節奏（5 秒）')}">👋</button>`,
      true]);
  }
  // 游泳也不顯示總爬升：開放水域的 GPS 高度本來就跳得很厲害，累加起來
  // 會得到「泳渡爬升 531 公尺」這種數字。水面是平的，這個欄位對游泳
  // 沒有任何意義，顯示出來只會讓人以為資料壞了。
  if(!isSwim&&race.route.elevationGainM!=null) badges.push([t('ui.resultElevGain','總爬升'),race.route.elevationGainM+' 公尺',false]);
  return `<div class="results-dashboard${isPb?' is-pb':''}">
    <div class="results-dashboard-main">
      <div class="results-big-time mono">${secToHMSDenoised(chipT)}</div>
      ${isPb?`<span class="pb-badge">${t('ui.pbBadge','個人最佳 PB')}</span>`:''}
    </div>
    ${badges.length?`<div class="results-badge-grid">${badges.map(([label,val,isHtml])=>`<div class="results-badge"><span class="results-badge-label">${label}</span><span class="results-badge-value mono">${isHtml?val:escapeHtml(String(val))}</span></div>`).join('')}</div>`:''}
    ${renderLegBreakdown(race)}
    ${renderRaceRadarHtml(race)}
    <div class="results-dashboard-actions">
      <button type="button" class="btn-ghost" data-action="generate-share-image">${t('ui.generateShareImage','產生分享圖')}</button>
    </div>
  </div>`;
}

/* ============================================================
   坡度校正配速（GAP，Grade Adjusted Pace）：把上下坡造成的配速差異
   換算回「平地等效配速」，用簡化版的拋物線模型近似 Minetti 爬坡耗能
   公式——這不是精確的生理學計算，是給一般跑者參考用的粗略估算，同一
   個坡度不同人的實際耗能差異可能不小。
   上坡：每增加 1% 坡度，配速大約慢 3.75%（3.3%~4% 區間的中間值）。
   下坡：坡度在 -6% 左右時校正效果最大（跑起來相對最輕鬆，GAP 比實際
   配速快最多）；比 -6% 更陡的下坡，因為煞車式的離心收縮耗能上升，
   校正效果會開始回彈，用同一條拋物線自然涵蓋「先變輕鬆、陡到一定
   程度後又變累」這個形狀，不用另外寫兩段式的判斷。
   ============================================================ */
const GAP_UPHILL_FACTOR=0.0375;
const GAP_DOWNHILL_VERTEX_GRADE=-6;
const GAP_DOWNHILL_VERTEX_BENEFIT=0.14;
function gapPaceMultiplier(gradePct){
  if(gradePct==null||!isFinite(gradePct)) return 1;
  let m;
  if(gradePct>=0){
    m=1+gradePct*GAP_UPHILL_FACTOR;
  }else{
    const k=GAP_DOWNHILL_VERTEX_BENEFIT/(GAP_DOWNHILL_VERTEX_GRADE*GAP_DOWNHILL_VERTEX_GRADE);
    m=1+k*Math.pow(gradePct-GAP_DOWNHILL_VERTEX_GRADE,2)-k*GAP_DOWNHILL_VERTEX_GRADE*GAP_DOWNHILL_VERTEX_GRADE;
  }
  // 保底範圍，避免 GPS 雜訊算出離譜的坡度時，GAP 數字整個失真到沒有參考價值
  return Math.min(3,Math.max(0.75,m));
}
function splitGradePct(split){
  if(split.elevationGainM==null||!split.distanceKm) return null;
  return (split.elevationGainM/(split.distanceKm*1000))*100;
}
// GAP 是「算出來就顯示」的衍生值，不存進 splits 資料本身——這樣使用者
// 之後手動修改某一段的「淨爬升」欄位，GAP 會自動跟著重算，不會出現
// 改了爬升、GAP 卻還是舊數字的過期資料問題。
function splitGapSecPerKm(split){
  if(split.avgPaceSecPerKm==null) return null;
  const grade=splitGradePct(split);
  if(grade==null) return null;
  return Math.round(split.avgPaceSecPerKm/gapPaceMultiplier(grade));
}
// GAP 上線之前匯入的賽事，分段資料裡的「淨爬升」從來沒有被算過、永遠是
// null，即使已經有海拔剖面（route.elevationProfile，匯入 GPX/TCX 時就有
// 存下來）也一樣，因為當初存分段的那段程式碼根本沒有寫這個計算——這會
// 讓 GAP 對這些舊賽事完全不會顯示。這裡從賽事自己的海拔剖面（存的是
// 「起點到這裡的累積距離、當下海拔」）內插出每一段的淨海拔變化，回頭把
// 缺漏的分段資料補上，讓 GAP 上線以前匯入的賽事也能套用。只補「淨爬升」
// 還是 null 的分段，使用者自己手動填過（即使填的是 0）的分段不會被覆蓋。
function elevationAtCumulativeDistance(profile,distKm){
  if(!profile||!profile.length) return null;
  if(distKm<=profile[0].distanceKm) return profile[0].elevationM;
  const last=profile[profile.length-1];
  if(distKm>=last.distanceKm) return last.elevationM;
  for(let i=1;i<profile.length;i++){
    if(profile[i].distanceKm>=distKm){
      const p0=profile[i-1],p1=profile[i];
      const span=p1.distanceKm-p0.distanceKm;
      const frac=span>0?(distKm-p0.distanceKm)/span:0;
      return p0.elevationM+(p1.elevationM-p0.elevationM)*frac;
    }
  }
  return last.elevationM;
}
function backfillSplitElevationFromProfile(race){
  const profile=race.route&&race.route.elevationProfile;
  const splits=race.splits;
  if(!profile||profile.length<2||!splits||!splits.length) return;
  let cumKm=0;
  splits.forEach(s=>{
    if(s.elevationGainM==null&&s.distanceKm!=null){
      const startEle=elevationAtCumulativeDistance(profile,cumKm);
      const endEle=elevationAtCumulativeDistance(profile,cumKm+s.distanceKm);
      if(startEle!=null&&endEle!=null) s.elevationGainM=Math.round(endEle-startEle);
    }
    if(s.distanceKm!=null) cumKm+=s.distanceKm;
  });
}

function computeSplitPercent(race){
  const h1=race.results.firstHalfSeconds,h2=race.results.secondHalfSeconds;
  if(h1==null||h2==null||h1<=0) return null;
  return ((h2-h1)/h1)*100;
}
function renderSplitAnalysis(race){
  const pct=computeSplitPercent(race);
  if(pct==null) return '';
  const isNegative=pct<0;
  const label=isNegative?'負分段（後半程加速）':'正分段（後半程掉速）';
  const cls=isNegative?'split-good':(pct>5?'split-bad':'split-ok');
  return `<div class="split-analysis ${cls}">
    <span class="split-analysis-label">${label}</span>
    <span class="split-analysis-value mono">${pct>0?'+':''}${pct.toFixed(1)}%</span>
  </div>`;
}
// 這裡故意不用 distanceKm 排序——distanceKm 存的是「這一段自己的長度」
// （GPX 匯入固定是 1，TCX 圈數匯入則各圈長度不一定相同），拿它排序
// 等於用長度而不是時間先後排，長度剛好都一樣時歪打正著看起來沒事，
// 長度不一樣時就會把賽事順序整個打亂。分段清單本身就是使用者可以
// 拖曳調整順序的清單（跟裝備清單、補給時程同一套機制），陣列本身
// 存的順序才是正確的賽事先後順序，直接照陣列順序顯示就好。
function renderSplitsChart(race){
  const splits=(race.splits||[]).filter(s=>s.avgPaceSecPerKm!=null&&s.distanceKm!=null);
  if(splits.length<2) return '';
  // GAP 算得出來的話，長條圖長短跟顏色深淺以 GAP 為準，不是實際配速——
  // 魔王坡段即使實際配速很慢，只要體感強度夠高，長條圖還是會顯得
  // 「滿」，精準反映真實輸出，不會因為爬坡拖慢的數字被誤讀成「這段
  // 跑得很鬆」。算不出 GAP（沒有海拔資料）的分段，退回用實際配速。
  const isSwimRace=race.sportType==='swimming';
  const gaps=splits.map(splitGapSecPerKm);
  const displayPaces=splits.map((s,i)=>gaps[i]!=null?gaps[i]:s.avgPaceSecPerKm);
  const minPace=Math.min(...displayPaces),maxPace=Math.max(...displayPaces);
  const range=(maxPace-minPace)||1;
  let cumKm=0;
  const rows=splits.map((s,i)=>{
    const rangeEnd=cumKm+s.distanceKm;
    cumKm=rangeEnd;
    const fillPct=Math.max(4,Math.round(((maxPace-displayPaces[i])/range)*100));
    const distLabel=formatDistanceCompact(rangeEnd)||'—';
    // 配速壓成一行：GAP 粗體、實際配速淡色，中間用「·」隔開，不再每一列
    // 都寫一次「(GAP)」「(實際配速)」——那兩個標籤是整張表最長的字串，
    // 也是原本每列被撐到三行、整張表高得要一直往下滑的主因。標籤改成
    // 在表頭寫一次就好。
    // 游泳的分段一樣要換成每 100 公尺；而且游泳沒有「坡度校正配速」
    // （GAP）可言——水裡沒有海拔——所以只顯示單一數字。
    const paceHtml=isSwimRace
      ?`<span class="mono splits-gap-primary">${formatSwimPace(s.avgPaceSecPerKm/10)}</span>`
      :(gaps[i]!=null
        ?`<span class="mono splits-gap-primary">${formatPace(gaps[i])}</span><span class="splits-gap-dot">·</span><span class="mono splits-gap-secondary">${formatPace(s.avgPaceSecPerKm)}</span>`
        :`<span class="mono splits-gap-primary">${formatPace(s.avgPaceSecPerKm)}</span>`);
    // 每跨過一個 5 公里整數就標記一次，讓表格有「每 5K 一段」的節奏感，
    // 取代原本斑馬紋的視線引導功能——跑者本來就是以 5K 為單位讀配速的。
    const isMilestone=Math.floor(rangeEnd/5)>Math.floor((rangeEnd-s.distanceKm)/5);
    return `<tr data-km-end="${rangeEnd.toFixed(3)}" data-km-span="${s.distanceKm.toFixed(3)}"${isMilestone?' data-milestone="1"':''}>
      <td class="mono splits-dist">${distLabel}</td>
      <td class="splits-chart-pace-cell">
        <div class="splits-pace-line">${paceHtml}</div>
        <div class="splits-effort-track"><div class="splits-effort-fill" style="width:${fillPct}%"></div></div>
      </td>
      <td class="num splits-hr">${hrZoneCompactHtml(s.avgHr,race)}</td>
    </tr>`;
  }).join('');
  // 外面再包一層 scrollbox：固定高度的捲動區底部需要一個漸層提示「下面
  // 還有」，那個漸層必須疊在捲動區之上、不能跟著內容一起捲走，所以不能
  // 放在捲動容器本身。
  // 標題放在捲動區「外面」——放裡面的話一滑就跟著跑掉，使用者會失去
  // 「我正在看哪張表」的定位。捲動區只包表格本身。
  return `<div class="splits-chart-block">
    <div class="yearly-chart-title small">${t('ui.splitsChartTitle','分段配速一覽')}</div>
    <div class="splits-chart-scrollbox"><div class="splits-chart-wrap">
      <table class="splits-chart-table" id="splits-chart-table-${race.id}">
        <thead><tr>
          <th>${t('ui.splitsChartDistance','距離')}</th>
          <th>${t('ui.resultPace','配速')}${isSwimRace?'':` <span class="splits-th-hint">GAP · ${t('ui.splitsActualPace','實際')}</span>`}</th>
          <th class="num">${t('ui.resultAvgHr','心率')}</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div></div>
  </div>`;
}

const GRADIENT_COLOR_STOPS=[
  {pct:0,rgb:[76,154,114]},
  {pct:8,rgb:[217,177,92]},
  {pct:15,rgb:[184,69,31]},
  {pct:25,rgb:[122,24,24]},
];
function gradientColor(absPct){
  const stops=GRADIENT_COLOR_STOPS;
  const p=Math.min(Math.max(absPct,0),stops[stops.length-1].pct);
  for(let i=0;i<stops.length-1;i++){
    if(p>=stops[i].pct&&p<=stops[i+1].pct){
      const ratio=(p-stops[i].pct)/(stops[i+1].pct-stops[i].pct);
      const c=stops[i].rgb.map((v,idx)=>Math.round(v+(stops[i+1].rgb[idx]-v)*ratio));
      return `rgb(${c[0]},${c[1]},${c[2]})`;
    }
  }
  const last=stops[stops.length-1].rgb;
  return `rgb(${last[0]},${last[1]},${last[2]})`;
}
function elevationProfileHtml(race){
  let pts=(race.route.elevationProfile&&race.route.elevationProfile.length>=2)?race.route.elevationProfile
    :(race.checkpoints||[]).filter(c=>c.elevationM!=null&&c.distanceKm!=null).map(c=>({distanceKm:c.distanceKm,elevationM:c.elevationM}));
  pts=pts.filter(p=>p.elevationM!=null&&p.distanceKm!=null).sort((a,b)=>a.distanceKm-b.distanceKm);
  if(pts.length<2) return '';
  const w=600,h=130,pad=6;
  const xs=pts.map(p=>p.distanceKm),ys=pts.map(p=>p.elevationM);
  const minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys);
  const sx=x=>pad+(x-minX)/((maxX-minX)||1)*(w-2*pad);
  const sy=y=>h-pad-(y-minY)/((maxY-minY)||1)*(h-2*pad);
  const baseline=(h-pad).toFixed(1);
  const segments=[];
  for(let i=1;i<pts.length;i++){
    const p0=pts[i-1],p1=pts[i];
    const distM=(p1.distanceKm-p0.distanceKm)*1000;
    const gradPct=distM>0?((p1.elevationM-p0.elevationM)/distM)*100:0;
    segments.push({
      x1:sx(p0.distanceKm),y1:sy(p0.elevationM),x2:sx(p1.distanceKm),y2:sy(p1.elevationM),
      color:gradientColor(Math.abs(gradPct)),
    });
  }
  const areaPolys=segments.map(s=>`<polygon points="${s.x1.toFixed(1)},${baseline} ${s.x1.toFixed(1)},${s.y1.toFixed(1)} ${s.x2.toFixed(1)},${s.y2.toFixed(1)} ${s.x2.toFixed(1)},${baseline}" fill="${s.color}"/>`).join('');
  const lines=segments.map(s=>`<line x1="${s.x1.toFixed(1)}" y1="${s.y1.toFixed(1)}" x2="${s.x2.toFixed(1)}" y2="${s.y2.toFixed(1)}" stroke="${s.color}" stroke-width="2.5" stroke-linecap="round"/>`).join('');
  const maskId='elev-fade-'+race.id;

  // CP 站點標記：在海拔圖上對應距離處畫一條小豎線，並標示這個 CP 是落在
  // 「爬升後」還是「下坡後」。這裡刻意用「索引前後幾個點」而不是「距離
  // 前後多少公里」來取窗口：海拔剖面資料點的間距差異很大（有些賽事只有
  // 個位數的點，GPX 匯入最多也才降採樣到 50 點），固定公里數的窗口在點
  // 很稀疏時常常一個點都篩不到、誤判成「持平」；改成固定抓最近點前後
  // 各 2 個索引，不管點的實際間距多寬，只要資料點數夠就一定抓得到。
  const cpTicks=(race.checkpoints||[]).filter(c=>c.distanceKm!=null&&c.distanceKm>=minX&&c.distanceKm<=maxX).map(cp=>{
    const cx=sx(cp.distanceKm);
    let nearestIdx=0,nearestDiff=Infinity;
    pts.forEach((p,i)=>{ const diff=Math.abs(p.distanceKm-cp.distanceKm); if(diff<nearestDiff){ nearestDiff=diff; nearestIdx=i; } });
    const before=pts.slice(Math.max(0,nearestIdx-2),nearestIdx+1);
    const after=pts.slice(nearestIdx,Math.min(pts.length,nearestIdx+3));
    const beforeTrend=before.length>=2?before[before.length-1].elevationM-before[0].elevationM:0;
    const afterTrend=after.length>=2?after[after.length-1].elevationM-after[0].elevationM:0;
    let arrow='→';
    if(beforeTrend>5) arrow='↗'; else if(beforeTrend<-5) arrow='↘';
    if(afterTrend>5&&beforeTrend<=5) arrow=arrow==='↘'?'⌄':'↗';
    else if(afterTrend<-5&&beforeTrend>=-5) arrow=arrow==='↗'?'⌃':'↘';
    return `<g class="elev-cp-tick" data-cp-name="${escapeHtml(cp.name||'CP')}">
      <line x1="${cx.toFixed(1)}" y1="${pad}" x2="${cx.toFixed(1)}" y2="${baseline}" stroke="#fff" stroke-width="1.5" stroke-dasharray="2,2" opacity="0.85"/>
      <circle cx="${cx.toFixed(1)}" cy="${pad+4}" r="3.5" fill="#fff" stroke="#16231C" stroke-width="1.2"/>
      <text x="${cx.toFixed(1)}" y="${pad+18}" text-anchor="middle" font-size="12" font-weight="700" fill="#fff" stroke="#16231C" stroke-width="2.5" paint-order="stroke">${arrow}</text>
    </g>`;
  }).join('');

  return `<div class="elevation-profile" data-race-id="${race.id}">
    <div class="elevation-profile-head small"><span>${t('ui.elevationProfileTitle','海拔變化圖')}</span><span class="mono">${Math.round(minY)}–${Math.round(maxY)} 公尺</span></div>
    <div class="elevation-svg-wrap">
      <svg viewBox="0 0 ${w} ${h}" class="elevation-svg" id="elevation-svg-${race.id}" preserveAspectRatio="none">
        <defs>
          <linearGradient id="${maskId}" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#fff" stop-opacity="0.55"/>
            <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
          </linearGradient>
          <mask id="${maskId}-m">
            <rect x="0" y="0" width="${w}" height="${h}" fill="url(#${maskId})"/>
          </mask>
        </defs>
        <g mask="url(#${maskId}-m)">${areaPolys}</g>
        ${lines}
        ${cpTicks}
        <g id="elev-cursor-${race.id}" class="elev-cursor" style="opacity:0">
          <line x1="0" y1="${pad}" x2="0" y2="${baseline}" stroke="#EDEEE9" stroke-width="1.5"/>
          <circle cx="0" cy="${pad}" r="5" fill="#D9B15C" stroke="#0D1013" stroke-width="1.5"/>
        </g>
        <rect x="0" y="0" width="${w}" height="${h}" fill="transparent" id="elev-hover-capture-${race.id}" style="cursor:crosshair"/>
      </svg>
      <div class="elevation-tooltip" id="elev-tooltip-${race.id}" hidden></div>
    </div>
    <div class="elevation-legend small">
      <span class="elevation-legend-swatch" style="background:${gradientColor(0)}"></span>${t('ui.gradientGentle','平緩')}
      <span class="elevation-legend-bar"></span>
      <span class="elevation-legend-swatch" style="background:${gradientColor(25)}"></span>${t('ui.gradientSteep','陡峭 (≥25%)')}
      ${cpTicks?`<span class="elevation-legend-cp-hint">${t('ui.elevationCpHint','虛線＝CP 站點')}</span>`:''}
    </div>
  </div>`;
}
// 海拔剖面圖與地圖游標聯動：滑鼠在海拔圖上移動時，同步在地圖上移動一個
// 標記，顯示該點的累積里程、海拔、瞬時坡度。軌跡點（trackPoints，只有
// 經緯度）跟海拔剖面點（elevationProfile，距離＋海拔）是分開匯入、各自
// 降採樣的兩份資料，彼此沒有共同索引可以對應——所以用 haversine 公式
// 重新算出軌跡點自己的累積距離，再依比例對應到海拔圖游標的位置，而不是
// 假設兩個陣列的點數或間距一致。
function computeTrackPointDistances(trackPoints){
  const dists=[0];
  for(let i=1;i<trackPoints.length;i++){
    dists.push(dists[i-1]+haversineKm(trackPoints[i-1].lat,trackPoints[i-1].lon,trackPoints[i].lat,trackPoints[i].lon));
  }
  return dists;
}
function findNearestTrackPointIndex(distances,targetKm){
  let lo=0,hi=distances.length-1;
  while(lo<hi){
    const mid=(lo+hi)>>1;
    if(distances[mid]<targetKm) lo=mid+1; else hi=mid;
  }
  // 二分搜尋找到的是「第一個距離 >= 目標值」的點，等於永遠無條件進位到下一個點；
  // 檢查它前面那一個點是不是其實離目標更近，兩者取近的，軌跡點很稀疏時
  // （例如匯入的 GPX 本身取樣點很少）精準度會差比較多。
  if(lo>0){
    const prevDiff=Math.abs(distances[lo-1]-targetKm);
    const curDiff=Math.abs(distances[lo]-targetKm);
    if(prevDiff<curDiff) return lo-1;
  }
  return lo;
}
function setupElevationScrubbing(race){
  let pts=(race.route.elevationProfile&&race.route.elevationProfile.length>=2)?race.route.elevationProfile
    :(race.checkpoints||[]).filter(c=>c.elevationM!=null&&c.distanceKm!=null).map(c=>({distanceKm:c.distanceKm,elevationM:c.elevationM}));
  pts=pts.filter(p=>p.elevationM!=null&&p.distanceKm!=null).sort((a,b)=>a.distanceKm-b.distanceKm);
  if(pts.length<2) return;
  const svg=document.getElementById('elevation-svg-'+race.id);
  const captureRect=document.getElementById('elev-hover-capture-'+race.id);
  const cursor=document.getElementById('elev-cursor-'+race.id);
  const tooltip=document.getElementById('elev-tooltip-'+race.id);
  if(!svg||!captureRect||!cursor||!tooltip) return;

  const w=600,h=130,pad=6;
  const xs=pts.map(p=>p.distanceKm),ys=pts.map(p=>p.elevationM);
  const minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys);
  const sx=x=>pad+(x-minX)/((maxX-minX)||1)*(w-2*pad);
  const sy=y=>h-pad-(y-minY)/((maxY-minY)||1)*(h-2*pad);

  const trackPoints=race.route.trackPoints||[];
  const trackDistances=trackPoints.length>=2?computeTrackPointDistances(trackPoints):null;
  const trackTotalKm=trackDistances?trackDistances[trackDistances.length-1]:0;
  const profileTotalKm=maxX-minX;
  const cursorLine=cursor.querySelector('line');
  const cursorDot=cursor.querySelector('circle');

  // 三維度游標聯動的第三腳：分段配速表。開始設定的時候把每一列的
  // 「累積距離終點」跟 DOM 節點快取成一個排序好的陣列，滑鼠移動時
  // 用二分搜尋找對應的那一列，不用每次移動都重新查一次 DOM、掃過
  // 所有列——海拔圖的 pointermove 可能一秒觸發好幾十次，表格列數
  // 多的時候（超馬、破百公里）這個差異看得出來。
  const splitsTable=document.getElementById('splits-chart-table-'+race.id);
  const splitsRows=splitsTable?[...splitsTable.querySelectorAll('tbody tr[data-km-end]')].map(tr=>({el:tr,kmEnd:parseFloat(tr.dataset.kmEnd)})):[];
  let activeSplitsRow=null;
  // lastGradeWasSteep：游標剛剛所在的點，坡度有沒有超過「陡坡」門檻
  // ——每次 setupElevationScrubbing() 重新呼叫（也就是每次切換／重新
  // 整理賽事詳情頁）都會重設回 false，不會帶著上一場賽事的狀態。
  let lastGradeWasSteep=false;
  const STEEP_GRADE_THRESHOLD_PCT=8; // 山徑／健行常見的「陡坡」門檻，上下坡都算
  function findSplitsRowIndex(distKm){
    if(!splitsRows.length) return -1;
    let lo=0,hi=splitsRows.length-1;
    while(lo<hi){
      const mid=(lo+hi)>>1;
      if(splitsRows[mid].kmEnd<distKm) lo=mid+1; else hi=mid;
    }
    return lo;
  }
  function setActiveSplitsRow(idx){
    const row=idx>=0&&idx<splitsRows.length?splitsRows[idx].el:null;
    if(row===activeSplitsRow) return;
    if(activeSplitsRow) activeSplitsRow.classList.remove('sync-row-active');
    if(row) row.classList.add('sync-row-active');
    activeSplitsRow=row;
  }

  function elevationAt(distKm){
    let i=1;
    while(i<pts.length-1&&pts[i].distanceKm<distKm) i++;
    const p0=pts[i-1],p1=pts[i];
    const span=p1.distanceKm-p0.distanceKm;
    const frac=span>0?(distKm-p0.distanceKm)/span:0;
    const elev=p0.elevationM+(p1.elevationM-p0.elevationM)*frac;
    const distM=span*1000;
    const gradPct=distM>0?((p1.elevationM-p0.elevationM)/distM)*100:0;
    return {elev,gradPct};
  }
  // applyHoverAtKm(distKm)：三個介面（海拔剖面圖游標、路線地圖上的
  // 幽靈圖釘、分段配速表列）共用的核心更新邏輯，不管這次是滑鼠在
  // SVG 上移動觸發、還是滑進了表格的某一列觸發，最終都走這一個
  // 函式，行為保證一致。relX 拿來定位 tooltip 的左右位置——如果是
  // 從表格觸發，沒有實際滑鼠 X 座標可用，用 distKm 換算出等效的
  // relX，讓 tooltip 一樣能正確定位在 SVG 上對應的地方。
  function applyHoverAtKm(distKm,relXOverride){
    const relX=relXOverride!=null?relXOverride:((maxX-minX)>0?(distKm-minX)/(maxX-minX):0);
    const {elev,gradPct}=elevationAt(distKm);
    const cx=sx(distKm);

    // 陡坡「阻力感」：游標經過的坡度跨過陡坡門檻（不管是進入還是離開）
    // 的那個瞬間震動一下，模擬滑過一道隱形阻力牆的物理錯覺。用
    // if(navigator.vibrate) 判斷是必要防呆，不是可有可無的寫法——
    // iOS Safari 完全不支援這個 API，沒判斷就直接呼叫會直接拋例外、
    // 中斷整個游標更新；有這層判斷之後，iOS 上游標聯動一樣正常運作，
    // 只是沒有震動感，這是平台本身的限制。
    const isSteep=Math.abs(gradPct)>=STEEP_GRADE_THRESHOLD_PCT;
    if(isSteep!==lastGradeWasSteep){
      lastGradeWasSteep=isSteep;
      tryVibrate(15);
    }

    cursor.style.opacity='1';
    cursorLine.setAttribute('x1',cx.toFixed(1));cursorLine.setAttribute('x2',cx.toFixed(1));
    cursorDot.setAttribute('cx',cx.toFixed(1));cursorDot.setAttribute('cy',sy(elev).toFixed(1));

    tooltip.hidden=false;
    tooltip.innerHTML=`<div class="elev-tooltip-dist mono">${distKm.toFixed(1)} km</div>
      <div class="elev-tooltip-row"><span>${t('ui.elevTooltipElevation','海拔')}</span><span class="mono">${Math.round(elev)} m</span></div>
      <div class="elev-tooltip-row"><span>${t('ui.elevTooltipGradient','瞬時坡度')}</span><span class="mono">${gradPct>0?'+':''}${gradPct.toFixed(1)}%</span></div>`;
    const leftPct=Math.max(0,Math.min(1,relX))*100;
    tooltip.style.left=leftPct+'%';
    tooltip.style.transform=leftPct>70?'translateX(-100%)':(leftPct<5?'translateX(0)':'translateX(-50%)');

    if(trackDistances&&currentRouteMap&&window.L){
      const trackTargetKm=profileTotalKm>0?((distKm-minX)/profileTotalKm)*trackTotalKm:0;
      const idx=findNearestTrackPointIndex(trackDistances,trackTargetKm);
      const pt=trackPoints[idx];
      if(pt){
        if(!elevScrubMapMarker){
          elevScrubMapMarker=L.circleMarker([pt.lat,pt.lon],{radius:7,color:'#fff',weight:2,fillColor:'#D9B15C',fillOpacity:1}).addTo(currentRouteMap);
        }else{
          elevScrubMapMarker.setLatLng([pt.lat,pt.lon]);
          if(!currentRouteMap.hasLayer(elevScrubMapMarker)) elevScrubMapMarker.addTo(currentRouteMap);
        }
      }
    }
    setActiveSplitsRow(findSplitsRowIndex(distKm));
  }
  function clearHover(){
    cursor.style.opacity='0';
    tooltip.hidden=true;
    if(elevScrubMapMarker&&currentRouteMap&&currentRouteMap.hasLayer(elevScrubMapMarker)){
      currentRouteMap.removeLayer(elevScrubMapMarker);
    }
    setActiveSplitsRow(-1);
    lastGradeWasSteep=false; // 離開之後重設，下次重新進入陡坡一樣會震動，不會因為「上次剛好也是陡坡」而被跳過
  }

  // rAF 節流：pointermove 在部分裝置上觸發頻率可能超過螢幕更新率，
  // 這裡把實際的 DOM 更新工作收進 requestAnimationFrame，同一畫面
  // 更新週期內收到好幾次移動事件也只會真的畫一次，不會讓瀏覽器忙著
  // 處理跟不上、看不到的中間畫面。
  let rafPending=false,pendingKm=undefined,pendingRelX=undefined;
  function scheduleHover(distKm,relX){
    pendingKm=distKm;pendingRelX=relX;
    if(rafPending) return;
    rafPending=true;
    requestAnimationFrame(()=>{
      rafPending=false;
      if(pendingKm!=null) applyHoverAtKm(pendingKm,pendingRelX);
    });
  }
  function handleMove(clientX){
    const rect=svg.getBoundingClientRect();
    if(!rect.width) return;
    const relX=Math.max(0,Math.min(1,(clientX-rect.left)/rect.width));
    const distKm=minX+relX*(maxX-minX);
    scheduleHover(distKm,relX);
  }
  function handleLeave(){
    pendingKm=undefined;
    clearHover();
  }
  captureRect.addEventListener('pointermove',e=>handleMove(e.clientX));
  captureRect.addEventListener('pointerleave',handleLeave);
  captureRect.addEventListener('touchmove',e=>{ if(e.touches[0]){ handleMove(e.touches[0].clientX); e.preventDefault(); } },{passive:false});

  // 分段配速表：滑進某一列，直接用那一列的累積距離終點當代表點——
  // 跟海拔圖、地圖同步移動過去；離開表格清除整組聯動顯示，行為跟
  // 滑鼠離開海拔圖是一樣的。表格列數通常不多（幾十列），不需要像
  // 海拔圖那樣額外做 rAF 節流，滑進一列就直接反應。
  splitsRows.forEach(({el,kmEnd},idx)=>{
    const kmStart=kmEnd-parseFloat(el.dataset.kmSpan||'0');
    const midKm=kmStart+(kmEnd-kmStart)/2;
    el.addEventListener('mouseenter',()=>{
      pendingKm=undefined; // 蓋掉海拔圖那邊還沒處理完的排程，避免兩邊互搶
      applyHoverAtKm(midKm);
    });
    el.addEventListener('mouseleave',()=>{ clearHover(); });
  });
}

/* ============================================================
   路線軌跡地圖（Leaflet + OpenStreetMap，僅在有 GPS 座標點時才會
   延遲載入地圖套件，避免拖慢一般情況下的頁面載入速度）
   ============================================================ */
let leafletLoadPromise=null;
function ensureLeafletLoaded(){
  if(window.L) return Promise.resolve();
  if(leafletLoadPromise) return leafletLoadPromise;
  leafletLoadPromise=new Promise((resolve,reject)=>{
    const cssLink=document.createElement('link');
    cssLink.rel='stylesheet';
    cssLink.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';
    document.head.appendChild(cssLink);
    const script=document.createElement('script');
    script.src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
    script.onload=()=>resolve();
    script.onerror=()=>reject(new Error('Leaflet failed to load'));
    document.head.appendChild(script);
  });
  return leafletLoadPromise;
}
// 照片 EXIF 解析套件（exifr）也是延遲載入，只有使用者真的要拖照片進來
// 對位時才會去抓，理由跟 Leaflet 一樣：避免拖慢一般情況下的頁面載入。
let exifrLoadPromise=null;
function ensureExifrLoaded(){
  if(window.exifr) return Promise.resolve();
  if(exifrLoadPromise) return exifrLoadPromise;
  exifrLoadPromise=new Promise((resolve,reject)=>{
    const script=document.createElement('script');
    script.src='https://cdn.jsdelivr.net/npm/exifr/dist/lite.umd.js';
    script.onload=()=>resolve();
    script.onerror=()=>reject(new Error('exifr failed to load'));
    document.head.appendChild(script);
  });
  return exifrLoadPromise;
}
let currentRouteMap=null;
let elevScrubMapMarker=null;
function destroyRouteMap(){
  if(currentRouteMap){ currentRouteMap.remove(); currentRouteMap=null; }
  elevScrubMapMarker=null;
}
function initRouteMap(race){
  destroyRouteMap();
  const container=document.getElementById('route-map');
  if(!container||!race.route.trackPoints||race.route.trackPoints.length<2||typeof L==='undefined') return;
  const pts=race.route.trackPoints.map(p=>[p.lat,p.lon]);
  currentRouteMap=L.map(container,{scrollWheelZoom:false});
  const standardLayer=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
    maxZoom:19,attribution:'&copy; OpenStreetMap contributors',
  });
  const terrainLayer=L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',{
    maxZoom:17,attribution:'&copy; OpenStreetMap contributors, &copy; OpenTopoMap (CC-BY-SA)',
  });
  // 越野／登山相關賽事預設用地形圖磚，路跑、鐵人三項等預設用一般地圖
  const preferTerrain=['trail_running','ultra_marathon','obstacle_race'].includes(race.sportType);
  (preferTerrain?terrainLayer:standardLayer).addTo(currentRouteMap);
  L.control.layers({
    [t('ui.mapStandard','標準地圖')]:standardLayer,

  // 路線用「深紅色實線 + 外層較透明的同色寬線」疊出發光效果，
  // 不管在地形圖的綠色系還是一般地圖上都能清楚跳出來，深色/淺色模式都測過。
  const glowLine=L.polyline(pts,{color:'#FF3D3D',weight:9,opacity:0.4,lineCap:'round',lineJoin:'round'}).addTo(currentRouteMap);
  const polyline=L.polyline(pts,{color:'#C4001D',weight:3.5,opacity:1,lineCap:'round',lineJoin:'round'}).addTo(currentRouteMap);
  L.circleMarker(pts[0],{radius:6,color:'#fff',weight:2,fillColor:'#00C853',fillOpacity:1}).addTo(currentRouteMap);
  L.circleMarker(pts[pts.length-1],{radius:6,color:'#fff',weight:2,fillColor:'#FFD600',fillOpacity:1}).addTo(currentRouteMap);
  (race.geoPhotos||[]).filter(p=>p.matched&&p.lat!=null&&p.lon!=null).forEach(p=>{
    const icon=L.divIcon({
      className:'geo-photo-marker-wrap',

        ?`<div class="geo-photo-marker"><img src="${p.thumbnailDataUrl}" alt=""></div>`
        :`<div class="geo-photo-marker geo-photo-marker-empty">📷</div>`,
      iconSize:[44,44],iconAnchor:[22,22],
    });
    L.marker([p.lat,p.lon],{icon}).addTo(currentRouteMap).bindPopup(geoPhotoPopupHtml(p),{maxWidth:220});
  });

// 圖釘 popup 內容：拍攝時間／插值出來的海拔／心率／配速，跟使用者原始
// 需求描述的資訊沉浸卡片對應。心率／配速沒有值（該時刻附近沒有對應
// 資料）時，那一行不會顯示「null bpm」這種沒意義的字串，直接省略。
function geoPhotoPopupHtml(p){

  const lines=[`📷 ${formatPhotoTime(p.rawCapturedAt)}`];

  const hrPace=[p.hr!=null?`❤️ ${p.hr} bpm`:null,paceLabel?`🏃 ${paceLabel}/km`:null].filter(Boolean).join(' · ');
  if(hrPace) lines.push(hrPace);

function routeMapHtml(race){

  return `<div class="route-map-wrap">

function renderRouteMapIfNeeded(race){
