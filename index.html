/* ============================================================
   照片時空對位（Time-Sync Mapping）：拖照片進來，讀 EXIF 拍攝時間跟
   內嵌縮圖（只讀檔案前面幾十 KB，不會把整張 20~40MB 的原始照片載進
   記憶體），套用時差校正後，去 route.timedTrackPoints 裡用二元搜尋＋
   線性插值查出那個瞬間的座標／海拔／心率／局部配速，變成地圖上的
   縮圖圖釘。只有這場賽事有存到「保留時間戳記的軌跡」（v2.68.0 之後
   （重新）匯入 GPX/TCX/FIT 才會有）才能用；舊賽事既有的 route.trackPoints
   只存經緯度、沒有時間戳記，沒辦法拿來做時間對位，需要使用者重新
   匯入一次原始檔案。
   ============================================================ */
function raceHasTimedTrack(race){
  return !!(race.route.timedTrackPoints&&race.route.timedTrackPoints.length>=2);
}
// 把一張照片的「原始拍攝時間＋目前這場賽事的時差校正秒數」代入插值
// 引擎，回填 race.geoPhotos 裡對應那筆紀錄的座標／海拔／心率／配速。
// 抽成獨立函式是因為時差校正滑桿每次拖動，所有已經對位過的照片都要
// 用新的偏移量重新插值一次，不用重新讀檔案、重新解 EXIF。
function reinterpolatePhoto(race,photo){
  const rawMs=new Date(photo.rawCapturedAt).getTime();
  const targetMs=rawMs+race.photoTimeOffsetSeconds*1000;
  const r=interpolateTrackAtTime(race.route.timedTrackPoints,targetMs);
  if(r){
    photo.matched=true;
    photo.lat=r.lat;photo.lon=r.lon;photo.elevationM=r.elevationM;photo.hr=r.hr;photo.paceSecPerKm=r.paceSecPerKm;
  }else{
    photo.matched=false;
    photo.lat=null;photo.lon=null;photo.elevationM=null;photo.hr=null;photo.paceSecPerKm=null;
  }
}
function reinterpolateAllPhotos(race){
  (race.geoPhotos||[]).forEach(p=>reinterpolatePhoto(race,p));
}
let photoProcessingCount=0;
// 對每個檔案：先用 exifr 只挑 DateTimeOriginal 這個 tag 做最小限度解析
// （exifr 本身預設就是分段讀取，瀏覽器端一次讀 64KB），找不到拍攝時間
// 的檔案（例如截圖、經過某些軟體重新存檔後被清空 EXIF 的照片）直接
// 略過、不中斷整批處理；縮圖用 exifr.thumbnail() 單獨抽取內嵌縮圖，
// 抽不到縮圖時 thumbnailDataUrl 留 null，畫面上會退回顯示通用圖示，
// 但拍攝時間／座標對位不受影響，兩者是各自獨立、互不依賴的資訊。
async function processPhotoFiles(race,files){
  await ensureExifrLoaded();
  // 略過的檔案逐一記下原因。以前是靜默 continue：使用者拖 10 張進來
  // 只出現 6 張，完全不知道另外 4 張去哪了、也不知道能怎麼補救。
  photoSkipReport=[];
  photoProcessingCount=files.length;
  if(currentRace&&currentRace.id===race.id) renderDetail();
  for(const file of files){
    try{
      // 這裡刻意不加 {pick:['DateTimeOriginal']} 這種欄位篩選選項——
      // 實測發現目前這個 exifr 版本（lite build）的 pick 選項本身有
      // bug，帶了就整個拋出例外，等於每張照片都解析失敗。不加篩選、
      // 直接完整解析（順便多拿到 Make/Model 這些用不到但無害的欄位）
      // 反而是能真正動作的寫法，速度上的差異在這個量級的檔案可以忽略。
      const tags=await window.exifr.parse(file);
      const capturedAt=(tags&&(tags.DateTimeOriginal||tags.CreateDate||tags.DateTimeDigitized))||null;
      if(!capturedAt){
        // 沒有拍攝時間就沒有對位的依據。最常見的是截圖，以及經過通訊軟體
        // （LINE／Messenger）轉傳、或某些編輯軟體重新存檔後 EXIF 被清掉的照片。
        photoSkipReport.push({fileName:file.name,reason:'noTime'});
        photoProcessingCount--; continue;
      }
      let thumbnailDataUrl=null;
      try{
        const thumbBytes=await window.exifr.thumbnail(file);
        if(thumbBytes){
          const blob=new Blob([thumbBytes],{type:'image/jpeg'});
          // 內嵌縮圖存的是感光元件的原始方向，沒有帶自己的方向標籤；
          // 直立拍的照片，縮圖躺著或倒著是常態，要用主圖的 Orientation 轉正。
          const orientation=await readExifOrientation(file,tags);
          thumbnailDataUrl=await orientThumbnail(blob,orientation);
        }
      }catch(e){ /* 沒有內嵌縮圖，下面再試著自己產生 */ }
      if(!thumbnailDataUrl){
        // 沒有內嵌縮圖時才自己解碼原圖縮一張。這違反「不載入整張原圖」的
        // 原則，所以只當退路：很多照片（HEIC、編輯過重存的 JPEG）根本
        // 沒有內嵌縮圖，沒有這條退路就只能顯示通用圖示。
        // resizeWidth 讓瀏覽器在解碼階段就縮小，不會把全尺寸點陣圖留在記憶體；
        // imageOrientation:'from-image' 交給瀏覽器轉正，不再自己轉一次。
        thumbnailDataUrl=await thumbnailFromFullImage(file);
      }
      const photo={
        id:uid(),fileName:file.name,thumbnailDataUrl,
        rawCapturedAt:capturedAt.toISOString(),
        matched:false,lat:null,lon:null,elevationM:null,hr:null,paceSecPerKm:null,
      };
      reinterpolatePhoto(race,photo);
      race.geoPhotos.push(photo);
    }catch(e){
      console.error('照片 EXIF 解析失敗',file.name,e);
      photoSkipReport.push({fileName:file.name,reason:'parseFailed'});
    }
    photoProcessingCount--;
    if(currentRace&&currentRace.id===race.id) renderDetail();
  }
  race.updatedAt=new Date().toISOString();
  persist();
  if(currentRace&&currentRace.id===race.id) renderDetail();
}
let photoSkipReport=[];
/* thumbnailFromFullImage(file)：沒有內嵌縮圖時，自己解碼原圖縮一張。
   HEIC 只有 Safari 解得開，Chrome 會丟例外——那就回 null 顯示通用圖示，
   拍攝時間與對位都已經拿到了，不該因為縮圖失敗就整張照片不收。 */
async function thumbnailFromFullImage(file){
  try{
    const bmp=await createImageBitmap(file,{resizeWidth:320,resizeQuality:'medium',imageOrientation:'from-image'});
    const c=document.createElement('canvas');
    c.width=bmp.width; c.height=bmp.height;
    c.getContext('2d').drawImage(bmp,0,0);
    if(bmp.close) bmp.close();
    return c.toDataURL('image/jpeg',0.82);
  }catch(e){ return null; }
}
/* readExifOrientation(file, tags)：回 1～8 的 EXIF 方向碼。
   exifr 的完整版有 orientation() 直接給數字；沒有的話從 parse 結果拿，
   而 parse 可能已經把數字翻譯成 'Rotate 90 CW' 這種字串（看 build），
   兩種都要收。認不出來一律當 1（不轉）——轉錯比不轉更糟。 */
async function readExifOrientation(file,tags){
  try{
    if(window.exifr&&typeof window.exifr.orientation==='function'){
      const n=await window.exifr.orientation(file);
      if(n>=1&&n<=8) return n;
    }
  }catch(e){}
  const v=tags&&tags.Orientation;
  if(typeof v==='number'&&v>=1&&v<=8) return v;
  if(typeof v==='string'){
    const s=v.toLowerCase();
    const mirror=s.includes('mirror');
    if(s.includes('180')) return mirror?4:3;
    if(s.includes('90'))  return mirror?7:6;   // Rotate 90 CW → 6
    if(s.includes('270')) return mirror?5:8;   // Rotate 270 CW → 8
    if(mirror) return 2;
  }
  return 1;
}
/* orientThumbnail(blob, orientation)：把縮圖依 EXIF 方向碼轉正，回 data URL。
   用 createImageBitmap 加 imageOrientation:'none' 解碼——萬一縮圖本身也帶
   方向標籤，瀏覽器在 drawImage 時會自己再轉一次，兩次就轉過頭。
   矩陣是 EXIF 標準的八種；5～8 是直式，畫布寬高要對調。 */
async function orientThumbnail(blob,orientation){
  const toDataUrl=b=>new Promise((resolve,reject)=>{
    const reader=new FileReader(); reader.onload=()=>resolve(reader.result); reader.onerror=()=>reject(reader.error); reader.readAsDataURL(b);
  });
  if(!orientation||orientation===1) return toDataUrl(blob);
  let bmp;
  try{ bmp=await createImageBitmap(blob,{imageOrientation:'none'}); }
  catch(e){
    // 舊瀏覽器沒有 createImageBitmap：退回 <img>，接受可能重複轉向的風險
    bmp=await new Promise((resolve,reject)=>{ const img=new Image(); img.onload=()=>resolve(img); img.onerror=reject; img.src=URL.createObjectURL(blob); });
  }
  const w=bmp.width,h=bmp.height;
  const swap=orientation>=5;
  const c=document.createElement('canvas'); c.width=swap?h:w; c.height=swap?w:h;
  const ctx=c.getContext('2d');
  switch(orientation){
    case 2: ctx.setTransform(-1,0,0,1,w,0); break;
    case 3: ctx.setTransform(-1,0,0,-1,w,h); break;
    case 4: ctx.setTransform(1,0,0,-1,0,h); break;
    case 5: ctx.setTransform(0,1,1,0,0,0); break;
    case 6: ctx.setTransform(0,1,-1,0,h,0); break;
    case 7: ctx.setTransform(0,-1,-1,0,h,w); break;
    case 8: ctx.setTransform(0,-1,1,0,0,w); break;
  }
  ctx.drawImage(bmp,0,0);
  if(bmp.close) bmp.close();
  return c.toDataURL('image/jpeg',0.85);
}
function formatPhotoTime(iso){
  if(!iso) return '';
  const d=new Date(iso);
  return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+':'+String(d.getSeconds()).padStart(2,'0');
}

    <div class="geo-photo-drop-zone" id="geo-photo-drop-zone">

      <button type="button" class="btn-ghost" data-action="trigger-geo-photo-input">${t('ui.geoPhotoAdd','＋ 加入照片')}</button>
      ${photoProcessingCount>0?`<span class="small">${tf('ui.geoPhotoProcessing','解析中… 還剩 {n} 張',photoProcessingCount)}</span>`:''}

                           :t('ui.geoPhotoSkipParseFailed','讀取失敗，這個檔案格式可能不支援')

/* ============================================================
   分享圖產生（Canvas，純前端，不上傳任何資料）
   ============================================================ */
function canvasWrapText(ctx,text,x,y,maxWidth,lineHeight,maxLines){
  const chars=Array.from(text||'');
  let line='',curY=y,lines=0;
  for(let i=0;i<chars.length;i++){
    const testLine=line+chars[i];
    if(ctx.measureText(testLine).width>maxWidth&&line){
      ctx.fillText(line,x,curY);
      line=chars[i];curY+=lineHeight;lines++;
      if(maxLines&&lines>=maxLines-1){
        const rest=chars.slice(i+1).join('');
        line+= rest ? '…' : '';
        break;
      }
    }else{
      line=testLine;
    }
  }
  ctx.fillText(line,x,curY);
  return curY;
}
function canvasFontFamily(){
  return currentLang==='ja' ? '"Noto Sans JP",sans-serif' : '"Noto Sans TC",sans-serif';
}
/* ------------------------------------------------------------
   分享圖的「資料層」跟「版面層」拆開：方形與限動兩種版面吃同一份
   badges／rows，運動別規則只寫一次，不會出現方形修好了、限動還在
   顯示泳渡爬升的情況。
   ------------------------------------------------------------ */
const SHARE_SHOW_DEFAULT={hr:true,shoe:true,fuel:true,track:true};
/* shareStatsBadges(race, show)：上排的關鍵數據。運動別規則跟詳情頁一致
   ——分享圖是最容易被外人看到的畫面，這裡出現「泳渡配速 89'25"/km、
   爬升 531 公尺」比在自己頁面上看到更糟，它會被截圖轉傳出去。 */
function shareStatsBadges(race,show){
  const isMultisport=(race.legs||[]).length>=2;
  const isSwim=race.sportType==='swimming';
  const chipT=race.results.chipTimeSeconds||0;
  const badges=[];
  if(!isMultisport&&race.route.distanceKm&&chipT){
    badges.push([t('ui.resultPace','配速'),
      isSwim?formatSwimPace(chipT/(race.route.distanceKm*10))
            :formatPace(chipT/race.route.distanceKm)+'/km']);
  }
  if(race.route.distanceKm) badges.push([t('field.route.route.distanceKm','距離'),race.route.distanceKm+' 公里']);
  if(!isSwim&&race.route.elevationGainM!=null) badges.push([t('ui.resultElevGain','總爬升'),race.route.elevationGainM+' 公尺']);
  if(show.hr&&!isMultisport&&race.performanceData.avgHr!=null) badges.push([t('ui.resultAvgHr','平均心率'),race.performanceData.avgHr+' bpm']);
  if(race.results.overallRank!=null) badges.push([t('ui.resultOverallRank','總排名次'),String(race.results.overallRank)]);
  return badges;
}
/* shareDetailRows(race, show)：下半部的戰靴與補給。 */
function shareDetailRows(race,show){
  const rows=[];
  if(show.shoe&&isRunningSportType(race.sportType)&&race.performanceData.shoeId){
    // 鞋款只對跑步相關賽事有意義：自行車、游泳的賽事本來就不綁鞋款，
    // 硬是顯示只會讓人以為資料填錯。
    const shoe=shoes.find(x=>x.id===race.performanceData.shoeId);
    if(shoe&&shoe.name) rows.push([t('ui.shareShoe','戰靴'),shoe.name]);
  }
  if(show.fuel){
    const fuel=summarizeRaceFuel(race);
    if(fuel) rows.push([fuel.planned?t('ui.shareFuelPlanned','補給（計畫）'):t('ui.shareFuel','補給'),fuel.parts]);
  }
  return rows;
}
/* shareAvailableOptions(race)：這場有哪些可勾選的內容。沒有的東西不給
   勾——一顆永遠沒作用的開關比沒有開關更誤導。 */
function shareAvailableOptions(race){
  const isMultisport=(race.legs||[]).length>=2;
  return {
    hr:!isMultisport&&race.performanceData.avgHr!=null,
    shoe:isRunningSportType(race.sportType)&&!!race.performanceData.shoeId&&!!shoes.find(x=>x.id===race.performanceData.shoeId),
    fuel:!!summarizeRaceFuel(race),
    track:(race.route.trackPoints||[]).length>=2,
  };
}
function drawShareLogo(ctx,x,y,uiFont){
  ctx.strokeStyle='#EEF0EF';ctx.lineWidth=7;ctx.lineCap='round';ctx.lineJoin='round';
  ctx.beginPath();
  ctx.moveTo(x,y+95);ctx.lineTo(x+90,y+25);ctx.lineTo(x+135,y+60);ctx.lineTo(x+200,y);
  ctx.stroke();
  ctx.fillStyle='#B8451F';
  ctx.beginPath();ctx.arc(x+200,y,11,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#9BA3A0';
  ctx.font=`28px ${uiFont}`;
  ctx.fillText(t('ui.appTitle','賽事紀錄'),x,y+155);
}
function drawShareRows(ctx,rows,x,top,maxW,uiFont,rowGap){
  rows.forEach((row,i)=>{
    const y=top+i*rowGap;
    ctx.fillStyle='#6B7178';
    ctx.font=`24px ${uiFont}`;
    ctx.fillText(row[0],x,y);
    ctx.fillStyle='#EDEEE9';
    ctx.font=`bold 34px ${uiFont}`;
    // 一律壓成一行：補給項目多的時候換行會疊到下一列，而被 canvasWrapText
    // 從中間截斷的「咖啡因…」既難看也讀不出到底還有幾項。
    const value=Array.isArray(row[1])?fitPartsToWidth(ctx,row[1],maxW):row[1];
    canvasWrapText(ctx,value,x,y+46,maxW,44,1);
  });
}
async function buildShareCanvas(race,opts){
  opts=opts||{};
  const show=Object.assign({},SHARE_SHOW_DEFAULT,opts.show||{});
  if(opts.format==='story') return buildShareCanvasStory(race,show);
  try{ await document.fonts.ready; }catch(e){}
  const W=1080,H=1080;
  const canvas=document.createElement('canvas');
  canvas.width=W;canvas.height=H;
  const ctx=canvas.getContext('2d');
  const isPb=!!race.results.isPb;
  const uiFont=canvasFontFamily();

  ctx.fillStyle='#16231C';
  ctx.fillRect(0,0,W,H);
  drawShareLogo(ctx,80,55,uiFont);

  ctx.fillStyle='#EDEEE9';
  ctx.font=`bold 52px ${uiFont}`;
  const nameEndY=canvasWrapText(ctx,race.name||t('ui.unnamedRace','(未命名賽事)'),80,300,W-160,64,2);

  ctx.fillStyle='#9BA3A0';
  ctx.font='30px "IBM Plex Mono",monospace';
  ctx.fillText(race.schedule.raceDate||'',80,nameEndY+60);

  const timeY=nameEndY+190;
  ctx.fillStyle=isPb?'#D9B15C':'#EDEEE9';
  ctx.font='bold 128px "IBM Plex Mono",monospace';
  ctx.fillText(secToHMS(race.results.chipTimeSeconds||0),80,timeY);
  if(isPb){
    ctx.fillStyle='#D9B15C';
    ctx.font=`bold 28px ${uiFont}`;
    ctx.fillText(t('ui.pbBadge','個人最佳 PB'),80,timeY+50);
  }

  const badges=shareStatsBadges(race,show).slice(0,4);   // 方形只有一排的位置
  const badgeY=timeY+(isPb?110:70);
  const colW=(W-160)/Math.max(badges.length,1);
  badges.forEach((b,i)=>{
    const bx=80+i*colW;
    ctx.fillStyle='#6B7178';
    ctx.font=`24px ${uiFont}`;
    ctx.fillText(b[0],bx,badgeY);
    ctx.fillStyle='#EDEEE9';
    ctx.font='bold 34px "IBM Plex Mono",monospace';
    ctx.fillText(b[1],bx,badgeY+42);
  });

  // ---- 下半部：戰靴／補給／軌跡 ----
  const rows=shareDetailRows(race,show);
  const trackPoints=show.track?(race.route.trackPoints||[]):[];
  const hasTrack=trackPoints.length>=2;
  const contentTop=badgeY+112;
  const contentBottom=H-130;
  // 有軌跡就讓文字退到左半邊，沒有就整行都給文字——不預留一塊永遠空著的欄位。
  const textMaxW=hasTrack?430:(W-160);
  drawShareRows(ctx,rows,80,contentTop,textMaxW,uiFont,108);
  if(hasTrack){
    const areaX=rows.length?560:80;
    const areaW=(W-80)-areaX;
    const areaH=contentBottom-contentTop+40;
    drawGoldGlowTrack(ctx,trackPoints,areaX+areaW/2,contentTop-20+areaH/2,areaW-40,areaH-40);
  }

  ctx.fillStyle='#4C9A72';
  ctx.font=`24px ${uiFont}`;
  ctx.fillText(sportLabel(race.sportType),80,H-70);
  return canvas;
}
/* buildShareCanvasStory(race, show)：1080×1920 限時動態版。上下各留
   250px 給 IG 的介面（頂端帳號列、底部回覆列），內容全部落在中間
   1420px。直式的空間多一倍，軌跡不再跟文字搶左右，而是獨佔中段。 */
async function buildShareCanvasStory(race,show){
  try{ await document.fonts.ready; }catch(e){}
  const W=1080,H=1920,SAFE_TOP=250,SAFE_BOTTOM=250;
  const canvas=document.createElement('canvas');
  canvas.width=W;canvas.height=H;
  const ctx=canvas.getContext('2d');
  const isPb=!!race.results.isPb;
  const uiFont=canvasFontFamily();

  ctx.fillStyle='#16231C';
  ctx.fillRect(0,0,W,H);
  drawShareLogo(ctx,80,SAFE_TOP+40,uiFont);
  // 運動別放右上角跟 App 名稱同一列：直式的底部要留給戰靴與補給，
  // 塞在那裡會跟它們搶同一條基線。
  ctx.fillStyle='#4C9A72';
  ctx.font=`26px ${uiFont}`;
  ctx.textAlign='right';
  ctx.fillText(sportLabel(race.sportType),W-80,SAFE_TOP+40+155);
  ctx.textAlign='left';

  ctx.fillStyle='#EDEEE9';
  ctx.font=`bold 60px ${uiFont}`;
  const nameEndY=canvasWrapText(ctx,race.name||t('ui.unnamedRace','(未命名賽事)'),80,SAFE_TOP+290,W-160,74,3);

  ctx.fillStyle='#9BA3A0';
  ctx.font='32px "IBM Plex Mono",monospace';
  ctx.fillText(race.schedule.raceDate||'',80,nameEndY+64);

  const timeY=nameEndY+230;
  ctx.fillStyle=isPb?'#D9B15C':'#EDEEE9';
  ctx.font='bold 150px "IBM Plex Mono",monospace';
  ctx.fillText(secToHMS(race.results.chipTimeSeconds||0),80,timeY);
  if(isPb){
    ctx.fillStyle='#D9B15C';
    ctx.font=`bold 30px ${uiFont}`;
    ctx.fillText(t('ui.pbBadge','個人最佳 PB'),80,timeY+54);
  }

  // 數據三欄排：直式有五格要放（含心率與名次），三欄兩列剛好，
  // 而 306px 的欄寬放得下最長的「42.195 公里」。
  const badges=shareStatsBadges(race,show);
  const badgeTop=timeY+(isPb?120:80);
  const cols=3, colW=(W-160)/cols, rowH=100;
  badges.forEach((b,i)=>{
    const bx=80+(i%cols)*colW, by=badgeTop+Math.floor(i/cols)*rowH;
    ctx.fillStyle='#6B7178';
    ctx.font=`24px ${uiFont}`;
    ctx.fillText(b[0],bx,by);
    ctx.fillStyle='#EDEEE9';
    ctx.font='bold 36px "IBM Plex Mono",monospace';
    ctx.fillText(b[1],bx,by+44);
  });
  const badgesEnd=badgeTop+Math.ceil(badges.length/cols)*rowH;

  // 底部：戰靴與補給並排成一列，各佔半寬；只有一項時整行都給它。
  // 直式最缺的是「高度」，兩項各佔一行會把中段的軌跡擠到扁掉。
  const rows=shareDetailRows(race,show);
  const rowsTop=H-SAFE_BOTTOM-90;
  if(rows.length){
    const half=(W-160-40)/2;
    rows.forEach((row,i)=>{
      const x=rows.length===1?80:80+i*(half+40);
      drawShareRows(ctx,[row],x,rowsTop,rows.length===1?W-160:half,uiFont,0);
    });
  }

  // 中段：軌跡獨佔數據與底部文字之間的整塊空間
  const trackPoints=show.track?(race.route.trackPoints||[]):[];
  if(trackPoints.length>=2){
    const areaTop=badgesEnd+30;
    const areaBottom=rows.length?rowsTop-70:H-SAFE_BOTTOM-20;
    const areaH=areaBottom-areaTop;
    if(areaH>180) drawGoldGlowTrack(ctx,trackPoints,W/2,areaTop+areaH/2,W-200,areaH-30);
  }
  return canvas;
}
/* fitPartsToWidth(ctx, parts, maxW)：把項目塞到一行放得下為止，放不下的
   用「+N」交代還有幾項——比截斷成「咖啡因…」誠實，也看得出總數。 */
function fitPartsToWidth(ctx,parts,maxW){
  if(!parts.length) return '';
  const sep='・';
  let shown=[];
  for(let i=0;i<parts.length;i++){
    const rest=parts.length-(i+1);
    const candidate=shown.concat(parts[i]).join(sep)+(rest?`　+${rest}`:'');
    if(shown.length&&ctx.measureText(candidate).width>maxW) break;
    shown.push(parts[i]);
  }
  const rest=parts.length-shown.length;
  return shown.join(sep)+(rest?`　+${rest}`:'');
}
/* summarizeRaceFuel(race)：這場實際吃了什麼。優先用補給時程裡勾過
   「賽後：已補給」的項目，那是實際發生的事；完全沒有勾選時才退回
   補給設定裡的計畫數量，並標示成「計畫」——把計畫當成實際寫在分享圖
   上是在說謊，但整塊空著也沒必要。 */
function summarizeRaceFuel(race){
  const taken=(race.nutritionSchedule||[]).filter(it=>it&&it.consumed&&String(it.item||'').trim());
  if(taken.length){
    const byItem=new Map();
    taken.forEach(it=>{
      const name=String(it.item).trim();
      const qty=Number(it.qty)>0?Number(it.qty):1;
      byItem.set(name,(byItem.get(name)||0)+qty);
    });
    return {planned:false,
      parts:[...byItem.entries()].sort((a,b)=>b[1]-a[1]).map(([n,q])=>q>1?`${n} ×${q}`:n)};
  }
  const plan=race.nutritionPlan||{};
  const parts=[];
  if(plan.gelCount>0) parts.push(`${t('ui.fuelGel','能量膠')} ×${plan.gelCount}`);
  if(plan.electrolyteTabletCount>0) parts.push(`${t('ui.fuelTablet','鹽錠')} ×${plan.electrolyteTabletCount}`);
  if(plan.hydrationCapacityMl>0) parts.push(`${t('ui.fuelHydration','水袋')} ${plan.hydrationCapacityMl}ml`);
  return parts.length?{planned:true,parts}:null;
}
/* drawGoldGlowTrack()：金色發光的軌跡，背景透明（直接畫在既有底色上，
   不鋪任何卡片或方框）。用三層疊加而不是單一 shadowBlur——單層只會
   得到「描了一圈模糊邊」的結果，疊加才有愈靠中心愈亮的發光感。
   composite 用 lighter：深色底上相加才會亮，正常疊加只會愈畫愈濁。 */
function drawGoldGlowTrack(ctx,trackPoints,cx,cy,maxW,maxH){
  if(!trackPoints||trackPoints.length<2||maxW<=0||maxH<=0) return false;
  ctx.save();
  ctx.globalCompositeOperation='lighter';
  drawRouteTrackOnCanvas(ctx,trackPoints,cx,cy,maxW,maxH,'rgba(217,177,92,0.16)',26,0);
  drawRouteTrackOnCanvas(ctx,trackPoints,cx,cy,maxW,maxH,'rgba(230,196,120,0.30)',13,0);
  ctx.restore();
  // 亮芯與起終點回到正常疊加：用 lighter 畫白色核心會過曝成一團白。
  drawRouteTrackOnCanvas(ctx,trackPoints,cx,cy,maxW,maxH,'#F4E3B4',4,7);
  return true;
}
/* ------------------------------------------------------------
   分享圖設定視窗：選格式（方形／限動）、勾要放的內容、看預覽、再分享。

const SHARE_PREFS_KEY='share-prefs-v1';

async function downloadShareImage(race,opts){
  const canvas=await buildShareCanvas(race,opts);
  const blob=await new Promise(res=>canvas.toBlob(res,'image/png'));
  if(!blob) return;
  const suffix=(opts&&opts.format==='story')?t('ui.shareStorySuffix','-限動.png'):t('ui.shareImageSuffix','-分享圖.png');

/* ============================================================
   親友應援與補給指南圖：跟賽前作戰卡是分開的另一張卡片，賽前作戰卡是
   給跑者自己看的（關門時間、緊急聯絡人），這張是給在場邊等的親友看
   的（幾點幾分會到哪個 CP、要遞什麼補給、怎麼從人群裡認出你）。
   ============================================================ */
// 把「起跑時刻」＋「距離起跑過了幾秒」換算成當下的時鐘時間；超過午夜
// 會捲到隔天，用 dayOffset 標記，賽事橫跨兩個日曆日時（多半是超馬）
// 卡片上才不會出現「兩個 14:30」這種讓親友搞混的情況。
function formatClockTimeOffset(startTimeStr,offsetSeconds){
  const parts=(startTimeStr||'').split(':').map(Number);
  if(parts.length<2||isNaN(parts[0])||isNaN(parts[1])) return null;
  const startMinutes=parts[0]*60+parts[1];
  const totalMinutes=startMinutes+Math.round(offsetSeconds/60);
  const DAY=24*60;
  const dayOffset=Math.floor(totalMinutes/DAY);
  const clockMinutes=((totalMinutes%DAY)+DAY)%DAY;
  const hh=Math.floor(clockMinutes/60),mm=clockMinutes%60;
  return {label:String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0'),dayOffset};
}
// 把補給時程規劃（nutritionSchedule）裡的每一筆，依距離配對到最接近的
// 那個 CP 站——兩邊本來就是分開填寫的欄位，距離不一定會完全對齊到小
// 數點，用「最近的那個 CP」配對，比要求使用者兩邊填一模一樣的數字
// 更貼近實際使用情境。
function groupNutritionByCheckpoint(cps,nutritionSchedule){
  const groups=cps.map(()=>[]);
  (nutritionSchedule||[]).forEach(n=>{
    if(n.distanceKm==null||!n.item) return;
    let bestIdx=-1,bestDiff=Infinity;
    cps.forEach((cp,i)=>{
      if(cp.distanceKm==null) return;
      const diff=Math.abs(cp.distanceKm-n.distanceKm);
      if(diff<bestDiff){ bestDiff=diff; bestIdx=i; }
    });
    if(bestIdx>=0) groups[bestIdx].push(n);
  });
  return groups;
}
function computeCrewGuideCheckpoints(race){
  const cps=(race.checkpoints||[]).filter(cp=>cp.distanceKm!=null).slice().sort((a,b)=>a.distanceKm-b.distanceKm);
  if(!cps.length) return {checkpoints:[],hasEta:false};
  const startTime=race.schedule.startTime;
  const goalA=(race.goals||[]).find(g=>g.tier==='A');
  const targetSeconds=goalA&&goalA.targetTimeSeconds;
  const totalDistance=race.route.distanceKm;
  const hasEta=!!(startTime&&targetSeconds&&totalDistance);
  const nutritionGroups=groupNutritionByCheckpoint(cps,race.nutritionSchedule);
  const checkpoints=cps.map((cp,i)=>{
    let eta=null;
    if(hasEta){
      const elapsedSec=pacingTimeAtDistance(targetSeconds,totalDistance,'even',cp.distanceKm);
      eta=formatClockTimeOffset(startTime,elapsedSec);
    }
    return {checkpoint:cp,eta,nutritionItems:nutritionGroups[i]};
  });
  return {checkpoints,hasEta};
}

/* ============================================================
   賽事復盤 AI 提示詞生成：把這場賽事的天氣、心率區間、分段配速、
   掉速比例、補給狀況、撞牆期與其他賽後反思筆記，組合成一段可以直接
   貼給 ChatGPT / Claude 的 prompt，請 AI 幫忙寫成 IG 貼文跟賽後
   檢討網誌兩種版本。每個區塊都是資料驅動的——沒有填的欄位那整段
   就不會出現在 prompt 裡，不會出現「天氣：（未填寫）」這種空欄位
   要求 AI 憑空編造內容。
   ============================================================ */
const HR_ZONE_PROMPT_LABELS={
  zh:['輕鬆恢復','有氧耐力','節奏跑','乳酸閾值','最大攝氧量'],
  ja:['イージー回復','有酸素持久力','テンポ走','乳酸閾値','最大酸素摂取量'],
  en:['Easy Recovery','Aerobic Endurance','Tempo','Lactate Threshold','VO2 Max'],
};
// 中日文用全形【】方框當區塊標題比較自然，英文則改用較常見的 markdown
// 風格「## 」，貼給 AI 時兩種寫法都能被正確辨識成段落標題，只是視覺
// 上比較符合各自語言使用者的閱讀習慣。
function promptSectionHeader(label){
  return currentLang==='en'?('## '+label):('【'+label+'】');
}
function buildRaceReportPrompt(race){
  const lines=[];
  lines.push(t('ui.reportPromptIntro','請你根據以下這場賽事的數據，幫我寫一篇賽後心得。請先給我一段適合發 Instagram 的短文（含適當表情符號與主題標籤，200 字以內），再給我一篇比較完整、專業口吻的賽後檢討網誌（分段落，包含賽前準備、比賽過程、數據分析、心得反思）。'));
  lines.push('');

  lines.push(promptSectionHeader(t('ui.reportPromptRaceInfo','賽事資訊')));
  lines.push(t('ui.reportPromptName','賽事名稱')+'：'+(race.name||t('ui.unnamedRace','(未命名賽事)')));
  if(race.schedule.raceDate) lines.push(t('ui.reportPromptDate','日期')+'：'+race.schedule.raceDate);
  if(race.route.distanceKm!=null) lines.push(t('ui.reportPromptDistance','距離')+'：'+race.route.distanceKm+' km');
  if(race.route.elevationGainM) lines.push(t('ui.reportPromptElevation','總爬升')+'：'+Math.round(race.route.elevationGainM)+' m');
  if(race.results.chipTimeSeconds!=null) lines.push(t('ui.reportPromptTime','完賽時間')+'：'+secToHMS(race.results.chipTimeSeconds));
  if(race.results.chipTimeSeconds!=null&&race.route.distanceKm){
    const pace=formatPace(race.results.chipTimeSeconds/race.route.distanceKm);
    if(pace) lines.push(t('ui.reportPromptPace','平均配速')+'：'+pace+'/km');
  }
  if(race.results.isPb) lines.push(t('ui.reportPromptIsPb','這是我的個人最佳成績（PB）！'));
  lines.push('');

  const w=race.raceDayWeather;
  const weatherParts=[];
  if(w.feelsLikeTempC!=null) weatherParts.push(w.feelsLikeTempC.toFixed(1)+'°C');
  if(w.condition) weatherParts.push(t('opt.weather.'+w.condition,(WEATHER_OPTIONS.find(o=>o.value===w.condition)||{}).label||w.condition));
  if(w.humidityPct!=null) weatherParts.push(t('ui.reportPromptHumidity','濕度')+' '+w.humidityPct+'%');
  if(weatherParts.length||w.notes){
    lines.push(promptSectionHeader(t('ui.reportPromptWeather','天氣狀況')));
    if(weatherParts.length) lines.push(weatherParts.join('・'));
    if(w.notes) lines.push(w.notes);
    lines.push('');
  }

  const avgHr=race.performanceData.avgHr;
  if(avgHr!=null){
    lines.push(promptSectionHeader(t('ui.reportPromptHr','心率表現')));
    let hrLine=t('ui.reportPromptAvgHr','平均心率')+' '+avgHr+' bpm';
    const zoneInfo=hrZoneInfoForRace(avgHr,race);
    if(zoneInfo&&zoneInfo.zone){
      const labels=HR_ZONE_PROMPT_LABELS[currentLang]||HR_ZONE_PROMPT_LABELS.zh;
      hrLine+=`（Zone ${zoneInfo.zone} ${labels[zoneInfo.zone-1]||''}）`;
    }
    lines.push(hrLine);
    lines.push('');
  }

  const splitPct=computeSplitPercent(race);
  const validSplits=(race.splits||[]).filter(s=>s.avgPaceSecPerKm!=null);
  if(splitPct!=null||validSplits.length>=2){
    lines.push(promptSectionHeader(t('ui.reportPromptSplits','分段配速')));
    if(validSplits.length>=2){
      const paces=validSplits.map(s=>s.avgPaceSecPerKm);

      if(minP&&maxP) lines.push(t('ui.reportPromptPaceRange','配速範圍')+'：'+minP+' ~ '+maxP+'/km');
    }
    if(splitPct!=null){
      const label=splitPct<0?t('ui.reportPromptNegSplit','後半程加速（負分段）'):t('ui.reportPromptPosSplit','後半程掉速（正分段）');
      lines.push(label+'：'+(splitPct>0?'+':'')+splitPct.toFixed(1)+'%');
    }
    lines.push('');
  }

  const np=race.nutritionPlan;
  const nsched=race.nutritionSchedule||[];
  const nutritionParts=[];
  if(np.gelCount) nutritionParts.push(np.gelCount+' '+t('ui.reportPromptGels','條能量膠'));
  if(np.electrolyteTabletCount) nutritionParts.push(np.electrolyteTabletCount+' '+t('ui.reportPromptElectrolytes','顆鹽錠'));
  if(np.hydrationCapacityMl) nutritionParts.push(np.hydrationCapacityMl+' ml '+t('ui.reportPromptHydration','水分'));
  if(nutritionParts.length||nsched.length||np.notes){
    lines.push(promptSectionHeader(t('ui.reportPromptNutrition','補給狀況')));
    if(nutritionParts.length) lines.push(t('ui.reportPromptPlanned','計畫補給')+'：'+nutritionParts.join('・'));
    if(nsched.length){
      const consumed=nsched.filter(n=>n.consumed).length;
      lines.push(t('ui.reportPromptExecuted','實際執行 {done}/{total} 個補給點依計畫進行').replace('{done}',consumed).replace('{total}',nsched.length));
    }
    if(np.notes) lines.push(np.notes);
    lines.push('');
  }

  const rv=race.review;
  const reviewParts=[];
  if(rv.hitTheWallNotes) reviewParts.push([t('ui.reportPromptHitWall','撞牆期心得'),rv.hitTheWallNotes]);
  if(rv.courseReview) reviewParts.push([t('ui.reportPromptCourseReview','賽道心得'),rv.courseReview]);
  if(rv.pros) reviewParts.push([t('ui.reportPromptPros','做得好的地方'),rv.pros]);
  if(rv.cons) reviewParts.push([t('ui.reportPromptCons','可以改進的地方'),rv.cons]);
  if(rv.lessonsLearned) reviewParts.push([t('ui.reportPromptLessons','學到的教訓'),rv.lessonsLearned]);
  if(reviewParts.length){
    lines.push(promptSectionHeader(t('ui.reportPromptReview','賽後反思')));
    reviewParts.forEach(([label,text])=>lines.push(label+'：'+text));
  }

  return lines.join('\n').trim();
}

   單一徽章分享卡：9:16 直式圖片，呼應開箱動畫的金色慶祝感，
   方便直接發布到社群限時動態。可以在開箱當下下載，也可以事後
   從榮譽櫃裡任何一個已解鎖的徽章回頭下載。
   ============================================================ */
// 在 canvas 上畫出純軌跡線條（去背，不含地圖底圖），經度依緯度餘弦修正，
// 避免路線的實際形狀因為地圖投影被拉伸變形。起點用綠色圓點、終點用紅色
// 圓點標示方向。lineWidth／dotRadius 是選填參數，沒帶的話維持原本粗細
// （單一徽章分享卡用的就是預設值），年度回顧卡下方的迷你軌跡拼貼會帶
// 較細的數值，同一份投影邏輯兩邊共用，不用各自維護一份容易兜不起來。
function drawRouteTrackOnCanvas(ctx,trackPoints,cx,cy,maxW,maxH,color,lineWidth,dotRadius){
  if(!trackPoints||trackPoints.length<2) return false;
  lineWidth=lineWidth||7;dotRadius=dotRadius!=null?dotRadius:11;
  const lats=trackPoints.map(p=>p.lat),lons=trackPoints.map(p=>p.lon);
  const minLat=Math.min(...lats),maxLat=Math.max(...lats);
  const minLon=Math.min(...lons),maxLon=Math.max(...lons);
  const avgLat=(minLat+maxLat)/2;
  const lonScale=Math.cos(avgLat*Math.PI/180)||1;
  const spanLat=(maxLat-minLat)||0.0001;
  const spanLon=((maxLon-minLon)*lonScale)||0.0001;
  const scale=Math.min(maxW/spanLon,maxH/spanLat);
  const drawW=spanLon*scale,drawH=spanLat*scale;
  const offsetX=cx-drawW/2,offsetY=cy-drawH/2;
  function project(p){
    return [offsetX+(p.lon-minLon)*lonScale*scale,offsetY+(maxLat-p.lat)*scale];
  }
  ctx.save();
  ctx.strokeStyle=color;ctx.lineWidth=lineWidth;ctx.lineCap='round';ctx.lineJoin='round';
  ctx.shadowColor='rgba(217,177,92,0.35)';ctx.shadowBlur=Math.max(4,lineWidth*2);
  ctx.beginPath();
  trackPoints.forEach((p,i)=>{
    const [x,y]=project(p);
    if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  });
  ctx.stroke();
  ctx.shadowBlur=0;
  if(dotRadius>0){
    const [sx,sy]=project(trackPoints[0]);
    const [ex,ey]=project(trackPoints[trackPoints.length-1]);
    ctx.fillStyle='#4C9A72';ctx.beginPath();ctx.arc(sx,sy,dotRadius,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#B8451F';ctx.beginPath();ctx.arc(ex,ey,dotRadius,0,Math.PI*2);ctx.fill();
  }
  ctx.restore();
  return true;
}

/* ============================================================
   年度回顧長圖卡：擷取單一年份的完賽數據，畫成一張直式分享圖。
   只統計「完賽」的賽事（跟 computeCareerStats／computeYearlyStats
   同一個慣例），每個區塊（鞋款、極端天氣）只在那個年度真的有對應
   資料時才畫出來，沒有資料就整段跳過，不畫空白或「—」佔位。
   ============================================================ */
function availableYearInReviewYears(){
  const years=new Set();
  state.races.forEach(r=>{
    if(r.deletedAt||r.status!=='completed'||!r.schedule.raceDate) return;
    years.add(r.schedule.raceDate.slice(0,4));
  });
  return Array.from(years).sort().reverse();
}
function computeYearInReviewStats(year){
  const completed=state.races.filter(r=>r.status==='completed'&&!r.deletedAt&&r.schedule.raceDate&&r.schedule.raceDate.startsWith(year));
  const totalDistance=completed.reduce((s,r)=>s+(r.route.distanceKm||0),0);
  const totalElevation=completed.reduce((s,r)=>s+(r.route.elevationGainM||0),0);
  const pbCount=completed.filter(r=>r.results.isPb).length;
  const newBadgeCount=Object.keys(badgeUnlocks).filter(id=>{
    const u=badgeUnlocks[id];
    return u&&u.unlockedAt&&u.unlockedAt.slice(0,4)===year;
  }).length;

  const shoeAgg={};
  completed.forEach(r=>{
    const sid=r.performanceData&&r.performanceData.shoeId;
    if(!sid) return;
    if(!shoeAgg[sid]) shoeAgg[sid]={count:0,distance:0};
    shoeAgg[sid].count++;
    shoeAgg[sid].distance+=shoeDistanceOfRace(r);
  });
  let topShoeId=null;
  Object.keys(shoeAgg).forEach(sid=>{
    if(!topShoeId||shoeAgg[sid].count>shoeAgg[topShoeId].count) topShoeId=sid;
  });
  const topShoe=topShoeId?{
    shoe:shoes.find(s=>s.id===topShoeId)||null,
    count:shoeAgg[topShoeId].count,
    distance:shoeAgg[topShoeId].distance,
  }:null;

  const withTemp=completed.filter(r=>r.raceDayWeather&&r.raceDayWeather.feelsLikeTempC!=null);
  let coldestRace=null,hottestRace=null;
  withTemp.forEach(r=>{
    const temp=r.raceDayWeather.feelsLikeTempC;
    if(!coldestRace||temp<coldestRace.raceDayWeather.feelsLikeTempC) coldestRace=r;
    if(!hottestRace||temp>hottestRace.raceDayWeather.feelsLikeTempC) hottestRace=r;
  });
  if(hottestRace&&coldestRace&&hottestRace.id===coldestRace.id) hottestRace=null;

  return {year,raceCount:completed.length,totalDistance,totalElevation,pbCount,newBadgeCount,topShoe,coldestRace,hottestRace,completed};
}
async function buildYearInReviewCanvas(year){
  const s=computeYearInReviewStats(year);
  if(!s.raceCount) return null;
  try{ await document.fonts.ready; }catch(e){}
  const W=1080,H=1920;
  const canvas=document.createElement('canvas');
  canvas.width=W;canvas.height=H;
  const ctx=canvas.getContext('2d');
  const uiFont=canvasFontFamily();
  const monoFont='"IBM Plex Mono",monospace';

  ctx.fillStyle='#0D1013';
  ctx.fillRect(0,0,W,H);
  const glow=ctx.createRadialGradient(W/2,H*0.28,0,W/2,H*0.28,W*0.8);
  glow.addColorStop(0,'rgba(217,177,92,0.18)');
  glow.addColorStop(1,'rgba(217,177,92,0)');
  ctx.fillStyle=glow;
  ctx.fillRect(0,0,W,H);

  ctx.textAlign='center';
  ctx.fillStyle='#D9B15C';
  ctx.font=`bold 28px ${uiFont}`;
  ctx.fillText(t('ui.yearInReviewLabel','年度回顧'),W/2,190);

  ctx.fillStyle='#EDEEE9';
  ctx.font=`bold 150px ${monoFont}`;
  ctx.fillText(year,W/2,360);

  ctx.fillStyle='#9BA3A0';
  ctx.font=`26px ${uiFont}`;
  ctx.fillText(t('ui.yearInReviewRaceCount','{n} 場完賽紀錄').replace('{n}',s.raceCount),W/2,410);

  let y=520;
  const drawDivider=()=>{
    ctx.strokeStyle='#2A3038';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(120,y);ctx.lineTo(W-120,y);ctx.stroke();
    y+=54;
  };
  const drawStatRow=(items)=>{
    const cols=items.length;
    const colW=(W-220)/cols;
    items.forEach((it,i)=>{
      const bx=110+colW*(i+0.5);
      ctx.fillStyle='#9BA3A0';ctx.font=`24px ${uiFont}`;ctx.textAlign='center';
      ctx.fillText(it[0],bx,y);
      ctx.fillStyle='#D9B15C';ctx.font=`bold 42px ${monoFont}`;
      ctx.fillText(it[1],bx,y+52);
    });
    y+=118;
  };

  drawStatRow([
    [t('ui.yearInReviewDistance','總里程'),s.totalDistance.toFixed(1)+' km'],
    [t('ui.yearInReviewElevation','總爬升'),Math.round(s.totalElevation)+' m'],
  ]);
  drawStatRow([
    [t('ui.yearInReviewPbCount','破 PB 次數'),String(s.pbCount)],
    [t('ui.yearInReviewNewBadges','新解鎖徽章'),String(s.newBadgeCount)],
  ]);

  if(s.topShoe&&s.topShoe.shoe){
    drawDivider();
    ctx.fillStyle='#6B7178';ctx.font=`24px ${uiFont}`;ctx.textAlign='center';
    ctx.fillText(t('ui.yearInReviewTopShoe','最常穿的鞋'),W/2,y);
    y+=48;
    ctx.fillStyle='#EDEEE9';ctx.font=`bold 34px ${uiFont}`;
    y=canvasWrapTextCentered(ctx,s.topShoe.shoe.name,W/2,y,W-240,42,2);
    y+=6;
    ctx.fillStyle='#9BA3A0';ctx.font=`22px ${monoFont}`;
    ctx.fillText(t('ui.yearInReviewShoeDetail','{count} 場/  {km} km').replace('{count}',s.topShoe.count).replace('{km}',s.topShoe.distance.toFixed(0)),W/2,y+34);
    y+=90;
  }

  if(s.coldestRace||s.hottestRace){
    drawDivider();
    ctx.fillStyle='#6B7178';ctx.font=`24px ${uiFont}`;ctx.textAlign='center';
    ctx.fillText(t('ui.yearInReviewWeatherExtreme','氣候紀錄'),W/2,y);
    y+=50;
    const weatherItems=[s.coldestRace,s.hottestRace].filter(Boolean);
    const colW=(W-220)/weatherItems.length;
    weatherItems.forEach((r,i)=>{
      const bx=110+colW*(i+0.5);
      const isCold=r===s.coldestRace;
      ctx.fillStyle='#9BA3A0';ctx.font=`22px ${uiFont}`;ctx.textAlign='center';
      ctx.fillText(isCold?t('ui.yearInReviewColdest','最冷賽事'):t('ui.yearInReviewHottest','最熱賽事'),bx,y);
      ctx.fillStyle=isCold?'#7B9FD1':'#E07850';ctx.font=`bold 36px ${monoFont}`;
      ctx.fillText(r.raceDayWeather.feelsLikeTempC.toFixed(1)+'°C',bx,y+46);
      ctx.fillStyle='#6B7178';ctx.font=`20px ${uiFont}`;
      const name=r.name.length>10?r.name.slice(0,10)+'…':r.name;
      ctx.fillText(name,bx,y+80);
    });
    y+=140;
  }

  // 下方剩餘空白處，鋪一排今年所有完賽賽事的純軌跡線條拼貼（去背、不含
  // 地圖，跟單一徽章分享卡用的是同一套投影函式，只是線條細很多、也不
  // 特別標名字——這裡要的是「一整年跑過的路線形狀」湊在一起的感覺，不
  // 是逐場賽事的細節，細節在上面的數字統計跟其他頁面已經有了。空間不
  // 夠擠的話（例如最常穿的鞋、氣候紀錄兩段都出現，把版面吃掉大半）寧可
  // 不畫，不要硬塞成一團看不出形狀的線。
  const tracksAvailable=(s.completed||[])
    .filter(r=>r.route&&r.route.trackPoints&&r.route.trackPoints.length>=2)
    .slice().sort((a,b)=>(a.schedule.raceDate||'').localeCompare(b.schedule.raceDate||''));
  if(tracksAvailable.length){
    const gridTop=y+16;
    const gridBottom=H-170;
    if(gridBottom-gridTop>160){
      ctx.fillStyle='#6B7178';ctx.font=`22px ${uiFont}`;ctx.textAlign='center';
      ctx.fillText(t('ui.yearInReviewRouteTraces','今年跑過的路線'),W/2,gridTop+14);
      const contentTop=gridTop+46;
      const contentH=gridBottom-contentTop;
      const cols=3;
      const gridLeft=100,gridRight=W-100;
      const cellW=(gridRight-gridLeft)/cols;
      const maxRows=Math.max(1,Math.floor(contentH/(cellW*0.82)));
      const maxShow=cols*maxRows;
      const shown=tracksAvailable.slice(0,maxShow);
      const rows=Math.ceil(shown.length/cols);
      const cellH=contentH/rows;
      shown.forEach((race,i)=>{
        const col=i%cols,row=Math.floor(i/cols);
        const cx=gridLeft+cellW*(col+0.5);
        const cy=contentTop+cellH*(row+0.5);
        drawRouteTrackOnCanvas(ctx,race.route.trackPoints,cx,cy,cellW*0.78,cellH*0.72,'rgba(237,238,233,0.5)',2.5,4);
      });
      if(tracksAvailable.length>maxShow){
        ctx.fillStyle='#4C4F52';ctx.font=`20px ${monoFont}`;ctx.textAlign='center';
        ctx.fillText(tf('ui.yearInReviewMoreRoutes','+{n} 場',tracksAvailable.length-maxShow),W/2,gridBottom+18);
      }
    }
  }

  ctx.textAlign='center';
  ctx.fillStyle='#4C4F52';
  ctx.font=`22px ${uiFont}`;
  ctx.fillText(t('ui.appTitle','賽事紀錄'),W/2,H-100);

  return canvas;
}

   動態回顧輪播（Story Mode）：全螢幕、一頁一頁播放的年度亮點，

function storyOverlayEl(){ return document.getElementById('story-mode-overlay'); }
function clearStoryTimer(){
  if(storyMode.timer){ clearTimeout(storyMode.timer); storyMode.timer=null; }
}
function openStoryMode(year){
  const races=getStoryModeRaces(year);
  if(!races.length) return;
  storyMode={races,index:0,timer:null,year};
  storyOverlayEl().innerHTML=storySlideHtml();
  storyOverlayEl().hidden=false;
  document.body.style.overflow='hidden';
  startStorySlide();
}
function closeStoryMode(){
  clearStoryTimer();
  storyOverlayEl().hidden=true;
  storyOverlayEl().innerHTML='';
  document.body.style.overflow='';
}
function goToStorySlide(newIndex){
  clearStoryTimer();
  if(newIndex<0) newIndex=0;
  // 播完最後一頁（不管是自動播放還是手動點右邊）就直接關閉，不循環回開頭——
  // 這是一份「今年的回顧」，播完了就結束，不是無限輪播的相簿。
  if(newIndex>=storyMode.races.length+1){ closeStoryMode(); return; }
  storyMode.index=newIndex;
  storyOverlayEl().innerHTML=storySlideHtml();
  startStorySlide();
}
function startStorySlide(){
  // index 0 是純文字標題頁，1..n 才是賽事照片頁（races[index-1]）
  requestAnimationFrame(()=>{
    const fill=storyOverlayEl().querySelector('.story-progress-fill.current');
    if(fill){
      fill.classList.add('animating');
      fill.style.transitionDuration=STORY_SLIDE_DURATION+'ms';
      requestAnimationFrame(()=>{ fill.style.width='100%'; });
    }
  });
  storyMode.timer=setTimeout(()=>goToStorySlide(storyMode.index+1),STORY_SLIDE_DURATION);
}
function storySlideHtml(){
  const total=storyMode.races.length+1; // +1 給標題頁
  const progressHtml=`<div class="story-progress-row">
    ${Array.from({length:total}).map((_,i)=>`<div class="story-progress-seg"><div class="story-progress-fill${i<storyMode.index?' filled':''}${i===storyMode.index?' current':''}"></div></div>`).join('')}
  </div>`;
  const closeHtml=`<button type="button" class="story-close-btn" data-action="close-story-mode" aria-label="${t('ui.close','關閉')}">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>`;
  const tapZones=`<button type="button" class="story-tap-zone left" data-action="story-prev" aria-label="${t('ui.storyPrev','上一頁')}"></button>
    <button type="button" class="story-tap-zone right" data-action="story-next" aria-label="${t('ui.storyNext','下一頁')}"></button>`;

  let slideHtml;
  if(storyMode.index===0){
    slideHtml=`<div class="story-title-slide">
      <div class="story-title-year mono">${storyMode.year}</div>
      <div class="story-title-sub">${t('ui.storyTitleSub','{n} 場亮點賽事回顧').replace('{n}',storyMode.races.length)}</div>
    </div>`;
  }else{
    const race=storyMode.races[storyMode.index-1];
    const w=race.raceDayWeather;
    const hasWeather=w&&(w.feelsLikeTempC!=null||w.condition);
    const weatherText=hasWeather
      ?[w.feelsLikeTempC!=null?w.feelsLikeTempC.toFixed(1)+'°C':null,w.condition?t('opt.weather.'+w.condition,(WEATHER_OPTIONS.find(o=>o.value===w.condition)||{}).label||w.condition):null].filter(Boolean).join('/  ')
      :null;
    slideHtml=`<div class="story-slide">
      <img class="story-slide-bg" src="${escapeHtml(safeUrl(race.coverImage))}" alt="" style="${focalPointStyle(race)}">
      <div class="story-slide-gradient"></div>
      <div class="story-slide-content">
        <div class="story-slide-name">${escapeHtml(race.name)||t('ui.unnamedRace','(未命名賽事)')}</div>
        <div class="story-slide-date">${escapeHtml(race.schedule.raceDate||'')}</div>
        <div class="story-slide-stats">
          ${race.route.distanceKm!=null?`<div><div class="story-slide-stat-label">${t('ui.dossierStatDistance','距離')}</div><div class="story-slide-stat-value">${race.route.distanceKm.toFixed(1)} km</div></div>`:''}
          ${weatherText?`<div><div class="story-slide-stat-label">${t('ui.storyWeatherLabel','當天天氣')}</div><div class="story-slide-stat-value">${weatherText}</div></div>`:''}
        </div>
      </div>
    </div>`;
  }
  return `<div class="story-slide-frame">${progressHtml}${closeHtml}${tapZones}${slideHtml}</div>`;
}
storyOverlayEl().addEventListener('click',e=>{
  if(e.target.closest('[data-action="close-story-mode"]')){ closeStoryMode(); return; }
  if(e.target.closest('[data-action="story-prev"]')){ goToStorySlide(storyMode.index-1); return; }
  if(e.target.closest('[data-action="story-next"]')){ goToStorySlide(storyMode.index+1); return; }
});
document.getElementById('report-prompt-fallback-modal').addEventListener('click',e=>{
  if(e.target.closest('[data-action="close-report-prompt-fallback"]')){
    const modal=document.getElementById('report-prompt-fallback-modal');
    modal.hidden=true;modal.innerHTML='';
  }
});

/* ============================================================
   疲勞模式（Fatigue Mode）：給賽事進行中、雙手可能濕滑沾泥、認知能力
   因為長時間疲勞而下降時用的全螢幕簡化介面——捨棄所有精準點擊，改用
   「整個畫面隨便哪裡、往左或往右滑」這種大動作手勢。

   刻意不做的事，跟原因：
   - 不做「自動地理柵欄播報」（GPS 背景偵測接近 CP 自動語音提示）。瀏覽器
     分頁一旦背景化或螢幕鎖定，JS（包含定位監聽）幾乎一定會被系統暫停，
     這在 iOS Safari 尤其明顯；螢幕喚醒鎖定（Wake Lock）只能防止畫面自動
     變暗，不能保證背景執行，硬做一個「自動」但其實常常不會觸發的播報，
     萬一使用者在真的比賽時依賴它、結果沒有反應，反而比沒有這個功能更
     危險。改成滑動手勢「主動」觸發播報——語音本身完全可靠，只是觸發
     時機從「自動」改成「操作當下」。
   - 三段震動回饋改用 navigator.vibrate()，iOS Safari（所有 iOS 上的瀏覽器
     引擎都是 WebKit）從來沒有實作這個 API，iPhone 上這段震動永遠不會有
     反應——寫成偵測到才震動、偵測不到就安靜跳過，不會噴錯誤。
   ============================================================ */
let fatigueModeActive=false;
let fatigueWakeLockSentinel=null;
let fatigueLastAction=null; // {type:'cp'|'nutrition', race, target} 給「復原上一步」用
let fatigueTouchStartX=null,fatigueTouchStartY=null,fatigueTouchStartTime=null;
// 強光／色盲適配：電子紙高對比模式是跨賽事的持久偏好（跟深色模式一樣
// 存 localStorage），因為「今天陽光很強」跟哪一場賽事無關，是使用者
// 當下環境的選擇；心率區間對照卡則是每次開疲勞模式時的暫時檢視狀態，
// 不需要記住，關閉疲勞模式就重置。
const FATIGUE_CONTRAST_KEY='fatigue-high-contrast-v1';
let fatigueHighContrast=false;
try{ fatigueHighContrast=localStorage.getItem(FATIGUE_CONTRAST_KEY)==='1'; }catch(e){}
let fatigueShowZoneCard=false;

function fatigueCurrentCheckpoint(race){
  const cps=(race.checkpoints||[]).filter(cp=>cp.distanceKm!=null).slice().sort((a,b)=>a.distanceKm-b.distanceKm);
  return cps.find(cp=>!cp.arrivedAt)||null;
}
function fatigueNextNutritionItem(race){
  const items=(race.nutritionSchedule||[]).slice().sort((a,b)=>(a.distanceKm||0)-(b.distanceKm||0));
  return items.find(it=>!it.consumed)||null;
}
function fatigueVibrate(pattern){
  try{ tryVibrate(pattern); }catch(e){}
}
function fatigueSpeak(text){
  if(!text||!('speechSynthesis' in window)) return;
  try{
    speechSynthesis.cancel(); // 上一句還沒唸完就被新的滑動觸發時，不要疊在一起唸
    const utter=new SpeechSynthesisUtterance(text);
    utter.lang=currentLang==='ja'?'ja-JP':(currentLang==='en'?'en-US':'zh-TW');
    speechSynthesis.speak(utter);
  }catch(e){}
}
async function fatigueRequestWakeLock(){
  if(!('wakeLock' in navigator)) return;
  try{
    fatigueWakeLockSentinel=await navigator.wakeLock.request('screen');
  }catch(e){ fatigueWakeLockSentinel=null; } // 常見原因：電量過低系統拒絕、或分頁當下不在前景
}
function fatigueReleaseWakeLock(){
  if(fatigueWakeLockSentinel){
    try{ fatigueWakeLockSentinel.release(); }catch(e){}
    fatigueWakeLockSentinel=null;
  }
}
document.addEventListener('visibilitychange',()=>{
  // Wake Lock 只要分頁被切到背景就會被系統自動釋放，回到前景時如果疲勞
  // 模式還開著，要重新申請一次，不然螢幕還是會照樣變暗。
  if(fatigueModeActive&&document.visibilityState==='visible'&&!fatigueWakeLockSentinel){
    fatigueRequestWakeLock();
  }
});
// 心率區間對照卡：開放給疲勞模式在賽事進行中快速核對「手錶上這個
// bpm 數字落在哪一區」用——這個 App 本身沒有跟心率錶做藍牙連線、
// 讀不到即時心率，所以這裡呈現的是賽前就設定好的區間表，不是即時
// 心率讀數，卡片上也用文字寫清楚這一點，避免被誤會成正在讀取心率。
// 優先用使用者依運動類型設定好的個人化儲備心率區間，沒設定時退回
// 「這場賽事填的最大心率」簡單百分比估算，兩種來源算出來的
// 區間表都套用同一套形狀圖示＋顏色雙重編碼。
function fatigueZoneCardHtml(race){
  const category=sportToProfileCategory(race.sportType);
  const profileHr=userProfile&&userProfile.hr&&userProfile.hr[category];
  let zones=null;
  if(profileHr&&profileHr.restingHr!=null&&profileHr.maxHr!=null){
    zones=karvonenZones(profileHr.restingHr,profileHr.maxHr);
  }
  if(!zones&&race.performanceData.maxHr){
    const maxHr=race.performanceData.maxHr;
    const bounds=[0,0.6,0.7,0.8,0.9,1.0];
    zones=[];
    for(let i=0;i<5;i++) zones.push({zone:i+1,low:Math.round(maxHr*bounds[i]),high:Math.round(maxHr*bounds[i+1])});
  }
  if(!zones){
    return `<div class="fatigue-zone-card">
      <div class="fatigue-panel-label">${t('ui.fatigueZoneCardTitle','心率區間對照')}</div>
      <p class="fatigue-zone-empty">${t('ui.fatigueZoneCardEmpty','還沒有設定安靜心率／最大心率，無法算出區間表。')}</p>
    </div>`;
  }
  const rows=zones.map(z=>`<div class="fatigue-zone-row">
    ${hrZoneBarsSvg(z.zone,HR_ZONE_COLORS[z.zone-1])}
    <span class="fatigue-zone-label" style="color:${HR_ZONE_COLORS[z.zone-1]}">Z${z.zone}</span>
    <span class="fatigue-zone-range mono">${z.low}–${z.high}</span>
  </div>`).join('');
  return `<div class="fatigue-zone-card">
    <div class="fatigue-panel-label">${t('ui.fatigueZoneCardTitle','心率區間對照')}</div>
    <div class="fatigue-zone-rows">${rows}</div>
    <p class="fatigue-zone-note">${t('ui.fatigueZoneCardNote','這是賽前設定好的參考區間，不是即時心率讀數——請對照手錶上顯示的心率數字。')}</p>
  </div>`;
}
function fatigueModeHtml(race){
  const cp=fatigueCurrentCheckpoint(race);
  const nutrition=fatigueNextNutritionItem(race);
  const cpText=cp
    ?(cp.name||t('ui.fatigueCpFallback','CP'))+(cp.distanceKm!=null?` · ${cp.distanceKm}km`:'')
    :t('ui.fatigueAllCpsArrived','所有 CP 站都已抵達');
  const nutritionText=nutrition
    ?(nutrition.item||t('ui.fatigueItemFallback','補給項目'))+(nutrition.distanceKm!=null?` @ ${nutrition.distanceKm}km`:'')
    :t('ui.fatigueAllNutritionDone','補給計畫已全部完成');
  const toolsRow=`<div class="fatigue-tools-row">
    <button type="button" class="fatigue-tool-btn${fatigueShowZoneCard?' is-active':''}" data-action="toggle-fatigue-zone-card">${t('ui.fatigueZoneCardToggle','心率區間對照')}</button>
    <button type="button" class="fatigue-tool-btn${fatigueHighContrast?' is-active':''}" data-action="toggle-fatigue-contrast">${t('ui.fatigueContrastToggle','電子紙高對比')}</button>
  </div>`;
  const body=fatigueShowZoneCard?fatigueZoneCardHtml(race):`
    <div class="fatigue-panel fatigue-panel-top">
      <div class="fatigue-panel-label">${t('ui.fatigueNextCp','下一個 CP')}</div>
      <div class="fatigue-panel-value">${escapeHtml(cpText)}</div>
      <div class="fatigue-panel-hint">${t('ui.fatigueSwipeRightHint','向右滑動＝標記抵達')}</div>
    </div>
    <div class="fatigue-panel fatigue-panel-bottom">
      <div class="fatigue-panel-label">${t('ui.fatigueNextFuel','下一個補給')}</div>
      <div class="fatigue-panel-value">${escapeHtml(nutritionText)}</div>
      <div class="fatigue-panel-hint">${t('ui.fatigueSwipeLeftHint','向左滑動＝標記已補給')}</div>
    </div>`;
  return `
    <div class="fatigue-exit-bar">
      ${fatigueLastAction?`<button type="button" class="fatigue-undo-btn" data-action="fatigue-undo">${t('ui.fatigueUndo','復原上一步')}</button>`:'<span></span>'}
      <button type="button" class="fatigue-exit-btn" data-action="exit-fatigue-mode">${t('ui.fatigueExit','結束疲勞模式')}</button>
    </div>
    ${toolsRow}
    ${body}`;
}
function renderFatigueOverlay(){
  if(!fatigueModeActive||!currentRace) return;
  fatigueModeEl_getter().innerHTML=fatigueModeHtml(currentRace);
}
const fatigueModeEl_getter=()=>document.getElementById('fatigue-mode-overlay');
async function openFatigueMode(){
  if(!currentRace) return;
  fatigueModeActive=true;
  fatigueLastAction=null;
  fatigueShowZoneCard=false;
  fatigueModeEl_getter().classList.toggle('fatigue-high-contrast',fatigueHighContrast);
  fatigueModeEl_getter().innerHTML=fatigueModeHtml(currentRace);
  fatigueModeEl_getter().hidden=false;
  document.body.style.overflow='hidden';
  await fatigueRequestWakeLock();
}
function closeFatigueMode(){
  fatigueModeActive=false;
  fatigueLastAction=null;
  fatigueReleaseWakeLock();
  try{ speechSynthesis.cancel(); }catch(e){}
  fatigueModeEl_getter().hidden=true;
  fatigueModeEl_getter().innerHTML='';
  document.body.style.overflow='';
}
function fatigueHandleSwipeRight(){
  if(!currentRace) return;
  const cp=fatigueCurrentCheckpoint(currentRace);
  if(!cp) return;
  cp.arrivedAt=new Date().toISOString();
  currentRace.updatedAt=new Date().toISOString();
  fatigueLastAction={type:'cp',target:cp};
  persist();
  fatigueVibrate([100]);
  const next=fatigueCurrentCheckpoint(currentRace);
  fatigueSpeak(next
    ?t('ui.fatigueSpeakNextCp','下一站，{name}，距離 {km} 公里').replace('{name}',next.name||t('ui.fatigueCpFallback','CP')).replace('{km}',next.distanceKm!=null?next.distanceKm:'—')
    :t('ui.fatigueSpeakAllCpsDone','所有補給站都已經抵達'));
  renderFatigueOverlay();
}
function fatigueHandleSwipeLeft(){
  if(!currentRace) return;
  const item=fatigueNextNutritionItem(currentRace);
  if(!item) return;
  item.consumed=true;
  currentRace.updatedAt=new Date().toISOString();
  fatigueLastAction={type:'nutrition',target:item};
  persist();
  fatigueVibrate([200,100,200]);
  renderFatigueOverlay();
}
function fatigueUndo(){
  if(!fatigueLastAction) return;
  if(fatigueLastAction.type==='cp') fatigueLastAction.target.arrivedAt=null;
  else if(fatigueLastAction.type==='nutrition') fatigueLastAction.target.consumed=false;
  if(currentRace) currentRace.updatedAt=new Date().toISOString();
  fatigueLastAction=null;
  persist();
  fatigueVibrate([50]);
  renderFatigueOverlay();
}
fatigueModeEl_getter().addEventListener('click',e=>{
  if(e.target.closest('[data-action="exit-fatigue-mode"]')){ closeFatigueMode(); return; }
  if(e.target.closest('[data-action="fatigue-undo"]')){ fatigueUndo(); return; }
});
fatigueModeEl_getter().addEventListener('touchstart',e=>{
  if(!e.touches[0]) return;
  fatigueTouchStartX=e.touches[0].clientX;
  fatigueTouchStartY=e.touches[0].clientY;
  fatigueTouchStartTime=Date.now();
},{passive:true});
fatigueModeEl_getter().addEventListener('touchend',e=>{
  if(fatigueTouchStartX==null) return;
  const touch=e.changedTouches[0];
  const startX=fatigueTouchStartX,startY=fatigueTouchStartY,startTime=fatigueTouchStartTime;
  fatigueTouchStartX=null;
  if(!touch) return;
  // 按鈕（結束、復原）本身也在觸控範圍內，那類點擊不該被誤判成滑動手勢
  if(e.target.closest('[data-action]')) return;
  const dx=touch.clientX-startX,dy=touch.clientY-startY,dt=Date.now()-startTime;
  // 明確的水平滑動：水平位移夠大、垂直位移相對小（避免跟上下滾動搞混）、
  // 手指停留時間不能太長（避免長按被誤判成滑動）
  if(Math.abs(dx)>80&&Math.abs(dy)<60&&dt<800){
    if(dx>0) fatigueHandleSwipeRight();
    else fatigueHandleSwipeLeft();
  }
});
document.addEventListener('keydown',e=>{
  if(storyOverlayEl().hidden) return;
  if(e.key==='Escape'){ closeStoryMode(); }
  else if(e.key==='ArrowLeft'){ goToStorySlide(storyMode.index-1); }
  else if(e.key==='ArrowRight'){ goToStorySlide(storyMode.index+1); }
});

/* ============================================================
   主畫面渲染
   ============================================================ */
const calendarEl=document.getElementById('calendar');
const calLabelEl=document.getElementById('cal-label');
const detailEl=document.getElementById('detail');
const filterChipsEl=document.getElementById('filter-chips');
const searchInputEl=document.getElementById('search-input');
function weekdayLabels(){
  return [0,1,2,3,4,5,6].map(i=>t('ui.weekday.'+i, WEEKDAY_LABELS_ZH[i]));
}
const WEEKDAY_LABELS_ZH=['日','一','二','三','四','五','六'];
const MONTH_NAMES_EN=['January','February','March','April','May','June','July','August','September','October','November','December'];
function monthLabel(y,m){
  if(currentLang==='en') return `${MONTH_NAMES_EN[m]} ${y}`;
  if(currentLang==='ja') return `${y}年${m+1}月`;
  return `${y} 年 ${m+1} 月`;
}

function detectHomeCountry(){
  const counts={};
  let total=0;
  state.races.forEach(r=>{
    if(r.deletedAt) return;
    const c=r.location&&r.location.country&&r.location.country.trim();
    if(!c) return;
    counts[c]=(counts[c]||0)+1;
    total++;
  });
  let home=null,max=0;
  Object.keys(counts).forEach(c=>{ if(counts[c]>max){ max=counts[c]; home=c; } });
  // 只有某個國家明顯佔多數（超過一半）時才視為主場，避免出國比賽次數一多反而誤判成海外才是主場
  if(!home||total===0||max/total<=0.5) return null;
  return home;
}
function overseasCountries(){
  const home=detectHomeCountry();
  if(!home) return [];
  const counts={};
  state.races.forEach(r=>{
    if(r.deletedAt) return;
    const c=r.location&&r.location.country&&r.location.country.trim();
    if(!c||c===home) return;
    counts[c]=(counts[c]||0)+1;
  });
  return Object.keys(counts).map(c=>({country:c,count:counts[c]})).sort((a,b)=>b.count-a.count);
}
function isOverseasRace(r){
  const home=detectHomeCountry();
  if(!home) return false;
  const c=r.location&&r.location.country&&r.location.country.trim();
  return !!c&&c!==home;
}
const FILTER_PRIMARY=[
  {value:'all',labelKey:'ui.filterAll',label:'全部'},
  {value:'upcoming',labelKey:'ui.filterUpcoming',label:'即將到來'},
  {value:'history',labelKey:'ui.filterHistory',label:'歷史紀錄'},
];
const STATUS_CHIP_LABELS={registered:'已報名',lottery_pending:'抽籤中',considering:'考慮中',completed:'已完賽',dns:'DNS',dnf:'DNF'};
const FILTER_SECONDARY_MAP={
  all:[],
  upcoming:['registered','lottery_pending','considering'],
  history:['completed','dns','dnf'],
};
function isUpcomingRace(r,todayStr){
  return ['registered','lottery_pending','considering'].includes(r.status)&&(!r.schedule.raceDate||r.schedule.raceDate>=todayStr);
}
function isHistoryRace(r,todayStr){
  return ['completed','dns','dnf'].includes(r.status)||(r.schedule.raceDate&&r.schedule.raceDate<todayStr);
}
function isInTaperPeriod(race,todayStr){
  todayStr=todayStr||todayISO();
  if(!race.trainingPlan||!race.trainingPlan.taperStartDate) return false;
  if(!isUpcomingRace(race,todayStr)) return false;
  return todayStr>=race.trainingPlan.taperStartDate;
}
function matchesFilter(r,filter,todayStr){
  if(r.deletedAt) return false;
  if(filter==='all') return true;
  if(filter==='upcoming') return isUpcomingRace(r,todayStr);
  if(filter==='history') return isHistoryRace(r,todayStr);
  if(filter==='overseas') return isOverseasRace(r);
  if(filter.indexOf('country:')===0) return isOverseasRace(r)&&(r.location.country||'').trim()===filter.slice(8);
  return r.status===filter;
}
function primaryPhaseFor(filterStatus){
  if(filterStatus==='all'||filterStatus==='upcoming'||filterStatus==='history'||filterStatus==='overseas') return filterStatus;
  if(filterStatus.indexOf('country:')===0) return 'overseas';
  if(FILTER_SECONDARY_MAP.upcoming.includes(filterStatus)) return 'upcoming';
  if(FILTER_SECONDARY_MAP.history.includes(filterStatus)) return 'history';
  return 'all';
}
function computeFilterCounts(){
  const todayStr=todayISO();
  const countries=overseasCountries();
  const allValues=['all','upcoming','history','overseas',...Object.keys(STATUS_CHIP_LABELS),...countries.map(c=>'country:'+c.country)];
  const counts={};
  allValues.forEach(v=>{counts[v]=0;});
  state.races.forEach(r=>{
    allValues.forEach(v=>{ if(matchesFilter(r,v,todayStr)) counts[v]++; });
  });
  return counts;
}
function renderFilterChips(){
  const counts=computeFilterCounts();
  const countries=overseasCountries();
  const activePrimary=primaryPhaseFor(state.filterStatus);
  const primaryList=FILTER_PRIMARY.concat(countries.length?[{value:'overseas',labelKey:'ui.filterOverseas',label:'海外賽事'}]:[]);
  const primaryHtml=primaryList.map(f=>
    `<button class="chip chip-primary${activePrimary===f.value?' active':''}" data-status="${f.value}">${t(f.labelKey,f.label)}${counts[f.value]?` (${counts[f.value]})`:''}</button>`
  ).join('');
  let secondaryHtml;
  if(activePrimary==='overseas'){
    secondaryHtml=countries.map(c=>{
      const v='country:'+c.country;
      return `<button class="chip chip-secondary${state.filterStatus===v?' active':''}" data-status="${v}">${escapeHtml(c.country)}${counts[v]?` (${counts[v]})`:''}</button>`;
    }).join('');
  }else{
    const secondaryValues=FILTER_SECONDARY_MAP[activePrimary]||[];
    secondaryHtml=secondaryValues.map(v=>
      `<button class="chip chip-secondary${state.filterStatus===v?' active':''}" data-status="${v}">${t('opt.status.'+v, STATUS_CHIP_LABELS[v])}${counts[v]?` (${counts[v]})`:''}</button>`
    ).join('');
  }
  filterChipsEl.innerHTML=`<div class="chips-primary">${primaryHtml}</div>${secondaryHtml?`<div class="chips-secondary">${secondaryHtml}</div>`:''}`;
}
function filteredRaces(){
  const q=state.searchQuery.trim().toLowerCase();
  const todayStr=todayISO();
  return state.races.filter(r=>{
    if(!matchesFilter(r,state.filterStatus,todayStr)) return false;
    if(q){
      const hay=`${r.name} ${r.alias} ${(r.location&&r.location.city)||''}`.toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
}
function buildRacesByDate(races){
  const map={};
  races.forEach(r=>{
    const d=r.schedule&&r.schedule.raceDate;
    if(!d) return;
    (map[d]=map[d]||[]).push(r);
  });
  return map;
}

// formatSwimPace(secPer100m)：游泳慣用的「分'秒"/100m」。跟 formatPace
// 分開而不是加參數：兩者的輸入單位不同（一個是每公里秒數、一個是每
// 100 公尺秒數），合在一起很容易在呼叫端傳錯。
function formatSwimPace(secPer100m){
  if(secPer100m==null||!isFinite(secPer100m)) return '—';
  const m=Math.floor(secPer100m/60),s=Math.round(secPer100m%60);
  return `${m}'${String(s).padStart(2,'0')}"/100m`;
}
function formatPace(secPerKm){
  if(secPerKm==null||!isFinite(secPerKm)||secPerKm<=0) return null;
  const m=Math.floor(secPerKm/60),s=Math.round(secPerKm%60);
  return `${m}'${String(s).padStart(2,'0')}"`;
}
/* ============================================================
   氣候與表現散佈圖矩陣：把不同距離的賽事，透過「相對於自己在同一種
   經典距離下的 PB 配速差多少 %」正規化到同一個尺度上，才能把 10K、
   半馬、全馬的表現放進同一張圖比較，不會因為距離不同、配速基數本來
   就不一樣而失真。只收路跑（sportType==='road_running'）且已完賽的
   資料——越野賽爬升造成的配速雜訊，會蓋過氣溫對配速的影響，混進來
   會讓「氣溫每上升 1°C 配速掉多少 %」這個統計失去意義。
   ============================================================ */
const CLASSIC_DISTANCES=[
  {key:'10k',label:'10K',min:8.5,max:11.5},
  {key:'half',label:'半馬',min:20,max:22.5},
  {key:'full',label:'全馬',min:41,max:43.5}, // 跟 computeCareerStats 的全馬 PB 判定範圍保持一致
];
function classifyClassicDistance(distanceKm){
  if(distanceKm==null) return null;
  const match=CLASSIC_DISTANCES.find(d=>distanceKm>=d.min&&distanceKm<=d.max);
  return match?match.key:null;
}
/* ============================================================
   個人距離曲線（Riegel）：T = exp(a) × D^k。
   原本效率基準是「10K／半馬／全馬三個分類各自的 PB」，三個桶以外的距離
   （5K、15K、30K、超馬路跑）沒有同伴可比，整場直接丟掉——氣候圖上
   「依 6 場推算」多半就是這樣來的。改成一條連續曲線之後，任何距離都
   能算出「這個距離我的理論最佳」，效率 = 理論／實際。
   k 從你自己各距離的最佳成績擬合（log-log 迴歸），資料不夠就用一般
   跑者的 1.06；截距取「包絡」——把曲線壓到最緊的那一場之下，讓所有
   實際成績的效率都 ≤100%，語意跟以前的「PB 是 100%」一致。
   ============================================================ */
const RIEGEL_DEFAULT_K=1.06;
function computePersonalDistanceCurve(){
  const runs=state.races.filter(r=>!r.deletedAt&&r.status==='completed'&&r.sportType==='road_running'
    &&r.route.distanceKm>0&&r.results.chipTimeSeconds>0);
  if(!runs.length) return null;
  // 每 0.5 km 一桶取最佳，只用前緣點擬合——不然同距離跑差的場次會把曲線往上拉
  const buckets=new Map();
  runs.forEach(r=>{ const key=Math.round(r.route.distanceKm*2)/2; const cur=buckets.get(key);
    if(!cur||r.results.chipTimeSeconds<cur.results.chipTimeSeconds) buckets.set(key,r); });
  const frontier=[...buckets.values()];
  const distinct=new Set(frontier.map(r=>Math.round(r.route.distanceKm)));
  let k=RIEGEL_DEFAULT_K,fitted=false,r2=null;
  if(distinct.size>=2){
    const reg=linearRegression(frontier.map(r=>({x:Math.log(r.route.distanceKm),y:Math.log(r.results.chipTimeSeconds)})));
    if(reg&&Number.isFinite(reg.slope)){ k=Math.min(1.25,Math.max(1.0,reg.slope)); fitted=true; r2=reg.r2; }
  }
  const resid=r=>Math.log(r.results.chipTimeSeconds)-k*Math.log(r.route.distanceKm);
  const a=Math.min(...frontier.map(resid));
  const anchorRace=frontier.find(r=>Math.abs(resid(r)-a)<1e-9)||frontier[0];
  const frontierIds=new Set(frontier.map(r=>r.id));
  return {k,a,fitted,r2,frontierCount:frontier.length,distinctDistances:distinct.size,anchorRace,frontierIds,
    predictSeconds:d=>Math.exp(a+k*Math.log(d))};
}
/* computeClimatePerformancePoints(opts)：氣候圖與 EPP 共用的資料層。
   opts.allDistances   用距離曲線當基準（否則只收三個經典距離、各自 PB 當基準）
   opts.allowEstimatedTemp 沒有體感溫度時退回歷史氣候平均溫，點會標成估計值
   opts.includeTrail   越野跑用爬升折損係數校正回平地等價，係數沒準備好就不收
   EPP 沿用最嚴格的那一組（三個參數全關），它的係數要拿去預測完賽時間，
   寧可少幾場也不要混進估計值。 */
function computeClimatePerformancePoints(opts){
  opts=opts||{};
  const curve=opts.allDistances?computePersonalDistanceCurve():null;
  const gravity=opts.includeTrail?computeGravityCoefficient():null;
  const trailOk=!!(gravity&&gravity.ready);
  const completed=state.races.filter(r=>!r.deletedAt&&r.status==='completed'
    &&r.route.distanceKm>0&&r.results.chipTimeSeconds>0
    &&(r.sportType==='road_running'||(opts.includeTrail&&trailOk&&(r.sportType==='trail_running'||r.sportType==='ultra_marathon')&&r.route.elevationGainM!=null)));
  const withTemp=completed.map(r=>{
    const measured=r.raceDayWeather&&r.raceDayWeather.feelsLikeTempC;
    const est=r.climateForecast&&r.climateForecast.avgTempC;
    if(measured!=null) return {r,tempC:measured,tempEstimated:false};
    if(opts.allowEstimatedTemp&&est!=null) return {r,tempC:est,tempEstimated:true};
    return null;
  }).filter(Boolean);
  // 越野：整場平均坡度 × 爬升係數，把配速校正回平地等價。粗，但跟係數
  // 本身的定義一致（每 1% 坡度慢幾 %）；不校正的話越野點會全部躺在最下面。
  const effectiveSeconds=r=>{
    if(r.sportType==='road_running'||!trailOk) return r.results.chipTimeSeconds;
    const gradePct=r.route.elevationGainM/(r.route.distanceKm*10);
    const factor=1+gravity.pctPerGradePoint*gradePct/100;
    return factor>0.3?r.results.chipTimeSeconds/factor:r.results.chipTimeSeconds;
  };
  const points=[];
  if(curve){
    withTemp.forEach(({r,tempC,tempEstimated})=>{
      const secs=effectiveSeconds(r);
      const efficiencyPct=Math.min(100,curve.predictSeconds(r.route.distanceKm)/secs*100);
      points.push({race:r,category:classifyClassicDistance(r.route.distanceKm),tempC,tempEstimated,
        isTrail:r.sportType!=='road_running',efficiencyPct,degradationPct:efficiencyPct-100,
        isPb:curve.frontierIds.has(r.id)});
    });
    points.curve=curve; points.gravity=gravity;
    return points;
  }
  const byCategory={};
  withTemp.forEach(item=>{ const cat=classifyClassicDistance(item.r.route.distanceKm); if(!cat) return; (byCategory[cat]=byCategory[cat]||[]).push(item); });
  Object.keys(byCategory).forEach(cat=>{
    const items=byCategory[cat];
    const paces=items.map(({r})=>effectiveSeconds(r)/r.route.distanceKm);
    const pbPace=Math.min(...paces);
    items.forEach(({r,tempC,tempEstimated},i)=>{
      const efficiencyPct=(pbPace/paces[i])*100;
      points.push({race:r,category:cat,tempC,tempEstimated,isTrail:r.sportType!=='road_running',
        efficiencyPct,degradationPct:efficiencyPct-100,isPb:paces[i]<=pbPace});
    });
  });
  return points;
}
// 最小平方法線性迴歸，x=體感溫度、y=配速衰退百分比（<=0）。資料點的
// 溫度如果全部一樣（分母為 0）就沒有斜率可以算，回傳 null。同時算出
// R²（判定係數），讓呼叫端知道這條迴歸線解釋了多少變異——R² 低代表
// 資料點很散、這條線不太可信，不是只看斜率數字本身好不好看。
function linearRegression(pts){
  const n=pts.length;
  if(n<2) return null;
  let sumX=0,sumY=0,sumXY=0,sumX2=0;
  pts.forEach(p=>{ sumX+=p.x; sumY+=p.y; sumXY+=p.x*p.y; sumX2+=p.x*p.x; });
  const denom=n*sumX2-sumX*sumX;
  if(denom===0) return null;
  const slope=(n*sumXY-sumX*sumY)/denom;
  const intercept=(sumY-slope*sumX)/n;
  const meanY=sumY/n;
  let ssTot=0,ssRes=0;
  pts.forEach(p=>{
    const predicted=slope*p.x+intercept;
    ssTot+=(p.y-meanY)*(p.y-meanY);
    ssRes+=(p.y-predicted)*(p.y-predicted);
  });
  const r2=ssTot===0?null:1-(ssRes/ssTot);
  return {slope,intercept,r2,n};
}
// 最佳作戰溫度帶：抓「PB 本身」或「效率 98% 以上」的賽事，取這些賽事
// 體感溫度的最小～最大範圍。只有一筆符合條件時，補一點寬度讓色塊看
// 得出來，不會變成一條細線。
function computeSweetSpotBand(points){
  // 只看效率 ≥98%：距離曲線之下「每個距離的最佳」（金點）不一定是高效率
  // ——一個人跑過六種距離，六場都是該距離最佳，但相對曲線可能只有 96%。
  // 甜蜜點要的是「那天狀態真的好」，不是「那個距離只跑過一次」。
  // 舊的分類制裡 PB 本身就是 100%，所以這條規則對舊資料層等價。
  const highEff=points.filter(p=>p.efficiencyPct>=98);
  if(!highEff.length) return null;
  const temps=highEff.map(p=>p.tempC);
  let min=Math.min(...temps),max=Math.max(...temps);
  if(max-min<1){ min-=1; max+=1; }
  return {min,max,count:highEff.length};
}

/* ============================================================
   環境折損與等價配速預測模型（EPP）：從過去的完賽紀錄，統計出這個人
   自己的「高溫折損係數」跟「爬升折損係數」，再用這兩個係數把一場賽事
   的完賽時間拆解成「基準時間＋爬升折損＋高溫折損＋其他因素」幾段，用
   瀑布圖呈現「這場比賽最大的敵人到底是山還是太陽」。

   刻意加了這幾層保守設計，都是先想清楚統計上的陷阱才決定的，不是
   隨便找個公式就上：
   - 業餘跑者的比賽紀錄通常只有個位數到十幾筆，用最小平方法硬算出來
     的係數很容易被單一一場「那天狀況特別差／特別好」的比賽整個帶偏，
     卻還是會吐出一個看起來很精確的數字（例如「每上升1°C配速衰退
     1.2%」）——精確不等於可信。所以每個係數旁邊都會顯示 R²（這條
     迴歸線解釋了多少變異）跟資料筆數，資料不夠或 R² 太低時，直接不
     顯示係數、改顯示「還需要更多資料」，不會給一個沒有根據的假精確
     數字。
   - 爬升折損係數刻意不是拿「不同賽事的總配速」互相比較（那樣會把
     「這場是全馬、那場是超馬」這種純粹因為距離不同造成的配速差異，
     錯誤地也算進爬升的帳上）。改成只在同一場賽事「自己的分段」之間
     比較——同一天、同一個人、同一個體能狀態，只有坡度在變，這樣量
     出來的爬升效應才乾淨，不會把「距離造成的配速差異」跟「坡度造成
     的配速差異」混在一起算成同一個係數。
   - 高溫折損係數沿用既有氣候矩陣（v2.59.0）的做法：同一個經典距離
     分類（10K／半馬／全馬）裡各自拿自己的 PB 當 100% 基準再比較，
     不會拿 10K 的配速去跟全馬比。
   - 「AI 預測完賽時間」只會顯示在瀑布圖跟一個獨立標示的預測欄位，
     不會自動寫進「賽前目標」——模型算出來的數字如果剛好是錯的，
     直接被當成配速計畫在比賽當天執行，後果比模型不準本身嚴重得多
     （例如高估體感耐熱能力導致前段衝太快、後段撞牆）。要採用這個
     預測當目標，是使用者自己主動的選擇，不是系統幫他決定的。
   ============================================================ */
const EPP_MIN_THERMAL_RACES=4;
const EPP_MIN_GRAVITY_RACES=2;
const EPP_MIN_GRAVITY_SPLITS=6;
// 高溫折損係數：沿用氣候矩陣的「同分類拿自己 PB 當基準」邏輯，只取
// 體感溫度 >= 15°C 的賽事做迴歸（低於這個門檻的degradation跟溫度
// 關聯性通常很弱，混進來只會稀釋斜率、讓係數更不準）。
function computeThermalCoefficient(){
  const points=computeClimatePerformancePoints().filter(p=>p.tempC>=15);
  if(points.length<EPP_MIN_THERMAL_RACES) return {ready:false,n:points.length,needed:EPP_MIN_THERMAL_RACES};
  const reg=linearRegression(points.map(p=>({x:p.tempC,y:p.degradationPct})));
  if(!reg) return {ready:false,n:points.length,needed:EPP_MIN_THERMAL_RACES};
  // slope 是「degradationPct 對 tempC」的斜率（degradationPct<=0），
  // 轉成正值的「每上升1°C衰退幾%」比較符合使用者的直覺說法。
  return {ready:true,pctPerDegree:Math.max(0,-reg.slope),r2:reg.r2,n:points.length};
}
// 爬升折損係數：只在同一場賽事「自己的分段」之間比較，把每段配速換算
// 成「相對這場賽事自己平均配速的比例」，再拿這個比例對坡度做迴歸，
// 這樣才不會把「距離造成的配速差異」也算進爬升的帳上。
function computeGravityCoefficient(){
  const completed=state.races.filter(r=>!r.deletedAt&&r.status==='completed'&&Array.isArray(r.splits)&&r.splits.length>=2);
  const pts=[];
  let contributingRaces=0;
  completed.forEach(r=>{
    const validSplits=r.splits.filter(s=>s.avgPaceSecPerKm!=null&&s.elevationGainM!=null&&s.distanceKm);
    if(validSplits.length<2) return;
    const raceMeanPace=validSplits.reduce((s,sp)=>s+sp.avgPaceSecPerKm,0)/validSplits.length;
    if(raceMeanPace<=0) return;
    let used=false;
    validSplits.forEach(sp=>{
      const grade=splitGradePct(sp);
      if(grade==null) return;
      pts.push({x:grade,y:(sp.avgPaceSecPerKm/raceMeanPace-1)*100});
      used=true;
    });
    if(used) contributingRaces++;
  });
  if(contributingRaces<EPP_MIN_GRAVITY_RACES||pts.length<EPP_MIN_GRAVITY_SPLITS){
    return {ready:false,n:pts.length,raceCount:contributingRaces,needed:EPP_MIN_GRAVITY_SPLITS};
  }
  const reg=linearRegression(pts);
  if(!reg) return {ready:false,n:pts.length,raceCount:contributingRaces,needed:EPP_MIN_GRAVITY_SPLITS};
  // slope 是「每 1% 坡度，配速比自己平均慢幾 %」；換算成「每 100m
  // 爬升、在 1 公里內大約多花幾秒」方便跟使用者熟悉的 GAP 概念對照。
  return {ready:true,pctPerGradePoint:reg.slope,r2:reg.r2,n:pts.length,raceCount:contributingRaces};
}
// 基準配速：從「經典距離」裡挑一個使用者最能代表「最佳有氧巡航配速」
// 的類別（全馬>半馬>10K，越長距離越接近長距離耐力賽事的能量系統），
// 取該分類目前的 PB 配速——PB 是已經證實做到過的能力上限，比隨便挑
// 一場單一賽事當基準更站得住腳。
function computeEppBaselinePace(){
  const points=computeClimatePerformancePoints();
  for(const cat of ['full','half','10k']){
    const inCat=points.filter(p=>p.category===cat);
    if(!inCat.length) continue;
    const pbPoint=inCat.find(p=>p.isPb)||inCat.reduce((best,p)=>(!best||p.race.results.chipTimeSeconds/p.race.route.distanceKm<best.race.results.chipTimeSeconds/best.race.route.distanceKm)?p:best,null);
    if(pbPoint){
      return {paceSecPerKm:pbPoint.race.results.chipTimeSeconds/pbPoint.race.route.distanceKm,category:cat,sourceRace:pbPoint.race};
    }
  }
  return null;
}
// 把三個係數套到某一場賽事（不分是已完賽用來回顧、還是未完賽用來
// 預測）身上，拆解成瀑布圖需要的幾段：基準時間／爬升折損／高溫折損／
// 其他（已完賽時是「實際時間 - 前三段加總」，未完賽時這段不存在，因為
// 還沒有實際時間可以拿來對比）。
// 用線性插值，從海拔剖面（route.elevationProfile，通常是降採樣到 50 點
// 的 {distanceKm,elevationM} 陣列）算出「某個公里數當下」的海拔——
// 逐公里切片預測要知道每一段的起訖點海拔，但剖面本身不會剛好在整數
// 公里處取樣，需要在兩個最近的已知點之間內插。
function elevationAtDistance(elevationProfile,km){
  if(!elevationProfile||elevationProfile.length<2) return null;
  if(km<=elevationProfile[0].distanceKm) return elevationProfile[0].elevationM;
  const last=elevationProfile[elevationProfile.length-1];
  if(km>=last.distanceKm) return last.elevationM;
  for(let i=1;i<elevationProfile.length;i++){
    if(elevationProfile[i].distanceKm>=km){
      const p0=elevationProfile[i-1],p1=elevationProfile[i];
      const span=p1.distanceKm-p0.distanceKm;
      const frac=span>0?(km-p0.distanceKm)/span:0;
      return p0.elevationM+(p1.elevationM-p0.elevationM)*frac;
    }
  }
  return last.elevationM;
}
/* ============================================================
   EPP 逐公里切片預測引擎：把整場賽事切成固定長度的區段（預設 1 公里，
   長距離賽事自動放寬到 3 公里，避免表格長到失去意義），每一段各自套
   用坡度折損／高溫折損，而不是像 computeRaceWaterfall() 原本那樣把
   全場總爬升攤平成一個平均坡度——這樣做出來的預測，才會真的反映出
   「第 4 段有一段連續陡坡，這段特別慢；第 9 段是長下坡，這段比基準
   還快」這種賽道實際的起伏樣貌，而不是整場均勻地慢一點點。

   坡度用「這一段起訖點的淨海拔變化」而不是「只算爬升的正值總和」，
   是為了跟爬升折損係數本身的算法保持一致——那個係數是拿 splits 資料
   裡 splitGradePct()（也是用淨爬升，下坡是負值）去迴歸出來的，如果
   這裡改用「只算上坡」的算法，套用同一個係數就會邏輯不一致。這也是
   為什麼下坡段的折損算出來可以是負值（=比基準快）：係數本身就是從
   這位使用者自己「上坡變慢多少、下坡變快多少」的真實資料迴歸出來
   的，不是只把上坡的效應複製一份、下坡直接歸零。

   氣溫則是「動態」的：如果這場賽事有抓到即時逐時預報（liveForecast，
   只有賽事日期在 7 天內才會有），會依照模擬跑到這一段時的「預估時
   鐘時間」去查對應時段的預報溫度，而不是整場都套同一個溫度——長距
   離賽事清晨出發、中午還在賽道上，體感溫度本來就會隨時間爬升，這裡
   把這個效應也模擬進去。查不到逐時預報、或模擬時間跨到隔天（逐時
   預報只涵蓋單一天）時，退回整場統一套用同一個溫度，跟原本 computeRaceWaterfall()
   的做法一樣。
   ============================================================ */
function pickSegmentLengthKm(distanceKm){
  return distanceKm>15?3:1;
}
function computeSegmentPredictions(race,segmentKmOverride){
  const baseline=computeEppBaselinePace();
  const thermal=computeThermalCoefficient();
  const gravity=computeGravityCoefficient();
  if(!baseline||!thermal.ready||!gravity.ready) return null;
  const distanceKm=race.route.distanceKm;
  if(!distanceKm) return null;
  const elevationProfile=race.route.elevationProfile;
  const hasProfile=elevationProfile&&elevationProfile.length>=2;
  if(!hasProfile) return null; // 沒有海拔剖面就沒辦法逐段算坡度，讓呼叫端退回用 elevationGainM 的簡化版，不要在這裡假裝算過、實際上每段坡度都是 0
  const segmentKm=segmentKmOverride||pickSegmentLengthKm(distanceKm);
  const live=race.liveForecast;
  const fallbackTempC=race.raceDayWeather.feelsLikeTempC!=null?race.raceDayWeather.feelsLikeTempC:race.climateForecast.avgTempC;
  const segments=[];
  let cumulativeSec=0;
  let startKm=0;
  while(startKm<distanceKm-1e-6){
    const endKm=Math.min(startKm+segmentKm,distanceKm);
    const segLenKm=endKm-startKm;
    let elevationChangeM=0;
    if(hasProfile){
      const e0=elevationAtDistance(elevationProfile,startKm);
      const e1=elevationAtDistance(elevationProfile,endKm);
      if(e0!=null&&e1!=null) elevationChangeM=e1-e0;
    }
    const avgGradePct=segLenKm>0?(elevationChangeM/(segLenKm*1000))*100:0;
    const gravityExtraPct=gravity.pctPerGradePoint*avgGradePct; // 刻意不夾在 >=0，下坡段允許算出負值（比基準快）
    const baselineSegSec=baseline.paceSecPerKm*segLenKm;
    const gravitySegSec=baselineSegSec*(gravityExtraPct/100);
    let tempC=fallbackTempC;
    if(live&&live.times&&live.times.length&&race.schedule.startTime){
      const arrival=formatClockTimeOffset(race.schedule.startTime,cumulativeSec);
      if(arrival&&arrival.dayOffset===0){
        const idx=findClosestHourIndex(live.times,arrival.label);
        if(live.temp&&live.temp[idx]!=null) tempC=live.temp[idx];
      }
    }
    const thermalExtraPct=(tempC!=null&&tempC>15)?thermal.pctPerDegree*(tempC-15):0;
    const thermalSegSec=baselineSegSec*(thermalExtraPct/100);
    const predictedSegSec=Math.max(0,baselineSegSec+gravitySegSec+thermalSegSec);
    cumulativeSec+=predictedSegSec;
    segments.push({
      startKm:+startKm.toFixed(2),endKm:+endKm.toFixed(2),segLenKm,
      elevationChangeM:Math.round(elevationChangeM),avgGradePct,
      tempC,gravitySegSec,thermalSegSec,predictedSegSec,
      cumulativeSec,paceSecPerKm:predictedSegSec/segLenKm,
    });
    startKm=endKm;
  }
  if(!segments.length) return null;
  return {
    segments,segmentKm,
    totalGravitySec:segments.reduce((s,x)=>s+x.gravitySegSec,0),
    totalThermalSec:segments.reduce((s,x)=>s+x.thermalSegSec,0),
    totalPredictedSec:cumulativeSec,
    baseline,thermal,gravity,
  };
}
function computeRaceWaterfall(race){
  const baseline=computeEppBaselinePace();
  const thermal=computeThermalCoefficient();
  const gravity=computeGravityCoefficient();
  if(!baseline||!thermal.ready||!gravity.ready) return null;
  const distanceKm=race.route.distanceKm;
  const elevationGainM=race.route.elevationGainM;
  if(!distanceKm) return null;
  const baselineSec=baseline.paceSecPerKm*distanceKm;
  // 優先用逐公里切片引擎算出來的加總——比下面「把全場爬升攤平成一個
  // 平均坡度」的簡化版準確得多，因為爬升折損跟高溫折損都會依照賽道
  // 實際的起伏跟模擬時鐘時間分段套用，不是整場均勻地打一個折。只有
  // 賽事沒有海拔剖面資料（例如手動填距離、沒匯入 GPX）時才會退回
  // 簡化版，保證這個功能在資料不足時依然能給出一個粗估值，而不是
  // 整段消失。
  const segmentResult=computeSegmentPredictions(race);
  let gravitySec,thermalSec,predictedSec,tempC,avgGradePct;
  if(segmentResult){
    gravitySec=segmentResult.totalGravitySec;
    thermalSec=segmentResult.totalThermalSec;
    predictedSec=segmentResult.totalPredictedSec;
    avgGradePct=elevationGainM!=null?(elevationGainM/(distanceKm*1000))*100:0;
    tempC=race.raceDayWeather.feelsLikeTempC!=null?race.raceDayWeather.feelsLikeTempC:race.climateForecast.avgTempC;
  }else{
    const fallbackAvgGradePct=elevationGainM!=null?(elevationGainM/(distanceKm*1000))*100:0;
    const gravityExtraPct=Math.max(0,gravity.pctPerGradePoint*fallbackAvgGradePct);
    gravitySec=baselineSec*(gravityExtraPct/100);
    tempC=race.raceDayWeather.feelsLikeTempC!=null?race.raceDayWeather.feelsLikeTempC:race.climateForecast.avgTempC;
    const thermalExtraPct=tempC!=null&&tempC>15?thermal.pctPerDegree*(tempC-15):0;
    thermalSec=baselineSec*(thermalExtraPct/100);
    predictedSec=baselineSec+gravitySec+thermalSec;
    avgGradePct=fallbackAvgGradePct;
  }
  const actualSec=race.results.chipTimeSeconds;
  const otherSec=actualSec!=null?actualSec-predictedSec:null;
  return {baseline,thermal,gravity,baselineSec,gravitySec,thermalSec,predictedSec,actualSec,otherSec,tempC,avgGradePct,segmentResult};
}
// 帶正負號的時間差顯示，用在瀑布圖的「+15分」「-8分」這種階梯標籤，
// 跟 secToHMS 分開是因為那個函式假設輸入一定是非負秒數。
function signedDurationLabel(sec){
  const sign=sec>=0?'+':'-';
  const abs=Math.round(Math.abs(sec));
  const h=Math.floor(abs/3600),m=Math.floor((abs%3600)/60),s=abs%60;
  if(h>0) return `${sign}${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  return `${sign}${m}:${String(s).padStart(2,'0')}`;
}
// 折損瀑布圖：基準時間開始，每加一段折損／優勢就往上或往下疊一階，
// 最後一根柱子是全部疊起來的總結果（有實際成績就用實際成績，還沒有
// 就用模型預測值）。配色沿用氣候散佈圖那組既有色票，不是另外自創。
function eppWaterfallChartSvg(wf){
  const steps=[
    {label:t('ui.eppBarBaseline','基準'),delta:wf.baselineSec,cumStart:0,cumEnd:wf.baselineSec,color:'var(--contour)',isBase:true},
    {label:t('ui.eppBarGravity','爬升'),delta:wf.gravitySec,cumStart:wf.baselineSec,cumEnd:wf.baselineSec+wf.gravitySec,color:'#B8451F'},
    {label:t('ui.eppBarThermal','高溫'),delta:wf.thermalSec,cumStart:wf.baselineSec+wf.gravitySec,cumEnd:wf.predictedSec,color:'#D98A3D'},
  ];
  if(wf.otherSec!=null){
    steps.push({
      label:t('ui.eppBarOther','其他因素'),delta:wf.otherSec,
      cumStart:wf.predictedSec,cumEnd:wf.predictedSec+wf.otherSec,
      color:wf.otherSec<0?'#4C9A72':'#B8451F',
    });
  }
  const finalSec=wf.actualSec!=null?wf.actualSec:wf.predictedSec;
  steps.push({
    label:wf.actualSec!=null?t('ui.eppBarActual','實際完賽'):t('ui.eppBarPredicted','AI 預測'),
    delta:finalSec,cumStart:0,cumEnd:finalSec,color:'var(--gold)',isFinal:true,
  });

  const maxSec=Math.max(...steps.map(s=>Math.max(s.cumStart,s.cumEnd)))*1.08;
  const w=600,h=280,padL=54,padR=16,padTop=24,padBottom=54;
  const plotW=w-padL-padR,plotH=h-padTop-padBottom;
  const cols=steps.length;
  const gap=10;
  const barW=(plotW-gap*(cols-1))/cols;
  const sy=sec=>padTop+plotH-((sec/maxSec)*plotH);

  const bars=steps.map((s,i)=>{
    const x=padL+i*(barW+gap);
    const yTop=sy(Math.max(s.cumStart,s.cumEnd));
    const yBottom=sy(Math.min(s.cumStart,s.cumEnd));
    const barH=Math.max(1,yBottom-yTop);
    const connector=i>0&&!s.isFinal
      ?`<line x1="${(x-gap).toFixed(1)}" y1="${sy(s.cumStart).toFixed(1)}" x2="${x.toFixed(1)}" y2="${sy(s.cumStart).toFixed(1)}" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/>`
      :'';
    const deltaLabel=s.isBase||s.isFinal?secToHMS(s.cumEnd):signedDurationLabel(s.delta);
    const tip=`${s.label}：${deltaLabel}`;
    return `${connector}<rect x="${x.toFixed(1)}" y="${yTop.toFixed(1)}" width="${barW.toFixed(1)}" height="${barH.toFixed(1)}" fill="${s.color}" opacity="${s.isFinal?1:0.85}" rx="2"><title>${escapeHtml(tip)}</title></rect>
      <text x="${(x+barW/2).toFixed(1)}" y="${(yTop-6).toFixed(1)}" text-anchor="middle" class="epp-waterfall-label mono">${escapeHtml(deltaLabel)}</text>
      <text x="${(x+barW/2).toFixed(1)}" y="${h-padBottom+20}" text-anchor="middle" class="epp-waterfall-axis-label">${escapeHtml(s.label)}</text>`;
  }).join('');

  return `<svg viewBox="0 0 ${w} ${h}" class="epp-waterfall-svg" preserveAspectRatio="xMidYMid meet">${bars}</svg>`;
}
function eppCoefficientBlockHtml(){
  const thermal=computeThermalCoefficient();
  const gravity=computeGravityCoefficient();
  const thermalLine=thermal.ready
    ?t('ui.eppThermalReady','高溫折損：每升高 1°C，配速衰退約 {pct}%（R²={r2}，依 {n} 場賽事推算）')
      .replace('{pct}',thermal.pctPerDegree.toFixed(2)).replace('{r2}',thermal.r2!=null?thermal.r2.toFixed(2):'—').replace('{n}',thermal.n)
    :t('ui.eppThermalPending','高溫折損：資料還不夠（目前 {n} 場體感溫度 ≥15°C 的路跑賽事，至少需要 {needed} 場）')
      .replace('{n}',thermal.n).replace('{needed}',thermal.needed);
  const gravityLine=gravity.ready
    ?t('ui.eppGravityReady','爬升折損：每 1% 坡度，配速比自己平均慢約 {pct}%（R²={r2}，依 {n} 場賽事、{count} 個分段推算）')
      .replace('{pct}',gravity.pctPerGradePoint.toFixed(2)).replace('{r2}',gravity.r2!=null?gravity.r2.toFixed(2):'—').replace('{n}',gravity.raceCount).replace('{count}',gravity.n)
    :t('ui.eppGravityPending','爬升折損：資料還不夠（目前 {n} 個有效分段，至少需要 {needed} 個、來自至少 2 場賽事）')
      .replace('{n}',gravity.n).replace('{needed}',gravity.needed);
  return `<div class="epp-coefficient-block">
    <p class="small">${thermalLine}</p>
    <p class="small">${gravityLine}</p>
  </div>`;
}

    return `<tr>

      <td class="mono">${eleSign}${s.elevationChangeM}m</td>

      <td class="mono">${arrival?arrival.label+(arrival.dayOffset>0?' +'+arrival.dayOffset+'d':''):'—'}</td>

      <tbody>${rows}</tbody>

}

  return `<div class="epp-section">

    </div>
    <p class="empty-hint small">${t('ui.eppDisclaimer','這是根據你過去賽事統計出來的估計值，不是保證會發生的事，也不會自動變成你的賽前目標——要採用的話請自己按下面的按鈕。')}</p>
    <div class="epp-adopt-row">${adoptButtons}</div>
