  /* ---------- Import modal ---------- */
  /* ---- iOS 風格的空間景深：彈出視窗／抽屜打開時，主內容往後退一點
     並且失焦，把視覺焦點完全交給前景。
     套用對象刻意選 #main-content 而不是 #app 或 body：filter 與
     transform 會讓元素變成 position:fixed 子孫的「包含區塊」，被套用的
     容器裡如果有固定定位的東西，就會從「相對視窗固定」變成「相對這個
     容器固定」，位置整個跑掉。這個 App 的兩顆懸浮按鈕（使用說明、新增
     賽事）都在 </main> 之後、#main-content 之外，標題列與快速導覽列是
     sticky 也都在 main 之外，所以都不受影響。 ---- */
  #main-content{
    transform-origin:center 32%;
    transition:transform 0.4s cubic-bezier(0.32,0.72,0,1),
               filter 0.4s cubic-bezier(0.32,0.72,0,1),
               border-radius 0.4s cubic-bezier(0.32,0.72,0,1);
  }
  body.overlay-open #main-content{
    transform:scale(0.96);
    border-radius:12px;
  }
  /* 模糊只給桌機。filter:blur() 會把整個 #main-content 連同底下所有
     東西（整個月曆、上百張 base64 封面、獎牌牆、圖表）一次點陣化成
     單一 GPU 圖層再做模糊——頁面越長、照片越多，這張貼圖就越大。
     iOS Safari 對這種超大圖層沒有分塊處理，記憶體一超過就把整個
     分頁殺掉、自動重新載入；使用者看到的是「開一個彈窗就白畫面、
     不斷重整、最後出現『重複發生問題』」。transform 沒有這個問題
     （Safari 會分塊），所以縮放與變暗的景深效果手機上照樣有。 */
  @media (hover:hover) and (pointer:fine){
    body.overlay-open #main-content{filter:blur(4px);}
  }
  /* 減少動態效果：保留「已經退到背景」這個語意，但不做位移與模糊，
     改用單純的淡化——完全不做區別的話，使用者會失去「主畫面現在不是
     操作對象」這個提示。 */
  @media (prefers-reduced-motion:reduce){
    #main-content{transition:opacity 0.2s ease;}
    body.overlay-open #main-content{transform:none;filter:none;border-radius:0;opacity:0.45;}
  }
  .modal-overlay{
    position:fixed;inset:0;background:rgba(22,35,28,0.45);
    display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;
  }
  .modal-overlay[hidden]{display:none;}

  /* ---- 全域拖曳匯入：拖曳外部檔案（GPX/TCX/FIT、JSON、圖片）進視窗
     時的毛玻璃提示層。z-index 故意比一般 modal-overlay 高，確保不管
     當下開著哪個彈窗，拖曳提示都蓋在最上層、清楚可見。backdrop-filter
     搭配 --paper-glass（本來就是半透明的紙色調），淺色／深色主題會
     自動套用對應的玻璃色調，不用另外寫深色模式的例外規則。 ---- */
  .global-dropzone-overlay{
    position:fixed;inset:0;z-index:500;
    background:var(--paper-glass);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    display:flex;align-items:center;justify-content:center;padding:24px;
    opacity:0;transition:opacity 0.15s ease;pointer-events:none;
  }
  .global-dropzone-overlay[hidden]{display:none;}
  .global-dropzone-overlay.is-active{opacity:1;}
  .global-dropzone-frame{
    border:3px dashed var(--trail);border-radius:24px;padding:48px 32px;
    text-align:center;max-width:360px;pointer-events:none;
  }
  .global-dropzone-icon{font-size:48px;margin-bottom:12px;}
  .global-dropzone-title{color:var(--ink);font-size:22px;margin:0 0 8px;}
  .global-dropzone-hint{color:var(--ink-soft);margin:0;}

  /* ---- 全域指令控制台（Cmd/Ctrl+K）：背景故意跟「動態回顧輪播」一樣
     用寫死的深色，不跟著淺色/深色主題變動——這是聚焦式的懸浮操作
     介面，不是一般表單頁面，維持固定的深色調更有「浮在最上層」的
     視覺重量；控制台本體（.cmdk-frame）才用一般的 --surface，會照
     淺色/深色主題正常切換。 ---- */
  /* ---- 抽屜面板（Drawer）：目前只有「裝備清單」用這個模式，是從
     長表單改成「儀表板卡片＋點開抽屜編輯」的第一個試作區塊。方向
     刻意做成有差別——桌機從右側滑入（不遮住左邊的內容，可以一邊
     對照一邊編輯），手機從底部滑上來（配合拇指操作，跟這個 App
     其他彈窗在手機上的行為一致）。
     關閉的方式有三種：右上角的 ✕、點背景遮罩、按 Esc；手機上再加
     一個「按系統返回鍵也會先收起抽屜、而不是直接離開網站」，用
     history 的狀態堆疊做到。 ---- */
  .drawer-overlay{
    position:fixed;inset:0;z-index:400;background:rgba(10,14,12,0.5);
    backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  }
  .drawer-overlay[hidden]{display:none;}
  .drawer-panel{
    position:fixed;z-index:401;background:var(--surface);
    display:flex;flex-direction:column;
    box-shadow:-4px 0 24px rgba(0,0,0,0.18);
    transition:transform 0.3s cubic-bezier(0.34,1.4,0.64,1);
  }
  .drawer-header{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:16px 20px;border-bottom:1px solid var(--rule);flex-shrink:0;
  }
  .drawer-header h3{font-size:17px;margin:0;}
  .drawer-body{overflow-y:auto;padding:16px 20px 28px;flex:1;}
  /* 抽屜頂端已經有標題了，如果區塊自己那個標題跟抽屜標題重複就藏
     起來（例如裝備清單抽屜裡不用再寫一次「裝備清單」）。但「預算與
     行程」這種一個抽屜裡放了住宿／交通／同行者好幾份清單的情況，
     每份清單的標題都要留著，不然只會看到三組「＋新增」按鈕、分不出
     哪個是哪個——所以用 data-keep-heading 標記需要保留的那些。 */
  .drawer-body .subsection-head h3:not([data-keep-heading]){display:none;}
  .drawer-body .subsection{margin:0 0 18px;}
  @media (min-width:641px){
    .drawer-panel{top:0;bottom:0;right:0;width:460px;max-width:92vw;transform:translateX(100%);}
    .drawer-overlay:not([hidden]) .drawer-panel{transform:translateX(0);}
  }
  @media (max-width:640px){
    .drawer-panel{
      bottom:0;left:0;right:0;height:86vh;
      border-radius:16px 16px 0 0;transform:translateY(100%);
    }
    .drawer-overlay:not([hidden]) .drawer-panel{transform:translateY(0);}
    /* 手機版頂端的小灰條，暗示這是一個可以從底部拉上來的面板，跟
       這個 App 其他彈窗在手機上的 Bottom Sheet 樣式一致。 */
    .drawer-header::before{
      content:'';position:absolute;top:8px;left:50%;transform:translateX(-50%);
      width:40px;height:5px;border-radius:3px;background:var(--rule);
    }
    .drawer-header{position:relative;padding-top:22px;}
  }
  @media (prefers-reduced-motion:reduce){
    .drawer-panel{transition:none;}
  }
  /* 儀表板上的裝備摘要卡片：整張卡片就是一個按鈕，點了打開抽屜。 */
  .dash-card{
    width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer;
    border:1px solid var(--rule);border-radius:8px;padding:14px 16px;
    margin:18px 0;
    background:var(--paper);display:flex;align-items:center;gap:14px;
    transition:border-color 0.15s ease,transform 0.15s ease;
  }
  .dash-card:hover{border-color:var(--trail);}
  .dash-card:active{transform:scale(0.995);}
  .dash-card-main{flex:1;min-width:0;}
  .dash-card-title{font-weight:600;margin-bottom:3px;}
  .dash-card-sub{color:var(--stone);font-size:13px;}
  .dash-card-chevron{color:var(--stone);font-size:18px;flex-shrink:0;}
  /* 空抽屜：淡化、虛線框、標題與「尚未填寫」收成同一行，高度約剩一半。
     hover／focus 時回到全亮，不然找不到要點哪裡。 */
  .dash-card.is-empty{opacity:0.58;border-style:dashed;padding:9px 16px;margin:10px 0;}
  .dash-card.is-empty:hover,.dash-card.is-empty:focus-visible{opacity:1;}
  .dash-card.is-empty .dash-card-main{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;}
  .dash-card.is-empty .dash-card-title{font-weight:500;font-size:14px;margin-bottom:0;}
  .dash-card.is-empty .dash-card-sub{font-size:12px;}
  .dash-card.is-empty .dash-card-chevron{font-size:15px;}
  /* 填了的卡片緊接著空卡片時，不要讓兩個 margin 疊出一大段空白 */
  .dash-card.is-empty + .dash-card.is-empty{margin-top:6px;}
  .cmdk-overlay{
    position:fixed;inset:0;z-index:600;background:rgba(10,14,12,0.55);
    display:flex;align-items:flex-start;justify-content:center;padding:12vh 20px 20px;
  }
  .cmdk-overlay[hidden]{display:none;}
  .cmdk-frame{
    width:100%;max-width:600px;background:var(--surface);border-radius:14px;
    box-shadow:0 20px 60px rgba(0,0,0,0.35);overflow:hidden;
    display:flex;flex-direction:column;max-height:70vh;
  }
  .cmdk-input{
    width:100%;border:none;border-bottom:1px solid var(--rule);padding:18px 20px;
    font-size:17px;font-family:inherit;background:transparent;color:var(--ink);outline:none;
  }
  .cmdk-results{overflow-y:auto;padding:6px;}
  .cmdk-row{
    display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;cursor:pointer;
  }
  .cmdk-row-icon{font-size:16px;width:20px;text-align:center;flex-shrink:0;}
  .cmdk-row-label{flex:1;color:var(--ink);}
  .cmdk-row-meta{color:var(--stone);font-size:12px;}
  .cmdk-row.active{background:var(--stamp-bg-gold);}
  .cmdk-empty{padding:20px;text-align:center;color:var(--stone);font-size:14px;}
  .cmdk-group-label{padding:8px 12px 4px;font-size:11px;text-transform:uppercase;letter-spacing:0.04em;color:var(--stone);}

  /* ---- 動態回顧輪播（Story Mode）：故意用寫死的深色，不跟著淺色/深色
     主題變動，理由跟徽章成就圖卡一樣——這是沉浸式的相片瀏覽畫面，不是
     一般表單頁面。 ---- */
  /* ---- 生涯回顧主卡：長按 PB 數字解鎖的全螢幕畫面。
     底色寫死深色、不跟隨淺色/深色主題，跟既有的「動態回顧輪播」
     一致——這是一個聚焦的儀式性畫面，不是一般的資料頁。 ---- */
  .hof-overlay{
    position:fixed;inset:0;z-index:210;overflow-y:auto;
    background:#0B0E0D;color:#EDEEE9;
    animation:hof-fade-in 0.5s ease;
  }
  .hof-overlay[hidden]{display:none;}
  @keyframes hof-fade-in{from{opacity:0;}to{opacity:1;}}
  .hof-inner{max-width:560px;margin:0 auto;padding:60px 20px 80px;position:relative;}
  .hof-close{
    position:fixed;top:16px;right:16px;z-index:2;
    background:rgba(255,255,255,0.1);color:#EDEEE9;border:none;
    width:40px;height:40px;border-radius:50%;font-size:18px;cursor:pointer;
  }
  .hof-close:hover{background:rgba(255,255,255,0.2);}
  .hof-title{font-size:13px;letter-spacing:0.18em;text-transform:uppercase;
    color:rgba(237,238,233,0.55);text-align:center;margin-bottom:26px;}
  /* 英雄卡：沿用獎牌牆那套 3D 傾斜的做法，變數由同一個引擎寫入 */
  .hof-hero{
    position:relative;border-radius:16px;padding:34px 24px 30px;text-align:center;
    background:linear-gradient(145deg,#15201B 0%,#0E1512 100%);
    border:1px solid rgba(var(--gold-rgb),0.35);
    box-shadow:0 18px 50px rgba(0,0,0,0.5);
    margin-bottom:30px;overflow:hidden;
  }
  .hof-hero-label{font-size:12px;letter-spacing:0.14em;text-transform:uppercase;
    color:rgba(var(--gold-rgb),0.85);margin-bottom:10px;}
  .hof-hero-value{font-size:58px;font-weight:700;color:var(--gold);line-height:1;}
  .hof-hero-race{margin-top:12px;font-size:15px;color:rgba(237,238,233,0.8);}
  .hof-hero-date{margin-top:4px;font-size:13px;color:rgba(237,238,233,0.5);}
  .hof-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:30px;}
  .hof-tile{
    background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);
    border-radius:12px;padding:18px 16px;
  }
  .hof-tile-wide{grid-column:1/-1;}
  .hof-tile-value{font-size:26px;font-weight:700;color:#EDEEE9;line-height:1.1;}
  .hof-tile-label{font-size:12px;color:rgba(237,238,233,0.55);margin-top:6px;}
  .hof-section-title{font-size:12px;letter-spacing:0.14em;text-transform:uppercase;
    color:rgba(237,238,233,0.5);margin:0 0 12px;}
  /* ---- 軌跡畫廊：橫向捲動，每張卡片對齊停靠。
     用原生的 scroll-snap 而不是自己寫 touch 事件——原生捲動本來就
     帶有邊緣阻尼與慣性，手感比自己算位移好，也不會跟外層的垂直
     捲動打架。 ---- */
  .hof-track-gallery{
    display:flex;gap:12px;overflow-x:auto;padding:2px 2px 14px;margin-bottom:26px;
    scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;
    scrollbar-width:thin;scrollbar-color:rgba(255,255,255,0.2) transparent;
  }
  .hof-track-gallery::-webkit-scrollbar{height:6px;}
  .hof-track-gallery::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.18);border-radius:3px;}
  .hof-track-card{
    position:relative;flex:0 0 168px;scroll-snap-align:start;
    background:rgba(255,255,255,0.035);border:1px solid rgba(255,255,255,0.08);
    border-radius:12px;padding:8px 8px 12px;
  }
  .hof-track-svg{width:100%;height:auto;display:block;}
  .hof-track-meta{padding:0 4px;}
  .hof-track-name{
    font-size:13px;color:#EDEEE9;margin-bottom:3px;
    /* 賽事名稱長度差很多，統一截成一行，不然卡片高度會參差不齊 */
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .hof-track-stats{font-size:11px;color:rgba(237,238,233,0.5);}
  .hof-track-badge{
    position:absolute;top:10px;right:10px;
    background:var(--gold);color:#0B0E0D;font-size:10px;font-weight:700;
    padding:2px 7px;border-radius:8px;letter-spacing:0.04em;
  }
  .hof-shoe-row{
    display:flex;align-items:baseline;gap:10px;padding:11px 0;
    border-bottom:1px solid rgba(255,255,255,0.07);
  }
  .hof-shoe-row:last-child{border-bottom:none;}
  .hof-shoe-name{flex:1;font-size:14px;color:#EDEEE9;}
  .hof-shoe-stat{font-size:13px;color:rgba(237,238,233,0.6);white-space:nowrap;}
  .hof-empty{color:rgba(237,238,233,0.45);font-size:13px;}
  /* ---- 能量補給區：用流體漸層當底，呼應「燃料艙」的意象。
     漸層是靜態的（沒有動畫）——這張卡片已經有彩帶、霓虹軌跡、
     3D 傾斜好幾個動態元素，再加一個會動的背景只會讓畫面更吵。 ---- */
  .hof-fuel-head{
    display:flex;align-items:baseline;gap:10px;
    padding:18px 18px 16px;border-radius:12px 12px 0 0;
    background:radial-gradient(ellipse 120% 100% at 15% 0%, rgba(184,69,31,0.30) 0%, transparent 60%),
               radial-gradient(ellipse 100% 100% at 85% 100%, rgba(var(--gold-rgb),0.22) 0%, transparent 62%),
               rgba(255,255,255,0.035);
    border:1px solid rgba(255,255,255,0.08);border-bottom:none;
  }
  .hof-fuel-total{font-size:34px;font-weight:700;color:#EDEEE9;line-height:1;}
  .hof-fuel-total-label{font-size:12px;color:rgba(237,238,233,0.6);}
  .hof-fuel-chips{
    display:flex;gap:8px;flex-wrap:wrap;padding:12px 18px 14px;
    background:rgba(255,255,255,0.02);
    border-left:1px solid rgba(255,255,255,0.08);border-right:1px solid rgba(255,255,255,0.08);
  }
  .hof-fuel-chip{
    display:flex;flex-direction:column;gap:2px;
    background:rgba(0,0,0,0.3);border-radius:8px;padding:8px 12px;min-width:76px;
  }
  .hof-fuel-chip-value{font-size:15px;font-weight:600;color:#EDEEE9;}
  .hof-fuel-chip-label{font-size:11px;color:rgba(237,238,233,0.5);}
  .hof-fuel-list{
    padding:4px 18px 8px;border:1px solid rgba(255,255,255,0.08);border-top:none;
    border-radius:0 0 12px 12px;margin-bottom:10px;
  }
  .story-overlay{
    position:fixed;inset:0;background:#000;z-index:200;
    display:flex;align-items:center;justify-content:center;
  }
  .story-overlay[hidden]{display:none;}
  .story-slide-frame{
    position:relative;width:100%;height:100%;max-width:480px;margin:0 auto;
    overflow:hidden;background:#0D1013;
  }
  .story-progress-row{
    position:absolute;top:0;left:0;right:0;display:flex;gap:4px;padding:12px 12px 0;z-index:10;
  }
  .story-progress-seg{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,0.3);overflow:hidden;}
  .story-progress-fill{height:100%;background:#fff;width:0%;}
  .story-progress-fill.filled{width:100%;}
  .story-progress-fill.animating{transition:width linear;}
  .story-close-btn{
    position:absolute;top:20px;right:12px;z-index:11;background:none;border:none;color:#fff;
    width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:0.9;
  }
  .story-tap-zone{position:absolute;top:0;bottom:0;width:50%;z-index:5;background:none;border:none;padding:0;cursor:pointer;}
  .story-tap-zone.left{left:0;}
  .story-tap-zone.right{right:0;}
  .story-slide{position:absolute;inset:0;}
  .story-slide-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .story-slide-gradient{position:absolute;inset:0;background:linear-gradient(to bottom, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0) 28%, rgba(0,0,0,0) 55%, rgba(0,0,0,0.8) 100%);}
  .story-slide-content{position:absolute;left:0;right:0;bottom:0;padding:28px 24px 46px;color:#fff;z-index:2;}
  .story-slide-name{font-size:23px;font-weight:700;margin-bottom:6px;line-height:1.3;}
  .story-slide-date{font-size:14px;opacity:0.8;margin-bottom:16px;}
  .story-slide-stats{display:flex;gap:20px;flex-wrap:wrap;}
  .story-slide-stat-label{font-size:11px;opacity:0.7;margin-bottom:2px;}
  .story-slide-stat-value{font-family:'IBM Plex Mono',monospace;font-size:16px;font-weight:600;}
  .story-title-slide{
    position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;color:#fff;background:#0D1013;padding:0 30px;
  }
  .story-title-year{font-family:'IBM Plex Mono',monospace;font-size:64px;font-weight:700;color:#D9B15C;}
  .story-title-sub{font-size:16px;opacity:0.75;margin-top:14px;}

  /* ---- 疲勞模式：純黑背景省 OLED 電、字級刻意放到極大，整個畫面就是
     一個大手勢感應區，不追求精緻排版，追求「隨便滑都滑得到」。 ---- */
  .fatigue-overlay{
    position:fixed;inset:0;background:#000;color:#fff;z-index:300;
    display:flex;flex-direction:column;touch-action:pan-y;
    font-family:inherit;
  }
  .fatigue-overlay[hidden]{display:none;}
  .fatigue-exit-bar{display:flex;justify-content:space-between;align-items:center;padding:18px 16px;flex:0 0 auto;}
  .fatigue-undo-btn,.fatigue-exit-btn{
    background:transparent;border:1px solid #3A3A3A;color:#999;padding:10px 16px;
    border-radius:8px;font-size:15px;font-family:inherit;
  }
  .fatigue-panel{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:24px;text-align:center;min-height:0;
  }
  .fatigue-panel-top{border-bottom:1px solid #1A1A1A;}
  .fatigue-panel-label{font-size:18px;color:#777;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:14px;}
  .fatigue-panel-value{
    font-size:44px;font-weight:800;color:#D9B15C;line-height:1.25;
    margin-bottom:18px;word-break:break-word;max-width:100%;
  }
  .fatigue-panel-hint{font-size:15px;color:#555;}
  /* ---- 強光／色盲適配：工具列、心率區間對照卡 ---- */
  .fatigue-tools-row{display:flex;gap:10px;padding:0 16px 14px;flex:0 0 auto;}
  .fatigue-tool-btn{
    flex:1;background:transparent;border:1.5px solid #3A3A3A;color:#999;padding:12px 8px;
    border-radius:8px;font-size:14px;font-family:inherit;
  }
  .fatigue-tool-btn.is-active{border-color:#D9B15C;color:#D9B15C;}
  .fatigue-zone-card{flex:1;display:flex;flex-direction:column;justify-content:center;padding:20px 24px;min-height:0;overflow-y:auto;}
  .fatigue-zone-card .fatigue-panel-label{text-align:center;margin-bottom:18px;}
  .fatigue-zone-rows{display:flex;flex-direction:column;gap:14px;}
  .fatigue-zone-row{display:flex;align-items:center;gap:14px;padding:8px 0;border-bottom:1px solid #1A1A1A;}
  .fatigue-zone-row .hr-zone-bars{width:26px;height:18px;flex-shrink:0;}
  .fatigue-zone-label{font-size:22px;font-weight:800;width:44px;flex-shrink:0;}
  .fatigue-zone-range{font-size:22px;color:#ccc;}
  .fatigue-zone-note,.fatigue-zone-empty{font-size:14px;color:#666;margin-top:18px;text-align:center;line-height:1.6;}
  /* 電子紙高對比模式：反轉成近乎純黑字配暖白底，強光下靠反射閱讀，
     不靠螢幕自體發光跟環境光搶對比——所有原本偏灰、偏暗的次要文字
     顏色都要跟著提高對比，不然「暗底淺灰字」直接對調成「淺底淺灰字」
     反而更看不清楚。 */
  .fatigue-high-contrast{background:#F2EFE6;color:#111;}
  .fatigue-high-contrast .fatigue-undo-btn,
  .fatigue-high-contrast .fatigue-exit-btn{border-color:#111;color:#111;}
  .fatigue-high-contrast .fatigue-tool-btn{border-color:#111;color:#333;}
  .fatigue-high-contrast .fatigue-tool-btn.is-active{background:#111;color:#F2EFE6;border-color:#111;}
  .fatigue-high-contrast .fatigue-panel-top{border-bottom-color:#B9B4A4;}
  .fatigue-high-contrast .fatigue-panel-label{color:#5A5647;}
  .fatigue-high-contrast .fatigue-panel-value{color:#111;}
  .fatigue-high-contrast .fatigue-panel-hint{color:#5A5647;}
  .fatigue-high-contrast .fatigue-zone-row{border-bottom-color:#B9B4A4;}
  .fatigue-high-contrast .fatigue-zone-label{color:#111 !important;}
  .fatigue-high-contrast .fatigue-zone-range{color:#333;}
  .fatigue-high-contrast .fatigue-zone-note,
  .fatigue-high-contrast .fatigue-zone-empty{color:#5A5647;}
  .modal-panel{
    background:var(--surface);border-radius:4px;padding:28px 30px;max-width:440px;width:100%;
    max-height:86vh;overflow-y:auto;
  }
  .modal-panel-wide{max-width:960px;}
  /* ---- 手機版 Bottom Sheet：彈窗從螢幕底部滑出、可以往下拖曳關閉，
     取代置中彈窗＋叉叉按鈕那種明顯「這是一個網頁」的既視感。只在
     窄螢幕生效（跟月曆切換清單檢視用同一個斷點），桌機維持原本的
     置中彈窗，不需要為滑鼠操作模擬觸控手感。把手（.modal-panel::before
     畫出來的那顆小藥丸）是純視覺提示，實際判斷「摸到的是不是把手」
     靠 JS 用觸控起點的 Y 座標離面板頂端多近來算，不是靠比對這個
     偽元素本身——偽元素不能單獨接收觸控事件，瀏覽器回報的 e.target
     一律是面板本體。 ---- */
  @media (max-width:640px){
    .modal-overlay{align-items:flex-end;padding:0;}
    .modal-panel{
      max-width:none;width:100%;border-radius:16px 16px 0 0;
      max-height:88vh;padding-top:22px;
    }
    .modal-panel::before{
      content:'';display:block;width:40px;height:5px;border-radius:3px;
      background:var(--rule);margin:0 auto 16px;
    }
  }
  .report-prompt-fallback-textarea{width:100%;min-height:260px;font:inherit;font-size:13px;padding:10px;border:1px solid var(--rule);border-radius:4px;background:var(--paper);color:var(--ink);resize:vertical;margin-bottom:14px;}
  .modal-panel h2{font-size:20px;margin-bottom:10px;}
  /* 同步診斷的對照表：本機 vs 雲端並排，數字對不上的那一列標出來。 */
  .sync-diag-table{width:100%;border-collapse:collapse;margin:14px 0 16px;font-size:14px;}
  .sync-diag-table th{
    text-align:left;font-weight:600;font-size:12px;color:var(--stone);
    padding:0 8px 6px 0;border-bottom:1px solid var(--rule);
  }
  .sync-diag-table th:not(:first-child),
  .sync-diag-table td:not(:first-child){text-align:right;width:80px;}
  .sync-diag-table td{padding:8px 8px 8px 0;border-bottom:1px solid var(--rule);vertical-align:top;}
  .sync-diag-table tr:last-child td{border-bottom:none;}
  .sync-diag-dim{color:var(--stone);}
  .sync-diag-nosync{color:var(--stone);font-size:12px;}
  /* 數字對不上＝這正是開這個畫面要找的線索，用警示色標出來 */
  .sync-diag-mismatch td{color:var(--flag);}
  .sync-diag-mismatch td:first-child{font-weight:600;}
  .storage-usage-warn{color:var(--flag);font-weight:600;}
  .sync-diag-note{color:var(--stone);line-height:1.6;margin-top:4px;}
  .gpx-overwrite-note{display:block;font-size:12px;color:var(--flag);margin-top:2px;}
  .geo-photo-skipped{border-left:3px solid var(--flag);background:var(--paper);border-radius:6px;padding:8px 12px;margin:10px 0;display:flex;flex-direction:column;gap:3px;}
  .geo-photo-skipped .small{color:var(--ink-soft);}
  /* 分享圖設定：格式切換沿用篩選 chip 的外觀，勾選列用一般 label */
  .share-format-row{display:flex;gap:8px;margin:4px 0 12px;}
  .climate-chart-curve{color:var(--stone);margin-top:4px;}
  .climate-trail-toggle{display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--stone);margin-top:8px;cursor:pointer;}
  .climate-trail-toggle input{accent-color:var(--trail);}
  .climate-trail-notready{color:var(--flag);}
  /* 長按卡片的快速動作：手機上長按不要跳出系統的文字選取／連結選單 */
  @media (pointer:coarse){
    .cal-chip,.cal-list-item,.photo-card,.table-view-row{-webkit-touch-callout:none;user-select:none;-webkit-user-select:none;}
  }
  .race-context-actions{display:flex;flex-direction:column;gap:2px;margin-top:6px;}
  /* 常駐提示條（安裝／更新／儲存空間）：跟 toast 同一個位置，但不會自己消失，
     一定有一顆「稍後」讓人關掉。同時間最多一條，後來的蓋掉前面的。 */
  .app-banner{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
    z-index:120;max-width:min(560px,calc(100vw - 32px));background:var(--ink);color:var(--surface);
    border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;box-shadow:0 10px 30px rgba(0,0,0,0.35);font-size:14px;}
  .app-banner-actions{display:flex;gap:8px;flex-wrap:wrap;}
  .app-banner-actions button{font:inherit;font-size:13px;border-radius:6px;padding:6px 12px;cursor:pointer;border:1px solid rgba(255,255,255,0.28);background:transparent;color:inherit;}
  .app-banner-actions button.primary{background:var(--surface);color:var(--ink);border-color:var(--surface);}
  .app-banner.is-warn{border-left:4px solid var(--flag);}
  .storage-cleanup-list{display:flex;flex-direction:column;gap:6px;max-height:52vh;overflow:auto;margin:8px 0 12px;}
  .storage-cleanup-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--rule);border-radius:8px;background:var(--paper);}
  .storage-cleanup-row img{width:44px;height:44px;object-fit:cover;border-radius:6px;flex-shrink:0;background:var(--rule);}
  .storage-cleanup-main{flex:1;min-width:0;}
  .storage-cleanup-name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .storage-cleanup-meta{font-size:12px;color:var(--stone);}
  .storage-cleanup-row .btn-ghost.is-confirming{border-color:var(--flag);color:var(--flag);}
  .race-context-actions .action-menu-item{font-size:16px;padding:12px 10px;}
  .share-options-row{display:flex;flex-wrap:wrap;gap:6px 18px;margin-bottom:12px;font-size:14px;color:var(--ink);}
  .share-options-row label{display:inline-flex;align-items:center;gap:6px;cursor:pointer;}
  .share-options-row input{width:16px;height:16px;accent-color:var(--trail);}
  .share-preview-wrap{background:var(--paper);border-radius:8px;padding:10px;display:flex;justify-content:center;margin-bottom:14px;}
  .share-preview-wrap img{max-width:100%;max-height:52vh;border-radius:4px;display:block;}
  .share-preview-wrap.is-story img{max-height:60vh;}
  .modal-hint{color:var(--ink-soft);font-size:15px;margin-bottom:16px;}
  .modal-actions{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap;}
  .modal-actions-top{margin-top:0;margin-bottom:14px;}
  .sheet-checks{display:flex;flex-direction:column;gap:8px;max-height:280px;overflow-y:auto;padding:4px 0;}
  .sheet-check{display:flex;align-items:center;gap:8px;font-size:15px;}
  .import-table-wrap{overflow-x:auto;border:1px solid var(--rule);border-radius:3px;}
  .import-table{border-collapse:collapse;width:100%;font-size:14px;}
  .import-table th{text-align:left;padding:8px 8px;border-bottom:1px solid var(--rule);background:var(--paper);white-space:nowrap;position:sticky;top:0;}
  .import-table td{padding:5px 8px;border-bottom:1px solid var(--rule);vertical-align:middle;}
  .import-table input[type="text"],.import-table input[type="date"],.import-table select{
    font:inherit;font-size:14px;padding:5px 6px;border:1px solid var(--rule);border-radius:3px;background:var(--surface);width:100%;min-width:90px;
  }
  .import-table input.narrow{min-width:60px;width:74px;}
  .import-table td:first-child{width:28px;}

  /* ---------- Series comparison ---------- */
  .series-best{font-size:15px;margin:0 0 12px;}
  .series-table-wrap{overflow-x:auto;border:1px solid var(--rule);border-radius:3px;}
  .series-table-wrap.scroll-fade{-webkit-mask-image:linear-gradient(to right,transparent 0%,black 3%,black 97%,transparent 100%);mask-image:linear-gradient(to right,transparent 0%,black 3%,black 97%,transparent 100%);}
  .series-table{border-collapse:collapse;width:100%;font-size:14px;}
  .series-table th{text-align:left;padding:8px 10px;border-bottom:1px solid var(--rule);background:var(--paper);white-space:nowrap;}
  .series-table td{padding:7px 10px;border-bottom:1px solid var(--rule);white-space:nowrap;}
  .series-table tr.current{background:rgba(46,107,73,0.08);}
  .series-table td.pb-time{color:var(--gold);font-weight:700;}
  /* ---- 全站資料表共用的質感層 ----
     原本每張表都是「每格一條實線」的 Excel 風格。這裡統一改成：分隔線
     淡到只剩一點暗示、偶數列鋪一層極淡的底色當作視線引導、表頭字級
     壓小並拉開字距。不動任何欄位寬度或內容，純粹是把「格子感」拿掉。 */
  .table-view td,.series-table td,.shoe-analysis-table td,.epp-segment-table td,.import-table td,.sync-diag-table td{
    border-bottom:1px solid color-mix(in srgb,var(--rule) 55%,transparent);
  }
  /* 斑馬紋是「這是一張試算表」最強烈的視覺訊號，拿掉之後改用：
     橫向分隔線再淡一階、表頭與內容拉開字級與顏色的差距、數字欄位
     用等寬字並右對齊。密度不變，但看起來是一份排版過的資料，
     不是一格一格的儲存格。 */
  .table-view tbody tr:hover td,
  .series-table tbody tr:hover td,
  .shoe-analysis-table tbody tr:hover td,
  .epp-segment-table tbody tr:hover td,
  .sync-diag-table tbody tr:hover td{
    background:color-mix(in srgb,var(--surface) 70%,transparent);
  }
  .table-view tbody tr:last-child td,.series-table tbody tr:last-child td,.shoe-analysis-table tbody tr:last-child td{border-bottom:none;}

function uid(){return 'r'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
// safeUrl(u)：只放行 http(s) 與（圖片用的）data:image/ 網址。escapeHtml 只能
// 防止跳出屬性，擋不住 javascript: 這種「本身就是可執行內容」的 scheme——
// 使用者自己不會打這種東西，但匯入別人給的 JSON 備份時就可能被塞進來，
// 點一下連結或載入封面圖就會執行對方的程式碼。不合規的網址一律換成空字串。
function safeUrl(u){
  const s=String(u||'').trim();
  if(!s) return '';
  if(/^https?:\/\//i.test(s)) return s;
  if(/^data:image\/(png|jpe?g|gif|webp|avif);base64,[a-z0-9+/=]+$/i.test(s)) return s;
  if(/^(icons|about|sitemap)\//.test(s)) return s; // 站內相對路徑
  return '';
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
// safeFilename(name)：清掉檔名裡 Windows／macOS 都不允許的符號（反斜線、
// 正斜線、冒號、星號、問號、雙引號、角括號、豎線）——原本 5 個下載檔名
// 各自重複同一段 regex，這裡抽成共用版本，符號清單跟原本完全一樣，
// 純粹是包裝。
function safeFilename(name){
  return (name||'').replace(/[\\/:*?"<>|]/g,'');
}
// downloadBlob(blob, filename)：建立暫時的 <a download> 觸發瀏覽器下載。
// 原本 10 處各自重複「createObjectURL → <a download> → click →
// revokeObjectURL」，這裡抽成共用版本，同時疊加兩個穩定性修正：
// 1) 連結元素統一先接進 DOM 再點擊、點擊後才移除——原本 10 處裡有 9 處
//    是元素建在記憶體裡就直接 click()、從沒接進 DOM，只有匯出 Notebook
//    那一處有接進 DOM 再移除；部分瀏覽器（含部分行動版瀏覽器）對沒接
//    進 DOM 的元素直接 click() 偶爾不會觸發下載，統一接進 DOM 是比
//    較保守、相容性較好的寫法，跟原本 9 處的行為差異在於「更可靠」，
//    不是行為變窄。
// 2) revokeObjectURL 延後 1 秒才呼叫，不是點擊當下就撤銷——iOS Safari
//    對「下載連結的 blob URL 剛觸發下載就被撤銷」偶爾會直接讓下載
//    失敗，這是已知的相容性問題，延後撤銷不影響其他瀏覽器的行為。
function downloadBlob(blob,filename){
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download=filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
/* shareOrDownloadImage(blob, filename)：觸控裝置上優先走系統分享面板，
   桌機或不支援時退回下載。
   為什麼分開：手機上 <a download> 不是「存到相簿」——iOS Safari 會把
   PNG 開成新分頁，使用者得自己長按存圖再去 IG 貼；分享面板一步就到
   限時動態。桌機反過來，分享面板選項少又慢，下載才是大家預期的。
   只在觸控裝置啟用（pointer: coarse），不是只看 API 存不存在——
   桌機 Chrome 也有 navigator.share，但那不是桌機使用者想要的。
   使用者在分享面板按取消會丟 AbortError，那不是失敗，什麼都不做。 */
function canUseShareSheet(){
  return !!(navigator.share&&navigator.canShare&&window.matchMedia('(pointer: coarse)').matches);
}
async function shareOrDownloadImage(blob,filename){
  if(canUseShareSheet()){
    const file=new File([blob],filename,{type:blob.type||'image/png'});
    if(navigator.canShare({files:[file]})){
      try{
        await navigator.share({files:[file],title:filename.replace(/\.png$/i,'')});
        return 'shared';
      }catch(err){
        if(err&&err.name==='AbortError') return 'cancelled';
        console.warn('分享面板失敗，退回下載',err);
      }
    }
  }
  downloadBlob(blob,filename);
  return 'downloaded';
}
// showToast(message, kind)：畫面右下角跳出一則短暫提示，kind='error'
// 用跟既有錯誤提示（例如 JSON 匯入失敗）一樣的警示樣式，其餘情況用
// 一般樣式。跳出的訊息文字已經是翻譯好的成品字串，這裡只負責組
// DOM、掛上去、幾秒後自動移除，不做任何翻譯或格式化。
/* runAsyncAction(fn, label)：包住「按下去就跑、沒有人接手錯誤」的非同步
   動作。這類函式（產生分享圖、匯入檔案、拖放處理）失敗時原本只會變成
   未處理的 Promise 拒絕——主控台有訊息，但使用者按了按鈕卻什麼都沒發生，
   完全不知道是還在跑還是壞了。
   刻意包在呼叫點而不是改寫函式本身：saveJson／loadJson 這類函式「必須
   繼續往外拋」，它們的呼叫端（persist 等）就是靠接到例外才會跳出儲存
   空間警示，在函式內部吞掉錯誤反而會讓那個警示永遠不觸發。 */
// 最後一道防線：上面逐一包住的是已知的進入點，但這個 App 的非同步動作
// 很多，難保沒有漏網的。全域攔截未處理的 Promise 拒絕，至少讓使用者知道
// 「剛剛那個動作沒成功」，而不是對著沒有反應的畫面猜。
window.addEventListener('unhandledrejection',e=>{
  console.error('未處理的非同步錯誤',e.reason);
  showToast(t('ui.actionFailed','這個動作沒有成功，請再試一次'),'error');
});
function runAsyncAction(promise,label){
  Promise.resolve(promise).catch(err=>{
    console.error(label||'非同步動作失敗',err);
    showToast(t('ui.actionFailed','這個動作沒有成功，請再試一次'),'error');
  });
}
/* tryVibrate(pattern)：所有震動都走這裡，不要直接呼叫 navigator.vibrate。
   兩件事必須一起處理：
   1) iOS 上根本沒有這個 API（WebKit 從不支援），navigator.vibrate 是 undefined。
   2) Android Chrome 有 API，但要求「黏性使用者啟用」——使用者必須先在
      這個頁面上點過一次東西。而 Chrome 明確不把 touchstart 算成使用者
      手勢，所以「載入後第一個動作就是長按」會被靜默擋掉，navigator.vibrate()
      回傳 false、完全不震，主控台只留一行 Intervention 訊息。
   兩種情況的共同結果都是「使用者感受不到震動」，所以只要偵測到失敗，
   就把 no-haptics 掛上去，改用加強版的視覺回饋（光暈更亮、進度條），
   讓長按的三個階段光看也分得出來——而不是讓人對著沒反應的畫面猜。 */
function tryVibrate(pattern){
  if(!navigator.vibrate){ document.documentElement.classList.add('no-haptics'); return false; }
  let ok=false;
  try{ ok=navigator.vibrate(pattern)!==false; }catch(err){ ok=false; }
  if(!ok) document.documentElement.classList.add('no-haptics');
  else document.documentElement.classList.remove('no-haptics');
  return ok;
}
function showToast(message,kind){
  const el=document.createElement('div');
  el.className=kind==='error'?'foreground-toast sync-notice':'foreground-toast';
  el.innerHTML=`<span>${escapeHtml(message)}</span>`;
  document.body.appendChild(el);
  setTimeout(()=>{ el.remove(); },6000);
}

   刪除賽事的「復原」提示：以前刪除賽事要「先確認、再真的刪除」
   （詳情頁按鈕要連按兩次、滑動刪除要滑到底再點一次確認），這裡
   改成「先刪除、給 5 秒可以反悔」——刪除的當下就已經走既有的軟
   刪除機制（設定 deletedAt，跟「資料復原」畫面共用同一套資料

   「立刻、不用特地跑去開資料復原畫面」就能反悔的捷徑，不是另外
   發明一套獨立於既有軟刪除之外、只存在記憶體裡的暫存機制——就算
   分頁在倒數期間被關掉或重新整理，資料本來就已經安全存在本機

   把這個視窗內刪除的全部救回來，不是只救最新一筆。
   ============================================================ */
let raceUndoState=null; // {ids:Set<string>, el:HTMLElement, timer}
function showRaceDeleteUndoToast(raceId,raceName){
  if(raceUndoState){
    clearTimeout(raceUndoState.timer);
    raceUndoState.ids.add(raceId);
  }else{
    const el=document.createElement('div');
    el.className='foreground-toast race-undo-toast';
    document.body.appendChild(el);
    raceUndoState={ids:new Set(),el,timer:null};
    raceUndoState.ids.add(raceId);
  }
  const count=raceUndoState.ids.size;
  const label=count>1?tf('ui.undoDeletedMultiple','已刪除 {n} 場賽事',count):tf('ui.undoDeletedSingle','已刪除：{n}',escapeHtml(raceName));
  raceUndoState.el.innerHTML=`<span>🗑️ ${label}</span><button type="button" class="btn-text-small race-undo-btn" data-action="undo-race-delete">${t('ui.undo','復原')}</button>`;
  raceUndoState.timer=setTimeout(()=>{
    if(raceUndoState){ raceUndoState.el.remove(); raceUndoState=null; }
  },5000);
}
document.addEventListener('click',e=>{
  if(!e.target.closest('[data-action="undo-race-delete"]')) return;
  if(!raceUndoState) return;
  clearTimeout(raceUndoState.timer);
  raceUndoState.ids.forEach(id=>{
    const race=state.races.find(r=>r.id===id);
    if(race){ race.deletedAt=null; race.updatedAt=new Date().toISOString(); }
  });
  persist();renderAll();
  raceUndoState.el.remove();
  raceUndoState=null;
  logFeatureUse('race_delete_undo');
});
// startCadenceFeel(btn, cadenceSpm)：用網頁震動 API 模擬這個步頻
// （spm＝每分鐘步數）的節奏，連續跑 5 秒。intervalMs 是「兩步之間
// 隔多久」——60000（一分鐘的毫秒數）除以 spm，就是每一步對應的
// 毫秒數。呼叫端已經先確認過 navigator.vibrate 存在，這裡不用再
// 判斷一次；btn 上加 'feeling' 這個 class 純粹是給 CSS 動畫用、
// 順便當作「這顆按鈕現在忙碌中」的旗標，避免體驗還沒跑完又被連點。
function startCadenceFeel(btn,cadenceSpm){
  if(!cadenceSpm||cadenceSpm<=0) return;
  btn.classList.add('feeling');
  const intervalMs=60000/cadenceSpm;
  const totalMs=5000;
  let elapsedMs=0;
  // 這顆按鈕是用點擊觸發的（有使用者啟用），所以第一下通常震得出來；
  // 仍然走 tryVibrate，萬一被擋下也會記錄成「這台裝置沒有觸覺回饋」。
  tryVibrate(5);
  const timer=setInterval(()=>{
    elapsedMs+=intervalMs;
    if(elapsedMs>=totalMs){
      clearInterval(timer);
      btn.classList.remove('feeling');
      return;
    }
    tryVibrate(5);
  },intervalMs);
}

}

/* hmsToSec(str)：把使用者打的時間字串換成秒數，看不懂回 null。
   接受的寫法比以前寬：3:44:25、44:25、3.44.25、3 44 25、3h44m25s、
   3時44分25秒、4'15"（配速）、全形冒號。使用者在手機上打冒號要切符號
   鍵盤，打句點不用——不接受句點等於逼他多按三次。
   但「寬」不等於「猜」：有任何一段不是數字就回 null，由呼叫端決定
   怎麼處理，這裡不會偷偷回 0。 */
function hmsToSec(str){
  if(str==null) return null;
  let s=String(str).trim();
  if(!s) return null;
  s=s.replace(/[：]/g,':').replace(/[′’']/g,':').replace(/[″”"]/g,'');
  const unitMatch=s.match(/^(?:(\d+)\s*(?:h|H|時|小时|小時))?\s*(?:(\d+)\s*(?:m|M|分))?\s*(?:(\d+(?:\.\d+)?)\s*(?:s|S|秒))?$/);
  if(unitMatch&&(unitMatch[1]!=null||unitMatch[2]!=null||unitMatch[3]!=null)){
    return Math.round((+unitMatch[1]||0)*3600+(+unitMatch[2]||0)*60+(+unitMatch[3]||0));
  }
  // 沒有冒號時，句點與空白當分隔（3.44.25／3 44 25）；有冒號時句點是秒的小數點
  if(!s.includes(':')){
    if(/^\d+(?:[.\s]+\d+){1,2}$/.test(s)) s=s.replace(/[.\s]+/g,':');
    else if(!/^\d+$/.test(s)) return null;
  }
  const parts=s.split(':').map(x=>x.trim());
  if(parts.length>3||parts.some(x=>x===''||!/^\d+(?:\.\d+)?$/.test(x))) return null;
  const nums=parts.map(Number);
  while(nums.length<3) nums.unshift(0);
  const [h,m,sec]=nums;
  return Math.round(h*3600+m*60+sec);
}
function daysDiff(dateStr){
  if(!dateStr) return null;
  const target=new Date(dateStr+'T00:00:00');
  if(isNaN(target.getTime())) return null;
  const today=new Date();today.setHours(0,0,0,0);
  return Math.round((target-today)/86400000);
}
function tf(key,fallback,n){ return t(key,fallback).replace('{n}',n); }
function tf2(key,fallback,a,b){ return t(key,fallback).replace('{a}',a).replace('{b}',b); }
function countdownLabel(race){
  if(race.status==='completed') return t('opt.status.completed','已完賽');
  if(race.status==='dns') return t('opt.status.dns','DNS');
  if(race.status==='dnf') return t('opt.status.dnf','DNF');
  const d=daysDiff(race.schedule&&race.schedule.raceDate);
  if(d==null) return t('ui.dateNotSet','尚未設定日期');
  if(d>0) return tf('ui.countdownDays',`倒數 ${d} 天`,d);
  if(d===0) return t('ui.startToday','今天出發');
  return tf('ui.pastDaysAgo',`已過 ${Math.abs(d)} 天`,Math.abs(d));
}
function adaptiveCountdown(d){
  if(d==null) return t('ui.dateNotSet','尚未設定日期');
  if(d<0) return tf('ui.pastDaysAgo',`已過 ${Math.abs(d)} 天`,Math.abs(d));
  if(d===0) return t('ui.justToday','就是今天');
  if(d>=60) return tf('ui.monthsLeft',`還有約 ${Math.round(d/30)} 個月`,Math.round(d/30));
  if(d>=14) return tf('ui.weeksLeft',`還有 ${Math.round(d/7)} 週`,Math.round(d/7));
  return tf('ui.daysLeft',`還有 ${d} 天`,d);
}
const PROGRESS_WINDOW_DAYS=180;
function progressPct(d){
  if(d==null) return null;
  if(d<=0) return 100;
  if(d>=PROGRESS_WINDOW_DAYS) return 0;
  return Math.round((1-d/PROGRESS_WINDOW_DAYS)*100);

  const urgent=d>=0&&d<=7;

  const fillStyle=`width:${pct}%`+(!urgent&&accent?`;background:rgb(${accent.r},${accent.g},${accent.b})`:'');
  return `<div class="progress-block">
    <div class="progress-label"><span>${adaptiveCountdown(d)}</span><span class="mono">${race.schedule.raceDate}</span></div>

  </div>`;
}

/* ============================================================
   多媒體相片網格
   直接連到圖片檔（.jpg/.png/.gif/.webp/.avif）的連結會嘗試顯示縮圖；
   其他連結（相簿首頁、社群貼文、PDF 等）無法在純前端取得預覽圖
   （目標網站沒有開放跨網域讀取，瀏覽器基於安全性會擋下來），
   改顯示對應類型的圖示卡片，一樣可以點擊開啟。
   ============================================================ */
function isDirectImageUrl(url){
  if(!url) return false;
  try{
    const path=new URL(url).pathname;
    return /\.(jpe?g|png|gif|webp|avif)$/i.test(path);
  }catch(err){ return false; }
}
function mediaTypeIconSvg(type){
  let key='mediaLinks';
  if(type==='photo_album') key='photos';
  else if(type==='brochure_pdf'||type==='gpx_track'||type==='certificate') key='document';
  const inner=(type==='medal_photo')?CAREER_TROPHY_ICON.replace('<svg','<svg class="media-trophy"'):
    `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${EMPTY_STATE_ICONS[key]||''}</svg>`;
  return inner;
}
function mediaGalleryHtml(race){
  const items=(race.mediaLinks||[]).filter(m=>m.url);
  if(!items.length) return '';
  const cards=items.map(m=>{
    const label=escapeHtml(m.notes||t('opt.mediatype.'+m.type,labelFor(MEDIA_TYPE_OPTIONS,m.type,'mediatype')));
    if(isDirectImageUrl(m.url)){
      return `<a class="media-gallery-card" href="${escapeHtml(safeUrl(m.url))}" target="_blank" rel="noopener noreferrer" title="${label}">
        <img src="${escapeHtml(m.url)}" alt="" loading="lazy" onerror="this.closest('.media-gallery-card').classList.add('media-gallery-fallback')">
        <span class="media-gallery-fallback-icon">${mediaTypeIconSvg(m.type)}</span>
      </a>`;
    }
    let domain='';
    try{ domain=new URL(m.url).hostname.replace(/^www\./,''); }catch(err){ domain=m.url.slice(0,24); }
    return `<a class="media-gallery-card media-gallery-link" href="${escapeHtml(safeUrl(m.url))}" target="_blank" rel="noopener noreferrer" title="${label}">
      <span class="media-gallery-link-icon">${mediaTypeIconSvg(m.type)}</span>
      <span class="media-gallery-link-domain">${escapeHtml(domain)}</span>
    </a>`;
  }).join('');
  return `<div class="media-gallery-wrap">
    <div class="media-gallery-head small">${t('ui.mediaGalleryTitle','多媒體相簿')}</div>
    <div class="media-gallery-strip">${cards}</div>
  </div>`;
}

function sparklineSvg(race){
  const pts=(race.checkpoints||[]).filter(c=>c.elevationM!=null&&c.distanceKm!=null).sort((a,b)=>a.distanceKm-b.distanceKm);
  if(pts.length<2) return '';
  const xs=pts.map(p=>p.distanceKm),ys=pts.map(p=>p.elevationM);
  const minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys);
  const w=140,h=22,pad=2;
  const sx=x=>maxX===minX?w/2:pad+(x-minX)/(maxX-minX)*(w-2*pad);
  const sy=y=>maxY===minY?h/2:h-pad-(y-minY)/(maxY-minY)*(h-2*pad);
  const points=pts.map(p=>sx(p.distanceKm).toFixed(1)+','+sy(p.elevationM).toFixed(1)).join(' ');
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polyline points="${points}" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>`;
}

/* ============================================================
   多語系（i18n）
   設計原則：中文（預設）字串就地留在原本的 label/title 裡當作
   fallback；只需要建立日文對照表 JA，用 t(key, fallback) 查表，
   查不到就自動退回中文，不會有畫面開天窗的風險。
   ============================================================ */
const LANG_KEY='lang-pref-v1';
let currentLang='zh';
try{ currentLang=localStorage.getItem(LANG_KEY)||'zh'; }catch(e){}
function t(key,fallback){
  const dict=(currentLang==='ja')?JA:(currentLang==='en')?EN:null;
  if(dict){
    const v=dict[key];
    if(v!=null) return v;
  }
  return fallback!=null?fallback:key;
}
function setLang(lang){
  currentLang=lang;
  try{ localStorage.setItem(LANG_KEY,lang); }catch(e){}
  document.documentElement.setAttribute('lang',lang==='ja'?'ja':lang==='en'?'en':'zh-Hant');
  document.documentElement.setAttribute('data-lang',lang);
  applyStaticTranslations();
  renderAll();
  renderAuthArea();
  syncSampleDataButtonLabel();
}
function applyStaticTranslations(){
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    if(el.dataset.zhText==null) el.dataset.zhText=el.textContent;
    el.textContent=t(el.dataset.i18n, el.dataset.zhText);
  });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el=>{
    if(el.dataset.zhPlaceholder==null) el.dataset.zhPlaceholder=el.getAttribute('placeholder');
    el.setAttribute('placeholder', t(el.dataset.i18nPlaceholder, el.dataset.zhPlaceholder));
  });
  document.querySelectorAll('[data-i18n-title]').forEach(el=>{
    if(el.dataset.zhTitle==null) el.dataset.zhTitle=el.getAttribute('aria-label')||el.getAttribute('title')||'';
    const v=t(el.dataset.i18nTitle, el.dataset.zhTitle);
    if(el.hasAttribute('aria-label')) el.setAttribute('aria-label',v);
    el.setAttribute('title',v);
  });
}

        <li>フィルターは2段階：まず「すべて／今後の予定／過去の記録」を選択し、「今後の予定」または「過去の記録」を選ぶと詳細ステータスが展開されます（ボタンが一度に多く表示されすぎないように）。</li>
        <li>検索欄でレース名や都市名で絞り込みできます。5件以上記録するとキャリアデータ（完走数、フルマラソン自己ベスト、年間走行距離）が表示されます。</li>
        <li>「今日」ボタンの隣のグリッドアイコンで「メダル棚」表示に切り替えられます。カバー写真付きの完走レースをカード形式で表示します。</li>
      </ul>
      <h3>レースの追加と管理</h3>
      <ul>
        <li>右上の「+ 大会を追加」で作成。カレンダーや一覧のレースをクリックすると詳細画面が開き、編集内容は自動保存されます。</li>
        <li>新規作成時に公式サイトのURLを直接貼り付けたり、アクティビティファイル（GPX/TCX/FIT）や大会ビジュアルを先に読み込んでおくと、作成時に自動で反映されます。</li>
        <li>詳細画面の「大会を削除」は誤操作防止のため2回クリックが必要です。「大会を複製」は場所・コース・装備などを引き継いで新しい大会を作成でき、年次シリーズ大会に便利です。</li>
      </ul>
      <h3>レース詳細の項目</h3>
      <ul>
        <li><strong>カバー写真</strong>：タイトル下から写真をアップロードでき、タイトル部分の淡いブランド背景になります（縦長の写真は自動的に高さを調整し、潰れないようにします）。同じ写真がカレンダーのマスやスマホの一覧にも小さなサムネイルとして表示されます。</li>
        <li><strong>基本情報</strong>：大会名、シリーズ（同じ名前なら自動で年別比較）、ステータス、日程、抽選情報。</li>
        <li><strong>コースと地形</strong>：距離、標高、標高変化グラフ、CP詳細、ITRA/UTMBポイント（要手動入力）。</li>
        <li><strong>装備・補給・戦略</strong>：装備リスト（ロード／トレイル／トライアスロン標準装備テンプレート対応）、補給計画、ペース計算＆リストバンド作成。</li>
        <li><strong>レース後の記録</strong>：成績ダッシュボード、前後半のペース分析、シューズ走行距離管理、シェア画像のワンクリック作成。</li>
      </ul>
      <h3>データの読み込み</h3>
      <ul>
        <li><strong>Excelを読み込む</strong>：レース計画表を読み込み、シートを選択して1件ずつ確認してから取り込めます。</li>
        <li><strong>アクティビティファイル（GPX/TCX/FIT）</strong>：Garmin/COROS/Strava から書き出したファイルに対応、距離・標高・心拍数・スプリットを自動取得。</li>
        <li><strong>データを貼り付けて入力</strong>：大会サイト・要項・完走証の内容をAIにJSON化してもらい貼り付けると、該当項目だけ反映されます。</li>
      </ul>
      <h3>リマインダーと通知</h3>
      <ul>
        <li><strong>カレンダーリマインダー</strong>：詳細画面の「カレンダーに追加」または左下の「カレンダーリマインダーを書き出す」で .ics ファイルをダウンロードし、スマホのカレンダーに追加。1ヶ月前・1週間前の通知が内蔵されています。</li>
        <li><strong>プッシュ通知</strong>（オプション、Cloud Functionsの追加デプロイが必要）：クラウド同期でログイン後、右上の「プッシュ通知を有効にする」。デプロイ手順は USAGE.md 参照。</li>
      </ul>
      <h3>クラウド同期とデータの安全性</h3>
      <ul>
        <li>右上の「Googleでログインして同期」でデバイス間同期（Firebaseの設定が必要、USAGE.md参照）。ログインしなくても通常利用には影響ありません。</li>
        <li>ローカル保存が常にメインのデータソースです。ログイン後に追加でクラウド同期されます。初回ログイン時はクラウドとローカルのデータを自動でマージし、データが失われることはありません。</li>
        <li>「JSONを書き出す」でいつでも全データをバックアップ可能。「すべてのデータを削除」は2回クリックで確認します。</li>
        <li>大会を削除すると30日間ゴミ箱に保存され、「削除した大会」から復元できます。複数端末の同期で競合が検出された場合も、古いバージョンは同じ場所に保存され、黙って消えることはありません。</li>
        <li>ブラウザの保存容量には上限があります。上限に近づいた場合や保存に失敗した場合は、画面上部に通知が表示されます（保存失敗の通知は自動的には消えません）。</li>
      </ul>
      <h3>その他</h3>
      <ul>
        <li>右上の月／太陽アイコンでダークモード切り替え、選択内容は記憶されます。</li>
        <li>右上の言語メニューで繁体字中国語／日本語／英語に対応しています。</li>
        <li>スマートフォンのブラウザでサイトを開き「ホーム画面に追加」を選ぶと、専用アイコンでアプリのように使えます。</li>
        <li>サイト全体の機能一覧は <a href="https://ai-sub3.github.io/Race-Day/sitemap/" target="_blank" rel="noopener noreferrer">サイトマップ</a> をご覧ください。</li>
      </ul>`,

      <h3>Calendar & Filters</h3>
      <ul>
        <li>Use <span class="mono">‹ Year Month ›</span> at the top to change months, and "Today" to jump back to the current month. On mobile it automatically switches to a list of this month's races.</li>
        <li>Filters have two levels: pick "All / Upcoming / History" first — tapping "Upcoming" or "History" reveals the more specific statuses underneath, so the bar isn't crowded with options at once.</li>
        <li>The search box filters by race name or city. Once you've logged 5+ races, a career stats strip appears (races finished, marathon PB, distance this year).</li>
        <li>The grid icon next to "Today" switches to a "trophy wall" view — a photo-card grid of completed races that have a cover photo.</li>
      </ul>
      <h3>Creating & Managing Races</h3>
      <ul>
        <li>Use "+ New Race" in the top right to create one. Click a race on the calendar or list to open its detail page — edits save automatically.</li>
        <li>While creating a race, you can paste the official website URL directly, or import an activity file (GPX/TCX/FIT) or a race cover image first — both get applied automatically once the race is created.</li>
        <li>"Delete race" on the detail page needs two clicks to confirm, to avoid accidental deletion. "Duplicate Race" carries over location, course, and gear into a new race — handy for annual series races.</li>
      </ul>
      <h3>Race Detail Fields</h3>
      <ul>
        <li><strong>Cover Photo</strong>: upload a photo below the title — it becomes a faded background for the title block (portrait photos automatically get a taller block so they aren't squeezed thin), and the same photo shows as a small thumbnail on the calendar and mobile list too.</li>
        <li><strong>Basic Info</strong>: name, series (same-name series get automatic year-over-year PB comparison), status, schedule, lottery info.</li>
        <li><strong>Course & Terrain</strong>: distance, elevation, an elevation profile chart, checkpoint details, ITRA/UTMB points (enter manually).</li>
        <li><strong>Gear, Nutrition & Strategy</strong>: gear checklist (with built-in road/trail/triathlon starter templates), a nutrition schedule, and a pace calculator with wristband generator.</li>
        <li><strong>Post-race Record</strong>: a results dashboard, first/second-half pace analysis, shoe mileage tracking, and one-click share image generation.</li>
      </ul>
      <h3>Importing Data</h3>
      <ul>
        <li><strong>Import Excel</strong>: reads your own race planning spreadsheet — pick which sheets, review each row before importing.</li>
        <li><strong>Import Activity File (GPX/TCX/FIT)</strong>: works with files exported from Garmin, COROS or Strava — automatically pulls distance, elevation, heart rate and splits.</li>
        <li><strong>Paste to Quick-fill</strong>: have an AI turn a race website, brochure or finisher certificate into JSON and paste it in — only the pasted fields get updated.</li>
      </ul>
      <h3>Reminders & Notifications</h3>
      <ul>
        <li><strong>Calendar Reminders</strong>: use "Add calendar reminder" on a race's detail page, or "Export Calendar Reminders" at the bottom left, to download an .ics file for your phone's calendar — with built-in 1-month and 1-week alerts.</li>
        <li><strong>Push Notifications</strong> (optional, requires deploying a separate Cloud Function): once signed in for cloud sync, use "Enable push notifications" in the top right. See USAGE.md for deployment steps.</li>
      </ul>
      <h3>Cloud Sync & Data Safety</h3>
      <ul>
        <li>"Sign in with Google to sync" in the top right syncs your data across devices (requires your own Firebase setup, see USAGE.md). Not signing in has no effect on local use.</li>
        <li>Local storage is always the primary data source — signing in adds cloud sync on top. On first sign-in, cloud and local data are merged automatically, so nothing is lost.</li>
        <li>"Export JSON" backs up all your data any time. "Clear All Data" needs two clicks to confirm.</li>
        <li>Deleting a race keeps it in a trash bin for 30 days — restore it anytime from "Deleted Races". If a sync conflict is detected across devices, the older version is kept in the same place rather than silently disappearing.</li>
        <li>Browser storage has a limit. You'll see a banner at the top when you're approaching it, or if a save actually fails (the failure banner stays visible until the next save succeeds).</li>
      </ul>
      <h3>Other</h3>
      <ul>
        <li>The moon/sun icon in the top right toggles dark mode and remembers your choice.</li>
        <li>The language menu in the top right supports Traditional Chinese, Japanese and English.</li>
        <li>On mobile, open the site in your browser and choose "Add to Home Screen" for an app-like experience with a custom icon.</li>
        <li>For a quick overview of everything on this site and where to find it, see the <a href="https://ai-sub3.github.io/Race-Day/sitemap/" target="_blank" rel="noopener noreferrer">sitemap</a>.</li>

const STORAGE_KEY='races-v1';
const TEMPLATES_KEY='equipment-templates-v1';
// window.storage 只存在於 Claude 內建的 artifact 預覽環境；獨立架站（如 GitHub Pages）
// 或直接開檔案時並不存在，此時改用下方的 IndexedDB（經由 idb-keyval）/localStorage 邏輯。
const hasArtifactStorage=(typeof window.storage!=='undefined')&&(typeof window.storage.get==='function');

/* ============================================================
   IndexedDB 儲存（經由 idb-keyval）
   localStorage 通常只有 5-10MB 額度，賽事一多、又加上封面照片，
   容易真的存不下去。IndexedDB 是所有現代瀏覽器內建的資料庫機制，
   額度通常是數百 MB 到數 GB（視裝置可用空間而定），資料一樣完全
   存在使用者自己的裝置上，不需要任何外部伺服器或費用。

   如果 CDN 連不到 idb-keyval（網路問題、被封鎖等），自動退回
   localStorage，確保這個核心儲存功能不會因為外部套件載入失敗就
   整個壞掉。讀取時一律先查 IndexedDB，查無資料才保底查一次
   localStorage——這樣即使搬移過程中途失敗，也不會憑空遺失資料。
   ============================================================ */
const hasIdbKeyval=(typeof idbKeyval!=='undefined')&&(typeof idbKeyval.get==='function');
async function idbGet(key){
  if(hasIdbKeyval){
    try{
      const val=await idbKeyval.get(key);
      if(val!=null) return val;
    }catch(err){
      console.error('IndexedDB 讀取失敗，改讀 localStorage：'+key,err);
    }
  }
  const raw=localStorage.getItem(key);
  return raw==null?undefined:raw;
}
async function idbSet(key,value){
  if(hasIdbKeyval){
    await idbKeyval.set(key,value);
    try{ localStorage.removeItem(key); }catch(err){}
    return;
  }
  localStorage.setItem(key,value);
}
/* ============================================================
   saveJson／loadJson：把 7 組 persistXxx()／loadXxx()（賽事、範本、
   個人資訊、鞋款、補給品資料庫、同步覆寫紀錄、徽章解鎖紀錄）裡各自
   重複的「依 hasArtifactStorage 走 window.storage 或 idbSet／idbGet
   分支、JSON 序列化／解析」抽出來共用。刻意不在這兩個函式裡包
   try/catch——原本每組 persistXxx／loadXxx 各自只有一層 try/catch，
   loadXxx 那層包的是「讀取＋解析＋讀完後的轉換（例如 .map(migrateRace)）」
   一整段，不是只有讀取本身；如果在這裡就把錯誤吞掉，轉換那段一旦
   出錯就不會被原本外層的 catch 接住，等於悄悄改變了行為。錯誤處理
   還是留給每個 persistXxx／loadXxx 自己既有的 try/catch，這兩個函式
   只負責「怎麼存、怎麼讀」，不負責「失敗怎麼辦」——純粹是包裝，
   不改存讀邏輯本身。
   ============================================================ */
async function saveJson(key,value){
  const json=JSON.stringify(value);
  if(hasArtifactStorage){
    await window.storage.set(key,json,false);
  }else{
    await idbSet(key,json);
  }
}
async function loadJson(key,fallback){
  if(hasArtifactStorage){
    const res=await window.storage.get(key,false);
    return (res&&res.value)?JSON.parse(res.value):fallback;
  }else{
    const raw=await idbGet(key);
    return raw?JSON.parse(raw):fallback;
  }
}
const IDB_MIGRATION_FLAG='idb-migration-v1-done';
async function migrateLocalStorageToIdb(){
  if(!hasIdbKeyval) return;
  if(localStorage.getItem(IDB_MIGRATION_FLAG)) return;
  const keysToMigrate=[STORAGE_KEY,TEMPLATES_KEY,SHOES_KEY,SYNC_OVERWRITES_KEY];
  for(const key of keysToMigrate){
    const raw=localStorage.getItem(key);
    if(raw!=null){
      try{
        await idbKeyval.set(key,raw);
        localStorage.removeItem(key);
      }catch(err){
        console.error('搬移資料到 IndexedDB 失敗，保留在 localStorage：'+key,err);
      }
    }
  }
  try{ localStorage.setItem(IDB_MIGRATION_FLAG,'1'); }catch(err){}
}

/* ============================================================
   本機儲存空間狀態提示
   存檔失敗（不管是哪種儲存機制）不該只印在 console 讓使用者
   完全不知情——這裡在失敗時明確告知。原本這裡還有「接近容量上限」
   的主動預警，是針對 localStorage 通常只有 ~5MB 的額度設計的；
   改用 IndexedDB 之後額度通常是數百 MB 到數 GB，這個預警已經沒有
   實際意義，所以移除，只保留真正存檔失敗時的錯誤提示。
   ============================================================ */
function storageBannerEl(){
  let el=document.getElementById('storage-banner');
  if(!el){
    el=document.createElement('div');
    el.id='storage-banner';
    el.hidden=true;
    document.body.appendChild(el);
  }
  return el;
}
function hideStorageBanner(){
  storageBannerEl().hidden=true;
}
/* ============================================================
   下拉操作選單（通用機制）：data-menu-trigger="面板id" 的按鈕負責
   開關對應的 .action-menu-panel；面板裡點一般項目後選單會自動收起
   （其他監聽器仍會照常處理該項目自己的 data-action，這裡不會擋掉），
   但標了 data-keep-menu-open 的項目例外（例如刪除/清除這種「點兩次
   才會真的執行」的按鈕，選單要留著讓使用者看到確認文字再點第二次）。
   面板刻意留在原本 DOM 位置（不搬到 body 底下）：這個 app 有些動作的
   點擊監聽器是掛在特定容器上（例如 detailEl.addEventListener，不是
   document），如果把面板搬到 body 底下，點擊事件就不會再往上冒泡經過
   那個容器，對應的動作處理器會直接收不到這個點擊、完全沒反應。真正
   的問題是賽事詳情頁裡幾層祖先元素各自建立了獨立的堆疊環境（stacking
   context，例如 .dh-content 設了 position:relative + z-index:1），
   面板本身的 z-index 再怎麼調高，都只在被困住的那個堆疊環境內部有效，
   畫面上還是會被 quick-nav 這類在別的堆疊環境、z-index 沒那麼高的
   元素蓋過去——這裡改成直接把幾個會造成這種夾層問題的祖先元素本身的
   z-index 提高，讓面板所在的那個堆疊環境整體排到更上層，而不是搬動
   面板在 DOM 裡的位置。
   ============================================================ */
function positionActionMenuPanel(trigger,panel){
  const rect=trigger.getBoundingClientRect();
  const panelRect=panel.getBoundingClientRect();
  let left=rect.right-panelRect.width;
  if(left<8) left=8;
  if(left+panelRect.width>window.innerWidth-8) left=Math.max(8,window.innerWidth-8-panelRect.width);
  let top=rect.bottom+6;
  if(top+panelRect.height>window.innerHeight-8&&rect.top-panelRect.height-6>8){
    top=rect.top-panelRect.height-6;
  }
  panel.style.left=left+'px';
  panel.style.top=top+'px';
}
function findMenuBoostTarget(trigger){
  // 目前只有賽事詳情頁的 .dh-content 有這種被祖先堆疊環境困住的問題；
  // 之後如果其他地方的下拉選單也遇到同樣情況，把對應的選擇器加進這裡。
  return trigger.closest('.dh-content');
}
function closeActionMenuPanel(panel){
  panel.hidden=true;
  panel.style.left='';panel.style.top='';
  const ownerTrigger=document.querySelector(`[data-menu-trigger="${panel.id}"]`);
  if(ownerTrigger){
    ownerTrigger.setAttribute('aria-expanded','false');
    const boostTarget=findMenuBoostTarget(ownerTrigger);
    if(boostTarget) boostTarget.classList.remove('menu-boost');
  }
}
function openActionMenuPanel(trigger,panel){
  const boostTarget=findMenuBoostTarget(trigger);
  if(boostTarget) boostTarget.classList.add('menu-boost');
  panel.hidden=false;
  positionActionMenuPanel(trigger,panel);
  trigger.setAttribute('aria-expanded','true');
}
document.addEventListener('click',e=>{
  const trigger=e.target.closest('[data-menu-trigger]');
  if(trigger){
    const panel=document.getElementById(trigger.dataset.menuTrigger);
    if(!panel) return;
    const willOpen=panel.hidden;
    document.querySelectorAll('.action-menu-panel').forEach(p=>{ if(p!==panel&&!p.hidden) closeActionMenuPanel(p); });
    if(willOpen) openActionMenuPanel(trigger,panel);
    else closeActionMenuPanel(panel);
    return;
  }
  const insidePanel=e.target.closest('.action-menu-panel');
  if(insidePanel){
    if(!e.target.closest('[data-keep-menu-open]')) closeActionMenuPanel(insidePanel);
    else setTimeout(()=>{
      // 刪除/清除這類項目點下去會觸發整個區塊重新渲染，用全新的 hidden
      // 面板節點取代掉目前這個；重新渲染後把新節點重新定位、顯示出來，
      // 選單才會維持開著讓使用者看到確認文字並點第二次。
      const freshTrigger=document.querySelector(`[data-menu-trigger="${insidePanel.id}"]`);
      const freshPanel=document.getElementById(insidePanel.id);
      if(freshTrigger&&freshPanel&&freshPanel.hidden) openActionMenuPanel(freshTrigger,freshPanel);
    },0);
    return;
  }
  document.querySelectorAll('.action-menu-panel:not([hidden])').forEach(p=>closeActionMenuPanel(p));
});
window.addEventListener('resize',()=>{
  document.querySelectorAll('.action-menu-panel:not([hidden])').forEach(p=>closeActionMenuPanel(p));
});
function showStorageBanner(kind,message){
  const el=storageBannerEl();
  el.className='storage-banner '+kind;
  el.innerHTML=`<span>${message}</span>${kind==='warning'?`<button type="button" data-action="dismiss-storage-banner">${t('ui.dismiss','知道了')}</button>`:''}`;
  el.hidden=false;
}
function showStorageError(){
  showStorageBanner('error',t('ui.storageError','本機儲存失敗！瀏覽器儲存空間可能已滿，最新的修改目前沒有真的存起來。請立即「匯出 JSON」備份，並考慮清除部分資料或移除封面照片後再試一次。'));
}
document.addEventListener('click',e=>{
  if(e.target.closest('[data-action="dismiss-storage-banner"]')){
    hideStorageBanner();
    try{ sessionStorage.setItem('storage-warning-dismissed','1'); }catch(err){}
  }
});

// 補上舊資料（此功能上線前建立的賽事）缺少的欄位，避免 setPath 寫入 undefined 巢狀物件時出錯。
function migrateRace(r){
  if(r.series==null) r.series='';
  if(r.coverImage==null) r.coverImage='';
  if(r.coverThumb==null) r.coverThumb='';
  if(r.coverImageAspect===undefined) r.coverImageAspect=null;
  if(!r.coverImageFocalPoint) r.coverImageFocalPoint={x:50,y:50};
  if(r.coverImageAccentColor===undefined) r.coverImageAccentColor=null;
  if(r.officialUrl==null) r.officialUrl='';
  if(r.deletedAt===undefined) r.deletedAt=null;
  if(r.lottery==null) r.lottery={applicants:null,winners:null,winRatePct:null,wasSelected:false};
  if(r.nutritionSchedule==null) r.nutritionSchedule=[];
  if(r.route&&r.route.itraPoints===undefined) r.route.itraPoints=null;
  if(r.route&&r.route.elevationProfile==null) r.route.elevationProfile=[];
  if(r.route&&r.route.trackPoints==null) r.route.trackPoints=[];
  if(r.results&&r.results.firstHalfSeconds===undefined) r.results.firstHalfSeconds=null;
  if(r.results&&r.results.secondHalfSeconds===undefined) r.results.secondHalfSeconds=null;
  if(r.performanceData&&r.performanceData.shoeId===undefined) r.performanceData.shoeId='';
  if(r.liveForecast===undefined) r.liveForecast=null;
  if(r.historicalWeather===undefined) r.historicalWeather=null;
  if(r.historicalAverageWeather===undefined) r.historicalAverageWeather=null;
  if(r.bibNumber==null) r.bibNumber='';
  if(r.crewApparelNote==null) r.crewApparelNote='';
  if(r.schedule&&r.schedule.startWave==null) r.schedule.startWave='';
  if(Array.isArray(r.equipmentChecklist)){
    r.equipmentChecklist.forEach(it=>{
      if(it.weightG===undefined) it.weightG=null;
      if(it.isConsumable===undefined) it.isConsumable=false;
      if(it.location===undefined) it.location='';
    });
  }
  if(Array.isArray(r.nutritionSchedule)){
    r.nutritionSchedule.forEach(it=>{
      if(it.dictionaryItemId===undefined) it.dictionaryItemId=null;
      if(it.qty===undefined) it.qty=null;
    });
  }
  if(Array.isArray(r.checkpoints)){
    r.checkpoints.forEach(cp=>{
      if(cp.arrivedAt===undefined) cp.arrivedAt=null;
    });
  }
  if(r.raceDayWeather&&!r.raceDayWeather.marineConditions){
    r.raceDayWeather.marineConditions={waveHeightM:null,swellPeriodSeconds:null,waterTempC:null};
  }
  if(r.route&&r.route.timedTrackPoints==null) r.route.timedTrackPoints=[];
  if(!Array.isArray(r.legs)) r.legs=[];
  if(r.geoPhotos==null) r.geoPhotos=[];
  if(r.photoTimeOffsetSeconds==null) r.photoTimeOffsetSeconds=0;
  if(r.route&&r.route.gpsDenoised==null) r.route.gpsDenoised=false;
  backfillSplitElevationFromProfile(r);
  return r;
}

/* ============================================================
   雲端同步（Firebase，選用功能）
   本機儲存（localStorage / window.storage）永遠是主要的儲存方式，
   雲端同步是疊加上去的：登入後會把資料同步到 Firestore，
   讓同一個 Google 帳號在不同裝置間可以看到一樣的資料。
   未設定 Firebase 或未登入時，這整組功能不會做任何事。
   ============================================================ */
let cloudSyncTimer=null;
let cloudSyncRetryTimer=null;
let cloudSyncFailCount=0;
let cloudSyncHasError=false;
function cloudEnabled(){
  return !!(window.__cloud&&window.__cloud.enabled);
}
/* ============================================================
   功能使用次數統計（用來之後分析哪些功能最常用、哪些最少用）
   只有設定了 Firebase 才會運作，沒設定就完全不做事，不影響其他功能；
   不需要登入也會記錄，這樣才能統計到所有訪客，不只是登入的人。本機先
   累加、每隔一段時間或分頁要關閉/切到背景時才整批送出一次，避免每次
   點擊都各自打一次網路請求。
   ============================================================ */
let pendingFeatureLogs={};
let featureLogFlushTimer=null;
function logFeatureUse(featureId){
  if(!cloudEnabled()) return;
  pendingFeatureLogs[featureId]=(pendingFeatureLogs[featureId]||0)+1;
  if(!featureLogFlushTimer) featureLogFlushTimer=setTimeout(flushFeatureLogs,8000);
}
function flushFeatureLogs(){
  featureLogFlushTimer=null;
  if(!Object.keys(pendingFeatureLogs).length) return;
  const toSend=pendingFeatureLogs;
  pendingFeatureLogs={};
  if(!cloudEnabled()) return;
  window.__cloud.logFeatureUse(toSend).catch(err=>console.warn('功能使用次數紀錄失敗（不影響其他功能）',err));
}
window.addEventListener('beforeunload',()=>flushFeatureLogs());
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden') flushFeatureLogs(); });
function scheduleCloudSync(){
  if(!state.user||!cloudEnabled()) return;

  cloudSyncTimer=setTimeout(()=>{cloudSyncAllRaces();},800);

// 鞋款、補給品資料庫這兩份全域清單原本完全沒有雲端同步——只存在本機
// IndexedDB／localStorage，從來沒有被推上 Firestore 過，這是換一台
// 電腦登入同一個帳號、資料就整個消失的真正原因，不是同步「失敗」，
// 是這兩份清單根本從來沒有被同步過。修法比照賽事已經有的
// scheduleCloudSync／cloudSyncAllRaces 這一組「本機異動 800ms 後才
// 真的送出，避免每個字都各打一次網路請求」的節流寫法，兩份清單共用
// 同一個 Firestore 文件、同一個計時器一起送出，不需要各自獨立。
let globalListsSyncTimer=null;
function scheduleGlobalListsSync(){
  if(!state.user||!cloudEnabled()) return;

async function cloudSyncGlobalLists(){
  if(!state.user||!cloudEnabled()) return;
  try{
    await window.__cloud.syncGlobalLists(state.user.uid,shoes,nutritionDictionary,{
      userProfile:userProfile||null,
      templates:templates||[],
      badgeUnlocks:badgeUnlocks||{},
    });
  }catch(err){
    console.error('全域資料雲端同步失敗',err);
  }
}
// 兩份清單都沒有像賽事那樣逐筆記錄 updatedAt 時間戳記，沒辦法比較
// 「雲端跟本機哪個比較新」，所以合併策略比賽事那套簡單：依 id 取
// 聯集，雲端獨有的項目補進本機，本機獨有的項目維持不動；同一個 id
// 兩邊都有但內容不同，保留本機版本（使用者當下正在看、正在用的
// 這一份），不彈跳「偵測到分歧」的通知——這種情況預期只會在「修好
// 這個 bug 之前，兩台裝置各自累積了不同鞋款」這種一次性情境發生，
// 不是常態下需要處理的分歧。
function mergeGlobalListsIntoState(cloud){
  if(!cloud) return;
  if(Array.isArray(cloud.shoes)){
    const localIds=new Set(shoes.map(s=>s.id));
    cloud.shoes.forEach(s=>{ if(!localIds.has(s.id)) shoes.push(migrateShoe(s)); });
  }
  if(Array.isArray(cloud.nutritionDictionary)){
    const localIds=new Set(nutritionDictionary.map(n=>n.id));
    cloud.nutritionDictionary.forEach(n=>{ if(!localIds.has(n.id)) nutritionDictionary.push(migrateNutritionDictItem(n)); });
  }
  // 裝備範本：跟鞋款、補給品一樣照 id 聯集，本機已有的那筆不動。
  if(Array.isArray(cloud.templates)){
    const localIds=new Set(templates.map(x=>x.id));
    cloud.templates.forEach(x=>{ if(x&&x.id&&!localIds.has(x.id)) templates.push(x); });
  }
  // 徽章解鎖：兩邊都有同一枚徽章時，保留「比較早」的解鎖時間——徽章
  // 記錄的是「什麼時候第一次達成」，在 B 裝置上重新判定出來的較晚時間
  // 不該覆蓋掉 A 裝置上真正達成的那一刻。
  if(cloud.badgeUnlocks&&typeof cloud.badgeUnlocks==='object'){
    Object.keys(cloud.badgeUnlocks).forEach(id=>{
      const c=cloud.badgeUnlocks[id];
      if(!c) return;
      const l=badgeUnlocks[id];
      if(!l){ badgeUnlocks[id]=c; return; }
      if(c.unlockedAt&&l.unlockedAt&&c.unlockedAt<l.unlockedAt) badgeUnlocks[id]=Object.assign({},l,{unlockedAt:c.unlockedAt});
    });
  }
  // 個人資料是單一份設定、沒辦法像清單那樣聯集，所以改成「逐欄位補空」：
  // 本機這個欄位是空的才從雲端拿，本機已經填過的一律保留。這樣不管哪
  // 台裝置比較新，都不會把使用者在這台裝置上親手輸入的數值蓋掉；換新
  // 裝置（整份都是空的）時則等同於把雲端那份完整帶過來。
  if(cloud.userProfile&&typeof cloud.userProfile==='object'){
    const c=migrateUserProfile(cloud.userProfile);
    if(!userProfile) userProfile=emptyUserProfile();
    ['age','gender','weightKg','heightCm','bodyFatPct','muscleMassKg'].forEach(k=>{
      const localEmpty=userProfile[k]==null||userProfile[k]==='';
      if(localEmpty&&c[k]!=null&&c[k]!=='') userProfile[k]=c[k];
    });
    Object.keys(c.hr||{}).forEach(sport=>{
      userProfile.hr[sport]=userProfile.hr[sport]||{restingHr:null,maxHr:null};
      ['restingHr','maxHr'].forEach(k=>{
        if(userProfile.hr[sport][k]==null&&c.hr[sport][k]!=null) userProfile.hr[sport][k]=c.hr[sport][k];
      });
    });
  }
}
async function cloudSyncAllRaces(){
  if(!state.user||!cloudEnabled()) return;
  try{
    await window.__cloud.replaceAll(state.user.uid,state.races);
    cloudSyncFailCount=0;
    clearTimeout(cloudSyncRetryTimer);
    if(cloudSyncHasError){ cloudSyncHasError=false; renderAuthArea(); }
  }catch(err){
    console.error('雲端同步失敗',err);
    cloudSyncFailCount++;
    // 失敗會自動重試（15秒後），連續失敗到一定次數才提醒使用者——
    // 避免暫時性的網路小抖動也跳出警示，本機資料本身完全不受影響。
    clearTimeout(cloudSyncRetryTimer);
    cloudSyncRetryTimer=setTimeout(()=>{cloudSyncAllRaces();},15000);
    if(cloudSyncFailCount>=3&&!cloudSyncHasError){
      cloudSyncHasError=true;
      renderAuthArea();
    }
  }
}
let pendingSyncOverwriteNotice=0;
function mergeRacesIntoState(incomingRaces){
  const merged={};
  state.races.forEach(r=>{merged[r.id]=r;});
  let addedCount=0,overwrittenCount=0;
  incomingRaces.forEach(r=>{
    const existing=merged[r.id];
    if(!existing){ merged[r.id]=r; addedCount++; return; }
    if((r.updatedAt||'')===(existing.updatedAt||'')) return; // 兩邊一致，沒有分歧
    const incomingNewer=(r.updatedAt||'')>(existing.updatedAt||'');
    const winner=incomingNewer?r:existing;
    const loser=incomingNewer?existing:r;
    syncOverwrites.unshift({
      id:uid(),raceId:loser.id,
      raceName:loser.name||t('ui.unnamedRace','(未命名賽事)'),
      discardedAt:new Date().toISOString(),
      race:loser,
    });
    overwrittenCount++;
    merged[r.id]=winner;
  });
  if(overwrittenCount>0){
    syncOverwrites=syncOverwrites.slice(0,20);
    persistSyncOverwrites();
  }
  state.races=Object.values(merged).map(migrateRace);
  return {addedCount,overwrittenCount};
}
async function mergeCloudAndLocal(cloudRaces){
  const result=mergeRacesIntoState(cloudRaces);
  if(result.overwrittenCount>0) pendingSyncOverwriteNotice+=result.overwrittenCount;
}

// 鞋款、補給品資料庫這兩個彈窗跟賽事詳情頁不一樣，不在 renderAll()
// 會自動刷新的範圍內——如果使用者在雲端資料還沒同步完成之前就先點開

// 的資料。這是真的會發生的情境：打開網站想確認鞋款資料在不在，
// 通常會立刻點進鞋款管理，比登入→抓雲端資料這個非同步過程還快，
// 使用者當下看到的畫面就是同步完成前的那一瞬間。登入合併完成後，
// 順便檢查這兩個彈窗當下開著沒有，開著就直接重新畫一次。
/* ============================================================
   同步診斷面板：排查「雲端明明有資料、畫面卻是空的」這類問題時，
   原本只能請使用者在電腦版開瀏覽器主控台手動貼指令查——手機版
   沒有方便的主控台可用，變成每次都要先確認是不是能借到電腦才能
   繼續查下去。這個面板把同樣的資訊（本機有幾筆、雲端有幾筆、雲端
   最後更新時間、查詢過程有沒有出錯）直接做成手機也能點的畫面，
   不用開發者工具。
   ============================================================ */
let syncDiagCloudResult=null,syncDiagCloudRaces=null,syncDiagCloudError=null,syncDiagLoading=false,syncDiagQueried=false;

  }else if(syncDiagQueried){

    cloudSection=r

    ${cloudSection}
    <p class="small sync-diag-note">${t('ui.syncDiagAllSyncedNote','六種資料都會同步。合併規則是「本機優先」：雲端有、本機沒有的會補進來，本機已經有的一律保留，不會被雲端覆蓋掉。')}</p>
    <div class="modal-actions"><button class="btn-ghost" data-action="close-sync-diag">${t('ui.close','關閉')}</button></div>

/* SYNC_DIAG_ITEMS：把「每一種資料在本機有幾筆、雲端有幾筆、到底會不會
   同步」攤成一張表。synced:false 的項目是真的沒有推上雲端的——這一點
   一定要誠實標出來，不然使用者換裝置時會以為登入就萬事俱備，結果心率
   區間、體重這些設定其實沒跟過來。
   cloud 欄位傳 null 代表「這個項目沒有雲端對應，不用顯示雲端數字」。 */
function syncDiagItems(){
  const r=syncDiagCloudResult,rc=syncDiagCloudRaces;
  const activeRaces=state.races.filter(x=>!x.deletedAt).length;
  const trashedRaces=state.races.filter(x=>x.deletedAt).length;
  const profileFilled=countFilledProfileFields();
  return [
    {key:'races',label:t('ui.syncDiagItemRaces','賽事紀錄'),synced:true,
      local:activeRaces,cloud:rc==null?null:rc.filter(x=>!x.deletedAt).length,
      note:trashedRaces?tf('ui.syncDiagTrashed','另有 {n} 筆在垃圾桶',trashedRaces):''},
    {key:'shoes',label:t('ui.syncDiagItemShoes','鞋款'),synced:true,
      local:shoes.length,cloud:r?(r.shoes||[]).length:null},
    {key:'nutrition',label:t('ui.syncDiagItemNutrition','補給品資料庫'),synced:true,
      local:nutritionDictionary.length,cloud:r?(r.nutritionDictionary||[]).length:null},
    {key:'profile',label:t('ui.syncDiagItemProfile','個人資料（體重／心率）'),synced:true,
      local:profileFilled,cloud:r?countFilledProfileFields(migrateUserProfile(r.userProfile)):null},
    {key:'templates',label:t('ui.syncDiagItemTemplates','裝備範本'),synced:true,
      local:templates.length,cloud:r?(r.templates||[]).length:null},
    {key:'badges',label:t('ui.syncDiagItemBadges','徽章解鎖紀錄'),synced:true,
      local:Object.keys(badgeUnlocks||{}).length,cloud:r?Object.keys(r.badgeUnlocks||{}).length:null},
  ];
}
function syncDiagTableHtml(){
  const rows=syncDiagItems().map(it=>{
    const cloudCell=!it.synced
      ? `<span class="sync-diag-nosync">${t('ui.syncDiagNotSynced','不同步')}</span>`
      : (it.cloud==null?'<span class="sync-diag-dim">—</span>':`<span class="mono">${it.cloud}</span>`);
    // 兩邊都查過、數字卻對不上時標出來：這正是使用者開這個畫面想知道的事。
    const mismatch=it.synced&&it.cloud!=null&&it.cloud!==it.local;
    return `<tr class="${mismatch?'sync-diag-mismatch':''}">
      <td>${it.label}${it.note?`<br><span class="sync-diag-dim small">${it.note}</span>`:''}</td>
      <td class="mono">${it.local}</td>
      <td>${cloudCell}</td>
    </tr>`;
  }).join('');
  return `<table class="sync-diag-table">
    <thead><tr>
      <th>${t('ui.syncDiagColItem','資料')}</th>
      <th>${t('ui.syncDiagColLocal','本機')}</th>
      <th>${t('ui.syncDiagColCloud','雲端')}</th>
    </tr></thead>
    <tbody>${rows}</tbody>
  </table>`;
}
const syncDiagModalEl_getter=()=>document.getElementById('sync-diag-modal');
/* reportStorageUsage()：顯示瀏覽器給這個網站的儲存空間用了多少。
   封面照片是以 base64 存進 IndexedDB 的，照片一多就會逼近上限，而
   寫入失敗在畫面上只會是一則錯誤橫幅——等到那時候才發現已經太晚。
   這裡讓使用者可以主動看到「還剩多少」。
   navigator.storage.estimate() 不是所有瀏覽器都支援（Safari 較晚才
   有），拿不到就整行不顯示，不要放一個空欄位讓人困惑。 */
async function reportStorageUsage(){
  const el=document.getElementById('storage-usage-line');
  if(!el) return;
  if(!navigator.storage||!navigator.storage.estimate){ el.textContent=''; return; }
  try{
    const {usage,quota}=await navigator.storage.estimate();
    if(usage==null||!quota){ el.textContent=''; return; }
    const mb=v=>(v/1048576).toFixed(1);
    const pct=Math.round(usage/quota*100);
    el.textContent=tf2('ui.storageUsage','已使用 {a} MB / 約 {b} MB',mb(usage),mb(quota))+`（${pct}%）`;
    // 逼近上限時用警示色，不要等到真的寫入失敗才說
    el.classList.toggle('storage-usage-warn',pct>=80);
  }catch(err){ el.textContent=''; }
}
function openSyncDiagModal(){
  syncDiagCloudResult=null;syncDiagCloudRaces=null;syncDiagCloudError=null;syncDiagLoading=false;syncDiagQueried=false;
  syncDiagModalEl_getter().innerHTML=syncDiagModalHtml();
  syncDiagModalEl_getter().hidden=false;
  reportStorageUsage();
}
async function runSyncDiag(){
  if(!state.user||!cloudEnabled()) return;
  syncDiagLoading=true;syncDiagCloudError=null;
  syncDiagModalEl_getter().innerHTML=syncDiagModalHtml();
  try{
    // 兩份雲端資料一起抓：賽事是一筆一份文件（races 集合），鞋款與
    // 補給品則整包存在 meta/globalLists。兩邊都要查，表格才完整。
    const [lists,races]=await Promise.all([
      window.__cloud.fetchGlobalLists(state.user.uid),
      window.__cloud.fetchAll(state.user.uid),
    ]);
    syncDiagCloudResult=lists;
    syncDiagCloudRaces=races||[];
    syncDiagQueried=true;
  }catch(err){
    syncDiagCloudError=(err&&err.message)?err.message:String(err);
  }
  syncDiagLoading=false;
  syncDiagModalEl_getter().innerHTML=syncDiagModalHtml();
}
syncDiagModalEl_getter().addEventListener('click',e=>{

  }
  if(e.target.closest('[data-action="run-sync-diag"]')) runSyncDiag();
});

async function handleAuthChange(user){
  state.user=user;
  renderAuthArea();
  if(user){
    // 先等本機資料（賽事、鞋款、補給品資料庫）讀取完成，才能開始跟
    // 雲端合併——見 localDataReady 宣告處的說明，這是修正一個真正的
    // 時序 race condition，不是可有可無的保險寫法。app 剛啟動、還沒
    // 呼叫過 init() 的極端情況下 localDataReady 會是 null，這種情況
    // 不用等（也沒有什麼好等的）。
    if(localDataReady) await localDataReady;
    if(signInAttemptInFlight){ signInAttemptInFlight=false; logFeatureUse('auth_google_signin'); }
    try{
      const cloudRaces=await window.__cloud.fetchAll(user.uid);
      pendingSyncOverwriteNotice=0;
      await mergeCloudAndLocal(cloudRaces);
      await persist();
      await cloudSyncAllRaces();
      renderAll();
      if(pendingSyncOverwriteNotice>0) showSyncOverwriteNotice(pendingSyncOverwriteNotice);
    }catch(err){
      console.error('雲端資料讀取失敗',err);
    }
    // 鞋款／補給品資料庫獨立一個 try/catch，這邊同步失敗不該連帶讓
    // 賽事資料（上面那段，明顯更重要）也跟著顯示錯誤或中斷。
    try{
      const cloudGlobalLists=await window.__cloud.fetchGlobalLists(user.uid);
      mergeGlobalListsIntoState(cloudGlobalLists);
      await persistShoes();
      await persistNutritionDictionary();
      await persistTemplates();
      await persistUserProfile();
      await persistBadgeUnlocks();
      await cloudSyncGlobalLists();
      renderAll();
      refreshOpenGlobalListModals();
    }catch(err){
      console.error('鞋款／補給品資料庫雲端讀取失敗',err);
    }
  }
}
document.addEventListener('click',e=>{
  if(e.target.closest('#btn-signin')){
    if(cloudEnabled()){
      authError=null;renderAuthArea();
      signInAttemptInFlight=true;
      window.__cloud.signIn().catch(err=>{
        signInAttemptInFlight=false;
        console.error('登入失敗',err);
        authError=authErrorMessage(err);
        renderAuthArea();
      });
    }
    return;
  }
  if(e.target.closest('#btn-enable-notif')){
    if(cloudEnabled()&&state.user){
      authError=null;
      window.__cloud.enableNotifications(state.user.uid).then(()=>{
        try{ localStorage.setItem('notif-enabled-v1','1'); }catch(err){}
        renderAuthArea();
      }).catch(err=>{
        console.error('推播設定失敗',err);
        authError=t('ui.notifFailed','推播設定失敗：')+err.message;
        renderAuthArea();
      });
    }
    return;
  }
  if(e.target.closest('#btn-signout')){
    if(cloudEnabled()) window.__cloud.signOutUser().catch(err=>console.error('登出失敗',err));
    return;
  }
  if(e.target.closest('#btn-sync-diag')){
    openSyncDiagModal();
    return;
  }
});
window.addEventListener('cloud-ready',()=>{
  renderAuthArea();
  if(cloudEnabled()) window.__cloud.onAuthChange(handleAuthChange);
});

const SPORT_TEMPLATE_INDEX={

  triathlon:2,duathlon:2,cycling:3,swimming:4,

function autoApplyEquipmentTemplate(race){
  if(race.equipmentChecklist&&race.equipmentChecklist.length>0) return false;
  const idx=SPORT_TEMPLATE_INDEX[race.sportType];
