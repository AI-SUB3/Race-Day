<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>賽事紀錄</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --paper:#EEF0EF;
    --surface:#FAFAF8;
    --ink:#16231C;
    --ink-soft:#4B564E;
    --rule:#D8DAD3;
    --trail:#2E6B49;
    --contour:#3A5A8C;
    --flag:#B8451F;
    --stone:#8B8D82;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Noto Sans TC',sans-serif;
    font-size:14px;
    line-height:1.6;
  }
  :focus-visible{outline:2px solid var(--contour);outline-offset:1px;}
  h1,h2,h3{margin:0;font-weight:700;}
  .mono{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;}
  .small{font-size:12px;}

  #app{display:flex;min-height:100vh;}

  /* ---------- Rail (left) ---------- */
  #rail{
    width:340px;flex-shrink:0;display:flex;flex-direction:column;
    height:100vh;position:sticky;top:0;
    border-right:1px solid var(--rule);
    background:var(--paper);
  }
  .rail-head{padding:22px 20px 12px;flex-shrink:0;}
  .app-title{font-size:19px;letter-spacing:0.01em;}
  .app-tagline{color:var(--stone);font-size:12px;margin:2px 0 16px;}
  .btn-block{width:100%;}
  #search-input{
    width:100%;margin-top:12px;padding:8px 10px;border:1px solid var(--rule);
    border-radius:3px;background:var(--surface);color:var(--ink);font:inherit;
  }
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
  .chip{
    font-size:12px;padding:4px 10px;border:1px solid var(--rule);border-radius:12px;
    background:none;cursor:pointer;color:var(--ink-soft);font-family:inherit;
  }
  .chip.active{background:var(--ink);color:var(--surface);border-color:var(--ink);}

  #rail-list{flex:1;overflow-y:auto;padding:6px 12px;}
  .empty-hint{color:var(--stone);font-size:13px;padding:16px 8px;}

  .race-card{
    display:flex;flex-direction:column;gap:5px;padding:12px 12px;margin-bottom:2px;
    border-radius:3px;cursor:pointer;border:1px solid transparent;
  }
  .race-card:hover{background:rgba(22,35,28,0.04);}
  .race-card.active{background:var(--surface);border-color:var(--rule);}
  .race-card-top{display:flex;justify-content:space-between;align-items:center;}
  .race-card-name{font-weight:500;font-size:14px;}
  .race-card-meta{color:var(--ink-soft);}
  .spark{width:100%;height:20px;color:var(--trail);display:block;}

  .rail-foot{
    padding:14px 20px;border-top:1px solid var(--rule);display:flex;gap:16px;
    flex-shrink:0;flex-wrap:wrap;
  }

  /* ---------- Stamp badge ---------- */
  .stamp{
    display:inline-block;padding:2px 9px;border:1.5px solid currentColor;border-radius:2px;
    font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.02em;
    transform:rotate(-2deg);white-space:nowrap;
  }
  .stamp.status-registered,.stamp.status-completed{color:var(--trail);}
  .stamp.status-considering,.stamp.status-lottery_pending{color:var(--contour);}
  .stamp.status-dns,.stamp.status-dnf{color:var(--flag);}

  /* ---------- Buttons ---------- */
  button{cursor:pointer;}
  .btn-primary{
    background:var(--ink);color:var(--surface);border:none;border-radius:3px;
    padding:10px 16px;font:inherit;font-weight:500;font-size:13px;
  }
  .btn-primary:hover{opacity:0.88;}
  .btn-ghost{
    background:none;border:1px solid var(--rule);color:var(--ink);border-radius:3px;
    padding:6px 12px;font:inherit;font-size:12px;
  }
  .btn-ghost:hover{border-color:var(--ink);}
  .btn-ghost.danger{color:var(--flag);border-color:var(--rule);}
  .btn-ghost.danger:hover{border-color:var(--flag);}
  .btn-text{background:none;border:none;color:var(--ink-soft);text-decoration:underline;font:inherit;font-size:12px;padding:0;}
  .btn-text.danger{color:var(--flag);}

  /* ---------- Detail (right) ---------- */
  #detail{flex:1;padding:40px 48px 100px;overflow-y:auto;height:100vh;max-width:920px;}
  .empty-state{padding:60px 0;color:var(--ink-soft);}
  .empty-state p{margin-bottom:16px;}

  .detail-header{padding-bottom:22px;margin-bottom:6px;border-bottom:2px solid var(--ink);}
  .dh-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
  .detail-header h1{font-size:27px;line-height:1.3;}
  .detail-header h1 .alias{font-weight:400;color:var(--ink-soft);font-size:16px;}
  .dh-meta{color:var(--ink-soft);}

  details.section{border-bottom:1px solid var(--rule);}
  details.section summary{
    cursor:pointer;font-weight:600;font-size:15px;padding:16px 2px;
    list-style:none;display:flex;align-items:center;justify-content:space-between;
  }
  details.section summary::-webkit-details-marker{display:none;}
  details.section summary::after{content:'+';font-family:'IBM Plex Mono',monospace;color:var(--stone);font-weight:400;}
  details.section[open] summary::after{content:'\2013';}

  .section-body{display:flex;flex-wrap:wrap;gap:16px 20px;padding:2px 2px 16px;}
  .section-body .field{flex:1 1 200px;min-width:170px;margin-bottom:0;}
  .section-body .field.wide{flex-basis:100%;}

  .field{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--ink-soft);margin-bottom:12px;}
  .field span{font-size:12px;}
  .field span i{font-style:normal;color:var(--stone);margin-left:3px;}
  .field input,.field select,.field textarea{
    font:inherit;font-family:'Noto Sans TC',sans-serif;font-size:13px;
    padding:8px 10px;border:1px solid var(--rule);border-radius:3px;
    background:var(--surface);color:var(--ink);width:100%;
  }
  .field input[type="number"],.field input[data-kind="duration"]{font-family:'IBM Plex Mono',monospace;}
  .field textarea{resize:vertical;min-height:60px;}
  .field-inline{flex-direction:row;align-items:center;gap:8px;}
  .field-inline input{width:auto;}

  .subsection{padding:6px 2px 22px;}
  .subsection-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
  .subsection h3{font-size:13px;font-weight:600;color:var(--ink-soft);}

  .repeat-rows .empty-hint{padding:0 0 8px;}
  .repeat-row{
    position:relative;display:flex;flex-wrap:wrap;gap:10px 16px;
    padding:14px 36px 4px 14px;border:1px solid var(--rule);border-radius:3px;
    margin-bottom:10px;background:var(--surface);
  }
  .repeat-row .field{flex:1 1 150px;min-width:130px;}
  .row-remove{
    position:absolute;top:6px;right:8px;width:22px;height:22px;border:none;
    background:none;color:var(--stone);font-size:17px;line-height:1;
  }
  .row-remove:hover{color:var(--flag);}

  .tier-label{
    display:flex;align-items:center;justify-content:center;width:28px;height:28px;
    border:1.5px solid var(--ink);border-radius:50%;font-size:13px;flex-shrink:0;margin-top:4px;
  }

  .create-form{max-width:420px;}
  .create-form h1{font-size:22px;margin-bottom:20px;}
  .create-actions{display:flex;gap:10px;margin-top:8px;}

  @media (max-width:860px){
    #app{flex-direction:column;}
    #rail{width:100%;height:auto;position:relative;border-right:none;border-bottom:1px solid var(--rule);}
    #rail-list{max-height:40vh;}
    #detail{height:auto;padding:28px 20px 80px;}
  }

  /* ---------- Import modal ---------- */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(22,35,28,0.45);
    display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;
  }
  .modal-overlay[hidden]{display:none;}
  .modal-panel{
    background:var(--surface);border-radius:4px;padding:28px 30px;max-width:440px;width:100%;
    max-height:86vh;overflow-y:auto;
  }
  .modal-panel-wide{max-width:960px;}
  .modal-panel h2{font-size:18px;margin-bottom:10px;}
  .modal-hint{color:var(--ink-soft);font-size:13px;margin-bottom:16px;}
  .modal-actions{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap;}
  .modal-actions-top{margin-top:0;margin-bottom:14px;}
  .sheet-checks{display:flex;flex-direction:column;gap:8px;max-height:280px;overflow-y:auto;padding:4px 0;}
  .sheet-check{display:flex;align-items:center;gap:8px;font-size:13px;}
  .import-table-wrap{overflow-x:auto;border:1px solid var(--rule);border-radius:3px;}
  .import-table{border-collapse:collapse;width:100%;font-size:12px;}
  .import-table th{text-align:left;padding:8px 8px;border-bottom:1px solid var(--rule);background:var(--paper);white-space:nowrap;position:sticky;top:0;}
  .import-table td{padding:5px 8px;border-bottom:1px solid var(--rule);vertical-align:middle;}
  .import-table input[type="text"],.import-table input[type="date"],.import-table select{
    font:inherit;font-size:12px;padding:5px 6px;border:1px solid var(--rule);border-radius:3px;background:var(--surface);width:100%;min-width:90px;
  }
  .import-table input.narrow{min-width:60px;width:74px;}
  .import-table td:first-child{width:28px;}
</style>
</head>
<body>
<div id="app">
  <aside id="rail">
    <div class="rail-head">
      <h1 class="app-title">賽事紀錄</h1>
      <p class="app-tagline">從報名到終點的完整紀錄</p>
      <button id="btn-new" class="btn-primary btn-block">+ 新增賽事</button>
      <input id="search-input" type="search" placeholder="搜尋賽事名稱、城市…">
      <div id="filter-chips" class="chips">
        <button class="chip active" data-status="all">全部</button>
        <button class="chip" data-status="registered">已報名</button>
        <button class="chip" data-status="lottery_pending">抽籤中</button>
        <button class="chip" data-status="considering">考慮中</button>
        <button class="chip" data-status="completed">已完賽</button>
        <button class="chip" data-status="dns">DNS</button>
        <button class="chip" data-status="dnf">DNF</button>
      </div>
    </div>
    <div id="rail-list"></div>
    <div class="rail-foot">
      <button id="btn-import" class="btn-text">匯入 Excel</button>
      <button id="btn-export" class="btn-text">匯出 JSON</button>
      <button id="btn-clear" class="btn-text danger">清除全部資料</button>
    </div>
  </aside>
  <main id="detail"></main>
</div>
<input type="file" id="import-file-input" accept=".xlsx,.xls" style="display:none">
<div id="import-modal" class="modal-overlay" hidden></div>

<script>
/* ============================================================
   常數與選項
   ============================================================ */
const STATUS_OPTIONS=[
  {value:'registered',label:'已報名'},{value:'lottery_pending',label:'抽籤中'},
  {value:'considering',label:'考慮中'},{value:'completed',label:'已完賽'},
  {value:'dns',label:'未起跑 (DNS)'},{value:'dnf',label:'未完賽 (DNF)'},
];
const SPORT_OPTIONS=[
  {value:'road_running',label:'路跑'},{value:'trail_running',label:'越野跑'},
  {value:'ultra_marathon',label:'超級馬拉松'},{value:'duathlon',label:'二鐵'},
  {value:'triathlon',label:'三鐵'},{value:'cycling',label:'自行車'},
  {value:'obstacle_race',label:'障礙賽'},{value:'other',label:'其他'},
];
const FORMAT_OPTIONS=[
  {value:'solo',label:'個人單人'},{value:'pair',label:'雙人組'},
  {value:'relay',label:'多人接力賽'},{value:'loop',label:'繞圈賽'},{value:'age_group',label:'分齡賽'},
];
const PAYMENT_OPTIONS=[{value:'unpaid',label:'未繳費'},{value:'paid',label:'已繳清'},{value:'refunding',label:'退款中'}];
const BOOKING_OPTIONS=[{value:'considering',label:'考慮中'},{value:'booked',label:'已預訂'},{value:'paid',label:'已付款'},{value:'cancelled',label:'已取消'}];
const WEATHER_OPTIONS=[{value:'sunny',label:'晴'},{value:'cloudy',label:'陰'},{value:'rainy',label:'雨'},{value:'foggy',label:'霧'},{value:'other',label:'其他'}];
const ROLE_OPTIONS=[{value:'partner',label:'同行夥伴'},{value:'cheer_squad',label:'加油團'},{value:'emergency_contact',label:'緊急聯絡人'},{value:'pacer',label:'配速員'},{value:'other',label:'其他'}];
const EQUIP_CATEGORY_OPTIONS=[{value:'shoes',label:'跑鞋/戰靴'},{value:'apparel',label:'服裝'},{value:'vest',label:'背心'},{value:'headlamp',label:'頭燈'},{value:'nutrition',label:'補給品'},{value:'mandatory_gear',label:'強制裝備'},{value:'other',label:'其他'}];
const MEDIA_TYPE_OPTIONS=[{value:'official_site',label:'官方網站'},{value:'brochure_pdf',label:'賽事簡章 PDF'},{value:'gpx_track',label:'GPX 軌跡'},{value:'photo_album',label:'個人相簿'},{value:'certificate',label:'證書照片'},{value:'medal_photo',label:'獎牌照片'},{value:'other',label:'其他'}];
const TRANSPORT_MODE_OPTIONS=[{value:'hsr',label:'高鐵'},{value:'shuttle',label:'接駁車'},{value:'self_drive',label:'自駕'},{value:'flight',label:'飛機'},{value:'other',label:'其他'}];
const DIRECTION_OPTIONS=[{value:'outbound',label:'去程'},{value:'return',label:'回程'}];

const SECTION_BASIC=[
  {path:'name',label:'賽事名稱',type:'text'},
  {path:'alias',label:'別名 / 英文名稱',type:'text'},
  {path:'status',label:'狀態',type:'select',options:STATUS_OPTIONS},
  {path:'sportType',label:'主要運動種類',type:'select',options:SPORT_OPTIONS},
  {path:'raceFormat',label:'競賽形式',type:'select',options:FORMAT_OPTIONS},
  {path:'schedule.raceDate',label:'比賽日期',type:'date'},
  {path:'schedule.startTime',label:'起跑時間',type:'time'},
  {path:'schedule.registrationOpenDate',label:'報名開始日期',type:'date'},
  {path:'schedule.registrationCloseDate',label:'報名截止日期',type:'date'},
  {path:'schedule.lotteryResultDate',label:'抽籤結果公佈日',type:'date'},
  {path:'location.venueName',label:'起終點名稱',type:'text'},
  {path:'location.city',label:'縣市',type:'text'},
  {path:'location.country',label:'國家',type:'text'},
];
const SECTION_ROUTE=[
  {path:'route.distanceKm',label:'總距離',type:'number',unit:'公里'},
  {path:'route.elevationGainM',label:'總爬升',type:'number',unit:'公尺'},
  {path:'route.elevationLossM',label:'總下降',type:'number',unit:'公尺'},
  {path:'route.startAltitudeM',label:'起點海拔',type:'number',unit:'公尺'},
  {path:'route.minAltitudeM',label:'最低海拔',type:'number',unit:'公尺'},
  {path:'route.maxAltitudeM',label:'最高海拔',type:'number',unit:'公尺'},
  {path:'route.surface.pavedPct',label:'柏油路比例',type:'number',unit:'%'},
  {path:'route.surface.trailPct',label:'土路比例',type:'number',unit:'%'},
  {path:'route.surface.stairsPct',label:'階梯比例',type:'number',unit:'%'},
  {path:'route.checkpointCount',label:'CP / 補給站數量',type:'number'},
  {path:'route.cutoffTimeSeconds',label:'全程關門時間',type:'duration'},
  {path:'route.terrainNotes',label:'賽道陡升段說明',type:'textarea',wide:true},
];
const SECTION_WEATHER=[
  {path:'climateForecast.avgTempC',label:'歷年平均氣溫',type:'number',unit:'°C'},
  {path:'climateForecast.avgHumidityPct',label:'歷年平均濕度',type:'number',unit:'%'},
  {path:'climateForecast.windDirection',label:'風向',type:'text'},
  {path:'climateForecast.windSpeedKmh',label:'風速',type:'number',unit:'km/h'},
  {path:'climateForecast.rainProbabilityPct',label:'降雨機率',type:'number',unit:'%'},
  {path:'raceDayWeather.condition',label:'當日氣候狀況',type:'select',options:WEATHER_OPTIONS},
  {path:'raceDayWeather.feelsLikeTempC',label:'實際體感溫度',type:'number',unit:'°C'},
  {path:'raceDayWeather.humidityPct',label:'當日濕度',type:'number',unit:'%'},
  {path:'raceDayWeather.notes',label:'天氣備註',type:'textarea',wide:true},
];
const SECTION_LOGISTICS=[
  {path:'budget.registrationFee',label:'報名費用',type:'number'},
  {path:'budget.currency',label:'幣別',type:'text'},
  {path:'budget.paymentStatus',label:'繳費狀態',type:'select',options:PAYMENT_OPTIONS},
  {path:'budget.chipDeposit',label:'晶片押金',type:'number'},
];
const SECTION_PREP=[
  {path:'nutritionPlan.gelCount',label:'能量膠數量',type:'number'},
  {path:'nutritionPlan.electrolyteTabletCount',label:'電解質 / 鹽錠數量',type:'number'},
  {path:'nutritionPlan.hydrationCapacityMl',label:'水袋容量預估',type:'number',unit:'ml'},
  {path:'nutritionPlan.notes',label:'補給備註',type:'textarea',wide:true},
  {path:'trainingPlan.planStartDate',label:'訓練計畫開始日',type:'date'},
  {path:'trainingPlan.planEndDate',label:'訓練計畫結束日',type:'date'},
  {path:'trainingPlan.taperStartDate',label:'減量期開始日',type:'date'},
  {path:'trainingPlan.weeklyMileageTargetKm',label:'週跑量目標',type:'number',unit:'公里'},
  {path:'trainingPlan.keyWorkoutNotes',label:'關鍵課表備註',type:'textarea',wide:true},
  {path:'trainingPlan.externalPlanUrl',label:'外部訓練計畫連結',type:'url',wide:true},
  {path:'trainingPlan.notes',label:'訓練備註',type:'textarea',wide:true},
];
const SECTION_POST=[
  {path:'results.gunTimeSeconds',label:'大會時間 (Gun Time)',type:'duration'},
  {path:'results.chipTimeSeconds',label:'晶片時間 (Chip Time)',type:'duration'},
  {path:'results.overallRank',label:'總排名次',type:'number'},
  {path:'results.overallParticipants',label:'總參賽人數',type:'number'},
  {path:'results.ageGroupRank',label:'分組名次',type:'number'},
  {path:'results.ageGroupParticipants',label:'分組人數',type:'number'},
  {path:'results.isPb',label:'個人最佳 (PB)',type:'checkbox'},
  {path:'performanceData.avgHr',label:'平均心率',type:'number',unit:'bpm'},
  {path:'performanceData.maxHr',label:'最大心率',type:'number',unit:'bpm'},
  {path:'performanceData.avgCadence',label:'平均步頻',type:'number',unit:'spm'},
  {path:'performanceData.avgPowerWatts',label:'平均功率',type:'number',unit:'W'},
  {path:'performanceData.dataSource',label:'資料來源',type:'text'},
  {path:'review.hitTheWallNotes',label:'撞牆期紀錄',type:'textarea',wide:true},
  {path:'review.courseReview',label:'路線心得',type:'textarea',wide:true},
  {path:'review.pros',label:'優點評價',type:'textarea',wide:true},
  {path:'review.cons',label:'缺點評價',type:'textarea',wide:true},
  {path:'review.lessonsLearned',label:'檢討筆記',type:'textarea',wide:true},
];

const CHECKPOINT_FIELDS=[
  {path:'name',label:'名稱',type:'text'},{path:'distanceKm',label:'距離',type:'number',unit:'公里'},
  {path:'cutoffTimeSeconds',label:'關門時間',type:'duration'},{path:'elevationM',label:'海拔',type:'number',unit:'公尺'},
  {path:'hasWater',label:'提供飲水',type:'checkbox'},{path:'hasFood',label:'提供食物',type:'checkbox'},
  {path:'hasDropBag',label:'可寄放裝備',type:'checkbox'},{path:'notes',label:'備註',type:'text'},
];
const ACCOM_FIELDS=[
  {path:'hotelName',label:'飯店名稱',type:'text'},{path:'address',label:'地址',type:'text'},
  {path:'checkIn',label:'入住時間',type:'datetime-local'},{path:'checkOut',label:'退房時間',type:'datetime-local'},
  {path:'distanceToStartKm',label:'距起點距離',type:'number',unit:'公里'},
  {path:'bookingStatus',label:'訂房狀態',type:'select',options:BOOKING_OPTIONS},
  {path:'cost',label:'費用',type:'number'},{path:'notes',label:'備註',type:'text'},
];
const TRANSPORT_FIELDS=[
  {path:'direction',label:'方向',type:'select',options:DIRECTION_OPTIONS},
  {path:'mode',label:'交通工具',type:'select',options:TRANSPORT_MODE_OPTIONS},
  {path:'departureTime',label:'發車 / 出發時間',type:'datetime-local'},
  {path:'pickupLocation',label:'接駁點位置',type:'text'},{path:'notes',label:'備註',type:'text'},
];
const COMPANION_FIELDS=[
  {path:'name',label:'姓名',type:'text'},{path:'role',label:'角色',type:'select',options:ROLE_OPTIONS},
  {path:'contactInfo',label:'聯絡方式',type:'text'},{path:'notes',label:'備註',type:'text'},
];
const EQUIP_FIELDS=[
  {path:'itemName',label:'項目名稱',type:'text'},{path:'category',label:'分類',type:'select',options:EQUIP_CATEGORY_OPTIONS},
  {path:'isMandatory',label:'強制裝備',type:'checkbox'},{path:'isPacked',label:'已打包',type:'checkbox'},
  {path:'notes',label:'備註',type:'text'},
];
const SPLIT_FIELDS=[
  {path:'distanceKm',label:'距離',type:'number',unit:'公里'},{path:'splitTimeSeconds',label:'分段時間',type:'duration'},
  {path:'avgHr',label:'平均心率',type:'number',unit:'bpm'},{path:'avgPaceSecPerKm',label:'平均配速',type:'duration'},
  {path:'elevationGainM',label:'爬升',type:'number',unit:'公尺'},{path:'notes',label:'備註',type:'text'},
];

/* ============================================================
   工具函式
   ============================================================ */
function uid(){return 'r'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function getPath(obj,path){return path.split('.').reduce((o,k)=>(o==null?undefined:o[k]),obj);}
function setPath(obj,path,value){
  const keys=path.split('.');let o=obj;
  for(let i=0;i<keys.length-1;i++){o=o[keys[i]];}
  o[keys[keys.length-1]]=value;
}
function labelFor(options,value){const o=options.find(o=>o.value===value);return o?o.label:(value||'—');}
function statusLabel(v){return labelFor(STATUS_OPTIONS,v);}
function sportLabel(v){return labelFor(SPORT_OPTIONS,v);}
function secToHMS(sec){
  if(sec==null||sec==='') return '';
  sec=Math.round(Number(sec));
  const h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=Math.floor(sec%60);
  return h+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
function hmsToSec(str){
  if(!str||!str.trim()) return null;
  const parts=str.trim().split(':').map(Number);
  if(parts.some(isNaN)) return null;
  while(parts.length<3) parts.unshift(0);
  const [h,m,s]=parts;
  return h*3600+m*60+s;
}
function daysDiff(dateStr){
  if(!dateStr) return null;
  const target=new Date(dateStr+'T00:00:00');
  if(isNaN(target.getTime())) return null;
  const today=new Date();today.setHours(0,0,0,0);
  return Math.round((target-today)/86400000);
}
function countdownLabel(race){
  if(race.status==='completed') return '已完賽';
  if(race.status==='dns') return 'DNS';
  if(race.status==='dnf') return 'DNF';
  const d=daysDiff(race.schedule&&race.schedule.raceDate);
  if(d==null) return '尚未設定日期';
  if(d>0) return `倒數 ${d} 天`;
  if(d===0) return '今天出發';
  return `已過 ${Math.abs(d)} 天`;
}
function sparklineSvg(race){
  const pts=(race.checkpoints||[]).filter(c=>c.elevationM!=null&&c.distanceKm!=null).sort((a,b)=>a.distanceKm-b.distanceKm);
  if(pts.length<2) return '';
  const xs=pts.map(p=>p.distanceKm),ys=pts.map(p=>p.elevationM);
  const minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys);
  const w=140,h=22,pad=2;
  const sx=x=>maxX===minX?w/2:pad+(x-minX)/(maxX-minX)*(w-2*pad);
  const sy=y=>maxY===minY?h/2:h-pad-(y-minY)/(maxY-minY)*(h-2*pad);
  const points=pts.map(p=>sx(p.distanceKm).toFixed(1)+','+sy(p.elevationM).toFixed(1)).join(' ');
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polyline points="${points}" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>`;
}
function emptyRace(name,sportType,status,raceDate){
  const now=new Date().toISOString();
  return {
    id:uid(),name:name||'',alias:'',status:status||'considering',sportType:sportType||'road_running',raceFormat:'solo',
    schedule:{raceDate:raceDate||'',startTime:'',registrationOpenDate:'',registrationCloseDate:'',lotteryResultDate:''},
    location:{venueName:'',city:'',country:''},
    route:{distanceKm:null,elevationGainM:null,elevationLossM:null,minAltitudeM:null,maxAltitudeM:null,startAltitudeM:null,
      surface:{pavedPct:null,trailPct:null,stairsPct:null},checkpointCount:null,cutoffTimeSeconds:null,terrainNotes:''},
    checkpoints:[],
    climateForecast:{avgTempC:null,avgHumidityPct:null,windDirection:'',windSpeedKmh:null,rainProbabilityPct:null},
    raceDayWeather:{feelsLikeTempC:null,condition:'',humidityPct:null,notes:''},
    budget:{registrationFee:null,currency:'TWD',paymentStatus:'unpaid',chipDeposit:null},
    accommodations:[],transportation:[],companions:[],
    goals:[{tier:'A',targetTimeSeconds:null,paceStrategy:''},{tier:'B',targetTimeSeconds:null,paceStrategy:''},{tier:'C',targetTimeSeconds:null,paceStrategy:''}],
    equipmentChecklist:[],
    nutritionPlan:{gelCount:null,electrolyteTabletCount:null,hydrationCapacityMl:null,notes:''},
    trainingPlan:{planStartDate:'',planEndDate:'',taperStartDate:'',weeklyMileageTargetKm:null,keyWorkoutNotes:'',externalPlanUrl:'',notes:''},
    results:{gunTimeSeconds:null,chipTimeSeconds:null,overallRank:null,overallParticipants:null,ageGroupRank:null,ageGroupParticipants:null,isPb:false},
    performanceData:{avgHr:null,maxHr:null,avgCadence:null,avgPowerWatts:null,dataSource:'',notes:''},
    splits:[],
    review:{hitTheWallNotes:'',courseReview:'',pros:'',cons:'',lessonsLearned:''},

    createdAt:now,updatedAt:now,

}

const state={races:[],selectedId:null,creating:false,filterStatus:'all',searchQuery:'',confirmDelete:false};

const STORAGE_KEY='races-v1';

async function loadRaces(){
  try{
    const res=await window.storage.get(STORAGE_KEY,false);
    state.races=(res&&res.value)?JSON.parse(res.value):[];
  }catch(err){
    state.races=[];
  }
}
async function persist(){
  try{
    await window.storage.set(STORAGE_KEY,JSON.stringify(state.races),false);
  }catch(err){
    console.error('儲存失敗',err);
  }
}

/* ============================================================
   欄位 / 表單渲染
   ============================================================ */
function renderField(race,cfg){
  const val=getPath(race,cfg.path);
  let input;
  switch(cfg.type){
    case 'select':
      input=`<select data-path="${cfg.path}"><option value="">—</option>${cfg.options.map(o=>`<option value="${o.value}" ${val===o.value?'selected':''}>${o.label}</option>`).join('')}</select>`;
      break;
    case 'textarea':
      input=`<textarea data-path="${cfg.path}" rows="3">${escapeHtml(val||'')}</textarea>`;
      break;
    case 'checkbox':
      return `<label class="field field-inline"><span>${cfg.label}</span><input type="checkbox" data-path="${cfg.path}" ${val?'checked':''}></label>`;
    case 'duration':
      input=`<input type="text" placeholder="H:MM:SS" data-path="${cfg.path}" data-kind="duration" value="${val!=null?secToHMS(val):''}">`;
      break;
    case 'number':
      input=`<input type="number" step="any" data-path="${cfg.path}" value="${val!=null?val:''}">`;
      break;
    default:
      input=`<input type="${cfg.type||'text'}" data-path="${cfg.path}" value="${escapeHtml(val!=null?val:'')}">`;
  }
  return `<label class="field${cfg.wide?' wide':''}"><span>${cfg.label}${cfg.unit?`<i>(${cfg.unit})</i>`:''}</span>${input}</label>`;
}

function renderRepeatable(race,listKey){
  const meta=LIST_META[listKey];
  const items=race[listKey]||[];
  return `<div class="subsection">
    <div class="subsection-head"><h3>${meta.title}</h3><button type="button" class="btn-ghost" data-action="add-item" data-list="${listKey}">+ 新增</button></div>
    <div class="repeat-rows">
      ${items.length?items.map((it,i)=>`
        <div class="repeat-row">
          <button type="button" class="row-remove" data-action="remove-item" data-list="${listKey}" data-index="${i}" title="刪除">×</button>
          ${meta.fields.map(f=>renderField(race,Object.assign({},f,{path:`${listKey}.${i}.${f.path}`}))).join('')}
        </div>`).join(''):`<p class="empty-hint">尚未新增</p>`}
    </div>
  </div>`;
}

function renderGoals(race){
  return `<div class="subsection">
    <div class="subsection-head"><h3>賽前目標</h3></div>
    <div class="repeat-rows">

          <label class="field" style="flex:2 1 220px;"><span>配速策略</span><input type="text" data-path="goals.${i}.paceStrategy" value="${escapeHtml(g.paceStrategy||'')}"></label>

}

function renderRail(){

    if(q){
      const hay=`${r.name} ${r.alias} ${(r.location&&r.location.city)||''}`.toLowerCase();
      if(!hay.includes(q)) return false;

  }).sort((a,b)=>(a.schedule.raceDate||'9999').localeCompare(b.schedule.raceDate||'9999'));

   ============================================================ */
function startCreate(){state.creating=true;state.selectedId=null;state.confirmDelete=false;renderAll();}

document.getElementById('btn-new').addEventListener('click',startCreate);

searchInputEl.addEventListener('input',e=>{state.searchQuery=e.target.value;renderRail();});

filterChipsEl.addEventListener('click',e=>{

railListEl.addEventListener('click',e=>{

document.getElementById('btn-export').addEventListener('click',()=>{

  const a=document.createElement('a');
  a.href=url;a.download='races-export.json';a.click();

let confirmClear=false;
document.getElementById('btn-clear').addEventListener('click',e=>{
  if(!confirmClear){
    confirmClear=true;e.target.textContent='確定清除？再按一次';
    setTimeout(()=>{confirmClear=false;e.target.textContent='清除全部資料';},4000);
    return;
  }
  state.races=[];state.selectedId=null;confirmClear=false;
  e.target.textContent='清除全部資料';
  persist();renderAll();
});

detailEl.addEventListener('change',e=>{
  const t=e.target;const path=t.dataset.path;if(!path||!currentRace) return;
  let value;
  if(t.type==='checkbox') value=t.checked;
  else if(t.dataset.kind==='duration') value=hmsToSec(t.value);
  else if(t.type==='number') value=(t.value===''?null:Number(t.value));
  else value=t.value;
  setPath(currentRace,path,value);
  currentRace.updatedAt=new Date().toISOString();
  persist();
  renderRail();
  if(path==='status'){renderDetail();}else{updateDetailHeaderBits();}
});

detailEl.addEventListener('click',e=>{
  const addBtn=e.target.closest('[data-action="add-item"]');
  if(addBtn){
    const listKey=addBtn.dataset.list;
    currentRace[listKey]=currentRace[listKey]||[];
    currentRace[listKey].push(LIST_META[listKey].factory());
    currentRace.updatedAt=new Date().toISOString();
    persist();renderDetail();return;
  }
  const rmBtn=e.target.closest('[data-action="remove-item"]');
  if(rmBtn){
    const listKey=rmBtn.dataset.list,idx=Number(rmBtn.dataset.index);
    currentRace[listKey].splice(idx,1);
    currentRace.updatedAt=new Date().toISOString();
    persist();renderDetail();return;
  }
  const delBtn=e.target.closest('[data-action="delete-race"]');
  if(delBtn){
    if(!state.confirmDelete){
      state.confirmDelete=true;renderDetail();
      setTimeout(()=>{state.confirmDelete=false;if(currentRace&&currentRace.id===state.selectedId) renderDetail();},4000);
      return;
    }
    state.races=state.races.filter(r=>r.id!==currentRace.id);
    state.selectedId=null;state.confirmDelete=false;currentRace=null;
    persist();renderAll();return;
  }
  if(e.target.closest('[data-action="start-create"]')){startCreate();return;}
  if(e.target.closest('[data-action="cancel-create"]')){state.creating=false;renderAll();return;}
  if(e.target.closest('[data-action="confirm-create"]')){
    const nameEl=document.getElementById('new-name');
    const name=nameEl.value.trim();
    if(!name){nameEl.focus();return;}
    const sportType=document.getElementById('new-sport').value;
    const status=document.getElementById('new-status').value;
    const raceDate=document.getElementById('new-date').value;
    const race=emptyRace(name,sportType,status,raceDate);
    state.races.push(race);
    state.selectedId=race.id;state.creating=false;
    persist();renderAll();return;
  }
});

/* ============================================================
   Excel 匯入
   ============================================================ */
const HEADER_KEYWORDS=[
  [['日期'],'date'],
  [['項目','賽事','名稱'],'name'],
  [['距離'],'distance'],
  [['地點','地址','位置'],'venue'],
  [['費用','報名費'],'fee'],
  [['報名'],'statusHint'],
];
const RACE_KEYWORDS=/馬拉松|路跑|越野|鐵人|半程|全馬|接力|障礙|定向|泳渡|三鐵|二鐵|夜跑|盃|杯|marathon|trail|triathlon|relay/i;

function inferColumnRoles(headerRow,dataRows){
  const roles=headerRow.map(()=>null);
  const used=new Set();
  headerRow.forEach((h,i)=>{
    const text=(h==null?'':String(h));
    for(const [keys,role] of HEADER_KEYWORDS){
      if(keys.some(k=>text.includes(k))&&!used.has(role)){roles[i]=role;used.add(role);return;}
    }
  });
  headerRow.forEach((h,i)=>{
    if(roles[i]) return;
    const sample=dataRows.map(r=>(r||[])[i]).filter(v=>v!=null&&v!=='').slice(0,15);
    if(sample.length===0){roles[i]='note';return;}
    const numericCount=sample.filter(v=>typeof v==='number'||(typeof v==='string'&&v.trim()!==''&&!isNaN(Number(v)))).length;
    const dateCount=sample.filter(v=>v instanceof Date).length;
    if(!used.has('distance')&&numericCount/sample.length>0.5){roles[i]='distance';used.add('distance');return;}
    if(!used.has('date')&&dateCount/sample.length>0.5){roles[i]='date';used.add('date');return;}
    roles[i]='note';
  });
  return roles;
}
function cellToISODate(v){
  if(v instanceof Date&&!isNaN(v)){
    const y=v.getFullYear(),m=String(v.getMonth()+1).padStart(2,'0'),d=String(v.getDate()).padStart(2,'0');
    return `${y}-${m}-${d}`;
  }
  if(typeof v==='string'){
    const s=v.trim();
    if(/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0,10);
    if(/[~～–至到]/.test(s)) return null;
    const m=s.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/);
    if(m) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  }
  return null;
}
function parseDistanceCell(v){
  if(v==null||v==='') return {km:null,raw:''};
  if(typeof v==='number') return {km:v,raw:String(v)};
  const s=String(v).trim();
  const n=Number(s);
  if(s!==''&&!isNaN(n)) return {km:n,raw:s};
  return {km:null,raw:s};
}
function parseFeeCell(v){
  if(v==null||v==='') return null;
  if(typeof v==='number') return v;
  const s=String(v).trim();
  if(/free|免費/i.test(s)) return 0;
  const n=Number(s.replace(/[^\d.]/g,''));
  return isNaN(n)?null:n;
}
function inferSportType(name){
  if(/鐵人|triathlon|challenge|226|113|70\.3/i.test(name)) return 'triathlon';
  if(/越野|trail/i.test(name)) return 'trail_running';
  if(/超馬|ultra/i.test(name)) return 'ultra_marathon';
  if(/障礙/i.test(name)) return 'obstacle_race';
  if(/自行車|單車|cycling|bike/i.test(name)) return 'cycling';
  if(/泳渡|長泳|游泳|swim/i.test(name)) return 'other';
  return 'road_running';
}
function inferFormat(name,distanceRaw){
  const hay=name+' '+(distanceRaw||'');
  if(/接力|relay/i.test(hay)) return 'relay';
  if(/雙人|pair/i.test(hay)) return 'pair';
  if(/繞圈|loop/i.test(hay)) return 'loop';
  return 'solo';
}
function todayISO(){
  const d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function parseSheetRows(sheetName,rows,isCurated){
  let headerIdx=0;
  for(let i=0;i<Math.min(rows.length,5);i++){
    const rowText=(rows[i]||[]).map(c=>c==null?'':String(c)).join('|');
    if(rowText.includes('日期')||rowText.includes('項目')){headerIdx=i;break;}
  }
  const headerRow=rows[headerIdx]||[];
  const dataRows=rows.slice(headerIdx+1);
  const roles=inferColumnRoles(headerRow,dataRows);
  const candidates=[];
  dataRows.forEach(row=>{
    if(!row||row.every(c=>c==null||c==='')) return;
    let name='',dateISO=null,distRaw=null,distKm=null,venue='',fee=null;
    const noteParts=[];
    roles.forEach((role,i)=>{
      const v=(row||[])[i];
      if(v==null||v==='') return;
      if(role==='name'&&!name) name=String(v).trim();
      else if(role==='date'&&!dateISO) dateISO=cellToISODate(v);
      else if(role==='distance'&&distKm==null&&distRaw==null){const d=parseDistanceCell(v);distKm=d.km;distRaw=d.raw;}
      else if(role==='venue'&&!venue) venue=String(v).trim();
      else if(role==='fee'&&fee==null) fee=parseFeeCell(v);
      else if(role==='note'||role==='statusHint'){
        const label=(headerRow[i]==null||headerRow[i]==='')?'':String(headerRow[i])+': ';
        noteParts.push(label+String(v).trim());
      }
    });
    if(!name) return;
    const noteText=noteParts.join(' ｜ ');
    const hasRaceKeyword=RACE_KEYWORDS.test(name);
    const hasDistance=distKm!=null;
    const checked=isCurated?true:!!(dateISO&&(hasDistance||hasRaceKeyword));
    let status;
    if(/DNF/i.test(noteText)) status='dnf';
    else if(/DNS/i.test(noteText)) status='dns';
    else if(dateISO) status=(dateISO<todayISO())?'completed':'registered';
    else status='considering';
    candidates.push({
      sheetName,checked,name,dateISO:dateISO||'',distanceRaw:distRaw||'',distanceKm:distKm,
      venue,fee,status,note:noteText,
    });
  });
  return candidates;
}

let importWorkbook=null;
let importSheetChecks={};
let importCandidates=[];
const importModalEl=document.getElementById('import-modal');

document.getElementById('btn-import').addEventListener('click',()=>{
  document.getElementById('import-file-input').click();
});
document.getElementById('import-file-input').addEventListener('change',async e=>{
  const file=e.target.files[0];
  if(!file) return;
  const buf=await file.arrayBuffer();
  importWorkbook=XLSX.read(buf,{type:'array',cellDates:true});
  importSheetChecks={};
  importWorkbook.SheetNames.forEach(n=>{importSheetChecks[n]=/^(19|20)\d{2}$/.test(n.trim());});
  if(!Object.values(importSheetChecks).some(Boolean)){
    importSheetChecks[importWorkbook.SheetNames[0]]=true;
  }
  importCandidates=[];
  showImportModal('select-sheets');
  e.target.value='';
});

function parseCheckedSheets(){
  importCandidates=[];
  importWorkbook.SheetNames.forEach(name=>{
    if(!importSheetChecks[name]) return;
    const ws=importWorkbook.Sheets[name];
    const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:null});
    const isCurated=/^(19|20)\d{2}$/.test(name.trim());
    importCandidates.push(...parseSheetRows(name,rows,isCurated));
  });
  importCandidates.sort((a,b)=>(a.dateISO||'9999').localeCompare(b.dateISO||'9999'));
}

function importModalHtml(step){
  if(step==='select-sheets'){
    return `<div class="modal-panel">
      <h2>匯入 Excel — 選擇工作表</h2>
      <p class="modal-hint">已勾選看起來像「年度賽事清單」的工作表，可自行調整要匯入哪些分頁。</p>
      <div class="sheet-checks">
        ${importWorkbook.SheetNames.map(n=>`
          <label class="sheet-check"><input type="checkbox" data-sheet="${escapeHtml(n)}" ${importSheetChecks[n]?'checked':''}> ${escapeHtml(n)}</label>
        `).join('')}
      </div>
      <div class="modal-actions">
        <button class="btn-primary" data-action="parse-sheets">解析並預覽</button>
        <button class="btn-ghost" data-action="close-import">取消</button>
      </div>
    </div>`;
  }
  const checkedCount=importCandidates.filter(c=>c.checked).length;
  return `<div class="modal-panel modal-panel-wide">
    <h2>匯入 Excel — 確認賽事清單</h2>
    <p class="modal-hint">已選 <span class="mono">${checkedCount}</span> / ${importCandidates.length} 筆。可直接調整名稱、日期、距離、地點、狀態後再匯入；取消勾選可略過該筆（距離單位、DNF/DNS 建議順手核對一下）。</p>
    <div class="modal-actions modal-actions-top">
      <button class="btn-ghost" data-action="check-all">全選</button>
      <button class="btn-ghost" data-action="check-none">全不選</button>
      <button class="btn-ghost" data-action="back-sheets">‹ 重新選擇工作表</button>
    </div>
    <div class="import-table-wrap">
      <table class="import-table">
        <thead><tr><th></th><th>日期</th><th>賽事名稱</th><th>距離</th><th>地點</th><th>狀態</th><th>來源分頁</th></tr></thead>
        <tbody>
          ${importCandidates.map((c,i)=>`
            <tr>
              <td><input type="checkbox" data-idx="${i}" data-field="checked" ${c.checked?'checked':''}></td>
              <td><input type="date" data-idx="${i}" data-field="dateISO" value="${c.dateISO}"></td>
              <td><input type="text" data-idx="${i}" data-field="name" value="${escapeHtml(c.name)}"></td>
              <td><input type="text" data-idx="${i}" data-field="distanceRaw" value="${escapeHtml(c.distanceRaw)}" class="mono narrow"></td>
              <td><input type="text" data-idx="${i}" data-field="venue" value="${escapeHtml(c.venue)}"></td>
              <td><select data-idx="${i}" data-field="status">${STATUS_OPTIONS.map(o=>`<option value="${o.value}" ${c.status===o.value?'selected':''}>${o.label}</option>`).join('')}</select></td>
              <td class="small mono">${escapeHtml(c.sheetName)}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>
    <div class="modal-actions">
      <button class="btn-primary" data-action="confirm-import">匯入所選賽事</button>
      <button class="btn-ghost" data-action="close-import">取消</button>
    </div>
  </div>`;
}
function showImportModal(step){
  importModalEl.innerHTML=importModalHtml(step);
  importModalEl.hidden=false;
}
function closeImportModal(){
  importModalEl.hidden=true;
  importModalEl.innerHTML='';
}
importModalEl.addEventListener('click',e=>{
  if(e.target.closest('[data-action="close-import"]')){closeImportModal();return;}
  if(e.target.closest('[data-action="back-sheets"]')){showImportModal('select-sheets');return;}
  if(e.target.closest('[data-action="parse-sheets"]')){parseCheckedSheets();showImportModal('review');return;}
  if(e.target.closest('[data-action="check-all"]')){importCandidates.forEach(c=>c.checked=true);showImportModal('review');return;}
  if(e.target.closest('[data-action="check-none"]')){importCandidates.forEach(c=>c.checked=false);showImportModal('review');return;}
  if(e.target.closest('[data-action="confirm-import"]')){
    const toImport=importCandidates.filter(c=>c.checked);
    toImport.forEach(c=>{
      const race=emptyRace(c.name,inferSportType(c.name),c.status,c.dateISO||'');
      race.raceFormat=inferFormat(c.name,c.distanceRaw);
      if(c.distanceKm!=null) race.route.distanceKm=c.distanceKm;
      if(c.venue) race.location.venueName=c.venue;
      if(c.fee!=null){race.budget.registrationFee=c.fee;race.budget.paymentStatus=(c.status==='completed')?'paid':'unpaid';}
      if(c.note) race.review.courseReview=`【Excel 匯入備註】${c.note}`;
      state.races.push(race);
    });
    persist();
    closeImportModal();
    renderAll();
    return;
  }
});
importModalEl.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.sheet!=null){importSheetChecks[t.dataset.sheet]=t.checked;return;}
  const idx=t.dataset.idx;
  if(idx==null) return;
  const field=t.dataset.field;
  const c=importCandidates[Number(idx)];
  if(!c) return;
  if(field==='checked') c.checked=t.checked;
  else if(field==='distanceRaw'){
    c.distanceRaw=t.value;
    const n=Number(t.value);
    c.distanceKm=(t.value.trim()!==''&&!isNaN(n))?n:null;
  }
  else c[field]=t.value;
});

/* ============================================================
   初始化
   ============================================================ */
async function init(){
  detailEl.innerHTML='<p class="empty-hint">載入中…</p>';
  await loadRaces();
  renderAll();
}
init();
</script>
